<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Preview Konten</title>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<style>
  :root{
    --brand:#58279D; --ink:#1a1a1a; --ink-2:#5c5565; --ink-3:#9790a3;
    --line:#e4e0ea; --line-soft:#efedf2; --bg:#f2f0f5; --surface:#ffffff;
    --danger:#c2443a; --danger-bg:#fdf2f0;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.5;
    -webkit-font-smoothing:antialiased}
  .wrap{max-width:460px;margin:0 auto;background:var(--surface);min-height:100vh}
  img{display:block;max-width:100%}
  button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}

  /* ---------- HEADER ---------- */
  .hd{padding:20px 20px 19px;position:relative;color:#fff;background:var(--brand)}
  .hd.light-logo{color:#fff}
  .hd.dark-logo{background:#fff;color:var(--ink);border-bottom:3px solid var(--brand)}
  .hd .by{position:absolute;top:17px;right:18px;font-size:9px;letter-spacing:1.2px;font-weight:700;opacity:.75}
  .hd .logo{max-height:54px;width:auto;margin-bottom:12px}
  .hd .cname{font-size:19px;font-weight:700;margin-bottom:9px;letter-spacing:-.3px}
  .hd h1{font-size:20px;font-weight:700;letter-spacing:-.3px;margin-bottom:3px}
  .hd .per{font-size:13px;opacity:.92}
  .hd .meta{margin-top:12px;display:flex;gap:7px;flex-wrap:wrap}
  .pill{font-size:11px;padding:4px 9px;border-radius:20px;
    background:rgba(255,255,255,.24);border:.5px solid rgba(255,255,255,.38)}
  .hd.dark-logo .pill{background:var(--line-soft);border-color:var(--line);color:var(--ink-2)}

  /* ---------- BANNER ---------- */
  .banner{padding:11px 20px;font-size:12px;line-height:1.55;border-bottom:1px solid var(--line)}
  .banner.warn{background:#fff8e6;color:#7a5c12}
  .banner.done{background:#f1f7f3;color:#2c6347}

  /* ---------- PROGRESS ---------- */
  .prog{padding:12px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:11px}
  .bar{flex:1;height:6px;background:#eceaf0;border-radius:4px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--brand);border-radius:4px;transition:width .3s}
  .prog span{font-size:11.5px;color:var(--ink-2);white-space:nowrap}

  /* ---------- ITEM ---------- */
  .item{border-bottom:9px solid var(--bg);padding:16px 20px 19px}
  .item:last-of-type{border-bottom:none}
  .top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
  .fmt{background:#3b3b40;color:#fff;font-size:10px;font-weight:700;letter-spacing:1.1px;
    padding:4px 9px;border-radius:3px;white-space:nowrap}
  .date{font-size:11.5px;color:var(--ink-2);text-align:right}
  .lbl{font-size:9.5px;letter-spacing:1.1px;color:var(--ink-3);font-weight:700;margin-bottom:7px}

  .vid{position:relative;border-radius:9px;overflow:hidden;background:#000;margin:0 auto;width:268px;max-width:100%}
  .vid iframe{display:block;width:100%;height:476px;border:0}
  .vid.wide iframe{height:152px}

  /* Satu baris cukup untuk 2–3 gambar. Carousel 4–6 slide dijejer jadi tiga per baris:
     kalau dipaksa satu baris, tiap slide cuma ~60px dan klien tidak bisa menilai apa pun. */
  .imgs{display:flex;gap:7px;flex-wrap:wrap}
  .imw{flex:1 1 0;position:relative;min-width:0}
  .imgs.grid3 .imw{flex:0 0 calc(33.333% - 4.7px)}
  .imw img{width:100%;border-radius:7px;background:var(--line-soft)}
  .imw .num{position:absolute;top:5px;left:5px;background:rgba(0,0,0,.6);color:#fff;
    font-size:9px;font-weight:700;width:18px;height:18px;border-radius:50%;
    display:flex;align-items:center;justify-content:center}
  .imw.sel img{outline:2.5px solid var(--brand);outline-offset:1.5px}
  .imw.sel .num{background:var(--brand)}
  .pickhint{font-size:10px;color:var(--ink-3);text-align:center;margin-top:8px}

  .orig{display:block;text-align:center;margin:9px 0 14px;font-size:11.5px;color:var(--ink-2);
    background:#f6f4f8;border:1px solid #e6e2ec;border-radius:7px;padding:8px;text-decoration:none}
  .orig b{color:var(--brand)}

  .capbox{background:#faf9fb;border:1px solid var(--line-soft);border-radius:8px;padding:12px 13px;margin-bottom:11px}
  .capbox p{font-size:12.6px;line-height:1.62;white-space:pre-line;word-wrap:break-word}
  .copy{margin-top:11px;font-size:11px;color:var(--ink-2);font-weight:600;
    border:1px solid var(--line);background:#fff;border-radius:5px;padding:6px 11px;display:inline-block}
  .copy.ok{color:#2c6347;border-color:#bfe0cd}

  .ondesign{border:1px dashed #d8d2e0;border-radius:8px;padding:11px 13px;margin-bottom:12px;background:#fcfbfd}
  .ondesign .s{font-size:9.5px;color:var(--ink-3);letter-spacing:.3px;margin-bottom:6px;font-weight:700}
  .ondesign .t{font-size:12.4px;line-height:1.68;white-space:pre-line;word-wrap:break-word}

  /* ---------- AKSI ---------- */
  .act{display:flex;gap:8px;margin-bottom:10px}
  .btn{flex:1;text-align:center;font-size:13px;font-weight:700;padding:12px 10px;
    border-radius:8px;border:1.5px solid transparent}
  .btn[disabled]{opacity:.4}
  .ok{background:var(--brand);color:#fff}
  .ok.confirm{background:#fff;color:var(--brand);border-color:var(--brand)}
  .rev{background:#fff;color:var(--danger);border-color:#f0cdc8}
  .rev.active{background:var(--danger-bg)}

  .cbox{border:1px solid var(--line);border-radius:8px;background:#fff;overflow:hidden}
  .cbox.open{border-color:var(--brand);border-width:1.5px}
  .cbox .for{background:#f7f4fb;border-bottom:1px solid var(--line-soft);padding:6px 12px;
    font-size:10.5px;color:var(--brand);font-weight:700}
  .cbox textarea{width:100%;border:0;outline:0;padding:11px 12px;font-size:12.5px;
    line-height:1.55;resize:vertical;min-height:54px;font-family:inherit;background:none;color:inherit}
  .cbox .barr{display:flex;justify-content:space-between;align-items:center;
    border-top:1px solid var(--line-soft);padding:7px 9px 7px 12px}
  .cbox .cnt{font-size:10.5px;color:var(--ink-3)}
  .cbox .send{background:var(--brand);color:#fff;font-size:12px;font-weight:700;padding:7px 15px;border-radius:6px}
  .cbox .send[disabled]{opacity:.35}

  .state{font-size:12.5px;font-weight:700;padding:11px;border-radius:8px;text-align:center;margin-bottom:9px}
  .state small{display:block;font-weight:400;font-size:11px;opacity:.8;margin-top:2px}
  .state.approved{background:#f1f7f3;color:#2c6347;border:1.5px solid #cfe5d8}
  .state.revised{background:#f7f4fb;color:var(--brand);border:1.5px solid #ded0f0}
  .undo{display:block;width:100%;text-align:center;font-size:11px;color:var(--ink-2);
    text-decoration:underline;padding:4px}

  .thread{margin-top:2px}
  .msg{border-radius:0 7px 7px 0;padding:10px 12px;margin-bottom:8px;border-left:3px solid}
  .msg.c{background:var(--danger-bg);border-color:var(--danger)}
  .msg.c.resolved{background:var(--line-soft);border-color:var(--ink-3)}
  .msg .who{font-size:10.5px;font-weight:700;margin-bottom:3px;color:var(--danger)}
  .msg.resolved .who{color:var(--ink-3)}
  .msg p{font-size:12.3px;line-height:1.55;word-wrap:break-word}
  .msg.resolved p{color:var(--ink-2);text-decoration:line-through;text-decoration-color:#bbb}
  .msg .fixed{display:block;font-size:10.5px;font-weight:700;color:#2c6347;
    margin-top:5px;text-decoration:none}

  .live{display:inline-block;margin-top:8px;font-size:11.5px;color:var(--brand);font-weight:600;text-decoration:none}

  /* ---------- IKLAN ---------- */
  .sum{background:#fbfafc;border-bottom:1px solid var(--line);padding:13px 20px}
  .srow{display:flex;justify-content:space-between;gap:12px;font-size:12px;padding:3px 0}
  .srow span:first-child{color:var(--ink-3);white-space:nowrap}
  .srow span:last-child{font-weight:600;text-align:right}
  .greet{margin-top:10px;background:#fff;border:1px dashed #d8d2e0;border-radius:8px;padding:10px 12px}
  .greet .s{font-size:9.5px;letter-spacing:.4px;color:var(--ink-3);font-weight:700;margin-bottom:5px}
  .greet p{font-size:12.3px;line-height:1.6;white-space:pre-line}

  .setbar{padding:13px 20px 11px;background:#f7f5fa;border-top:1px solid var(--line);
    border-bottom:1px solid var(--line)}
  .setbar h3{font-size:13.5px;font-weight:700;margin-bottom:7px}
  .setbar .bud{font-size:16px;font-weight:700;margin-bottom:7px}
  .tagrow{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
  .tag{font-size:10.5px;background:#fff;border:1px solid var(--line);border-radius:12px;
    padding:3px 8px;color:var(--ink-2)}

  .adwrap{border:1px solid #dcdce2;border-radius:10px;overflow:hidden;background:#fff;margin-bottom:6px}
  .adhd{display:flex;align-items:center;gap:9px;padding:10px 12px}
  .adhd .av{width:34px;height:34px;border-radius:50%;flex:none;display:flex;
    align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:700}
  .adhd .who b{display:block;font-size:12.5px}
  .adhd .who i{font-style:normal;font-size:10.5px;color:var(--ink-3)}
  .adtext{padding:0 12px 10px;font-size:12.5px;line-height:1.55;white-space:pre-line;word-wrap:break-word}
  .adwrap .media img{width:100%;display:block}
  .adwrap .media iframe{display:block;width:100%;height:420px;border:0}
  .adfoot{display:flex;align-items:center;gap:10px;background:#f4f4f6;padding:10px 12px;
    border-top:1px solid #e6e6ec}
  .adfoot .hl{flex:1;min-width:0}
  .adfoot .hl b{display:block;font-size:12.5px;line-height:1.35}
  .adfoot .hl i{font-style:normal;font-size:10.5px;color:var(--ink-3);word-break:break-all}
  .adfoot .cta{background:#e4e4ea;color:#111;font-size:11.5px;font-weight:700;
    padding:7px 11px;border-radius:5px;white-space:nowrap}
  .asfeed{font-size:10px;color:var(--ink-3);text-align:center;margin-bottom:12px}

  /* ---------- FOOTER ---------- */
  .foot{padding:20px;text-align:center;border-top:1px solid var(--line)}
  .foot .l{font-size:11px;color:var(--ink-3);line-height:1.6}
  .foot .pdf{margin-top:12px;font-size:12px;font-weight:600;color:var(--ink-2);
    border:1px solid var(--line);border-radius:7px;padding:9px 16px;display:inline-block}

  /* ---------- LAYAR PEMBUKA ---------- */
  .screen{padding:48px 24px;text-align:center}
  .screen h2{font-size:17px;margin-bottom:8px}
  .screen p{font-size:13px;color:var(--ink-2);line-height:1.6;margin-bottom:18px}
  .who-list{display:flex;flex-direction:column;gap:8px;max-width:280px;margin:0 auto}
  .who-list button{border:1px solid var(--line);border-radius:9px;padding:13px;
    font-size:14px;font-weight:600;background:#fff;text-align:center}
  .who-list button:active{border-color:var(--brand)}
  .spin{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--brand);
    border-radius:50%;margin:0 auto 14px;animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}

  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);
    background:#23202a;color:#fff;font-size:12.5px;padding:10px 16px;border-radius:8px;
    max-width:88%;text-align:center;z-index:90;box-shadow:0 6px 20px rgba(0,0,0,.2)}

  /* ---------- CETAK ---------- */
  @media print{
    body{background:#fff}
    .wrap{max-width:none;box-shadow:none}
    .act,.cbox,.undo,.foot .pdf,.prog,.pickhint,.copy{display:none !important}
    .item{page-break-inside:avoid;border-bottom:1px solid #ddd}
    .vid iframe{display:none}
    .vid:after{content:"Video — lihat di link file asli";display:block;padding:40px 10px;
      color:#888;font-size:12px;text-align:center}
    .orig{border-style:solid}
    a[href]:after{content:" (" attr(href) ")";font-size:9px;color:#777;word-break:break-all}
    .hd{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  }
</style>
</head>
<body>
<div class="wrap" id="root">
  <div class="screen"><div class="spin"></div><p>Membuka preview…</p></div>
</div>

<script>
/* =========================================================================
   PREVIEW KONTEN KLIEN — halaman publik, tanpa login.
   Dibaca dengan token acak di URL: preview.html?k=<token>
   Sengaja TIDAK memakai React: halaman ini dibuka klien dari peramban dalam
   WhatsApp, sering di jaringan lambat. Satu file tanpa kerangka kerja apa pun
   memuat jauh lebih cepat, dan tidak ada yang perlu diperbarui belakangan.
   ========================================================================= */

var firebaseConfig = {
  apiKey: "AIzaSyAp3pc0-U1bSbB1pWtDTNIBjGI8Emq9Uys",
  authDomain: "ubah-project-tracker.firebaseapp.com",
  projectId: "ubah-project-tracker",
  storageBucket: "ubah-project-tracker.firebasestorage.app",
  messagingSenderId: "255038719115",
  appId: "1:255038719115:web:31d4d2ed0192d96bd8808e",
};

var PREVIEW_COLLECTION = "ubah_tracker_preview";
var IMAGES_COLLECTION  = "ubah_tracker_images";
var BRAND_FALLBACK     = "#58279D";

var root = document.getElementById("root");
var db = null, token = "", doc = null, images = {}, responses = [];
var me = null;              // PIC yang sedang membuka
var unsubDoc = null, unsubResp = null;
var pending = {};           // { itemId: 'approve' } -> tombol Setuju sedang minta penegasan
var commentOn = {};         // { itemId: slideNo|0 } -> kolom komentar terbuka
var drafts = {};            // { itemId: teks }
var sending = {};

/* ---------- alat bantu ---------- */
function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function qs(name){
  var m = new RegExp("[?&]" + name + "=([^&]+)").exec(window.location.search);
  return m ? decodeURIComponent(m[1].replace(/\+/g," ")) : "";
}
var BULAN = ["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Agu","Sep","Okt","Nov","Des"];
function fmtDate(iso){
  if(!iso) return "";
  var p = String(iso).slice(0,10).split("-");
  if(p.length !== 3) return iso;
  return Number(p[2]) + " " + BULAN[Number(p[1]) - 1] + (p[0] !== String(new Date().getFullYear()) ? " " + p[0] : "");
}
function fmtWhen(iso){
  if(!iso) return "";
  var d = new Date(iso);
  if(isNaN(d)) return "";
  var jam = ("0" + d.getHours()).slice(-2) + "." + ("0" + d.getMinutes()).slice(-2);
  return fmtDate(iso) + ", " + jam;
}
function toast(msg){
  var el = document.createElement("div");
  el.className = "toast"; el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(function(){ el.parentNode && el.parentNode.removeChild(el); }, 2600);
}
// localStorage bisa dilarang di mode penyamaran. Jangan sampai halaman ikut mati
// cuma karena nama PIC tidak bisa diingat.
function lsGet(k){ try{ return window.localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ window.localStorage.setItem(k,v); }catch(e){} }

/* ---------- keadaan preview ---------- */
function isExpired(){
  if(!doc) return false;
  var ms = Number(doc.expiresAtMs || 0);
  return ms > 0 && Date.now() > ms;
}
function isArchived(){ return !!(doc && doc.archived); }
function isOpen(){ return !isExpired() && !isArchived(); }

/* Tanggapan terakhir per konten menentukan keadaannya. Urutan dijaga dari 'at',
   bukan dari urutan dokumen — dua orang bisa menanggapi hampir bersamaan dan
   Firestore tidak menjamin urutan datangnya. */
function lastOf(itemId){
  var list = responses.filter(function(r){
    return r.itemId === itemId && r.kind !== "comment";
  }).sort(function(a,b){ return String(a.at||"").localeCompare(String(b.at||"")); });
  var last = list[list.length - 1];
  return (last && last.kind !== "cancel") ? last : null;
}
function commentsOf(itemId){
  return responses.filter(function(r){ return r.itemId === itemId && r.kind === "comment"; })
    .sort(function(a,b){ return String(a.at||"").localeCompare(String(b.at||"")); });
}
function itemById(id){
  var items = (doc && doc.items) || [];
  for(var i=0;i<items.length;i++) if(items[i].id === id) return items[i];
  return null;
}
// Komentar yang masuk SEBELUM revisi terakhir dianggap sudah ditindaklanjuti.
// Tanpa penanda ini, klien melihat permintaan lamanya di bawah gambar yang sudah
// diperbaiki dan menyangka tidak dibaca.
function isResolved(item, c){
  return !!(item.revisedAt && String(c.at||"") < String(item.revisedAt));
}
function answered(itemId){
  return !!lastOf(itemId) || commentsOf(itemId).length > 0;
}
function canDecide(){ return !!(me && me.canApprove) && isOpen(); }

/* ---------- gambar ---------- */
// Dokumen gambar diambil satu per satu dengan get(), bukan query. Rules memang
// cuma mengizinkan get untuk yang bertanda public — list tetap tertutup.
function loadImages(){
  var items = (doc && doc.items) || [];
  var ids = [];
  items.forEach(function(it){ if(it.imagesDoc && ids.indexOf(it.imagesDoc) < 0) ids.push(it.imagesDoc); });
  var left = ids.length;
  if(!left) return;
  ids.forEach(function(id){
    db.collection(IMAGES_COLLECTION).doc(id).get().then(function(s){
      images[id] = (s.exists && Array.isArray(s.data().images)) ? s.data().images : [];
    }).catch(function(){
      images[id] = [];           // gambar belum ditandai publik — kontennya tetap tampil
    }).then(function(){
      if(--left === 0) render();
    });
  });
}

/* ---------- kirim tanggapan ---------- */
function send(itemId, kind, text, slide){
  if(sending[itemId]) return;
  if(!me){ toast("Pilih dulu nama kamu."); return; }
  if(!isOpen()){ toast("Preview ini sudah ditutup."); return; }
  sending[itemId] = true; render();

  var payload = {
    itemId: String(itemId).slice(0,80),
    kind: kind,
    picName: String(me.name).slice(0,60),
    at: new Date().toISOString(),
    text: String(text || "").slice(0,500)
  };
  if(slide) payload.slide = Number(slide);

  db.collection(PREVIEW_COLLECTION).doc(token).collection("responses").add(payload)
    .then(function(){
      delete drafts[itemId]; delete commentOn[itemId]; delete pending[itemId];
      toast(kind === "approve" ? "Persetujuan tercatat."
          : kind === "cancel"  ? "Persetujuan dibatalkan."
          : kind === "revise"  ? "Permintaan revisi terkirim."
          : "Komentar terkirim.");
    })
    .catch(function(e){
      toast("Gagal mengirim. Cek koneksi lalu coba lagi.");
      if(window.console) console.error(e);
    })
    .then(function(){ delete sending[itemId]; render(); });
}

/* ---------- aksi dari tombol ---------- */
window.PV = {
  approve: function(id){
    // Dua ketukan. Di HP tombol ini terlalu gampang kesenggol waktu scroll cepat,
    // dan satu salah pencet berarti konten lolos tanpa dibaca.
    if(pending[id] !== "approve"){ pending[id] = "approve"; render(); return; }
    send(id, "approve", "");
  },
  cancel: function(id){ send(id, "cancel", ""); },
  openRev: function(id){
    commentOn[id] = commentOn[id] || 0;
    pending[id] = "revise";
    render();
    setTimeout(function(){
      var ta = document.getElementById("ta_" + id);
      if(ta) ta.focus();
    }, 50);
  },
  openComment: function(id){
    if(commentOn[id] === undefined) commentOn[id] = 0;
    render();
    setTimeout(function(){
      var ta = document.getElementById("ta_" + id);
      if(ta) ta.focus();
    }, 50);
  },
  pickSlide: function(id, n){
    commentOn[id] = (commentOn[id] === n) ? 0 : n;
    render();
  },
  draft: function(id, v){ drafts[id] = v; var c = document.getElementById("cnt_" + id);
    if(c) c.textContent = (me ? me.name + " · " : "") + v.length + "/500";
    var b = document.getElementById("send_" + id); if(b) b.disabled = !v.trim(); },
  submit: function(id){
    var text = (drafts[id] || "").trim();
    if(!text) return;
    send(id, pending[id] === "revise" ? "revise" : "comment", text, commentOn[id] || 0);
  },
  copy: function(id, btn){
    var it = itemById(id); if(!it) return;
    var txt = it.caption || "";
    var done = function(){
      btn.textContent = "Caption tersalin"; btn.className = "copy ok";
      setTimeout(function(){ btn.textContent = "Salin caption"; btn.className = "copy"; }, 2000);
    };
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(done, function(){ fallbackCopy(txt, done); });
    } else fallbackCopy(txt, done);
  },
  setMe: function(i){
    var pics = (doc && doc.pics) || [];
    me = pics[i] || null;
    if(me) lsSet("ubahpv_" + token, me.name);
    render();
  },
  print: function(){ window.print(); }
};
function fallbackCopy(txt, done){
  var ta = document.createElement("textarea");
  ta.value = txt; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); done(); }catch(e){ toast("Salin manual dari teks di atas."); }
  document.body.removeChild(ta);
}

/* ---------- penggambar ---------- */
function render(){
  if(!doc){ return; }
  var pics = doc.pics || [];

  // Siapa yang membuka. Satu PIC -> langsung. Lebih dari satu -> tanya sekali,
  // lalu diingat di HP-nya. Preview yang sudah ditutup tidak perlu bertanya.
  if(!me && isOpen() && pics.length){
    var saved = lsGet("ubahpv_" + token);
    if(saved){
      for(var i=0;i<pics.length;i++) if(pics[i].name === saved){ me = pics[i]; break; }
    }
    if(!me && pics.length === 1) me = pics[0];
    if(!me){ root.innerHTML = renderWho(pics); return; }
  }

  var brand = doc.brand || {};
  var color = /^#[0-9A-Fa-f]{6}$/.test(brand.color || "") ? brand.color : BRAND_FALLBACK;
  var dark  = brand.logoTone === "dark";
  var items = doc.items || [];
  var done  = items.filter(function(it){ return answered(it.id); }).length;
  var pct   = items.length ? Math.round(done / items.length * 100) : 0;

  var h = "";
  h += '<div class="hd ' + (dark ? "dark-logo" : "light-logo") + '"' +
       (dark ? "" : ' style="background:' + esc(color) + '"') + '>';
  h +=   '<div class="by">UBAH DIGITAL</div>';
  h +=   brand.logo
          ? '<img class="logo" src="' + esc(brand.logo) + '" alt="">'
          : '<div class="cname">' + esc(doc.client || "") + '</div>';
  h +=   '<h1>Preview ' + (isAds() ? "Iklan" : "Konten") + '</h1>';
  h +=   '<div class="per">' + esc(doc.period || "") + '</div>';
  h +=   '<div class="meta"><span class="pill">' + items.length +
         (isAds() ? ' materi' : ' konten') + '</span>';
  if(isArchived())      h += '<span class="pill">Arsip</span>';
  else if(isExpired())  h += '<span class="pill">Masa berlaku habis</span>';
  else if(doc.expiresAtMs) h += '<span class="pill">Berlaku s/d ' + fmtDate(new Date(doc.expiresAtMs).toISOString()) + '</span>';
  h +=   '</div></div>';

  if(isArchived()){
    h += '<div class="banner done">Semua ' + (isAds() ? "materi iklan" : "konten") +
         ' pada periode ini sudah disetujui. ' +
         'Halaman ini disimpan sebagai catatan dan tidak menerima tanggapan baru.</div>';
  } else if(isExpired()){
    h += '<div class="banner warn">Masa berlaku preview ini sudah habis, jadi tombol ' +
         'persetujuan dan komentar ditutup. Isinya masih bisa dibaca. ' +
         'Hubungi tim UBAH kalau butuh link terbaru.</div>';
  } else {
    h += '<div class="prog"><div class="bar"><i style="width:' + pct + '%;background:' + esc(color) + '"></i></div>' +
         '<span>' + done + ' dari ' + items.length + ' ditanggapi</span></div>';
  }

  if(isAds()){
    h += renderCampaign(doc.campaign || {}, color);
    // Dikelompokkan per ad set, dengan budget dan targeting di kepala kelompok.
    // Bukan per materi: di Meta budget memang diatur per ad set, jadi angka per
    // materi hanya bisa dikarang.
    var sets = (doc.adSets || []);
    var rest = items.filter(function(it){
      return !sets.some(function(s){ return s.id === it.adSetId; });
    });
    sets.forEach(function(s){
      var mine = items.filter(function(it){ return it.adSetId === s.id; });
      if(!mine.length) return;
      h += renderAdSet(s, color);
      mine.forEach(function(it){ h += renderItem(it, color); });
    });
    if(rest.length){
      h += '<div class="setbar"><h3>Materi lain</h3>' +
           '<div style="font-size:11.5px;color:var(--ink-3)">Belum dikelompokkan ke ad set.</div></div>';
      rest.forEach(function(it){ h += renderItem(it, color); });
    }
  } else {
    items.forEach(function(it){ h += renderItem(it, color); });
  }

  h += '<div class="foot">';
  h +=   '<div class="l">Preview ini dibuat oleh UBAH Digital<br>untuk ' + esc(doc.client || "") + '</div>';
  h +=   '<button class="pdf" onclick="PV.print()">Simpan sebagai PDF</button>';
  h += '</div>';

  root.innerHTML = h;
}

/* ---------- bagian khusus iklan ---------- */
function isAds(){ return !!(doc && doc.kind === "ads"); }

function rupiah(n){
  var v = Number(n) || 0;
  return "Rp " + v.toLocaleString("id-ID");
}

function renderCampaign(c, color){
  var h = '<div class="sum">';
  function row(k, v){ if(v) h += '<div class="srow"><span>' + k + '</span><span>' + esc(v) + '</span></div>'; }
  row("Platform", c.platform);
  row("Objektif", c.objective);
  if(c.startDate || c.endDate){
    row("Periode tayang", (c.startDate ? fmtDate(c.startDate) : "?") + " – " + (c.endDate ? fmtDate(c.endDate) : "?"));
  }
  row("Jam tayang", c.daypart || "24 jam");
  if(c.greeting){
    h += '<div class="greet"><div class="s">PESAN PEMBUKA YANG DITERIMA CALON PELANGGAN</div>' +
         '<p>' + esc(c.greeting) + '</p></div>';
  }
  h += '<div class="hint" style="margin-top:9px;font-size:10.5px;color:var(--ink-3);line-height:1.55">' +
       'Iklan mulai tayang setelah disetujui. Yang belum disetujui tidak dijalankan.</div>';
  h += '</div>';
  return h;
}

function renderAdSet(s, color){
  var h = '<div class="setbar">';
  h += '<h3>' + esc(s.name) + '</h3>';
  if(s.budget) h += '<div class="bud" style="color:' + esc(color) + '">' + rupiah(s.budget) + '</div>';
  if(s.location) h += '<div class="srow"><span>Lokasi</span><span>' + esc(s.location) + '</span></div>';
  if(s.interest) h += '<div class="srow"><span>Audiens</span><span>' + esc(s.interest) + '</span></div>';
  if((s.placements || []).length){
    h += '<div style="font-size:10.5px;color:var(--ink-3);margin-top:8px">Placement utama</div>';
    h += '<div class="tagrow">';
    s.placements.forEach(function(p){ h += '<span class="tag">' + esc(p) + '</span>'; });
    h += '</div>';
  }
  h += '</div>';
  return h;
}

// Iklannya digambar seperti yang akan dilihat audiens di feed, bukan sebagai daftar
// kolom. Begitu headline kepanjangan atau CTA-nya tidak nyambung, langsung kelihatan —
// hal yang tidak ketahuan kalau klien cuma dikirim gambar plus caption terpisah.
function renderAdCard(it, imgs, color){
  var akun = (doc.client || "").trim();
  var boost = it.adSource === "boost";
  var h = '<div class="adwrap">';
  h += '<div class="adhd"><div class="av" style="background:' + esc(color) + '">' +
       esc(akun.slice(0,1).toUpperCase() || "?") + '</div>' +
       '<div class="who"><b>' + esc(akun) + '</b><i>' +
       (boost ? "Post yang dinaikkan · Bersponsor" : "Bersponsor") + '</i></div></div>';
  if(it.caption) h += '<div class="adtext">' + esc(it.caption) + '</div>';
  h += '<div class="media">';
  if(it.videoId){
    h += '<iframe src="https://drive.google.com/file/d/' + esc(it.videoId) +
         '/preview" allow="autoplay" allowfullscreen loading="lazy"></iframe>';
  } else if(imgs.length){
    h += '<img src="' + imgs[0] + '" alt="" loading="lazy">';
  }
  h += '</div>';
  if(it.headline || it.cta || it.destination){
    h += '<div class="adfoot"><div class="hl">' +
         (it.headline ? '<b>' + esc(it.headline) + '</b>' : '') +
         (it.destination ? '<i>' + esc(it.destination) + '</i>' : '') +
         '</div>' +
         (it.cta ? '<div class="cta">' + esc(it.cta) + '</div>' : '') +
         '</div>';
  }
  h += '</div>';
  h += '<div class="asfeed">' +
       (boost ? "Post ini sudah tayang — yang disetujui belanja dan targetingnya"
              : "Begini iklannya akan terlihat di feed") + '</div>';
  if(boost && it.postLink){
    h += '<a class="orig" href="' + esc(it.postLink) + '" target="_blank" rel="noopener">' +
         'Lihat postingan aslinya di Instagram <b>&rarr;</b></a>';
  }
  return h;
}

function renderWho(pics){
  var h = '<div class="screen"><h2>Siapa yang membuka?</h2>' +
          '<p>Nama ini dipakai supaya tim tahu siapa yang menyetujui atau meminta revisi.</p>' +
          '<div class="who-list">';
  pics.forEach(function(p, i){
    h += '<button onclick="PV.setMe(' + i + ')">' + esc(p.name) + '</button>';
  });
  h += '</div></div>';
  return h;
}

function renderItem(it, color){
  var st = lastOf(it.id);
  var cs = commentsOf(it.id);
  var imgs = images[it.imagesDoc] || [];
  var sel = commentOn[it.id];
  var h = '<div class="item">';

  if(isAds()){
    h += '<div class="top"><span class="nm" style="font-size:13px;font-weight:700">' +
         esc(it.label || "Materi iklan") + '</span>' +
         (it.format ? '<span class="fmt">' + esc(it.format.toUpperCase()) + '</span>' : '') + '</div>';
    h += renderAdCard(it, imgs, color);
  } else {

  h += '<div class="top"><span class="fmt">' + esc((it.format || "Konten").toUpperCase()) + '</span>';
  h += '<span class="date">' + (it.postingDate ? "Rencana tayang " + fmtDate(it.postingDate) : "Jadwal menyusul") + '</span></div>';

  /* --- video --- */
  if(it.videoId){
    h += '<div class="lbl">VIDEO</div>';
    h += '<div class="vid' + (it.videoWide ? " wide" : "") + '">' +
         '<iframe src="https://drive.google.com/file/d/' + esc(it.videoId) + '/preview" ' +
         'allow="autoplay" allowfullscreen loading="lazy"></iframe></div>';
  }

  /* --- gambar --- */
  // Nomor slide dan komentar per slide hanya untuk Carousel. Reels dan Feed juga
  // bisa punya dua gambar (cover + potongan), tapi menomorinya "Slide 1, Slide 2"
  // menyesatkan — di Instagram tidak ada slide-nya.
  var isCarousel = /carousel/i.test(it.format || "") && imgs.length > 1;
  if(imgs.length){
    h += '<div class="lbl">' + (isCarousel ? imgs.length + " SLIDE" : "VISUAL") + '</div>';
    h += '<div class="imgs' + (imgs.length > 3 ? " grid3" : "") + '">';
    imgs.forEach(function(src, i){
      var n = i + 1;
      var on = (isCarousel && sel === n) ? " sel" : "";
      h += '<div class="imw' + on + '"' +
           (isCarousel && isOpen() ? ' onclick="PV.pickSlide(\'' + esc(it.id) + '\',' + n + ')"' : '') +
           '><img src="' + src + '" alt="" loading="lazy">' +
           (isCarousel ? '<div class="num">' + n + '</div>' : '') + '</div>';
    });
    h += '</div>';
    if(isCarousel && isOpen()) h += '<div class="pickhint">Ketuk slide untuk mengomentari slide tertentu</div>';
  }

  /* --- file asli --- */
  if(it.driveLink){
    h += '<a class="orig" href="' + esc(it.driveLink) + '" target="_blank" rel="noopener">' +
         'Versi ringan supaya cepat terbuka · <b>Lihat file asli →</b></a>';
  }

  /* --- caption --- */
  if(it.caption){
    h += '<div class="lbl">CAPTION</div><div class="capbox"><p>' + esc(it.caption) + '</p>';
    h += '<button class="copy" onclick="PV.copy(\'' + esc(it.id) + '\',this)">Salin caption</button></div>';
  }

  /* --- tulisan di dalam desain --- */
  if(it.onDesignText){
    h += '<div class="ondesign"><div class="s">TULISAN DI DALAM ' +
         (it.videoId ? "VIDEO" : "DESAIN") + '</div>' +
         '<div class="t">' + esc(it.onDesignText) + '</div></div>';
  }

  } /* tutup cabang konten — iklan sudah digambar sebagai kartu feed di atas */

  // Tombol file asli tetap ada untuk iklan, karena materinya juga dikompres.
  if(isAds() && it.driveLink){
    h += '<a class="orig" href="' + esc(it.driveLink) + '" target="_blank" rel="noopener">' +
         'Versi ringan supaya cepat terbuka · <b>Lihat file asli →</b></a>';
  }

  /* --- keadaan & aksi --- */
  if(st && st.kind === "approve"){
    h += '<div class="state approved">Sudah disetujui<small>' +
         esc(st.picName) + ' · ' + fmtWhen(st.at) + '</small></div>';
    // Batal hanya selama PM belum memproses. Setelah diproses, berubah pikiran
    // caranya lewat permintaan revisi baru — bukan dengan menghapus jejaknya.
    if(!it.processedAt && canDecide()){
      h += '<button class="undo" onclick="PV.cancel(\'' + esc(it.id) + '\')">Batalkan persetujuan</button>';
    } else if(it.processedAt && canDecide()){
      h += '<div class="act"><button class="btn rev" onclick="PV.openRev(\'' + esc(it.id) + '\')">Minta revisi</button></div>';
    }
  } else if(st && st.kind === "revise" && it.revisedAt && String(it.revisedAt) > String(st.at)){
    h += '<div class="state revised">Sudah direvisi<small>versi terbaru ditampilkan di atas</small></div>';
  }

  var showAct = isOpen() && !(st && st.kind === "approve");
  if(showAct){
    h += '<div class="act">';
    if(canDecide()){
      var asking = pending[it.id] === "approve";
      h += '<button class="btn ok' + (asking ? " confirm" : "") + '" ' +
           (sending[it.id] ? "disabled " : "") +
           'onclick="PV.approve(\'' + esc(it.id) + '\')"' +
           (asking ? "" : ' style="background:' + esc(color) + '"') + '>' +
           (asking ? "Yakin? Ketuk lagi" : "Setuju") + '</button>';
      h += '<button class="btn rev' + (pending[it.id] === "revise" ? " active" : "") + '" ' +
           'onclick="PV.openRev(\'' + esc(it.id) + '\')">Minta revisi</button>';
    } else {
      h += '<button class="btn rev" onclick="PV.openComment(\'' + esc(it.id) + '\')">Tulis komentar</button>';
    }
    h += '</div>';
  }

  /* --- kolom komentar --- */
  if(isOpen() && (commentOn[it.id] !== undefined)){
    var draft = drafts[it.id] || "";
    h += '<div class="cbox open">';
    if(sel) h += '<div class="for">KOMENTAR UNTUK SLIDE ' + sel + '</div>';
    h += '<textarea id="ta_' + esc(it.id) + '" maxlength="500" placeholder="' +
         (pending[it.id] === "revise" ? "Apa yang perlu diubah?" : "Tulis komentar…") +
         '" oninput="PV.draft(\'' + esc(it.id) + '\',this.value)">' + esc(draft) + '</textarea>';
    h += '<div class="barr"><span class="cnt" id="cnt_' + esc(it.id) + '">' +
         (me ? esc(me.name) + " · " : "") + draft.length + '/500</span>';
    h += '<button class="send" id="send_' + esc(it.id) + '"' + (draft.trim() ? "" : " disabled") +
         (sending[it.id] ? " disabled" : "") +
         ' style="background:' + esc(color) + '" onclick="PV.submit(\'' + esc(it.id) + '\')">Kirim</button>';
    h += '</div></div>';
  } else if(isOpen() && canDecide() && !(st && st.kind === "approve")){
    h += '<div class="cbox" onclick="PV.openComment(\'' + esc(it.id) + '\')" ' +
         'style="padding:11px 12px;font-size:12px;color:var(--ink-3)">Tulis komentar (opsional)…</div>';
  }

  /* --- komentar terkirim --- */
  if(cs.length){
    h += '<div class="thread">';
    cs.forEach(function(c){
      var res = isResolved(it, c);
      h += '<div class="msg c' + (res ? " resolved" : "") + '">' +
           '<div class="who">' + esc(c.picName) + (c.slide ? " · Slide " + c.slide : "") +
           ' · ' + fmtWhen(c.at) + '</div><p>' + esc(c.text) + '</p>' +
           (res ? '<span class="fixed">Sudah ditindaklanjuti · direvisi ' + fmtDate(it.revisedAt) + '</span>' : '') +
           '</div>';
    });
    h += '</div>';
  }

  if(it.livePostLink){
    h += '<a class="live" href="' + esc(it.livePostLink) + '" target="_blank" rel="noopener">Lihat postingannya →</a>';
  }

  h += '</div>';
  return h;
}

function fatal(judul, pesan){
  root.innerHTML = '<div class="screen"><h2>' + esc(judul) + '</h2><p>' + esc(pesan) + '</p></div>';
}

/* ---------- mulai ---------- */
(function start(){
  token = qs("k").replace(/[^A-Za-z0-9_-]/g, "").slice(0, 64);
  if(!token){
    fatal("Link tidak lengkap", "Alamatnya kurang kode preview. Minta link terbaru ke tim UBAH.");
    return;
  }
  try{
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
  }catch(e){
    fatal("Gagal memuat", "Coba buka ulang halaman ini. Kalau tetap gagal, hubungi tim UBAH.");
    return;
  }

  unsubDoc = db.collection(PREVIEW_COLLECTION).doc(token).onSnapshot(function(snap){
    if(!snap.exists){
      fatal("Preview tidak ditemukan", "Link ini mungkin sudah dihapus. Minta link terbaru ke tim UBAH.");
      return;
    }
    var first = !doc;
    doc = snap.data();
    render();
    if(first){
      loadImages();
      unsubResp = db.collection(PREVIEW_COLLECTION).doc(token).collection("responses")
        .onSnapshot(function(rs){
          responses = rs.docs.map(function(d){ var o = d.data(); o.id = d.id; return o; });
          render();
        }, function(){ /* tanggapan gagal dimuat — halaman tetap bisa dibaca */ });
    } else {
      loadImages();
    }
  }, function(){
    fatal("Tidak bisa membuka preview", "Periksa koneksi lalu buka ulang. Kalau tetap gagal, hubungi tim UBAH.");
  });
})();
</script>
