<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Preview Konten</title>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<style>
:root{--brand:#58279D;--c:#58279D;--onbrand:#ffffff;--ink:#121212;--mid:#56514e;--soft:#8c8785;
  --hair:#e9e6e4;--bg:#f4f2f1;--ok:#2f6b4f;--new:#1f5f8b;--warn:#9d4a40;--pad:16px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);line-height:1.45;-webkit-font-smoothing:antialiased;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.wrap{max-width:520px;margin:0 auto;background:#fff;min-height:100vh}
img{display:block;max-width:100%}
button,textarea,input{font:inherit;color:inherit}
button{border:none;background:none;cursor:pointer}
a{color:inherit}

/* Tulisan di atas warna brand mengikuti terang-gelapnya warna itu: brand pink muda
   dengan tulisan putih cuma 1,99:1, jadi di sana tulisannya dibuat gelap. */
.hero{background:var(--brand);padding:22px var(--pad) 20px;color:var(--onbrand)}
.hero.white{background:#fff;color:var(--ink);border-bottom:3px solid var(--brand)}
.hero img{height:40px;width:auto;margin-bottom:16px}
.hero .cname{font-size:15px;font-weight:650;margin-bottom:12px;opacity:.9}
.hero h1{font-size:21px;font-weight:650;letter-spacing:-.4px}
.hero .per{font-size:14px;margin-top:3px}

.banner{padding:12px var(--pad);font-size:13px;line-height:1.55;border-bottom:1px solid var(--hair)}
.banner.warn{background:#fff8e6;color:#7a5c12}
.banner.done{background:#eef5f0;color:var(--ok)}

.me{padding:11px var(--pad);font-size:13px;color:var(--mid);border-bottom:1px solid var(--hair)}
.me b{color:var(--ink);font-weight:600}
.me button{color:var(--c);margin-left:6px;text-decoration:underline;text-underline-offset:2px;font-size:13px}

.notice{display:block;margin:14px var(--pad) 0;padding:12px 14px;border-radius:10px;background:#eaf3f9;
  color:var(--new);font-size:13.5px;line-height:1.5;text-decoration:none;text-align:left;width:calc(100% - 2*var(--pad))}
.notice b{font-weight:650}
.notice u{text-underline-offset:2px}

.idx{padding:14px var(--pad);border-bottom:1px solid var(--hair)}
.idx .ttl{font-size:12px;color:var(--soft);margin-bottom:9px}
.strip{display:flex;gap:9px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.strip::-webkit-scrollbar{display:none}
.strip button{flex:none;width:62px;text-align:center}
.strip .im{display:block;width:62px;height:62px;border-radius:7px;overflow:hidden;border:2px solid transparent;background:var(--bg)}
.strip .im img{width:100%;height:100%;object-fit:cover}
.strip .im i{display:flex;width:100%;height:100%;align-items:center;justify-content:center;font-style:normal;
  font-size:18px;font-weight:700;color:var(--soft)}
.strip .st{display:block;font-size:10px;margin-top:5px;color:var(--soft);line-height:1.25}
.strip .done .im{border-color:var(--ok)}
.strip .done .st{color:var(--ok)}
.strip .new .im{border-color:var(--new)}
.strip .new .st{color:var(--new);font-weight:650}
.strip .sent .st{color:var(--c)}

.bar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.96);border-bottom:1px solid var(--hair);
  padding:10px var(--pad);display:flex;gap:12px;align-items:center}
.bar .n{flex:1;font-size:13px;font-weight:600}
.bar .n em{font-style:normal;font-weight:400;color:var(--soft)}
.bar button{font-size:13px;font-weight:600;color:var(--c)}
.bar .who{font-weight:400;color:var(--soft)}
.bar .who button{font-weight:400;text-decoration:underline;text-underline-offset:2px;margin-left:3px}

.card{border-bottom:9px solid var(--bg);scroll-margin-top:50px}
.idr{display:flex;align-items:center;gap:10px;padding:13px var(--pad) 11px}
.idr .nm{flex:1;min-width:0}
.idr .nm b{display:block;font-size:14.5px;font-weight:650;word-wrap:break-word}
.idr .nm span{font-size:12px;color:var(--soft)}
.tag{font-size:11.5px;font-weight:650;border-radius:12px;padding:4px 10px;white-space:nowrap}
.tag.new{background:#eaf3f9;color:var(--new)}
.tag.ok{background:#e8f2ec;color:var(--ok)}
.tag.wait{background:#f1efee;color:var(--soft)}
.tag.sent{background:#f1efee;color:var(--mid)}
.revnote{margin:0 var(--pad) 12px;padding:11px 13px;border-left:3px solid var(--new);background:#f5f9fc;
  border-radius:0 9px 9px 0;font-size:13.5px;line-height:1.55;white-space:pre-line;word-wrap:break-word}
.revnote em{font-style:normal;display:block;font-size:11.5px;color:var(--new);font-weight:650;margin-bottom:3px}

/* ---------- media ---------- */
.one{padding:0 var(--pad) 4px}
.one img{width:100%;border-radius:8px;background:var(--bg)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;padding:0 var(--pad) 4px}
.gs{text-align:center}
.gs .im{display:block;border-radius:6px;overflow:hidden;border:2px solid transparent;background:var(--bg)}
.gs .im img{width:100%}
.gs.on .im{border-color:var(--c)}
.gs .lb{display:block;font-size:10.5px;color:var(--soft);margin-top:4px}
.gs.on .lb{color:var(--c);font-weight:650}
/* Carousel pendek digeser seperti di Instagram; tiap slide tetap diberi nomor. */
.swipe{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 var(--pad) 4px;scrollbar-width:none}
.swipe::-webkit-scrollbar{display:none}
.swipe .sl{flex:0 0 82%;scroll-snap-align:center;text-align:center}
.swipe .sl img{width:100%;border-radius:8px;background:var(--bg)}
.swipe .lb{display:block;font-size:11px;color:var(--soft);margin-top:5px}
.swipehint{font-size:11px;color:var(--soft);text-align:center;padding:4px var(--pad) 0}
/* Reels: cover dan video berdampingan seperti di deck tim. Cover itu yang tampil di
   kisi Instagram dan sering direvisi sendiri, jadi tidak dilebur dengan videonya. */
.duo{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 var(--pad) 4px;align-items:start}
.duo.solo{grid-template-columns:minmax(0,300px);justify-content:center}
.duo .t{position:relative;border-radius:8px;overflow:hidden;background:#000;aspect-ratio:9/16;display:block;width:100%}
.duo .t.cov{background:var(--bg);aspect-ratio:auto}
.duo .t img{width:100%;height:100%;object-fit:cover}
.duo .t.cov img{height:auto}
.duo .t iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.duo .lb{font-size:11px;color:var(--soft);text-align:center;margin-top:5px}
.play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:52px;height:52px;border-radius:50%;
  background:rgba(0,0,0,.45);border:1.5px solid rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center}
.play i{width:0;height:0;border-left:14px solid #fff;margin-left:4px;border-top:9px solid transparent;border-bottom:9px solid transparent}
.orig{display:block;text-align:center;padding:10px var(--pad) 4px;font-size:12px;color:var(--c);text-decoration:none}
.orig u{text-underline-offset:2px}
.nomedia{margin:0 var(--pad) 4px;padding:22px 14px;border:1px dashed var(--hair);border-radius:10px;
  font-size:13px;color:var(--soft);text-align:center;line-height:1.55}

.when{padding:8px var(--pad) 0;font-size:12.5px;color:var(--soft)}
.cap{padding:8px var(--pad) 0;font-size:14px;line-height:1.55;white-space:pre-line;word-wrap:break-word}
.ond{margin:12px var(--pad) 0;padding:11px 13px;border:1px dashed #d9d4d2;border-radius:10px;
  font-size:13.5px;line-height:1.6;white-space:pre-line;word-wrap:break-word}
.ond em{font-style:normal;display:block;font-size:11.5px;color:var(--soft);font-weight:650;margin-bottom:4px}

/* ---------- tanggapan ---------- */
.old{margin:14px var(--pad) 0;border:1px solid var(--hair);border-radius:10px}
.old summary{padding:11px 13px;font-size:12.5px;color:var(--soft);list-style:none;cursor:pointer}
.old summary::-webkit-details-marker{display:none}
.old summary::after{content:"lihat";float:right;color:var(--c);font-weight:600}
.old[open] summary::after{content:"tutup"}
.m{padding:0 13px 12px;font-size:13.5px;line-height:1.5;word-wrap:break-word}
.m b{font-weight:600;margin-right:5px}
.m time{display:block;font-size:11.5px;color:var(--soft);margin-top:3px}
.m .sl{font-size:11px;color:var(--c);font-weight:650;display:block;margin-bottom:2px}
.mine{margin:14px var(--pad) 0}
.mine .h{font-size:11.5px;color:var(--soft);font-weight:650;margin-bottom:7px}
.mine .m{padding:10px 13px;border:1px solid var(--hair);border-radius:10px;margin-bottom:7px;background:#fbfafa}
.mine .m p{white-space:pre-line}
.mine .m .ed{font-size:12px;color:var(--c);text-decoration:underline;text-underline-offset:2px;margin-top:5px}
.say{padding:14px var(--pad) 0}
.say .to{font-size:11.5px;color:var(--c);font-weight:650;margin-bottom:7px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.chips button{font-size:12px;border:1px solid var(--hair);border-radius:14px;padding:5px 11px;color:var(--mid);background:#fff}
.chips button.on{border-color:var(--c);color:var(--c);font-weight:650}
.box{border:1px solid #ddd8d6;border-radius:14px;background:#fbfafa;padding:11px 13px 9px;display:flex;flex-direction:column;gap:8px}
.box:focus-within{border-color:var(--c);background:#fff}
.box textarea{border:none;background:transparent;resize:none;outline:none;font-size:16px;line-height:1.45;min-height:44px;width:100%}
.box textarea::placeholder{color:#a8a2a0;font-size:14.5px}
.box .row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.box .cnt{font-size:11px;color:var(--soft)}
.box .btns{display:flex;gap:8px;align-items:center;margin-left:auto}
.send{font-size:13.5px;font-weight:650;color:#fff;background:#cfc8c6;border-radius:16px;padding:7px 16px}
.send.live{background:var(--c)}
.lnk{font-size:12.5px;color:var(--mid);text-decoration:underline;text-underline-offset:2px}
.lnk.del{color:var(--warn)}
/* Setuju di ujung bawah kartu: di situlah klien berada setelah selesai melihat dan
   membaca. Baris tersendiri, tidak sebaris dengan Kirim. */
.fin{padding:14px var(--pad) 18px}
.fin .q{font-size:12.5px;color:var(--soft);margin-bottom:8px}
.agree{width:100%;border:1.5px solid var(--ok);color:var(--ok);border-radius:12px;padding:12px;font-size:14.5px;
  font-weight:650;display:flex;align-items:center;justify-content:center;gap:8px;background:#fff}
.agree svg{width:16px;height:16px}
.agree.ask{background:var(--ok);color:#fff}
.agree[disabled]{opacity:.5}
.state{padding:14px var(--pad) 18px;font-size:13px;color:var(--mid);line-height:1.6}
.state b{color:var(--ok);font-weight:650}
.state button{color:var(--c);text-decoration:underline;text-underline-offset:2px;font-size:13px}

/* ---------- iklan ---------- */
.sum2{background:#fbfafa;border-bottom:1px solid var(--hair);padding:13px var(--pad)}
.srow{display:flex;justify-content:space-between;gap:12px;font-size:13px;padding:3px 0}
.srow span:first-child{color:var(--soft);white-space:nowrap}
.srow span:last-child{font-weight:600;text-align:right}
.greet{margin-top:10px;background:#fff;border:1px dashed #d9d4d2;border-radius:10px;padding:10px 12px}
.greet em{font-style:normal;display:block;font-size:11px;color:var(--soft);font-weight:650;margin-bottom:5px}
.greet p{font-size:13.5px;line-height:1.6;white-space:pre-line}
.hint{margin-top:9px;font-size:11.5px;color:var(--soft);line-height:1.55}
.setbar{padding:13px var(--pad) 11px;background:var(--bg)}
.setbar h3{font-size:14px;font-weight:650;margin-bottom:6px}
.setbar .bud{font-size:16px;font-weight:700;margin-bottom:6px;color:var(--c)}
.tagrow{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.tagrow span{font-size:11px;background:#fff;border:1px solid var(--hair);border-radius:12px;padding:3px 8px;color:var(--mid)}
.adwrap{border:1px solid #dcdce2;border-radius:10px;overflow:hidden;background:#fff;margin:0 var(--pad) 6px}
.adhd{display:flex;align-items:center;gap:9px;padding:10px 12px}
.adhd .av{width:34px;height:34px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;
  background:var(--brand);color:var(--onbrand);font-size:13px;font-weight:700}
.adhd .who b{display:block;font-size:13px}
.adhd .who i{font-style:normal;font-size:11px;color:var(--soft)}
.adtext{padding:0 12px 10px;font-size:13.5px;line-height:1.55;white-space:pre-line;word-wrap:break-word}
.adwrap .media img{width:100%;display:block}
.adwrap .media iframe{display:block;width:100%;height:420px;border:0}
.adfoot{display:flex;align-items:center;gap:10px;background:#f4f4f6;padding:10px 12px;border-top:1px solid #e6e6ec}
.adfoot .hl{flex:1;min-width:0}
.adfoot .hl b{display:block;font-size:13px;line-height:1.35}
.adfoot .hl i{font-style:normal;font-size:11px;color:var(--soft);word-break:break-all}
.adfoot .cta{background:#e4e4ea;color:#111;font-size:12px;font-weight:700;padding:7px 11px;border-radius:5px;white-space:nowrap}
.asfeed{font-size:11px;color:var(--soft);text-align:center;margin:0 var(--pad) 8px}


/* ---------- iklan: ringkasan + bab ad set ---------- */
.adlay{padding:0 0 4px}
.sumcard{margin:14px var(--pad) 4px;border:1px solid var(--hair);border-radius:14px;overflow:hidden}
.sumcard h2{font-size:12px;letter-spacing:.6px;text-transform:uppercase;color:var(--soft);font-weight:700;padding:13px 15px 4px}
.sumbig{padding:2px 15px 4px}
.sumline{padding:0 15px 12px;font-size:13.5px;color:var(--mid);line-height:1.55}
.sumcard details{border-top:1px solid var(--hair)}
.sumcard summary{padding:10px 15px;font-size:13px;color:var(--c);font-weight:600;list-style:none;cursor:pointer}
.sumcard summary::-webkit-details-marker{display:none}
.sumbig b{display:block;font-size:24px;font-weight:700;letter-spacing:-.6px;color:var(--ink)}
.sumbig span{font-size:12.5px;color:var(--mid)}
.srow2{display:flex;justify-content:space-between;gap:14px;padding:9px 15px;border-bottom:1px solid var(--hair);font-size:13.5px}
.srow2:last-child{border-bottom:none}
.srow2 span:first-child{color:var(--soft);white-space:nowrap}
.srow2 span:last-child{font-weight:600;text-align:right}
.bubble{margin:4px 15px 12px;background:#e7fbe0;border-radius:12px 12px 12px 3px;padding:9px 12px;font-size:13.5px;
  line-height:1.55;white-space:pre-line;word-wrap:break-word;max-width:88%}
.bubtl{padding:10px 15px 0;font-size:11.5px;color:var(--soft)}
.sumnote{margin:0 15px 12px;padding:10px 12px;border-left:3px solid var(--new);background:#f5f9fc;border-radius:0 9px 9px 0;
  font-size:13px;line-height:1.55;white-space:pre-line}
.sumnote em{font-style:normal;display:block;font-size:11px;color:var(--new);font-weight:650;margin-bottom:2px}
.sumhint{padding:10px 15px 13px;font-size:11.5px;color:var(--soft);line-height:1.55;background:#fbfafa}
.aset{border-top:9px solid var(--bg)}
.ash{display:flex;align-items:center;gap:10px;width:100%;padding:14px var(--pad) 10px;text-align:left}
.ash .nm{flex:1;min-width:0}
.ash .nm b{display:block;font-size:15px;font-weight:700;letter-spacing:-.2px}
.ash .nm span{font-size:12px;color:var(--soft)}
.ash .bud{text-align:right;font-size:14px;font-weight:700;color:var(--c);white-space:nowrap}
.ash .bud small{display:block;font-size:10.5px;font-weight:500;color:var(--soft)}
.ash .chev{color:var(--soft);font-size:14px;flex:none;transition:transform .15s}
.aset.closed .ash .chev{transform:rotate(-90deg)}
.aset.closed .gb{display:none}
.ainfo{padding:0 var(--pad) 10px;font-size:13.5px;color:var(--mid);line-height:1.55}
.ainfo .r{display:flex;gap:10px;font-size:13px;padding:3px 0;line-height:1.45}
.ainfo .r span:first-child{color:var(--soft);flex:none;width:118px}
.chiprow{display:flex;flex-wrap:wrap;gap:5px}
.chiprow i{font-style:normal;font-size:11px;background:var(--bg);border-radius:12px;padding:3px 9px;color:var(--mid)}
.vtog{display:inline-flex;border:1px solid var(--hair);border-radius:9px;overflow:hidden;margin:2px var(--pad) 10px}
.vtog button{font-size:12.5px;padding:7px 14px;color:var(--mid)}
.vtog button[aria-pressed=true]{background:var(--ink);color:#fff;font-weight:600}
.adrow{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 var(--pad) 6px;scrollbar-width:none}
.adrow::-webkit-scrollbar{display:none}
/* Tanpa bingkai luar: mockup iklannya sendiri yang jadi kartu. Dua garis tepi bertumpuk
   membuat iklan terasa sempit. */
.adcard{flex:0 0 86%;scroll-snap-align:center;background:#fff;scroll-margin-top:56px;display:flex;flex-direction:column}
.adcard.one{flex-basis:100%}
.adcard .idr{padding:2px 2px 8px}
.adcard .idr .tag{font-size:10.5px;padding:3px 8px}
.adcard .idr .nm b{font-size:13.5px}
.adcard .revnote{margin:0 0 10px}
.adhint{font-size:11px;color:var(--soft);text-align:center;padding:2px var(--pad) 8px}
.mock{border:1px solid #e3e3e8;border-radius:12px;overflow:hidden;background:#fff}
.mock .adhd{padding:9px 11px}
.mock .adtext{padding:0 11px 9px;font-size:13px}
.mock .adtext button{color:var(--soft);font-size:13px}
.mfeed{position:relative;aspect-ratio:4/5;background:#efedeb;overflow:hidden}
.mfeed img{width:100%;height:100%;object-fit:cover;display:block}
.mfeed.sq{aspect-ratio:1/1}
/* Otomatis: bingkai mengikuti ukuran gambar yang diunggah, tanpa dipotong. */
.mfeed.auto{aspect-ratio:auto}
.mfeed.auto > img{height:auto}
.mfeed.auto.novid{aspect-ratio:4/5}
.mcar{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;height:100%}
.mcar::-webkit-scrollbar{display:none}
.mcar img{flex:0 0 100%;scroll-snap-align:center;width:100%}
.mfeed.auto .mcar{height:auto;align-items:flex-start}
.mfeed.auto .mcar img{height:auto;object-fit:contain}
.mdots{display:flex;justify-content:center;gap:5px;padding:8px 0 2px}
.mdots i{width:6px;height:6px;border-radius:50%;background:#d6d2d0}
.mcount{position:absolute;top:9px;right:9px;background:rgba(0,0,0,.55);color:#fff;font-size:10.5px;font-weight:650;
  border-radius:10px;padding:2px 8px;z-index:2}
.mfeed iframe,.mstory iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.mempty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;
  font-size:12.5px;color:var(--soft);line-height:1.5}
.mstory{position:relative;margin:0 auto;width:min(100%,300px);aspect-ratio:9/16;background:#111;border-radius:12px;overflow:hidden}
.mstory > img{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);width:100%;height:auto;display:block}
.mstory .bg{position:absolute;inset:-20px;background-size:cover;background-position:center;filter:blur(18px) brightness(.55)}
.mstory .top{position:absolute;left:0;right:0;top:0;padding:12px 11px;display:flex;gap:8px;align-items:center;
  background:linear-gradient(rgba(0,0,0,.45),transparent);color:#fff;z-index:2}
.mstory .top .av{width:28px;height:28px;border-radius:50%;background:var(--brand);color:var(--onbrand);font-size:11px;
  font-weight:700;display:flex;align-items:center;justify-content:center;border:1.5px solid #fff}
.mstory .top b{font-size:12px;display:block}
.mstory .top i{font-style:normal;font-size:10.5px;opacity:.85}
.mstory .bot{position:absolute;left:0;right:0;bottom:0;padding:30px 12px 14px;color:#fff;z-index:2;
  background:linear-gradient(transparent,rgba(0,0,0,.65))}
.mstory .bot p{font-size:12px;line-height:1.45;margin-bottom:9px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.mstory .bot span{display:block;text-align:center;background:#fff;color:#111;border-radius:20px;padding:8px;font-size:12.5px;font-weight:700}
.mstory .playbtn,.mfeed .playbtn{position:absolute;inset:0;z-index:1}

  var m = new RegExp("[?&]" + name + "=([^&]+)").exec(window.location.search);
  return m ? decodeURIComponent(m[1].replace(/\+/g," ")) : "";
}
var BULAN = ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
var BLN = ["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Agu","Sep","Okt","Nov","Des"];
function dparts(iso){
  var s = String(iso || "");
  if(s.length > 10){ var d = new Date(s); if(!isNaN(d)) return [d.getFullYear(), d.getMonth() + 1, d.getDate(), d]; }
  var p = s.slice(0,10).split("-");
  return p.length === 3 ? [Number(p[0]), Number(p[1]), Number(p[2]), null] : null;
}
function fmtDate(iso){ var p = dparts(iso); return p ? p[2] + " " + BULAN[p[1] - 1] : ""; }
function fmtShort(iso){ var p = dparts(iso); return p ? p[2] + " " + BLN[p[1] - 1] : ""; }
function fmtWhen(iso){
  var p = dparts(iso); if(!p) return "";
  var d = p[3]; if(!d) return fmtDate(iso);
  return p[2] + " " + BULAN[p[1] - 1] + ", " + ("0" + d.getHours()).slice(-2) + "." + ("0" + d.getMinutes()).slice(-2);
}
function toast(msg){
  var el = document.createElement("div");
  el.className = "toast"; el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); }, 2800);
}
// localStorage bisa dilarang di mode penyamaran. Halaman tidak boleh ikut mati cuma
// karena nama tidak bisa diingat — akibatnya hanya nama ditanya lagi lain kali.
function lsGet(k){ try{ return window.localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ window.localStorage.setItem(k,v); }catch(e){} }
function safeUrl(raw){
  var s = String(raw || "").trim();
  return /^https?:\/\//i.test(s) ? s : "";
}
function safeImg(raw){
  var s = String(raw || "");
  return /^data:image\/(png|jpe?g|webp|gif);base64,[A-Za-z0-9+\/=]+$/.test(s) ? s : "";
}
function safeId(raw){ return /^[A-Za-z0-9_-]{10,}$/.test(String(raw || "")) ? String(raw) : ""; }

/* ---------- warna brand ---------- */
function hexRgb(h){ return [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)]; }
function rgbHex(c){
  return "#" + c.map(function(v){
    var s = Math.max(0, Math.min(255, Math.round(v))).toString(16);
    return s.length < 2 ? "0" + s : s;
  }).join("");
}
function lum(c){
  var a = c.map(function(v){ v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); });
  return 0.2126 * a[0] + 0.7152 * a[1] + 0.0722 * a[2];
}
function applyBrand(){
  var b = doc.brand || {};
  var color = /^#[0-9A-Fa-f]{6}$/.test(b.color || "") ? b.color : BRAND_FALLBACK;
  var c = hexRgb(color), L = lum(c), t = c.slice(), i = 0;
  // Untuk tulisan dan garis di atas putih: digelapkan sampai kontras 4,5:1.
  while(1.05 / (lum(t) + 0.05) < 4.5 && i < 40){ t = t.map(function(v){ return v * 0.94; }); i++; }
  // Untuk tulisan di atas warna brand: pilih yang kontrasnya lebih tinggi.
  var onWhite = 1.05 / (L + 0.05), onDark = (L + 0.05) / 0.05;
  var on = onWhite >= 3 ? "#ffffff" : (onDark > onWhite ? rgbHex(c.map(function(v){ return v * 0.22; })) : "#ffffff");
  var st = document.documentElement.style;
  try{ st.setProperty("--brand", color); st.setProperty("--c", rgbHex(t)); st.setProperty("--onbrand", on); }catch(e){}
}

/* ---------- keadaan preview ---------- */
function isAds(){ return !!(doc && doc.kind === "ads"); }
function isExpired(){ var ms = Number((doc && doc.expiresAtMs) || 0); return ms > 0 && Date.now() > ms; }
function isArchived(){ return !!(doc && doc.archived); }
function isOpen(){ return !!doc && !isExpired() && !isArchived(); }
function itemById(id){
  var items = (doc && doc.items) || [];
  for(var i = 0; i < items.length; i++) if(items[i].id === id) return items[i];
  return null;
}
function byAt(a,b){ return String(a.at || "").localeCompare(String(b.at || "")); }

/* Komentar yang berlaku untuk satu konten: komentar asli, dengan isi diganti versi
   suntingan terakhirnya. Yang dikosongkan dianggap ditarik dan tidak ditampilkan.
   Jenis "revise" adalah bentuk lama dari halaman sebelumnya — diperlakukan sebagai komentar. */
function commentsOf(itemId){
  var last = {};
  responses.forEach(function(r){
    if(r.kind !== "edit" || !r.ref) return;
    if(!last[r.ref] || String(r.at || "") > String(last[r.ref].at || "")) last[r.ref] = r;
  });
  return responses.filter(function(r){
    return r.itemId === itemId && (r.kind === "comment" || r.kind === "revise");
  }).map(function(r){
    var e = last[r.id];
    return { id: r.id, at: r.at, picName: r.picName, slide: r.slide || 0,
      text: e ? String(e.text || "") : String(r.text || ""), edited: !!e };
  }).filter(function(c){ return c.text.trim() !== ""; }).sort(byAt);
}
// Komentar yang masuk SEBELUM revisi terakhir dianggap sudah ditindaklanjuti.
function isResolved(item, c){ return !!(item.revisedAt && String(c.at || "") < String(item.revisedAt)); }
function openComments(item){ return commentsOf(item.id).filter(function(c){ return !isResolved(item, c); }); }
function oldComments(item){ return commentsOf(item.id).filter(function(c){ return isResolved(item, c); }); }
/* Persetujuan yang berlaku: tanggapan setuju/batal terakhir, dan hanya kalau diberikan
   SETELAH revisi terakhir. Persetujuan untuk versi lama tidak dibawa ke versi baru. */
function approvalOf(item){
  var list = responses.filter(function(r){
    return r.itemId === item.id && (r.kind === "approve" || r.kind === "cancel");
  }).sort(byAt);
  var last = list[list.length - 1];
  if(!last || last.kind !== "approve") return null;
  if(item.revisedAt && String(last.at || "") < String(item.revisedAt)) return null;
  return last;
}
// "approved" | "new" (versi baru belum ditanggapi) | "sent" (sudah berkomentar) | "wait"
function stateOf(item){
  if(approvalOf(item)) return "approved";
  if(openComments(item).length) return "sent";
  if(item.revisedAt) return "new";
  return "wait";
}

/* ---------- gambar ---------- */
// Diambil satu per satu dengan get(), bukan query: rules hanya mengizinkan get untuk
// dokumen bertanda public. Diambil ulang kalau kontennya direvisi.
function loadImages(){
  ((doc && doc.items) || []).forEach(function(it){
    var id = it.imagesDoc; if(!id) return;
    var key = id + "@" + (it.revisedAt || "");
    if(imagesAsked[id] === key) return;
    imagesAsked[id] = key;
    db.collection(IMAGES_COLLECTION).doc(id).get().then(function(s){
      var arr = (s.exists && Array.isArray(s.data().images)) ? s.data().images : [];
      images[id] = arr.map(function(x){ return safeImg(typeof x === "string" ? x : (x && x.data)); })
        .filter(Boolean);
    }).catch(function(){
      images[id] = [];            // belum ditandai publik — kontennya tetap tampil tanpa gambar
    }).then(function(){ render(); });
  });
}

/* ---------- kirim tanggapan ---------- */
function send(itemId, kind, text, extra, okMsg){
  if(sending[itemId]) return;
  if(!isOpen()){ toast("Preview ini sudah ditutup."); return; }
  sending[itemId] = 1; render();

  var ref = db.collection(PREVIEW_COLLECTION).doc(token).collection("responses").doc();
  var payload = {
    itemId: String(itemId).slice(0,80),
    kind: kind,
    picName: String(myName).slice(0,60),
    at: new Date().toISOString(),
    text: String(text || "").slice(0, MAX_TEXT)
  };
  if(extra && extra.slide) payload.slide = Number(extra.slide);
  if(extra && extra.ref)   payload.ref = String(extra.ref).slice(0,40);

  ref.set(payload).then(function(){
    if(kind === "comment"){
      mine[ref.id] = 1;
      lsSet("ubahpv_mine_" + token, Object.keys(mine).join(","));
      delete drafts[itemId]; delete slideOn[itemId];
    }
    if(kind === "edit") editing = null;
    if(kind === "approve"){ delete reopened[itemId]; delete saying[itemId]; }
    delete asking[itemId];
    toast(okMsg || "Terkirim.");
  }).catch(function(e){
    toast("Gagal mengirim. Cek koneksi lalu coba lagi.");
    if(window.console) console.error(e);
  }).then(function(){ delete sending[itemId]; render(true); });
}

// Satu ketukan menyetujui semua materi di satu ad set. Di belakangnya tetap tercatat
// satu per satu, jadi tim memprosesnya dengan cara yang sama seperti persetujuan biasa.
function sendApproveMany(setId, list){
  var key = "set_" + setId;
  if(sending[key]) return;
  if(!isOpen()){ toast("Preview ini sudah ditutup."); return; }
  sending[key] = 1; render(true);
  var col = db.collection(PREVIEW_COLLECTION).doc(token).collection("responses");
  var at = new Date().toISOString();
  var chain = Promise.resolve(), done = 0;
  list.forEach(function(it){
    chain = chain.then(function(){
      return col.doc().set({ itemId: String(it.id).slice(0,80), kind: "approve",
        picName: String(myName).slice(0,60), at: at, text: "" }).then(function(){ done++; });
    });
  });
  // Ad set-nya sendiri ikut dicatat, berikut budget dan target yang tampil saat disetujui.
  // Itu yang jadi pegangan kalau kelak ditanya "budget berapa yang disetujui".
  var s = null; (doc.adSets || []).forEach(function(x){ if(x.id === setId) s = x; });
  if(s){
    chain = chain.then(function(){
      return col.doc().set({ itemId: ("set_" + setId).slice(0,80), kind: "approve",
        picName: String(myName).slice(0,60), at: at, text: setSnapshot(s).slice(0, MAX_TEXT) });
    });
  }
  chain.then(function(){ toast(s ? "Ad set disetujui." : done + " iklan disetujui."); })
    .catch(function(e){ toast(done ? done + " materi tercatat, sisanya gagal. Coba lagi." : "Gagal mengirim. Cek koneksi lalu coba lagi."); if(window.console) console.error(e); })
    .then(function(){ delete sending[key]; delete askAll[setId]; render(true); });
}

/* ---------- aksi ---------- */
function act(a, id, n, el){
  var it = id ? itemById(id) : null;
  if(a === "goto"){
    // Iklan di bab yang terlipat dibuka dulu, baru digulir ke sana.
    if(it && isAds()){
      var sid = setIdOf(it);
      if(openSet && !openSet[sid]){ openSet[sid] = true; render(true); }
    }
    var t = document.getElementById("k_" + id);
    if(t && t.scrollIntoView) t.scrollIntoView({ block: "start", inline: "center" });
  }
  else if(a === "toggleset"){
    openSet[id] = !openSet[id];
    render(true);
  }
  else if(a === "view"){ view[id] = n === "story" ? "story" : "feed"; render(true); }
  else if(a === "more"){ expanded[id] = 1; render(true); }
  else if(a === "say"){
    saying[id] = 1; render(true);
    setTimeout(function(){ var ta = document.getElementById("ta_" + id); if(ta){ try{ ta.focus(); }catch(e){} } }, 60);
  }
  else if(a === "approveall"){
    var todo = itemsOfSet(id).filter(function(x){ return !approvalOf(x); });
    if(!todo.length && setApproval(id)) return;
    if(!askAll[id]){ askAll[id] = 1; render(true); return; }
    needName(function(){ sendApproveMany(id, todo); });
  }
  else if(a === "next"){
    var items = doc.items || [];
    for(var i = 0; i < items.length; i++){
      if(stateOf(items[i]) !== "approved"){ act("goto", items[i].id); break; }
    }
  }
  else if(a === "play"){ playing[id] = 1; render(true); }
  else if(a === "approvecancel"){ delete asking[id]; render(true); }
  else if(a === "unfold"){ reopened[id] = 1; render(true); act("goto", id); }
  else if(a === "fold"){ delete reopened[id]; render(true); act("goto", id); }
  else if(a === "jump"){ showJump(); }
  else if(a === "jumpto"){ closeSheet(); act("goto", id); }
  else if(a === "slide"){
    var v = Number(n) || 0;
    slideOn[id] = (slideOn[id] === v) ? 0 : v;
    render(true);
  }
  else if(a === "send"){
    var text = (drafts[id] || "").trim();
    if(!text) return;
    needName(function(){ send(id, "comment", text, { slide: slideOn[id] || 0 }, "Tanggapan terkirim ke tim."); });
  }
  else if(a === "approve"){
    // Dua ketukan. Di HP tombol ini gampang kesenggol waktu menggulir, dan satu salah
    // pencet berarti konten lolos tanpa dibaca.
    if(!asking[id]){ asking[id] = 1; render(true); return; }
    needName(function(){ send(id, "approve", "", null, "Persetujuan tercatat."); });
  }
  else if(a === "cancel"){
    needName(function(){ send(id, "cancel", "", null, "Persetujuan dibatalkan."); });
  }
  else if(a === "edit"){
    var list = commentsOf(id);
    for(var j = 0; j < list.length; j++) if(list[j].id === n) editing = { id: n, itemId: id, text: list[j].text };
    render(true);
    setTimeout(function(){ var ta = document.getElementById("ed_" + n); if(ta){ try{ ta.focus(); }catch(e){} } }, 60);
  }
  else if(a === "editcancel"){ editing = null; render(true); }
  else if(a === "editsave"){
    if(!editing) return;
    var tx = String(editing.text || "").trim();
    if(!tx) return;
    send(editing.itemId, "edit", tx, { ref: editing.id }, "Tanggapan diperbarui.");
  }
  else if(a === "editdel"){
    if(!editing) return;
    if(!el || el.getAttribute("data-sure") !== "1"){
      if(el){ el.setAttribute("data-sure", "1"); el.textContent = "Yakin hapus? Ketuk lagi"; }
      return;
    }
    send(editing.itemId, "edit", "", { ref: editing.id }, "Tanggapan dihapus.");
  }
  else if(a === "rename"){ nameThen = function(){}; showNameSheet(myName); }
  else if(a === "namesave"){
    var inp = document.getElementById("nm");
    var v2 = inp ? inp.value.trim().slice(0,60) : "";
    if(!v2) return;
    myName = v2; lsSet("ubahpv_name", v2);
    var then = nameThen; layer.innerHTML = ""; nameThen = null;
    render(true);
    if(then) then();
  }
  else if(a === "nameclose"){ closeSheet(); }
  else if(a === "ovclose"){ if(el && el === window.__ovTarget) closeSheet(); }
}

/* ---------- penggambar ---------- */
function typing(){
  var a = document.activeElement;
  return !!(a && a.tagName === "TEXTAREA" && root.contains(a));
}
function setPart(id, html){
  if(cache[id] === html) return;
  var el = document.getElementById(id);
  if(!el) return;
  el.innerHTML = html;
  cache[id] = html;
}

// force = perubahan akibat aksi pengguna sendiri. Tanpa force (data baru dari server),
// gambar ulang ditunda selama pengguna masih mengetik: mengganti kotak teks di tengah
// ketikan menutup papan ketik di HP.
function render(force){
  if(!doc) return;
  if(!force && typing()){ pendingRender = true; return; }
  pendingRender = false;
  applyBrand();
  try{ document.title = "Preview " + (isAds() ? "Iklan " : "Konten ") + (doc.client || ""); }catch(e){}

  var items = doc.items || [];
  var groups = isAds() ? adGroups() : [];
  if(isAds() && !openSet){
    // Satu ad set: langsung terbuka. Banyak: hanya yang pertama, sisanya terlipat supaya
    // halaman tidak sepanjang belasan iklan sekaligus.
    openSet = {};
    groups.forEach(function(g, i){ openSet[g.id] = i === 0 || groups.length === 1; });
  }
  var ids = ["p_head"].concat(groups.map(function(g){ return "g_" + g.id + ":" + g.items.map(function(x){ return x.id; }).join(","); }))
    .concat(items.map(function(it){ return "k_" + it.id; })).concat(["p_end"]);
  var sig = ids.join("|") + "|" + (isAds() ? "ads" : "c");
  if(cache.__sig !== sig){
    // Kerangka dibangun sekali; setelah itu tiap bagian diganti sendiri-sendiri.
    // Tanpa ini, satu komentar masuk dari orang lain akan memuat ulang video yang
    // sedang diputar.
    var h = '<div id="p_head"></div>';
    if(isAds()){
      h += '<div class="adlay"><div id="p_camp"></div><div class="adsets">';
      groups.forEach(function(g){
        var gid = esc(g.id);
        h += '<section class="aset" id="g_' + gid + '"><div id="gh_' + gid + '"></div><div class="gb">' +
          '<div id="gi_' + gid + '"></div><div class="adrow">';
        g.items.forEach(function(it){ h += adCardShell(it, g.items.length === 1); });
        h += '</div>' + (g.items.length > 1 ? '<div class="adhint">Geser untuk iklan berikutnya</div>' : '') +
          '<div id="gf_' + gid + '"></div></div></section>';
      });
      h += '</div></div>';
    } else {
      items.forEach(function(it){ h += cardShellC(it); });
    }
    h += '<div id="p_end"></div>';
    root.innerHTML = h;
    root.className = "wrap" + (isAds() ? "" : " cm");
    cache = { __sig: sig };
  }

  setPart("p_head", isAds() ? headHtml(items) : headC(items));
  if(isAds()){
    setPart("p_camp", campaignHtml(doc.campaign || {}));
    groups.forEach(function(g){
      var sec = document.getElementById("g_" + g.id);
      if(sec) sec.className = "aset" + (openSet[g.id] ? "" : " closed");
      setPart("gh_" + g.id, groupHeadHtml(g));
      setPart("gi_" + g.id, groupInfoHtml(g));
      setPart("gf_" + g.id, groupFootHtml(g));
    });
  }
  items.forEach(function(it){
    if(isAds()){
      setPart("t_" + it.id, titleHtml(it));
      setPart("m_" + it.id, adMediaHtml(it));
      setPart("c_" + it.id, "");
      setPart("x_" + it.id, talkHtml(it));
      return;
    }
    var card = document.getElementById("k_" + it.id);
    if(card) card.className = "card ck" + (collapsed(it) ? " isdone" : "");
    setPart("t_" + it.id, titleC(it));
    setPart("m_" + it.id, mediaC(it));
    setPart("c_" + it.id, textC(it));
    setPart("x_" + it.id, talkC(it));
    setPart("d_" + it.id, doneC(it));
  });
  setPart("p_end", endHtml(items));
}
function cardShell(it){
  var id = esc(it.id);
  return '<div class="card" id="k_' + id + '"><div id="t_' + id + '"></div>' +
    '<div class="two"><div class="R" id="m_' + id + '"></div>' +
    '<div class="L"><div id="c_' + id + '"></div><div id="x_' + id + '"></div></div></div></div>';
}

function headHtml(items){
  var b = doc.brand || {}, logo = safeImg(b.logo), white = b.logoTone === "dark";
  var n = items.length, approved = 0, fresh = [], firstOpen = null;
  items.forEach(function(it){
    var s = stateOf(it);
    if(s === "approved") approved++; else if(!firstOpen) firstOpen = it;
    if(s === "new") fresh.push(it);
  });
  var unit = isAds() ? "materi iklan" : "konten";

  var h = coverHtml();

  if(isArchived()){
    h += doc.closedReason === "done"
      ? '<div class="banner done">Semua ' + unit + ' di halaman ini sudah disetujui dan diproses. ' +
        'Halaman disimpan sebagai catatan dan tidak menerima tanggapan baru.</div>'
      : '<div class="banner warn">Halaman ini sudah ditutup oleh tim UBAH dan tidak menerima tanggapan baru. ' +
        'Hubungi tim UBAH kalau butuh link terbaru.</div>';
  } else if(isExpired()){
    h += '<div class="banner warn">Masa berlaku preview ini sudah habis, jadi tanggapan ditutup. ' +
      'Isinya masih bisa dibaca. Hubungi tim UBAH kalau butuh link terbaru.</div>';
  } else if(myName && !isAds()){
    h += '<div class="me">Anda menanggapi sebagai <b>' + esc(myName) + '</b>' +
      '<button data-a="rename">ganti nama</button></div>';
  }

  if(isOpen() && fresh.length){
    h += '<button class="notice" data-a="goto" data-id="' + esc(fresh[0].id) + '"><b>' + fresh.length + " " + unit +
      ' sudah direvisi</b> dan menunggu tanggapan Anda. <u>Lihat</u></button>';
  }

  if(n > 1 && !isAds()){
    h += '<div class="idx"><div class="ttl">Semua ' + unit + '</div><div class="strip">';
    items.forEach(function(it, i){
      var s = stateOf(it), img = (images[it.imagesDoc] || [])[0];
      var cls = s === "approved" ? "done" : s === "new" ? "new" : s === "sent" ? "sent" : "";
      var lab = s === "approved" ? "Setuju" : s === "new" ? "Versi baru" : s === "sent" ? "Ditanggapi" : "Belum";
      h += '<button class="' + cls + '" data-a="goto" data-id="' + esc(it.id) + '" aria-label="' +
        esc(nameOf(it, i)) + ", " + lab + '"><span class="im">' +
        (img ? '<img src="' + img + '" alt="">' : '<i>' + (i + 1) + '</i>') +
        '</span><span class="st">' + lab + '</span></button>';
    });
    h += '</div></div>';
  }

  var col = /^#[0-9A-Fa-f]{6}$/.test(b.color || "") ? b.color : BRAND_FALLBACK, L = lum(hexRgb(col));

      (it.postingDate ? 'Tim kami akan menyiapkannya untuk tayang ' + esc(fmtDate(it.postingDate)) + '. ' : 'Tim kami akan menjadwalkannya. ') +
      'Masih bisa dibatalkan selama link berlaku.</p><div class="bb">' +
      '<button class="y" data-a="approve" data-id="' + id + '"' + (sending[it.id] ? " disabled" : "") + '>Ya, setujui</button>' +
      '<button class="n" data-a="approvecancel" data-id="' + id + '">Batal</button></div></div>';
  } else {
    h += '<div class="acts2"><button class="ap" data-a="approve" data-id="' + id + '"' + (sending[it.id] ? " disabled" : "") + '>✓ Setujui</button>' +
      (wantSay ? '' : '<button class="km" data-a="say" data-id="' + id + '">💬 Komentar</button>') + '</div>';
  }
  return h;
}

function doneC(it){
  var ap = approvalOf(it); if(!ap) return "";
  var img = (images[it.imagesDoc] || [])[0], id = esc(it.id);
  return '<div class="drow">' + (img ? '<img src="' + img + '" alt="">' : '<i></i>') +
    '<div class="x"><b>' + esc(nameOf(it, indexOf(it))) + '</b><span>✓ Disetujui ' + esc(ap.picName || "") +
    ' · ' + esc(fmtShort(ap.at)) + '</span></div><span class="ac">' +
    '<button data-a="unfold" data-id="' + id + '">Lihat</button>' +
    (!it.processedAt && isOpen() ? '<button data-a="cancel" data-id="' + id + '">Batalkan</button>' : '') + '</span></div>';
}

function showJump(){
  var items = doc.items || [];
  var h = '<div class="ov" data-a="ovclose"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="jph">' +
    '<h2 id="jph">Lompat ke konten</h2><div class="jl">';
  items.forEach(function(it, i){
    var s = stateOf(it), img = (images[it.imagesDoc] || [])[0];
    var lab = s === "approved" ? "Disetujui" : s === "new" ? "Versi baru" : s === "sent" ? "Ada komentar" : "Menunggu";
    h += '<button data-a="jumpto" data-id="' + esc(it.id) + '">' + (img ? '<img src="' + img + '" alt="">' : '<i>' + (i + 1) + '</i>') +
      '<span><b>' + esc(nameOf(it, i)) + '</b><em class="' + s + '">' + lab + '</em></span></button>';
  });
  h += '</div><button class="no" data-a="nameclose">Tutup</button></div></div>';
  layer.innerHTML = h;
}

/* ---------- bagian khusus iklan ---------- */
function rupiah(n){ return "Rp " + Math.round(Number(n) || 0).toLocaleString("id-ID"); }
function campaignDays(){
  var c = doc.campaign || {}, a = dparts(c.startDate), b = dparts(c.endDate);
  if(!a || !b) return 0;
  var d = Math.round((Date.UTC(b[0], b[1] - 1, b[2]) - Date.UTC(a[0], a[1] - 1, a[2])) / 86400000) + 1;
  return d > 0 ? d : 0;
}
// Budget per ad set dalam dua bentuk sekaligus. Yang tidak dinyatakan per hari atau
// total ditahan: angka uang yang salah tafsir lebih berbahaya daripada angka yang tidak ada.
function budgetInfo(s){
  var b = Number(s.budget) || 0, days = campaignDays();
  if(!b) return null;
  if(s.budgetType === "daily") return { main: rupiah(b) + "/hari", sub: days ? "±" + rupiah(b * days) + " selama " + days + " hari" : "", total: days ? b * days : null };
  if(s.budgetType === "total") return { main: rupiah(b), sub: days ? "±" + rupiah(b / days) + "/hari" : "selama periode", total: b };
  return { main: "", sub: "", total: null };
}
function setIdOf(it){
  var sets = doc.adSets || [];
  for(var i = 0; i < sets.length; i++) if(sets[i].id === it.adSetId) return it.adSetId;
  return "_lain";
}
function adGroups(){
  var items = doc.items || [], out = [];
  (doc.adSets || []).forEach(function(s){
    var list = items.filter(function(it){ return it.adSetId === s.id; });
    if(list.length) out.push({ id: s.id, set: s, items: list });
  });
  var rest = items.filter(function(it){ return setIdOf(it) === "_lain"; });
  if(rest.length) out.push({ id: "_lain", set: null, items: rest });
  return out;
}
function itemsOfSet(sid){
  for(var g = adGroups(), i = 0; i < g.length; i++) if(g[i].id === sid) return g[i].items;
  return [];
}
function wantsStory(s){
  return !!s && (s.placements || []).some(function(p){ return /stor|reels|status/i.test(p); });
}

function setApproval(sid){
  var last = null;
  responses.forEach(function(r){
    if(r.itemId !== "set_" + sid || (r.kind !== "approve" && r.kind !== "cancel")) return;
    if(!last || String(r.at || "") > String(last.at || "")) last = r;
  });
  if(!last || last.kind !== "approve") return null;
  if(doc.lastRevisedAt && String(last.at || "") < String(doc.lastRevisedAt)) return null;
  return last;
}
// Satu kalimat tentang siapa yang melihat iklan dan di mana.
function setSentence(s){
  var who = String(s.interest || "").trim(), where = String(s.location || "").trim();
  var pl = (s.placements || []).map(function(p){ return String(p).replace(/^Instagram\s+/i, "").replace(/^Facebook\s+/i, "FB "); });
  var t = "";
  if(who || where) t = "Tampil ke " + (who || "audiens") + (where ? " di " + where : "");
  if(pl.length) t += (t ? ", lewat " : "Tampil lewat ") + pl.join(", ");
  return t ? t + "." : "";
}
// Ringkasan yang disimpan bersama persetujuan ad set.
function setSnapshot(s){
  var bi = budgetInfo(s), parts = [];
  if(bi && bi.main) parts.push(bi.main + (bi.sub ? " (" + bi.sub + ")" : ""));
  if(s.location) parts.push(s.location);
  if(s.interest) parts.push(s.interest);
  return parts.join(" · ");
}

function campaignHtml(c){
  var sets = doc.adSets || [], days = campaignDays(), total = 0, known = true, any = false;
  sets.forEach(function(s){
    var bi = budgetInfo(s); if(!bi) return;
    any = true;
    if(bi.total == null) known = false; else total += bi.total;
  });
  var h = '<div class="sumcard"><h2>Ringkasan yang Anda setujui</h2>';
  if(any && known){
    h += '<div class="sumbig"><b>' + rupiah(total) + '</b><span>total budget iklan' +
      (days ? ' · ±' + rupiah(total / days) + '/hari' : '') + '</span></div>';
  } else if(any){
    h += '<div class="sumbig"><b style="font-size:16px">Budget per ad set</b><span>Rinciannya di tiap ad set di bawah.</span></div>';
  }
  // Satu kalimat, bukan lima baris: tanggal, lama tayang, platform, tujuan.
  var bits = [];
  if(c.startDate || c.endDate) bits.push((c.startDate ? fmtShort(c.startDate) : "?") + " – " + (c.endDate ? fmtShort(c.endDate) : "?") + (days ? ", " + days + " hari" : ""));
  if(c.daypart) bits.push(c.daypart);
  if(c.platform) bits.push(c.platform);
  var obj = String(c.objective || "").replace(/\s*\(.*\)\s*$/, "");
  if(obj) bits.push("tujuan " + obj);
  if(sets.length) bits.push(sets.length + " ad set");
  if(bits.length) h += '<div class="sumline">' + esc(bits.join(" · ")) + '</div>';
  if(doc.lastRevisedAt && String(doc.adsRevNote || "").trim()){
    h += '<div class="sumnote"><em>Yang diubah, ' + esc(fmtShort(doc.lastRevisedAt)) + '</em>' + esc(doc.adsRevNote) + '</div>';
  }
  if(c.greeting){
    h += '<details><summary>Lihat pesan pembuka yang diterima calon pelanggan</summary><div class="bubble">' + esc(c.greeting) + '</div></details>';
  }
  h += '<div class="sumhint">Iklan mulai tayang setelah disetujui. Yang belum disetujui tidak dijalankan.</div></div>';
  return h;
}

function groupHeadHtml(g){
  var s = g.set, bi = s ? budgetInfo(s) : null, n = g.items.length;
  var ok = g.items.filter(function(it){ return !!approvalOf(it); }).length;
  return '<button class="ash" data-a="toggleset" data-id="' + esc(g.id) + '" aria-expanded="' + (openSet[g.id] ? "true" : "false") + '">' +
    '<span class="nm"><b>' + esc(s ? s.name : "Materi lain") + '</b><span>' + n + ' iklan · ' + ok + ' disetujui</span></span>' +
    (bi && bi.main ? '<span class="bud">' + esc(bi.main) + (bi.sub ? '<small>' + esc(bi.sub) + '</small>' : '') + '</span>' : '') +
    '<span class="chev" aria-hidden="true">▾</span></button>';
}
function groupInfoHtml(g){
  var s = g.set; if(!s) return "";
  var sen = setSentence(s), h = sen ? '<div class="ainfo">' + esc(sen) + '</div>' : '';
  if(wantsStory(s)){
    var v = view[g.id] || "feed";
    h += '<div class="vtog" role="group" aria-label="Tampilan">' +
      '<button data-a="view" data-id="' + esc(g.id) + '" data-n="feed" aria-pressed="' + (v === "feed") + '">Feed</button>' +
      '<button data-a="view" data-id="' + esc(g.id) + '" data-n="story" aria-pressed="' + (v === "story") + '">Story / Reels</button></div>';
  }
  return h;
}
function groupFootHtml(g){
  var todo = g.items.filter(function(it){ return !approvalOf(it); }), key = "set_" + g.id, h = '<div class="gfoot">';
  var sap = g.set ? setApproval(g.id) : null, bi = g.set ? budgetInfo(g.set) : null;
  var done = !todo.length && (!g.set || sap);
  if(done){
    h += '<div class="alldone">' + (g.set ? "Ad set ini sudah disetujui" + (sap ? " " + esc(sap.picName || "") + ", " + esc(fmtWhen(sap.at)) : "") + "."
      : "Semua iklan di bagian ini sudah disetujui.") + '</div>';
  } else if(isOpen()){
    // Tombol menyebut apa persisnya yang disetujui: jumlah iklan dan budget-nya.
    var what = g.items.length + " iklan" + (bi && bi.main ? ", " + bi.main : "");
    h += '<button class="allbtn' + (askAll[g.id] ? " ask" : "") + '" data-a="approveall" data-id="' + esc(g.id) + '"' + (sending[key] ? " disabled" : "") + '>' +
      (askAll[g.id] ? "Yakin? Ketuk sekali lagi<small>" + esc(what) + (g.set ? ", berikut targetnya" : "") + "</small>"
        : "✓ Setujui " + (g.set ? "ad set ini" : "semua iklan ini") + "<small>" + esc(what) + "</small>") + '</button>';
  }
  if(g.set){
    var p = { id: key, revisedAt: doc.lastRevisedAt || "" };
    var body = commentsHtml(p, false);
    var wantSay = saying[key] || (drafts[key] || "").trim() || body;
    if(wantSay){
      h += '<div class="settalk"><div class="h">Soal budget atau target ad set ini</div>' +
        '<div class="l">Misalnya lokasinya kurang luas, usia audiensnya, atau budget-nya.</div>' + body +
        (isOpen() ? sayHtml(p, "Tulis di sini…", "") : "") + '</div>';
    } else if(isOpen()){
      h += '<button class="setlink" data-a="say" data-id="' + esc(key) + '">Ada catatan soal budget atau target?</button>';
    }
  }
  return h + '</div>';
}

function adCardShell(it, single){
  var id = esc(it.id);
  return '<article class="adcard' + (single ? " one" : "") + '" id="k_' + id + '"><div id="t_' + id + '"></div>' +
    '<div id="m_' + id + '"></div><div id="x_' + id + '"></div></article>';
}

function adVideo(it, poster){
  var vid = safeId(it.videoId);
  if(playing[it.id]) return '<iframe src="https://drive.google.com/file/d/' + vid + '/preview" allow="autoplay" allowfullscreen></iframe>';
  return (poster ? '<img src="' + poster + '" alt="">' : '<span class="mempty" style="color:#bbb">Video</span>') +
    '<button class="playbtn" data-a="play" data-id="' + esc(it.id) + '" aria-label="Putar video"><span class="play"><i></i></span></button>';
}

// Digambar seperti yang akan dilihat audiens: di feed (4:5) atau di Story/Reels (9:16).
// Headline kepanjangan atau CTA yang tidak nyambung langsung kelihatan di sini.
function adMediaHtml(it){
  var imgs = images[it.imagesDoc] || [], akun = String(doc.client || "").trim();
  var boost = it.adSource === "boost", vid = safeId(it.videoId);
  var sid = setIdOf(it), s = null;
  (doc.adSets || []).forEach(function(x){ if(x.id === sid) s = x; });
  var story = wantsStory(s) && view[sid] === "story";
  var poster = imgs[0] || "";
  var text = String(it.caption || ""), h = "";

  if(story){
    h += '<div class="mstory">' + (poster && !playing[it.id] ? '<div class="bg" style="background-image:url(' + poster + ')"></div>' : '') +
      (vid ? adVideo(it, poster) : poster ? '<img src="' + poster + '" alt="">' : '<span class="mempty" style="color:#bbb">Gambar materi belum diunggah</span>') +
      '<div class="top"><span class="av">' + esc(akun.slice(0,1).toUpperCase() || "?") + '</span><span><b>' + esc(akun) + '</b><i>Bersponsor</i></span></div>' +
      (playing[it.id] ? '' : '<div class="bot">' + (text ? '<p>' + esc(text) + '</p>' : '') + (it.cta ? '<span>' + esc(it.cta) + '</span>' : '') + '</div>') +
      '</div><div class="storynote">Kalau tidak ada materi khusus Story, Meta menampilkan materi feed seperti ini.</div>';
  } else {
    var long = text.length > 125 && !expanded[it.id];
    h += '<div class="mock"><div class="adhd"><div class="av">' + esc(akun.slice(0,1).toUpperCase() || "?") + '</div>' +
      '<div class="who"><b>' + esc(akun) + '</b><i>' + (boost ? "Post yang dinaikkan · Bersponsor" : "Bersponsor") + '</i></div></div>';
    if(text){
      h += '<div class="adtext">' + esc(long ? text.slice(0, 125).replace(/\s+\S*$/, "") : text) +
        (long ? '… <button data-a="more" data-id="' + esc(it.id) + '">selengkapnya</button>' : '') + '</div>';
    }
    // Bingkai: pilihan tim (1:1 / 4:5), atau otomatis mengikuti ukuran gambar yang diunggah.
    var fr = it.frame === "1:1" ? " sq" : it.frame === "4:5" ? "" : (poster && !playing[it.id] ? " auto" : " auto novid");
    if(it.frame !== "1:1" && it.frame !== "4:5" && !poster) fr = "";
    var multi = !vid && imgs.length > 1;
    h += '<div class="mfeed' + fr + '">' + (vid ? adVideo(it, poster)
      : multi ? '<span class="mcount">1/' + imgs.length + '</span><div class="mcar">' + imgs.map(function(src, i){
          return '<img src="' + src + '" alt="Slide ' + (i + 1) + '" loading="lazy">'; }).join("") + '</div>'
      : poster ? '<img src="' + poster + '" alt="" loading="lazy">'
      : '<span class="mempty">' + (boost ? "Post yang sudah tayang. Buka lewat tautan di bawah." : "Gambar materi belum diunggah.") + '</span>') + '</div>';
    if(multi){
      h += '<div class="mdots">' + imgs.map(function(_, i){ return '<i' + (i === 0 ? ' style="background:var(--c)"' : '') + '></i>'; }).join("") + '</div>';
    }
    if(it.headline || it.cta || it.destination){
      h += '<div class="adfoot"><div class="hl">' + (it.headline ? '<b>' + esc(it.headline) + '</b>' : '') +
        (it.destination ? '<i>' + esc(it.destination) + '</i>' : '') + '</div>' +
        (it.cta ? '<div class="cta">' + esc(it.cta) + '</div>' : '') + '</div>';
    }
    h += '</div>';
  }
  var link = boost ? safeUrl(it.postLink) : safeUrl(it.driveLink);
  if(link){
    h += '<a class="orig" href="' + esc(link) + '" target="_blank" rel="noopener noreferrer"><u>' +
      (boost ? "Lihat postingan aslinya di Instagram" : "Buka file asli di Drive") + '</u></a>';
  }
  if(boost) h += '<div class="storynote">Post ini sudah tayang. Yang disetujui budget dan targetnya.</div>';
  return h;
}

function endHtml(items){
  var a = 0, n = 0, s = 0, w = 0;
  items.forEach(function(it){
    var st = stateOf(it);
    if(st === "approved") a++; else if(st === "new") n++; else if(st === "sent") s++; else w++;
  });
  var h = '<div class="end"><h2>Ringkasan</h2><div class="sum"><div class="a"><b>' + a + '</b><span>disetujui</span></div>';
  if(n) h += '<div class="n"><b>' + n + '</b><span>versi baru, menunggu Anda</span></div>';
  if(s) h += '<div><b>' + s + '</b><span>sedang direvisi tim</span></div>';
  h += '<div><b>' + w + '</b><span>belum ditanggapi</span></div></div>';
  if(isOpen()){
    h += isAds()
      ? '<p>Iklan yang sudah disetujui kami siapkan untuk tayang sesuai jadwal. Kalau ada yang perlu diubah, tulis di bawah iklannya atau di kotak komentar ad set, dan versi barunya muncul di halaman ini juga, lewat link yang sama.</p>'
      : '<p>Yang sudah disetujui langsung kami jadwalkan. Kalau masih ada yang perlu diubah, tulis di bawah kontennya dan versi barunya akan muncul di halaman ini juga, lewat link yang sama.</p>';
  }
  h += '<div class="fine">Halaman ini dibuat UBAH Digital untuk ' + esc(doc.client || "") +
    (doc.expiresAtMs && isOpen() ? ' dan berlaku sampai ' + esc(fmtDate(new Date(doc.expiresAtMs).toISOString())) : '') +
    '. Semua tanggapan tercatat dan langsung sampai ke tim.<br><br>' +
    'Kalau dibuka dari iPhone, matikan mode True Tone supaya warna gambar terlihat sebagaimana aslinya.</div></div>';
  return h;
}

function fatal(judul, pesan){
  cache = {};
  root.innerHTML = '<div class="screen"><h2>' + esc(judul) + '</h2><p>' + esc(pesan) + '</p></div>';
}

/* ---------- pendengar ---------- */
function onClick(e){
  var el = e.target;
  window.__ovTarget = el;
  while(el && el !== document.body && !(el.getAttribute && el.getAttribute("data-a"))) el = el.parentNode;
  if(!el || el === document.body || !el.getAttribute) return;
  if(el.disabled) return;
  act(el.getAttribute("data-a"), el.getAttribute("data-id") || "", el.getAttribute("data-n") || "", el);
}
function onInput(e){
  var t = e.target;
  if(!t || t.tagName !== "TEXTAREA") return;
  t.style.height = "auto"; t.style.height = t.scrollHeight + "px";
  var kind = t.getAttribute("data-i");
  if(kind === "draft"){
    var id = t.getAttribute("data-id");
    drafts[id] = t.value;
    var b = document.getElementById("sd_" + id); if(b) b.className = "send" + (t.value.trim() ? " live" : "");
    var c = document.getElementById("cn_" + id); if(c) c.textContent = t.value.length > 400 ? t.value.length + "/" + MAX_TEXT : "";
    // html di cache sengaja dibuang: isi kotak sudah berubah di layar, jadi perbandingan
    // dengan html lama tidak lagi sah untuk bagian ini.
    delete cache["x_" + id];
    if(/^set_/.test(id)) delete cache["gf_" + id.slice(4)];
  } else if(kind === "edit" && editing){
    editing.text = t.value;
    var sv = t.parentNode.querySelector(".send"); if(sv) sv.className = "send" + (t.value.trim() ? " live" : "");
    delete cache["x_" + editing.itemId];
    if(/^set_/.test(editing.itemId)) delete cache["gf_" + editing.itemId.slice(4)];
  }
}
function onFocusOut(){
  setTimeout(function(){ if(pendingRender && !typing()) render(); }, 200);
}

/* ---------- mulai ---------- */
(function start(){
  token = qs("k").replace(/[^A-Za-z0-9_-]/g, "").slice(0, 64);
  if(!token){
    fatal("Link tidak lengkap", "Alamatnya kurang kode preview. Minta link terbaru ke tim UBAH.");
    return;
  }
  try{
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
  }catch(e){
    fatal("Gagal memuat", "Coba buka ulang halaman ini. Kalau tetap gagal, hubungi tim UBAH.");
    return;
  }

  myName = String(lsGet("ubahpv_name") || "").slice(0,60);
  String(lsGet("ubahpv_mine_" + token) || "").split(",").forEach(function(x){ if(x) mine[x] = 1; });

  document.addEventListener("click", onClick);
  document.addEventListener("input", onInput);
  document.addEventListener("focusout", onFocusOut);
  // Penanda slide carousel iklan mengikuti geseran. Peristiwa scroll tidak merambat,
  // jadi didengarkan di tahap capture.
  document.addEventListener("scroll", function(e){
    var el = e.target;
    if(!el || !el.classList || !el.classList.contains("mcar") || !el.clientWidth) return;
    var i = Math.round(el.scrollLeft / el.clientWidth), n = el.children.length;
    var cnt = el.parentNode.querySelector(".mcount"); if(cnt) cnt.textContent = (i + 1) + "/" + n;
    var dots = el.parentNode.nextElementSibling;
    if(dots && dots.classList.contains("mdots")){
      for(var k = 0; k < dots.children.length; k++) dots.children[k].style.background = k === i ? "var(--c)" : "#d6d2d0";
    }
  }, true);

  var first = true;
  db.collection(PREVIEW_COLLECTION).doc(token).onSnapshot(function(snap){
    if(!snap.exists){
      doc = null;
      fatal("Preview tidak ditemukan", "Link ini mungkin sudah dihapus. Minta link terbaru ke tim UBAH.");
      return;
    }
    doc = snap.data();
    render();
    loadImages();
    if(first){
      first = false;
      db.collection(PREVIEW_COLLECTION).doc(token).collection("responses")
        .onSnapshot(function(rs){
          responses = rs.docs.map(function(d){ var o = d.data(); o.id = d.id; return o; });
          render();
        }, function(){ /* tanggapan gagal dimuat — halaman tetap bisa dibaca */ });
    }
  }, function(){
    fatal("Tidak bisa membuka preview", "Periksa koneksi lalu buka ulang. Kalau tetap gagal, hubungi tim UBAH.");
  });
})();
