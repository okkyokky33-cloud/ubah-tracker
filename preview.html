<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Preview Konten</title>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<style>
:root{--brand:#58279D;--c:#58279D;--onbrand:#ffffff;--ink:#121212;--mid:#56514e;--soft:#8c8785;
  --hair:#e9e6e4;--bg:#f4f2f1;--ok:#2f6b4f;--new:#1f5f8b;--warn:#9d4a40;--pad:16px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);line-height:1.45;-webkit-font-smoothing:antialiased;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.wrap{max-width:520px;margin:0 auto;background:#fff;min-height:100vh}
img{display:block;max-width:100%}
button,textarea,input{font:inherit;color:inherit}
button{border:none;background:none;cursor:pointer}
a{color:inherit}

/* Tulisan di atas warna brand mengikuti terang-gelapnya warna itu: brand pink muda
   dengan tulisan putih cuma 1,99:1, jadi di sana tulisannya dibuat gelap. */
.hero{background:var(--brand);padding:22px var(--pad) 20px;color:var(--onbrand)}
.hero.white{background:#fff;color:var(--ink);border-bottom:3px solid var(--brand)}
.hero img{height:40px;width:auto;margin-bottom:16px}
.hero .cname{font-size:15px;font-weight:650;margin-bottom:12px;opacity:.9}
.hero h1{font-size:21px;font-weight:650;letter-spacing:-.4px}
.hero .per{font-size:14px;margin-top:3px}

.banner{padding:12px var(--pad);font-size:13px;line-height:1.55;border-bottom:1px solid var(--hair)}
.banner.warn{background:#fff8e6;color:#7a5c12}
.banner.done{background:#eef5f0;color:var(--ok)}

.me{padding:11px var(--pad);font-size:13px;color:var(--mid);border-bottom:1px solid var(--hair)}
.me b{color:var(--ink);font-weight:600}
.me button{color:var(--c);margin-left:6px;text-decoration:underline;text-underline-offset:2px;font-size:13px}

.notice{display:block;margin:14px var(--pad) 0;padding:12px 14px;border-radius:10px;background:#eaf3f9;
  color:var(--new);font-size:13.5px;line-height:1.5;text-decoration:none;text-align:left;width:calc(100% - 2*var(--pad))}
.notice b{font-weight:650}
.notice u{text-underline-offset:2px}

.idx{padding:14px var(--pad);border-bottom:1px solid var(--hair)}
.idx .ttl{font-size:12px;color:var(--soft);margin-bottom:9px}
.strip{display:flex;gap:9px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.strip::-webkit-scrollbar{display:none}
.strip button{flex:none;width:62px;text-align:center}
.strip .im{display:block;width:62px;height:62px;border-radius:7px;overflow:hidden;border:2px solid transparent;background:var(--bg)}
.strip .im img{width:100%;height:100%;object-fit:cover}
.strip .im i{display:flex;width:100%;height:100%;align-items:center;justify-content:center;font-style:normal;
  font-size:18px;font-weight:700;color:var(--soft)}
.strip .st{display:block;font-size:10px;margin-top:5px;color:var(--soft);line-height:1.25}
.strip .done .im{border-color:var(--ok)}
.strip .done .st{color:var(--ok)}
.strip .new .im{border-color:var(--new)}
.strip .new .st{color:var(--new);font-weight:650}
.strip .sent .st{color:var(--c)}

.bar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.96);border-bottom:1px solid var(--hair);
  padding:10px var(--pad);display:flex;gap:12px;align-items:center}
.bar .n{flex:1;font-size:13px;font-weight:600}
.bar .n em{font-style:normal;font-weight:400;color:var(--soft)}
.bar button{font-size:13px;font-weight:600;color:var(--c)}

.card{border-bottom:9px solid var(--bg);scroll-margin-top:50px}
.idr{display:flex;align-items:center;gap:10px;padding:13px var(--pad) 11px}
.idr .nm{flex:1;min-width:0}
.idr .nm b{display:block;font-size:14.5px;font-weight:650;word-wrap:break-word}
.idr .nm span{font-size:12px;color:var(--soft)}
.tag{font-size:11.5px;font-weight:650;border-radius:12px;padding:4px 10px;white-space:nowrap}
.tag.new{background:#eaf3f9;color:var(--new)}
.tag.ok{background:#e8f2ec;color:var(--ok)}
.tag.wait{background:#f1efee;color:var(--soft)}
.tag.sent{background:#f1efee;color:var(--mid)}
.revnote{margin:0 var(--pad) 12px;padding:11px 13px;border-left:3px solid var(--new);background:#f5f9fc;
  border-radius:0 9px 9px 0;font-size:13.5px;line-height:1.55;white-space:pre-line;word-wrap:break-word}
.revnote em{font-style:normal;display:block;font-size:11.5px;color:var(--new);font-weight:650;margin-bottom:3px}

/* ---------- media ---------- */
.one{padding:0 var(--pad) 4px}
.one img{width:100%;border-radius:8px;background:var(--bg)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;padding:0 var(--pad) 4px}
.gs{text-align:center}
.gs .im{display:block;border-radius:6px;overflow:hidden;border:2px solid transparent;background:var(--bg)}
.gs .im img{width:100%}
.gs.on .im{border-color:var(--c)}
.gs .lb{display:block;font-size:10.5px;color:var(--soft);margin-top:4px}
.gs.on .lb{color:var(--c);font-weight:650}
/* Carousel pendek digeser seperti di Instagram; tiap slide tetap diberi nomor. */
.swipe{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 var(--pad) 4px;scrollbar-width:none}
.swipe::-webkit-scrollbar{display:none}
.swipe .sl{flex:0 0 82%;scroll-snap-align:center;text-align:center}
.swipe .sl img{width:100%;border-radius:8px;background:var(--bg)}
.swipe .lb{display:block;font-size:11px;color:var(--soft);margin-top:5px}
.swipehint{font-size:11px;color:var(--soft);text-align:center;padding:4px var(--pad) 0}
/* Reels: cover dan video berdampingan seperti di deck tim. Cover itu yang tampil di
   kisi Instagram dan sering direvisi sendiri, jadi tidak dilebur dengan videonya. */
.duo{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 var(--pad) 4px;align-items:start}
.duo.solo{grid-template-columns:minmax(0,300px);justify-content:center}
.duo .t{position:relative;border-radius:8px;overflow:hidden;background:#000;aspect-ratio:9/16;display:block;width:100%}
.duo .t.cov{background:var(--bg);aspect-ratio:auto}
.duo .t img{width:100%;height:100%;object-fit:cover}
.duo .t.cov img{height:auto}
.duo .t iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.duo .lb{font-size:11px;color:var(--soft);text-align:center;margin-top:5px}
.play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:52px;height:52px;border-radius:50%;
  background:rgba(0,0,0,.45);border:1.5px solid rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center}
.play i{width:0;height:0;border-left:14px solid #fff;margin-left:4px;border-top:9px solid transparent;border-bottom:9px solid transparent}
.orig{display:block;text-align:center;padding:10px var(--pad) 4px;font-size:12px;color:var(--c);text-decoration:none}
.orig u{text-underline-offset:2px}
.nomedia{margin:0 var(--pad) 4px;padding:22px 14px;border:1px dashed var(--hair);border-radius:10px;
  font-size:13px;color:var(--soft);text-align:center;line-height:1.55}

.when{padding:8px var(--pad) 0;font-size:12.5px;color:var(--soft)}
.cap{padding:8px var(--pad) 0;font-size:14px;line-height:1.55;white-space:pre-line;word-wrap:break-word}
.ond{margin:12px var(--pad) 0;padding:11px 13px;border:1px dashed #d9d4d2;border-radius:10px;
  font-size:13.5px;line-height:1.6;white-space:pre-line;word-wrap:break-word}
.ond em{font-style:normal;display:block;font-size:11.5px;color:var(--soft);font-weight:650;margin-bottom:4px}

/* ---------- tanggapan ---------- */
.old{margin:14px var(--pad) 0;border:1px solid var(--hair);border-radius:10px}
.old summary{padding:11px 13px;font-size:12.5px;color:var(--soft);list-style:none;cursor:pointer}
.old summary::-webkit-details-marker{display:none}
.old summary::after{content:"lihat";float:right;color:var(--c);font-weight:600}
.old[open] summary::after{content:"tutup"}
.m{padding:0 13px 12px;font-size:13.5px;line-height:1.5;word-wrap:break-word}
.m b{font-weight:600;margin-right:5px}
.m time{display:block;font-size:11.5px;color:var(--soft);margin-top:3px}
.m .sl{font-size:11px;color:var(--c);font-weight:650;display:block;margin-bottom:2px}
.mine{margin:14px var(--pad) 0}
.mine .h{font-size:11.5px;color:var(--soft);font-weight:650;margin-bottom:7px}
.mine .m{padding:10px 13px;border:1px solid var(--hair);border-radius:10px;margin-bottom:7px;background:#fbfafa}
.mine .m p{white-space:pre-line}
.mine .m .ed{font-size:12px;color:var(--c);text-decoration:underline;text-underline-offset:2px;margin-top:5px}
.say{padding:14px var(--pad) 0}
.say .to{font-size:11.5px;color:var(--c);font-weight:650;margin-bottom:7px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.chips button{font-size:12px;border:1px solid var(--hair);border-radius:14px;padding:5px 11px;color:var(--mid);background:#fff}
.chips button.on{border-color:var(--c);color:var(--c);font-weight:650}
.box{border:1px solid #ddd8d6;border-radius:14px;background:#fbfafa;padding:11px 13px 9px;display:flex;flex-direction:column;gap:8px}
.box:focus-within{border-color:var(--c);background:#fff}
.box textarea{border:none;background:transparent;resize:none;outline:none;font-size:16px;line-height:1.45;min-height:44px;width:100%}
.box textarea::placeholder{color:#a8a2a0;font-size:14.5px}
.box .row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.box .cnt{font-size:11px;color:var(--soft)}
.box .btns{display:flex;gap:8px;align-items:center;margin-left:auto}
.send{font-size:13.5px;font-weight:650;color:#fff;background:#cfc8c6;border-radius:16px;padding:7px 16px}
.send.live{background:var(--c)}
.lnk{font-size:12.5px;color:var(--mid);text-decoration:underline;text-underline-offset:2px}
.lnk.del{color:var(--warn)}
/* Setuju di ujung bawah kartu: di situlah klien berada setelah selesai melihat dan
   membaca. Baris tersendiri, tidak sebaris dengan Kirim. */
.fin{padding:14px var(--pad) 18px}
.fin .q{font-size:12.5px;color:var(--soft);margin-bottom:8px}
.agree{width:100%;border:1.5px solid var(--ok);color:var(--ok);border-radius:12px;padding:12px;font-size:14.5px;
  font-weight:650;display:flex;align-items:center;justify-content:center;gap:8px;background:#fff}
.agree svg{width:16px;height:16px}
.agree.ask{background:var(--ok);color:#fff}
.agree[disabled]{opacity:.5}
.state{padding:14px var(--pad) 18px;font-size:13px;color:var(--mid);line-height:1.6}
.state b{color:var(--ok);font-weight:650}
.state button{color:var(--c);text-decoration:underline;text-underline-offset:2px;font-size:13px}

/* ---------- iklan ---------- */
.sum2{background:#fbfafa;border-bottom:1px solid var(--hair);padding:13px var(--pad)}
.srow{display:flex;justify-content:space-between;gap:12px;font-size:13px;padding:3px 0}
.srow span:first-child{color:var(--soft);white-space:nowrap}
.srow span:last-child{font-weight:600;text-align:right}
.greet{margin-top:10px;background:#fff;border:1px dashed #d9d4d2;border-radius:10px;padding:10px 12px}
.greet em{font-style:normal;display:block;font-size:11px;color:var(--soft);font-weight:650;margin-bottom:5px}
.greet p{font-size:13.5px;line-height:1.6;white-space:pre-line}
.hint{margin-top:9px;font-size:11.5px;color:var(--soft);line-height:1.55}
.setbar{padding:13px var(--pad) 11px;background:var(--bg)}
.setbar h3{font-size:14px;font-weight:650;margin-bottom:6px}
.setbar .bud{font-size:16px;font-weight:700;margin-bottom:6px;color:var(--c)}
.tagrow{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.tagrow span{font-size:11px;background:#fff;border:1px solid var(--hair);border-radius:12px;padding:3px 8px;color:var(--mid)}
.adwrap{border:1px solid #dcdce2;border-radius:10px;overflow:hidden;background:#fff;margin:0 var(--pad) 6px}
.adhd{display:flex;align-items:center;gap:9px;padding:10px 12px}
.adhd .av{width:34px;height:34px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;
  background:var(--brand);color:var(--onbrand);font-size:13px;font-weight:700}
.adhd .who b{display:block;font-size:13px}
.adhd .who i{font-style:normal;font-size:11px;color:var(--soft)}
.adtext{padding:0 12px 10px;font-size:13.5px;line-height:1.55;white-space:pre-line;word-wrap:break-word}
.adwrap .media img{width:100%;display:block}
.adwrap .media iframe{display:block;width:100%;height:420px;border:0}
.adfoot{display:flex;align-items:center;gap:10px;background:#f4f4f6;padding:10px 12px;border-top:1px solid #e6e6ec}
.adfoot .hl{flex:1;min-width:0}
.adfoot .hl b{display:block;font-size:13px;line-height:1.35}
.adfoot .hl i{font-style:normal;font-size:11px;color:var(--soft);word-break:break-all}
.adfoot .cta{background:#e4e4ea;color:#111;font-size:12px;font-weight:700;padding:7px 11px;border-radius:5px;white-space:nowrap}
.asfeed{font-size:11px;color:var(--soft);text-align:center;margin:0 var(--pad) 8px}

/* ---------- penutup ---------- */
.end{padding:22px var(--pad) 30px}
.end h2{font-size:16px;font-weight:650;margin-bottom:12px}
.sum{display:flex;gap:8px;margin-bottom:16px}
.sum div{flex:1;background:var(--bg);border-radius:10px;padding:12px 8px;text-align:center}
.sum b{display:block;font-size:22px;font-weight:700}
.sum span{font-size:11px;color:var(--soft);display:block;margin-top:3px;line-height:1.3}
.sum .a b{color:var(--ok)}
.sum .n b{color:var(--new)}
.end p{font-size:13.5px;color:var(--mid);line-height:1.65}
.fine{margin-top:18px;padding-top:14px;border-top:1px solid var(--hair);font-size:11.5px;color:var(--soft);line-height:1.6}

/* ---------- nama ---------- */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:80;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom))}
.sheet h2{font-size:17px;font-weight:650;margin-bottom:6px}
.sheet p{font-size:13.5px;color:var(--mid);line-height:1.55;margin-bottom:14px}
.sheet input{width:100%;border:1px solid #ddd8d6;border-radius:12px;padding:12px 14px;font-size:16px;outline:none}
.sheet input:focus{border-color:var(--c)}
.sheet .go{width:100%;margin-top:12px;background:var(--c);color:#fff;border-radius:12px;padding:13px;font-size:15px;font-weight:650}
.sheet .go[disabled]{opacity:.4}
.sheet .no{display:block;width:100%;text-align:center;margin-top:10px;font-size:13px;color:var(--soft)}

.screen{padding:56px 24px;text-align:center}
.screen h2{font-size:17px;margin-bottom:8px}
.screen p{font-size:13.5px;color:var(--mid);line-height:1.6}
.spin{width:26px;height:26px;border:3px solid var(--hair);border-top-color:var(--brand);
  border-radius:50%;margin:0 auto 14px;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#23202a;color:#fff;font-size:13px;
  padding:10px 16px;border-radius:9px;max-width:88%;text-align:center;z-index:90;box-shadow:0 6px 20px rgba(0,0,0,.2)}

@media (min-width:900px){
  :root{--pad:26px}
  .wrap{max-width:1100px}
  body{font-size:15px}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:28px;padding:0 var(--pad);align-items:start}
  .two>.L{order:1}
  .two>.R{order:2}
  .two .grid,.two .duo,.two .one,.two .swipe,.two .when,.two .cap,.two .ond,.two .old,.two .mine,.two .say,
  .two .fin,.two .state,.two .orig,.two .nomedia,.two .adwrap,.two .asfeed,.two .swipehint{padding-left:0;padding-right:0;margin-left:0;margin-right:0}
  .cap{font-size:15px}
  .strip button,.strip .im{width:76px}
  .strip .im{height:76px}
  .ov{align-items:center}
  .sheet{border-radius:18px}
  .swipe .sl{flex-basis:60%}
}
@media print{
  body{background:#fff}
  .bar,.say,.fin,.me,.idx,.notice,.orig,.lnk,.ov{display:none !important}
  .card{page-break-inside:avoid;border-bottom:1px solid #ddd}
  .hero{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.spin{animation:none}}
</style>
</head>
<body>
<div class="wrap" id="root">
  <div class="screen"><div class="spin"></div><p>Membuka preview…</p></div>
</div>
<div id="layer"></div>

<script>
/* =========================================================================
   PREVIEW KONTEN KLIEN — halaman publik, tanpa login.
   Dibaca dengan token acak di URL: preview.html?k=<token>

   Tidak ada daftar PIC. Siapa pun yang memegang link boleh berkomentar dan
   menyetujui; yang diminta hanya nama, diketik sekali dan diingat perangkatnya.

   Tanggapan tidak pernah diubah atau dihapus di database (rules melarangnya).
   Mengubah komentar berarti menulis catatan baru berjenis "edit" yang menunjuk
   komentar aslinya — halaman ini menampilkan versi terakhir, tim tetap bisa
   melihat versi sebelumnya.

   Sengaja tanpa React: dibuka dari peramban dalam WhatsApp, sering di jaringan
   lambat. Satu file polos memuat jauh lebih cepat.
   ========================================================================= */

var firebaseConfig = {
  apiKey: "AIzaSyAp3pc0-U1bSbB1pWtDTNIBjGI8Emq9Uys",
  authDomain: "ubah-project-tracker.firebaseapp.com",
  projectId: "ubah-project-tracker",
  storageBucket: "ubah-project-tracker.firebasestorage.app",
  messagingSenderId: "255038719115",
  appId: "1:255038719115:web:31d4d2ed0192d96bd8808e",
};

var PREVIEW_COLLECTION = "ubah_tracker_preview";
var IMAGES_COLLECTION  = "ubah_tracker_images";
var BRAND_FALLBACK     = "#58279D";
var MAX_TEXT           = 500;

var root = document.getElementById("root");
var layer = document.getElementById("layer");
var db = null, token = "", doc = null, images = {}, imagesAsked = {}, responses = [];
var myName = "", mine = {};       // mine: { responseId: 1 } — tanggapan yang dikirim dari perangkat ini
var asking = {};                  // { itemId: 1 } -> tombol Setuju sedang minta penegasan
var slideOn = {};                 // { itemId: nomor slide yang sedang dikomentari }
var drafts = {};                  // { itemId: teks }
var editing = null;               // { id, itemId, text } komentar yang sedang diubah
var playing = {};                 // { itemId: 1 } -> video sudah diketuk, iframe dimuat
var sending = {};
var cache = {};                   // html terakhir tiap bagian, supaya yang tidak berubah tidak digambar ulang
var pendingRender = false;
var nameThen = null;

/* ---------- alat bantu ---------- */
function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function qs(name){
  var m = new RegExp("[?&]" + name + "=([^&]+)").exec(window.location.search);
  return m ? decodeURIComponent(m[1].replace(/\+/g," ")) : "";
}
var BULAN = ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
var BLN = ["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Agu","Sep","Okt","Nov","Des"];
function dparts(iso){
  var s = String(iso || "");
  if(s.length > 10){ var d = new Date(s); if(!isNaN(d)) return [d.getFullYear(), d.getMonth() + 1, d.getDate(), d]; }
  var p = s.slice(0,10).split("-");
  return p.length === 3 ? [Number(p[0]), Number(p[1]), Number(p[2]), null] : null;
}
function fmtDate(iso){ var p = dparts(iso); return p ? p[2] + " " + BULAN[p[1] - 1] : ""; }
function fmtShort(iso){ var p = dparts(iso); return p ? p[2] + " " + BLN[p[1] - 1] : ""; }
function fmtWhen(iso){
  var p = dparts(iso); if(!p) return "";
  var d = p[3]; if(!d) return fmtDate(iso);
  return p[2] + " " + BULAN[p[1] - 1] + ", " + ("0" + d.getHours()).slice(-2) + "." + ("0" + d.getMinutes()).slice(-2);
}
function toast(msg){
  var el = document.createElement("div");
  el.className = "toast"; el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); }, 2800);
}
// localStorage bisa dilarang di mode penyamaran. Halaman tidak boleh ikut mati cuma
// karena nama tidak bisa diingat — akibatnya hanya nama ditanya lagi lain kali.
function lsGet(k){ try{ return window.localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ window.localStorage.setItem(k,v); }catch(e){} }
function safeUrl(raw){
  var s = String(raw || "").trim();
  return /^https?:\/\//i.test(s) ? s : "";
}
function safeImg(raw){
  var s = String(raw || "");
  return /^data:image\/(png|jpe?g|webp|gif);base64,[A-Za-z0-9+\/=]+$/.test(s) ? s : "";
}
function safeId(raw){ return /^[A-Za-z0-9_-]{10,}$/.test(String(raw || "")) ? String(raw) : ""; }

/* ---------- warna brand ---------- */
function hexRgb(h){ return [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)]; }
function rgbHex(c){
  return "#" + c.map(function(v){
    var s = Math.max(0, Math.min(255, Math.round(v))).toString(16);
    return s.length < 2 ? "0" + s : s;
  }).join("");
}
function lum(c){
  var a = c.map(function(v){ v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); });
  return 0.2126 * a[0] + 0.7152 * a[1] + 0.0722 * a[2];
}
function applyBrand(){
  var b = doc.brand || {};
  var color = /^#[0-9A-Fa-f]{6}$/.test(b.color || "") ? b.color : BRAND_FALLBACK;
  var c = hexRgb(color), L = lum(c), t = c.slice(), i = 0;
  // Untuk tulisan dan garis di atas putih: digelapkan sampai kontras 4,5:1.
  while(1.05 / (lum(t) + 0.05) < 4.5 && i < 40){ t = t.map(function(v){ return v * 0.94; }); i++; }
  // Untuk tulisan di atas warna brand: pilih yang kontrasnya lebih tinggi.
  var onWhite = 1.05 / (L + 0.05), onDark = (L + 0.05) / 0.05;
  var on = onWhite >= 3 ? "#ffffff" : (onDark > onWhite ? rgbHex(c.map(function(v){ return v * 0.22; })) : "#ffffff");
  var st = document.documentElement.style;
  try{ st.setProperty("--brand", color); st.setProperty("--c", rgbHex(t)); st.setProperty("--onbrand", on); }catch(e){}
}

/* ---------- keadaan preview ---------- */
function isAds(){ return !!(doc && doc.kind === "ads"); }
function isExpired(){ var ms = Number((doc && doc.expiresAtMs) || 0); return ms > 0 && Date.now() > ms; }
function isArchived(){ return !!(doc && doc.archived); }
function isOpen(){ return !!doc && !isExpired() && !isArchived(); }
function itemById(id){
  var items = (doc && doc.items) || [];
  for(var i = 0; i < items.length; i++) if(items[i].id === id) return items[i];
  return null;
}
function byAt(a,b){ return String(a.at || "").localeCompare(String(b.at || "")); }

/* Komentar yang berlaku untuk satu konten: komentar asli, dengan isi diganti versi
   suntingan terakhirnya. Yang dikosongkan dianggap ditarik dan tidak ditampilkan.
   Jenis "revise" adalah bentuk lama dari halaman sebelumnya — diperlakukan sebagai komentar. */
function commentsOf(itemId){
  var last = {};
  responses.forEach(function(r){
    if(r.kind !== "edit" || !r.ref) return;
    if(!last[r.ref] || String(r.at || "") > String(last[r.ref].at || "")) last[r.ref] = r;
  });
  return responses.filter(function(r){
    return r.itemId === itemId && (r.kind === "comment" || r.kind === "revise");
  }).map(function(r){
    var e = last[r.id];
    return { id: r.id, at: r.at, picName: r.picName, slide: r.slide || 0,
      text: e ? String(e.text || "") : String(r.text || ""), edited: !!e };
  }).filter(function(c){ return c.text.trim() !== ""; }).sort(byAt);
}
// Komentar yang masuk SEBELUM revisi terakhir dianggap sudah ditindaklanjuti.
function isResolved(item, c){ return !!(item.revisedAt && String(c.at || "") < String(item.revisedAt)); }
function openComments(item){ return commentsOf(item.id).filter(function(c){ return !isResolved(item, c); }); }
function oldComments(item){ return commentsOf(item.id).filter(function(c){ return isResolved(item, c); }); }
/* Persetujuan yang berlaku: tanggapan setuju/batal terakhir, dan hanya kalau diberikan
   SETELAH revisi terakhir. Persetujuan untuk versi lama tidak dibawa ke versi baru. */
function approvalOf(item){
  var list = responses.filter(function(r){
    return r.itemId === item.id && (r.kind === "approve" || r.kind === "cancel");
  }).sort(byAt);
  var last = list[list.length - 1];
  if(!last || last.kind !== "approve") return null;
  if(item.revisedAt && String(last.at || "") < String(item.revisedAt)) return null;
  return last;
}
// "approved" | "new" (versi baru belum ditanggapi) | "sent" (sudah berkomentar) | "wait"
function stateOf(item){
  if(approvalOf(item)) return "approved";
  if(openComments(item).length) return "sent";
  if(item.revisedAt) return "new";
  return "wait";
}

/* ---------- gambar ---------- */
// Diambil satu per satu dengan get(), bukan query: rules hanya mengizinkan get untuk
// dokumen bertanda public. Diambil ulang kalau kontennya direvisi.
function loadImages(){
  ((doc && doc.items) || []).forEach(function(it){
    var id = it.imagesDoc; if(!id) return;
    var key = id + "@" + (it.revisedAt || "");
    if(imagesAsked[id] === key) return;
    imagesAsked[id] = key;
    db.collection(IMAGES_COLLECTION).doc(id).get().then(function(s){
      var arr = (s.exists && Array.isArray(s.data().images)) ? s.data().images : [];
      images[id] = arr.map(function(x){ return safeImg(typeof x === "string" ? x : (x && x.data)); })
        .filter(Boolean);
    }).catch(function(){
      images[id] = [];            // belum ditandai publik — kontennya tetap tampil tanpa gambar
    }).then(function(){ render(); });
  });
}

/* ---------- nama ---------- */
function needName(then){
  if(myName){ then(); return; }
  nameThen = then;
  showNameSheet("");
}
function showNameSheet(current){
  layer.innerHTML = '<div class="ov" data-a="ovclose"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="nmh">' +
    '<h2 id="nmh">Nama Anda</h2>' +
    '<p>Dicantumkan di tanggapan supaya tim tahu siapa yang menulis. Cukup diisi sekali di perangkat ini.</p>' +
    '<input id="nm" maxlength="60" autocomplete="name" placeholder="mis. Bu Novia" value="' + esc(current) + '">' +
    '<button class="go" data-a="namesave"' + (current.trim() ? "" : " disabled") + '>Lanjut</button>' +
    '<button class="no" data-a="nameclose">Batal</button></div></div>';
  var inp = document.getElementById("nm");
  if(inp){
    inp.addEventListener("input", function(){
      var b = layer.querySelector(".go"); if(b) b.disabled = !inp.value.trim();
    });
    inp.addEventListener("keydown", function(e){ if(e.key === "Enter") act("namesave"); });
    setTimeout(function(){ try{ inp.focus(); }catch(e){} }, 60);
  }
}
function closeSheet(){ layer.innerHTML = ""; nameThen = null; }

/* ---------- kirim tanggapan ---------- */
function send(itemId, kind, text, extra, okMsg){
  if(sending[itemId]) return;
  if(!isOpen()){ toast("Preview ini sudah ditutup."); return; }
  sending[itemId] = 1; render();

  var ref = db.collection(PREVIEW_COLLECTION).doc(token).collection("responses").doc();
  var payload = {
    itemId: String(itemId).slice(0,80),
    kind: kind,
    picName: String(myName).slice(0,60),
    at: new Date().toISOString(),
    text: String(text || "").slice(0, MAX_TEXT)
  };
  if(extra && extra.slide) payload.slide = Number(extra.slide);
  if(extra && extra.ref)   payload.ref = String(extra.ref).slice(0,40);

  ref.set(payload).then(function(){
    if(kind === "comment"){
      mine[ref.id] = 1;
      lsSet("ubahpv_mine_" + token, Object.keys(mine).join(","));
      delete drafts[itemId]; delete slideOn[itemId];
    }
    if(kind === "edit") editing = null;
    delete asking[itemId];
    toast(okMsg || "Terkirim.");
  }).catch(function(e){
    toast("Gagal mengirim. Cek koneksi lalu coba lagi.");
    if(window.console) console.error(e);
  }).then(function(){ delete sending[itemId]; render(true); });
}

/* ---------- aksi ---------- */
function act(a, id, n, el){
  var it = id ? itemById(id) : null;
  if(a === "goto"){
    var t = document.getElementById("k_" + id);
    if(t && t.scrollIntoView) t.scrollIntoView();
  }
  else if(a === "next"){
    var items = doc.items || [];
    for(var i = 0; i < items.length; i++){
      if(stateOf(items[i]) !== "approved"){ act("goto", items[i].id); break; }
    }
  }
  else if(a === "play"){ playing[id] = 1; render(true); }
  else if(a === "slide"){
    var v = Number(n) || 0;
    slideOn[id] = (slideOn[id] === v) ? 0 : v;
    render(true);
  }
  else if(a === "send"){
    var text = (drafts[id] || "").trim();
    if(!text) return;
    needName(function(){ send(id, "comment", text, { slide: slideOn[id] || 0 }, "Tanggapan terkirim ke tim."); });
  }
  else if(a === "approve"){
    // Dua ketukan. Di HP tombol ini gampang kesenggol waktu menggulir, dan satu salah
    // pencet berarti konten lolos tanpa dibaca.
    if(!asking[id]){ asking[id] = 1; render(true); return; }
    needName(function(){ send(id, "approve", "", null, "Persetujuan tercatat."); });
  }
  else if(a === "cancel"){
    needName(function(){ send(id, "cancel", "", null, "Persetujuan dibatalkan."); });
  }
  else if(a === "edit"){
    var list = it ? commentsOf(id) : [];
    for(var j = 0; j < list.length; j++) if(list[j].id === n) editing = { id: n, itemId: id, text: list[j].text };
    render(true);
    setTimeout(function(){ var ta = document.getElementById("ed_" + n); if(ta){ try{ ta.focus(); }catch(e){} } }, 60);
  }
  else if(a === "editcancel"){ editing = null; render(true); }
  else if(a === "editsave"){
    if(!editing) return;
    var tx = String(editing.text || "").trim();
    if(!tx) return;
    send(editing.itemId, "edit", tx, { ref: editing.id }, "Tanggapan diperbarui.");
  }
  else if(a === "editdel"){
    if(!editing) return;
    if(!el || el.getAttribute("data-sure") !== "1"){
      if(el){ el.setAttribute("data-sure", "1"); el.textContent = "Yakin hapus? Ketuk lagi"; }
      return;
    }
    send(editing.itemId, "edit", "", { ref: editing.id }, "Tanggapan dihapus.");
  }
  else if(a === "rename"){ nameThen = function(){}; showNameSheet(myName); }
  else if(a === "namesave"){
    var inp = document.getElementById("nm");
    var v2 = inp ? inp.value.trim().slice(0,60) : "";
    if(!v2) return;
    myName = v2; lsSet("ubahpv_name", v2);
    var then = nameThen; layer.innerHTML = ""; nameThen = null;
    render(true);
    if(then) then();
  }
  else if(a === "nameclose"){ closeSheet(); }
  else if(a === "ovclose"){ if(el && el === window.__ovTarget) closeSheet(); }
}

/* ---------- penggambar ---------- */
function typing(){
  var a = document.activeElement;
  return !!(a && a.tagName === "TEXTAREA" && root.contains(a));
}
function setPart(id, html){
  if(cache[id] === html) return;
  var el = document.getElementById(id);
  if(!el) return;
  el.innerHTML = html;
  cache[id] = html;
}

// force = perubahan akibat aksi pengguna sendiri. Tanpa force (data baru dari server),
// gambar ulang ditunda selama pengguna masih mengetik: mengganti kotak teks di tengah
// ketikan menutup papan ketik di HP.
function render(force){
  if(!doc) return;
  if(!force && typing()){ pendingRender = true; return; }
  pendingRender = false;
  applyBrand();
  try{ document.title = "Preview " + (isAds() ? "Iklan " : "Konten ") + (doc.client || ""); }catch(e){}

  var items = doc.items || [];
  var ids = ["p_head"].concat(items.map(function(it){ return "k_" + it.id; })).concat(["p_end"]);
  var sig = ids.join("|") + "|" + (isAds() ? "ads" : "c");
  if(cache.__sig !== sig){
    // Kerangka dibangun sekali; setelah itu tiap bagian diganti sendiri-sendiri.
    // Tanpa ini, satu komentar masuk dari orang lain akan memuat ulang video yang
    // sedang diputar.
    var h = '<div id="p_head"></div>';
    if(isAds()){
      h += '<div id="p_camp"></div>';
      var sets = doc.adSets || [], seen = {};
      sets.forEach(function(s){
        var mineItems = items.filter(function(it){ return it.adSetId === s.id; });
        if(!mineItems.length) return;
        h += '<div id="s_' + esc(s.id) + '"></div>';
        mineItems.forEach(function(it){ seen[it.id] = 1; h += cardShell(it); });
      });
      var rest = items.filter(function(it){ return !seen[it.id]; });
      if(rest.length && sets.length) h += '<div class="setbar"><h3>Materi lain</h3></div>';
      rest.forEach(function(it){ h += cardShell(it); });
    } else {
      items.forEach(function(it){ h += cardShell(it); });
    }
    h += '<div id="p_end"></div>';
    root.innerHTML = h;
    cache = { __sig: sig };
  }

  setPart("p_head", headHtml(items));
  if(isAds()){
    setPart("p_camp", campaignHtml(doc.campaign || {}));
    (doc.adSets || []).forEach(function(s){ setPart("s_" + s.id, adSetHtml(s)); });
  }
  items.forEach(function(it){
    setPart("t_" + it.id, titleHtml(it));
    setPart("m_" + it.id, isAds() ? adMediaHtml(it) : mediaHtml(it));
    setPart("c_" + it.id, isAds() ? "" : textHtml(it));
    setPart("x_" + it.id, talkHtml(it));
  });
  setPart("p_end", endHtml(items));
}
function cardShell(it){
  var id = esc(it.id);
  return '<div class="card" id="k_' + id + '"><div id="t_' + id + '"></div>' +
    '<div class="two"><div class="R" id="m_' + id + '"></div>' +
    '<div class="L"><div id="c_' + id + '"></div><div id="x_' + id + '"></div></div></div></div>';
}

function headHtml(items){
  var b = doc.brand || {}, logo = safeImg(b.logo), white = b.logoTone === "dark";
  var n = items.length, approved = 0, fresh = [], firstOpen = null;
  items.forEach(function(it){
    var s = stateOf(it);
    if(s === "approved") approved++; else if(!firstOpen) firstOpen = it;
    if(s === "new") fresh.push(it);
  });
  var unit = isAds() ? "materi iklan" : "konten";

  var h = '<div class="hero' + (white ? " white" : "") + '">' +
    (logo ? '<img src="' + logo + '" alt="' + esc(doc.client || "") + '">'
          : '<div class="cname">' + esc(doc.client || "") + '</div>') +
    '<h1>Preview ' + (isAds() ? "iklan" : "konten") + '</h1>' +
    '<div class="per">' + esc(doc.period || "") + (doc.period ? ", " : "") + n + " " + unit + '</div></div>';

  if(isArchived()){
    h += doc.closedReason === "done"
      ? '<div class="banner done">Semua ' + unit + ' di halaman ini sudah disetujui dan diproses. ' +
        'Halaman disimpan sebagai catatan dan tidak menerima tanggapan baru.</div>'
      : '<div class="banner warn">Halaman ini sudah ditutup oleh tim UBAH dan tidak menerima tanggapan baru. ' +
        'Hubungi tim UBAH kalau butuh link terbaru.</div>';
  } else if(isExpired()){
    h += '<div class="banner warn">Masa berlaku preview ini sudah habis, jadi tanggapan ditutup. ' +
      'Isinya masih bisa dibaca. Hubungi tim UBAH kalau butuh link terbaru.</div>';
  } else if(myName){
    h += '<div class="me">Anda menanggapi sebagai <b>' + esc(myName) + '</b>' +
      '<button data-a="rename">ganti nama</button></div>';
  }

  if(isOpen() && fresh.length){
    h += '<button class="notice" data-a="goto" data-id="' + esc(fresh[0].id) + '"><b>' + fresh.length + " " + unit +
      ' sudah direvisi</b> dan menunggu tanggapan Anda. <u>Lihat</u></button>';
  }

  if(n > 1){
    h += '<div class="idx"><div class="ttl">Semua ' + unit + '</div><div class="strip">';
    items.forEach(function(it, i){
      var s = stateOf(it), img = (images[it.imagesDoc] || [])[0];
      var cls = s === "approved" ? "done" : s === "new" ? "new" : s === "sent" ? "sent" : "";
      var lab = s === "approved" ? "Setuju" : s === "new" ? "Versi baru" : s === "sent" ? "Ditanggapi" : "Belum";
      h += '<button class="' + cls + '" data-a="goto" data-id="' + esc(it.id) + '" aria-label="' +
        esc(nameOf(it, i)) + ", " + lab + '"><span class="im">' +
        (img ? '<img src="' + img + '" alt="">' : '<i>' + (i + 1) + '</i>') +
        '</span><span class="st">' + lab + '</span></button>';
    });
    h += '</div></div>';
  }

  if(isOpen()){
    h += '<div class="bar"><span class="n">' + approved + ' dari ' + n + ' <em>sudah disetujui</em></span>' +
      (firstOpen && n > 1 ? '<button data-a="next">Ke yang belum</button>' : '') + '</div>';
  }
  return h;
}

function nameOf(it, i){
  if(isAds()) return it.label || "Materi iklan";
  return it.title || ((it.format || "Konten") + " " + ((i == null ? 0 : i) + 1));
}
function indexOf(it){
  var items = doc.items || [];
  for(var i = 0; i < items.length; i++) if(items[i].id === it.id) return i;
  return 0;
}

function titleHtml(it){
  var s = stateOf(it), imgs = images[it.imagesDoc] || [];
  var sub = isAds() ? (it.format || "") :
    ((it.format || "Konten") + (/carousel/i.test(it.format || "") && imgs.length > 1 ? ", " + imgs.length + " slide" : ""));
  var tag = s === "approved" ? '<span class="tag ok">Disetujui</span>'
    : s === "new"  ? '<span class="tag new">Versi baru, ' + esc(fmtShort(it.revisedAt)) + '</span>'
    : s === "sent" ? '<span class="tag sent">Tanggapan terkirim</span>'
    : '<span class="tag wait">Belum ditanggapi</span>';
  var h = '<div class="idr"><span class="nm"><b>' + esc(nameOf(it, indexOf(it))) + '</b><span>' + esc(sub) + '</span></span>' + tag + '</div>';
  if(it.revisedAt && String(it.revNote || "").trim()){
    h += '<div class="revnote"><em>Yang diubah, ' + esc(fmtShort(it.revisedAt)) + '</em>' + esc(it.revNote) + '</div>';
  }
  return h;
}

function videoTile(it, poster){
  var vid = safeId(it.videoId);
  if(!vid) return "";
  if(playing[it.id]){
    return '<div class="t"><iframe src="https://drive.google.com/file/d/' + vid +
      '/preview" allow="autoplay" allowfullscreen></iframe></div>';
  }
  return '<button class="t" data-a="play" data-id="' + esc(it.id) + '" aria-label="Putar video">' +
    (poster ? '<img src="' + poster + '" alt="">' : '') + '<span class="play"><i></i></span></button>';
}

function mediaHtml(it){
  var imgs = images[it.imagesDoc] || [], vid = safeId(it.videoId), h = "";
  var carousel = /carousel/i.test(it.format || "") && imgs.length > 1;
  var id = esc(it.id), sel = slideOn[it.id] || 0;

  if(vid){
    // Video: cover di kiri (kalau ada gambarnya), video di kanan.
    if(imgs.length){
      h += '<div class="duo"><div><div class="t cov"><img src="' + imgs[0] + '" alt=""></div><div class="lb">Cover</div></div>' +
           '<div>' + videoTile(it, imgs[1] || imgs[0]) + '<div class="lb">' +
           (playing[it.id] ? "Video" : "Video, ketuk untuk memutar") + '</div></div></div>';
    } else {
      h += '<div class="duo solo"><div>' + videoTile(it, "") + '<div class="lb">' +
           (playing[it.id] ? "Video" : "Ketuk untuk memutar video") + '</div></div></div>';
    }
  } else if(carousel && imgs.length > 3){
    h += '<div class="grid">';
    imgs.forEach(function(src, i){
      var n = i + 1;
      h += '<button class="gs' + (sel === n ? " on" : "") + '"' +
        (isOpen() ? ' data-a="slide" data-id="' + id + '" data-n="' + n + '"' : ' disabled') +
        '><span class="im"><img src="' + src + '" alt="Slide ' + n + '" loading="lazy"></span>' +
        '<span class="lb">Slide ' + n + '</span></button>';
    });
    h += '</div>';
  } else if(carousel){
    h += '<div class="swipe">';
    imgs.forEach(function(src, i){
      h += '<div class="sl"><img src="' + src + '" alt="Slide ' + (i + 1) + '" loading="lazy">' +
        '<span class="lb">Slide ' + (i + 1) + ' dari ' + imgs.length + '</span></div>';
    });
    h += '</div><div class="swipehint">Geser untuk melihat slide berikutnya</div>';
  } else if(imgs.length){
    h += '<div class="one"><img src="' + imgs[0] + '" alt="" loading="lazy"></div>';
    if(imgs.length > 1){
      h += '<div class="grid" style="margin-top:7px">';
      imgs.slice(1).forEach(function(src){ h += '<div class="gs"><span class="im"><img src="' + src + '" alt="" loading="lazy"></span></div>'; });
      h += '</div>';
    }
  } else {
    h += '<div class="nomedia">Gambar pratinjaunya belum tersedia di halaman ini.' +
      (safeUrl(it.driveLink) ? ' Buka file aslinya lewat tautan di bawah.' : '') + '</div>';
  }

  if(safeUrl(it.driveLink)){
    h += '<a class="orig" href="' + esc(safeUrl(it.driveLink)) + '" target="_blank" rel="noopener noreferrer">' +
      (imgs.length || vid ? 'Yang tampil di sini versi ringan, ' : '') + '<u>buka file asli di Drive</u></a>';
  }
  return h;
}

function textHtml(it){
  var h = '<div class="when">' + (it.postingDate ? "Rencana tayang " + esc(fmtDate(it.postingDate)) : "Jadwal tayang menyusul") + '</div>';
  if(String(it.caption || "").trim()) h += '<div class="cap">' + esc(it.caption) + '</div>';
  if(String(it.onDesignText || "").trim()){
    h += '<div class="ond"><em>Tulisan di dalam ' + (safeId(it.videoId) ? "video" : "desain") + '</em>' + esc(it.onDesignText) + '</div>';
  }
  if(safeUrl(it.livePostLink)){
    h += '<a class="orig" style="text-align:left" href="' + esc(safeUrl(it.livePostLink)) +
      '" target="_blank" rel="noopener noreferrer"><u>Lihat postingannya</u></a>';
  }
  return h;
}

function commentHtml(c, withSlide){
  return (withSlide && c.slide ? '<span class="sl">Slide ' + Number(c.slide) + '</span>' : '') +
    '<b>' + esc(c.picName || "") + '</b><span style="white-space:pre-line">' + esc(c.text) + '</span>' +
    '<time>' + esc(fmtWhen(c.at)) + (c.edited ? ", diubah" : "") + '</time>';
}

function talkHtml(it){
  var id = esc(it.id), ap = approvalOf(it), open = openComments(it), old = oldComments(it);
  var imgs = images[it.imagesDoc] || [];
  var carousel = !isAds() && /carousel/i.test(it.format || "") && imgs.length > 1 && !safeId(it.videoId);
  var h = "";

  if(old.length){
    h += '<details class="old"><summary>' + old.length + ' tanggapan sebelumnya, sudah ditindaklanjuti</summary>';
    old.forEach(function(c){ h += '<div class="m">' + commentHtml(c, true) + '</div>'; });
    h += '</details>';
  }

  if(open.length){
    h += '<div class="mine"><div class="h">Tanggapan untuk versi ini</div>';
    open.forEach(function(c){
      var canEdit = isOpen() && mine[c.id] && !ap;
      if(editing && editing.id === c.id){
        h += '<div class="box" style="margin-bottom:7px"><textarea id="ed_' + esc(c.id) + '" maxlength="' + MAX_TEXT +
          '" rows="3" data-i="edit">' + esc(editing.text) + '</textarea><div class="row">' +
          '<button class="lnk del" data-a="editdel">Hapus</button><span class="btns">' +
          '<button class="lnk" data-a="editcancel">Batal</button>' +
          '<button class="send' + (String(editing.text).trim() ? " live" : "") + '" data-a="editsave">Simpan</button></span></div></div>';
      } else {
        h += '<div class="m">' + commentHtml(c, true) +
          (canEdit ? '<button class="ed" data-a="edit" data-id="' + id + '" data-n="' + esc(c.id) + '">Ubah tanggapan ini</button>' : '') +
          '</div>';
      }
    });
    h += '</div>';
  }

  if(ap){
    h += '<div class="state"><b>Disetujui</b> ' + esc(ap.picName || "") + ', ' + esc(fmtWhen(ap.at)) + '. ';
    // Batal hanya selama tim belum memproses. Sesudahnya kontennya sudah dijadwalkan.
    if(it.processedAt) h += 'Sudah diproses tim untuk dijadwalkan.';
    else if(isOpen()) h += '<button data-a="cancel" data-id="' + id + '">Batalkan persetujuan</button>';
    h += '</div>';
    return h;
  }
  if(!isOpen()) return h + '<div style="height:16px"></div>';

  var draft = drafts[it.id] || "", sel = slideOn[it.id] || 0;
  h += '<div class="say">';
  if(carousel){
    h += '<div class="chips"><button class="' + (sel ? "" : "on") + '" data-a="slide" data-id="' + id + '" data-n="0">Seluruh konten</button>';
    imgs.forEach(function(_, i){
      h += '<button class="' + (sel === i + 1 ? "on" : "") + '" data-a="slide" data-id="' + id + '" data-n="' + (i + 1) + '">Slide ' + (i + 1) + '</button>';
    });
    h += '</div>';
  }
  h += '<div class="box"><textarea id="ta_' + id + '" rows="2" maxlength="' + MAX_TEXT + '" data-i="draft" data-id="' + id + '" placeholder="' +
    (open.length ? "Ada lagi yang perlu diubah? Tulis di sini."
      : it.revisedAt ? "Masih ada yang perlu diubah? Tulis di sini."
      : "Ada yang perlu diubah? Tulis di sini.") + '">' + esc(draft) + '</textarea>' +
    '<div class="row"><span class="cnt" id="cn_' + id + '">' + (draft.length > 400 ? draft.length + "/" + MAX_TEXT : "") + '</span>' +
    '<span class="btns"><button class="send' + (draft.trim() ? " live" : "") + '" id="sd_' + id + '" data-a="send" data-id="' + id + '"' +
    (sending[it.id] ? " disabled" : "") + '>Kirim</button></span></div></div></div>';

  h += '<div class="fin"><div class="q">' + (open.length ? "Atau sudah pas tanpa perubahan?" : "Sudah pas?") + '</div>' +
    '<button class="agree' + (asking[it.id] ? " ask" : "") + '" data-a="approve" data-id="' + id + '"' + (sending[it.id] ? " disabled" : "") + '>' +
    '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10.5l4 4 8-9"/></svg>' +
    '<span>' + (asking[it.id] ? "Yakin? Ketuk sekali lagi" : "Setuju " + (isAds() ? "materi" : "konten") + " ini") + '</span></button></div>';
  return h;
}

/* ---------- bagian khusus iklan ---------- */
function rupiah(n){ return "Rp " + (Number(n) || 0).toLocaleString("id-ID"); }
function campaignHtml(c){
  var h = '<div class="sum2">';
  function row(k, v){ if(v) h += '<div class="srow"><span>' + k + '</span><span>' + esc(v) + '</span></div>'; }
  row("Platform", c.platform);
  row("Objektif", c.objective);
  if(c.startDate || c.endDate){
    row("Periode tayang", (c.startDate ? fmtShort(c.startDate) : "?") + " – " + (c.endDate ? fmtShort(c.endDate) : "?"));
  }
  row("Jam tayang", c.daypart || "24 jam");
  if(c.greeting){
    h += '<div class="greet"><em>Pesan pembuka yang diterima calon pelanggan</em><p>' + esc(c.greeting) + '</p></div>';
  }
  h += '<div class="hint">Iklan mulai tayang setelah disetujui. Yang belum disetujui tidak dijalankan.</div></div>';
  return h;
}
// Budget dan targeting ditaruh di kepala ad set, bukan per materi: di Meta budget
// memang diatur per ad set, jadi angka per materi hanya bisa dikarang.
function adSetHtml(s){
  var h = '<div class="setbar"><h3>' + esc(s.name) + '</h3>';
  if(s.budget) h += '<div class="bud">' + rupiah(s.budget) + '</div>';
  if(s.location) h += '<div class="srow"><span>Lokasi</span><span>' + esc(s.location) + '</span></div>';
  if(s.interest) h += '<div class="srow"><span>Audiens</span><span>' + esc(s.interest) + '</span></div>';
  if((s.placements || []).length){
    h += '<div class="tagrow">';
    s.placements.forEach(function(p){ h += '<span>' + esc(p) + '</span>'; });
    h += '</div>';
  }
  return h + '</div>';
}
// Digambar seperti yang akan dilihat audiens di feed. Headline kepanjangan atau CTA
// yang tidak nyambung langsung kelihatan di sini.
function adMediaHtml(it){
  var imgs = images[it.imagesDoc] || [], akun = String(doc.client || "").trim();
  var boost = it.adSource === "boost", vid = safeId(it.videoId);
  var h = '<div class="adwrap"><div class="adhd"><div class="av">' + esc(akun.slice(0,1).toUpperCase() || "?") + '</div>' +
    '<div class="who"><b>' + esc(akun) + '</b><i>' + (boost ? "Post yang dinaikkan · Bersponsor" : "Bersponsor") + '</i></div></div>';
  if(it.caption) h += '<div class="adtext">' + esc(it.caption) + '</div>';
  h += '<div class="media">';
  if(vid) h += '<iframe src="https://drive.google.com/file/d/' + vid + '/preview" allow="autoplay" allowfullscreen loading="lazy"></iframe>';
  else if(imgs.length) h += '<img src="' + imgs[0] + '" alt="" loading="lazy">';
  h += '</div>';
  if(it.headline || it.cta || it.destination){
    h += '<div class="adfoot"><div class="hl">' + (it.headline ? '<b>' + esc(it.headline) + '</b>' : '') +
      (it.destination ? '<i>' + esc(it.destination) + '</i>' : '') + '</div>' +
      (it.cta ? '<div class="cta">' + esc(it.cta) + '</div>' : '') + '</div>';
  }
  h += '</div><div class="asfeed">' + (boost ? "Post ini sudah tayang. Yang disetujui adalah belanja dan targetingnya."
    : "Begini iklannya akan terlihat di feed.") + '</div>';
  var link = boost ? safeUrl(it.postLink) : safeUrl(it.driveLink);
  if(link){
    h += '<a class="orig" href="' + esc(link) + '" target="_blank" rel="noopener noreferrer"><u>' +
      (boost ? "Lihat postingan aslinya di Instagram" : "Buka file asli di Drive") + '</u></a>';
  }
  return h;
}

function endHtml(items){
  var a = 0, n = 0, s = 0, w = 0;
  items.forEach(function(it){
    var st = stateOf(it);
    if(st === "approved") a++; else if(st === "new") n++; else if(st === "sent") s++; else w++;
  });
  var h = '<div class="end"><h2>Ringkasan</h2><div class="sum"><div class="a"><b>' + a + '</b><span>disetujui</span></div>';
  if(n) h += '<div class="n"><b>' + n + '</b><span>versi baru, menunggu Anda</span></div>';
  if(s) h += '<div><b>' + s + '</b><span>sedang direvisi tim</span></div>';
  h += '<div><b>' + w + '</b><span>belum ditanggapi</span></div></div>';
  if(isOpen()){
    h += '<p>Yang sudah disetujui langsung kami jadwalkan. Kalau masih ada yang perlu diubah, tulis di bawah ' +
      (isAds() ? "materinya" : "kontennya") + ' dan versi barunya akan muncul di halaman ini juga, lewat link yang sama.</p>';
  }
  h += '<div class="fine">Halaman ini dibuat UBAH Digital untuk ' + esc(doc.client || "") +
    (doc.expiresAtMs && isOpen() ? ' dan berlaku sampai ' + esc(fmtDate(new Date(doc.expiresAtMs).toISOString())) : '') +
    '. Semua tanggapan tercatat dan langsung sampai ke tim.<br><br>' +
    'Kalau dibuka dari iPhone, matikan mode True Tone supaya warna gambar terlihat sebagaimana aslinya.</div></div>';
  return h;
}

function fatal(judul, pesan){
  cache = {};
  root.innerHTML = '<div class="screen"><h2>' + esc(judul) + '</h2><p>' + esc(pesan) + '</p></div>';
}

/* ---------- pendengar ---------- */
function onClick(e){
  var el = e.target;
  window.__ovTarget = el;
  while(el && el !== document.body && !(el.getAttribute && el.getAttribute("data-a"))) el = el.parentNode;
  if(!el || el === document.body || !el.getAttribute) return;
  if(el.disabled) return;
  act(el.getAttribute("data-a"), el.getAttribute("data-id") || "", el.getAttribute("data-n") || "", el);
}
function onInput(e){
  var t = e.target;
  if(!t || t.tagName !== "TEXTAREA") return;
  t.style.height = "auto"; t.style.height = t.scrollHeight + "px";
  var kind = t.getAttribute("data-i");
  if(kind === "draft"){
    var id = t.getAttribute("data-id");
    drafts[id] = t.value;
    var b = document.getElementById("sd_" + id); if(b) b.className = "send" + (t.value.trim() ? " live" : "");
    var c = document.getElementById("cn_" + id); if(c) c.textContent = t.value.length > 400 ? t.value.length + "/" + MAX_TEXT : "";
    // html di cache sengaja dibuang: isi kotak sudah berubah di layar, jadi perbandingan
    // dengan html lama tidak lagi sah untuk bagian ini.
    delete cache["x_" + id];
  } else if(kind === "edit" && editing){
    editing.text = t.value;
    var sv = t.parentNode.querySelector(".send"); if(sv) sv.className = "send" + (t.value.trim() ? " live" : "");
    delete cache["x_" + editing.itemId];
  }
}
function onFocusOut(){
  setTimeout(function(){ if(pendingRender && !typing()) render(); }, 200);
}

/* ---------- mulai ---------- */
(function start(){
  token = qs("k").replace(/[^A-Za-z0-9_-]/g, "").slice(0, 64);
  if(!token){
    fatal("Link tidak lengkap", "Alamatnya kurang kode preview. Minta link terbaru ke tim UBAH.");
    return;
  }
  try{
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
  }catch(e){
    fatal("Gagal memuat", "Coba buka ulang halaman ini. Kalau tetap gagal, hubungi tim UBAH.");
    return;
  }

  myName = String(lsGet("ubahpv_name") || "").slice(0,60);
  String(lsGet("ubahpv_mine_" + token) || "").split(",").forEach(function(x){ if(x) mine[x] = 1; });

  document.addEventListener("click", onClick);
  document.addEventListener("input", onInput);
  document.addEventListener("focusout", onFocusOut);

  var first = true;
  db.collection(PREVIEW_COLLECTION).doc(token).onSnapshot(function(snap){
    if(!snap.exists){
      doc = null;
      fatal("Preview tidak ditemukan", "Link ini mungkin sudah dihapus. Minta link terbaru ke tim UBAH.");
      return;
    }
    doc = snap.data();
    render();
    loadImages();
    if(first){
      first = false;
      db.collection(PREVIEW_COLLECTION).doc(token).collection("responses")
        .onSnapshot(function(rs){
          responses = rs.docs.map(function(d){ var o = d.data(); o.id = d.id; return o; });
          render();
        }, function(){ /* tanggapan gagal dimuat — halaman tetap bisa dibaca */ });
    }
  }, function(){
    fatal("Tidak bisa membuka preview", "Periksa koneksi lalu buka ulang. Kalau tetap gagal, hubungi tim UBAH.");
  });
})();
</script>
