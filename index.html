function PostingHistoryView({tasks, projectNames, dailyLog, onSaveDailyLog, isAdmin, onDeleteDailyLog, busy}){
  const [client, setClient] = useState("");
  const [month, setMonth] = useState(todayStr().slice(0,7));
  const [showLogModal, setShowLogModal] = useState(false);
  const [waOpen, setWaOpen] = useState(false);
  const [copyMsg, setCopyMsg] = useState("");

  const content = useMemo(() => tasks.filter(t => isPostableTask(t) && t.status==="Done" && t.postedAt
    && (t.postedAt||"").slice(0,7)===month && (!client || t.client===client)), [tasks, month, client]);
  const logEntries = useMemo(() => dailyLog
    .filter(d => (d.date||"").slice(0,7)===month && (!client || d.client===client))
    .sort((a,b)=>(b.date||"").localeCompare(a.date||"")), [dailyLog, month, client]);

  // Ringkasan bulanan — angka inilah yang biasanya ditanya client.
  const summary = useMemo(() => {
    let leads = 0, spend = 0, cplSum = 0, cplCount = 0, campaigns = 0;
    logEntries.forEach(e => (e.campaigns||[]).forEach(c => {
      leads += Number(c.totalLeads)||0;
      spend += Number(c.budgetUsed)||0;
      if(Number(c.costPerLead)>0){ cplSum += Number(c.costPerLead); cplCount += 1; }
      campaigns += 1;
    }));
    return { leads, spend, avgCpl: cplCount ? Math.round(cplSum/cplCount) : 0, campaigns };
  }, [logEntries]);

  // Teks WA mengikuti tanggal terbaru yang ada di filter aktif, bukan selalu hari ini.
  const waDate = logEntries.length ? logEntries[0].date : todayStr();
  const waEntries = useMemo(() => logEntries.filter(e => e.date === waDate), [logEntries, waDate]);
  const waText = useMemo(() => buildDailyWAText(waDate, waEntries), [waDate, waEntries]);

  function copyWA(){
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(waText)
        .then(()=>setCopyMsg("Tersalin. Tinggal tempel di WhatsApp."))
        .catch(()=>setCopyMsg("Salin otomatis gagal — pilih teksnya manual di bawah."));
    } else {
      setCopyMsg("Salin otomatis tidak tersedia — pilih teksnya manual di bawah.");
    }
    setWaOpen(true);
  }

  return (
    <div>
      <div className="card" style={{background:"var(--brand-gradient)",color:"#fff"}}>
        <div style={{fontWeight:800,fontSize:14,marginBottom:4}}>Log Harian Ads</div>
        <div style={{fontSize:12,opacity:.92}}>Ganti kebiasaan ketik manual di WA — isi angka ads di sini, kapan saja, untuk client mana saja.</div>
        <div style={{display:"flex",gap:8,marginTop:10,flexWrap:"wrap"}}>
          <button className="btn" style={{background:"#fff",color:"var(--brand-deep)"}} onClick={()=>setShowLogModal(true)}>+ Update Ads</button>
          <button className="btn" style={{background:"transparent",color:"#fff",border:"1px solid #fff"}} onClick={copyWA}>Salin ke WA</button>
        </div>
      </div>

      <div className="card">
        <div className="row2">
          <div className="field" style={{marginBottom:0}}>
            <label htmlFor="h-client">Client</label>
            <select id="h-client" value={client} onChange={e=>setClient(e.target.value)}>
              <option value="">Semua Client</option>
              {projectNames.map(c=><option key={c} value={c}>{c}</option>)}
            </select>
          </div>
          <div className="field" style={{marginBottom:0}}>
            <label htmlFor="h-month">Bulan</label>
            <input id="h-month" type="month" value={month} onChange={e=>setMonth(e.target.value)} />
          </div>
        </div>
      </div>

      {summary.campaigns > 0 && (
        <div className="card">
          <div className="section-title">Ringkasan Bulan Ini</div>
          <div className="kpi-grid" style={{marginBottom:0}}>
            <div className="kpi" style={{background:"#1F4E79",cursor:"default"}}>
              <div className="num">{summary.leads}</div><div className="lbl">TOTAL LEADS</div></div>
            <div className="kpi" style={{background:"var(--brand-deep)",cursor:"default"}}>
              <div className="num" style={{fontSize:18}}>{fmtIDR(summary.avgCpl)}</div><div className="lbl">RATA-RATA CPL</div></div>
            <div className="kpi" style={{background:"var(--navy)",cursor:"default"}}>
              <div className="num" style={{fontSize:18}}>{fmtIDR(summary.spend)}</div><div className="lbl">BUDGET TERPAKAI</div></div>
          </div>
        </div>
      )}

      <div className="section-title">Log Harian Ads ({logEntries.length})</div>
      {logEntries.length===0 && <div className="empty">Belum ada update harian di periode ini.</div>}
      {logEntries.map(entry => {
        const camps = entry.campaigns || [];
        return (
          <div key={entry.id} className="card">
            <div style={{display:"flex",justifyContent:"space-between",marginBottom:4,alignItems:"center"}}>
              <span style={{fontSize:11,color:"var(--gold)",fontWeight:800}}>{entry.client}</span>
              <div style={{display:"flex",gap:8,alignItems:"center"}}>
                <span style={{fontSize:11,color:"var(--grey)"}}>{fmtDate(entry.date)}</span>
                {isAdmin && <button className="btn btn-outline btn-sm" disabled={busy} onClick={()=>onDeleteDailyLog(entry.id)}>Hapus</button>}
              </div>
            </div>
            {camps.map((c,i) => (
              <div key={i} style={{fontSize:12,marginBottom:5,paddingBottom:5,borderBottom: i<camps.length-1 ? "1px dashed var(--line)" : "none"}}>
                <div style={{display:"flex",justifyContent:"space-between",fontWeight:700,gap:8}}>
                  <span>{c.name || "(tanpa nama)"}{c.active===false ? " — OFF" : ""}</span>
                  <span style={{color:"var(--grey)",fontWeight:400,whiteSpace:"nowrap"}}>{c.endDate ? daysLeftLabel(c.endDate) : ""}</span>
                </div>
                <div style={{color:"var(--grey)"}}>
                  CPL {fmtIDR(c.costPerLead)} · {c.totalLeads||0} Leads
                  {(c.budgetUsed||c.totalBudget) ? ` · Budget ${fmtIDR(c.budgetUsed)} / ${fmtIDR(c.totalBudget)}` : ""}
                </div>
              </div>
            ))}
          </div>
        );
      })}

      <div className="section-title">Konten Tayang ({content.length})</div>
      {content.length===0 && <div className="empty">Belum ada konten yang tayang di periode ini.</div>}
      {content.map(t => (
        <div key={t.id} className="card">
          <div style={{fontSize:11,color:"var(--gold)",fontWeight:800}}>{t.client}</div>
          <div style={{fontSize:13,fontWeight:700,margin:"3px 0"}}>{t.subtasks[0] ? t.subtasks[0].description : "-"}</div>
          <div style={{fontSize:11,color:"var(--grey)",marginBottom:4}}>
            Tayang {fmtDate(t.postedAt)}
            {t.postingDate && (() => {
              const late = daysBetween(t.postingDate, t.postedAt);
              return late > 0
                ? <span className="badge badge-red" style={{marginLeft:6}}>TELAT {late} HARI</span>
                : <span className="badge badge-green" style={{marginLeft:6}}>TEPAT WAKTU</span>;
            })()}
          </div>
          {t.livePostLink && <ExternalLink href={t.livePostLink} style={{fontSize:12,color:"var(--brand-deep)",wordBreak:"break-all"}}>{t.livePostLink}</ExternalLink>}
          {t.previewLink && (
            <div style={{fontSize:11,marginTop:4}}>
              Preview: <ExternalLink href={t.previewLink} style={{color:"var(--grey)",wordBreak:"break-all"}}>{t.previewLink}</ExternalLink>
            </div>
          )}
        </div>
      ))}

      {showLogModal && (
        <DailyLogModal projectNames={projectNames} dailyLog={dailyLog}
          onSave={onSaveDailyLog} onClose={()=>setShowLogModal(false)} defaultClient={client} busy={busy} />
      )}

      {waOpen && (
        <div className="modal-bg" onMouseDown={e=>{ if(e.target===e.currentTarget) setWaOpen(false); }}>
          <div className="modal">
            <div className="section-title">Format WA — {fmtDate(waDate)}</div>
            {copyMsg && <div style={{fontSize:12,color:"var(--green)",marginBottom:8,fontWeight:700}}>{copyMsg}</div>}
            {waEntries.length===0 && <div className="locked-note">Belum ada log di periode yang dipilih.</div>}
            <textarea readOnly rows="16" value={waText}
              style={{width:"100%",padding:10,border:"1px solid var(--line)",borderRadius:8,fontSize:12,fontFamily:"monospace"}}
              onFocus={e=>e.target.select()} />
            <div className="modal-actions">
              <button className="btn btn-gold" style={{width:"100%"}} onClick={()=>setWaOpen(false)}>Tutup</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function DailyLogModal({projectNames, dailyLog, onSave, onClose, defaultClient, busy}){
  const [client, setClient] = useState(defaultClient || "");
  const [date, setDate] = useState(todayStr());
  const [err, setErr] = useState("");
  const existing = dailyLog.find(d => d.date===date && d.client===client);

  const [rows, setRows] = useState([emptyAdLogRow()]);
  useEffect(() => {
    const found = dailyLog.find(d => d.date===date && d.client===client);
    setRows((found && Array.isArray(found.campaigns) && found.campaigns.length)
      ? found.campaigns.map(c=>({...emptyAdLogRow(), ...c, _id: uid()}))
      : [emptyAdLogRow()]);
  }, [client, date, dailyLog]);

  function setRow(i,k,v){ setRows(r => r.map((row,idx)=> idx===i ? {...row,[k]:v} : row)); }
  function addRow(){ setRows(r => [...r, emptyAdLogRow()]); }
  function removeRow(i){ setRows(r => r.length>1 ? r.filter((_,idx)=>idx!==i) : r); }

  async function submit(){
    setErr("");
    if(!client){ setErr("Pilih client dulu."); return; }
    if(!date){ setErr("Pilih tanggal dulu."); return; }
    const campaigns = rows.filter(r=>(r.name||"").trim() || r.costPerLead || r.totalLeads)
      .map(r=>({ name:(r.name||"").trim(), costPerLead:Math.max(0,Number(r.costPerLead)||0),
        totalLeads:Math.max(0,Number(r.totalLeads)||0), budgetUsed:Math.max(0,Number(r.budgetUsed)||0),
        totalBudget:Math.max(0,Number(r.totalBudget)||0), endDate:r.endDate||"", active:r.active!==false }));
    if(campaigns.length===0){ setErr("Isi minimal 1 campaign."); return; }
    const ok = await onSave(client, date, campaigns);
    if(ok) onClose();
  }

  return (
    <div className="modal-bg" onMouseDown={e=>{ if(e.target===e.currentTarget) onClose(); }}>
      <div className="modal">
        <div className="section-title">Update Ads</div>
        {err && <div className="login-error">{err}</div>}
        <div className="row2">
          <div className="field">
            <label htmlFor="dl-client">Client</label>
            <select id="dl-client" value={client} onChange={e=>setClient(e.target.value)}>
              <option value="">Pilih client</option>
              {projectNames.map(c=><option key={c} value={c}>{c}</option>)}
            </select>
          </div>
          <div className="field">
            <label htmlFor="dl-date">Tanggal</label>
            <input id="dl-date" type="date" value={date} max={todayStr()} onChange={e=>setDate(e.target.value)} />
          </div>
        </div>
        {existing && <div className="locked-note">Sudah ada update untuk {client} di tanggal ini — isian di bawah otomatis terisi datanya. Simpan lagi untuk memperbarui.</div>}

        {rows.map((r,i) => (
          <div key={r._id} style={{background:"var(--offwhite)",borderRadius:8,padding:10,marginBottom:8}}>
            <div style={{display:"flex",gap:8,alignItems:"flex-start",marginBottom:6}}>
              <input value={r.name} onChange={e=>setRow(i,"name",e.target.value)} placeholder={`Nama campaign #${i+1}`}
                style={{flex:1,padding:8,border:"1px solid var(--line)",borderRadius:6,fontSize:13,fontFamily:"inherit"}} />
              {rows.length>1 && <button className="btn btn-outline btn-sm" onClick={()=>removeRow(i)}>Hapus</button>}
            </div>
            <div className="row2" style={{marginBottom:6}}>
              <input type="number" min="0" placeholder="Cost per Lead (IDR)" value={r.costPerLead} onChange={e=>setRow(i,"costPerLead",e.target.value)}
                style={{padding:8,border:"1px solid var(--line)",borderRadius:6,fontSize:13,fontFamily:"inherit"}} />
              <input type="number" min="0" placeholder="Total Leads" value={r.totalLeads} onChange={e=>setRow(i,"totalLeads",e.target.value)}
                style={{padding:8,border:"1px solid var(--line)",borderRadius:6,fontSize:13,fontFamily:"inherit"}} />
            </div>
            <div className="row2" style={{marginBottom:6}}>
              <input type="number" min="0" placeholder="Budget Terpakai" value={r.budgetUsed} onChange={e=>setRow(i,"budgetUsed",e.target.value)}
                style={{padding:8,border:"1px solid var(--line)",borderRadius:6,fontSize:13,fontFamily:"inherit"}} />
              <input type="number" min="0" placeholder="Total Budget" value={r.totalBudget} onChange={e=>setRow(i,"totalBudget",e.target.value)}
                style={{padding:8,border:"1px solid var(--line)",borderRadius:6,fontSize:13,fontFamily:"inherit"}} />
            </div>
            <div className="row2" style={{alignItems:"center"}}>
              <div>
                <label style={{fontSize:11,color:"var(--grey)"}} htmlFor={"ed-"+r._id}>Tanggal Berakhir</label>
                <input id={"ed-"+r._id} type="date" value={r.endDate} onChange={e=>setRow(i,"endDate",e.target.value)}
                  style={{width:"100%",padding:8,border:"1px solid var(--line)",borderRadius:6,fontSize:13,fontFamily:"inherit"}} />
              </div>
              <label style={{display:"flex",alignItems:"center",gap:6,fontSize:12,fontWeight:400,marginTop:16}}>
                <input type="checkbox" style={{width:"auto"}} checked={r.active!==false} onChange={e=>setRow(i,"active",e.target.checked)} />
                Aktif (hilangkan centang kalau OFF)
              </label>
            </div>
          </div>
        ))}
        <button className="btn btn-outline btn-sm" onClick={addRow}>+ Tambah Campaign</button>

        <div className="modal-actions">
          <button className="btn btn-outline" onClick={onClose}>Batal</button>
          <button className="btn btn-gold" onClick={submit} disabled={busy}>{busy ? "Menyimpan..." : "Simpan"}</button>
        </div>
      </div>
    </div>
  );
}

/* ===================== DASHBOARD ===================== */
function Dashboard({tasks, connected, staffNames, onNavigate, clientsMeta, myName, onOpenTask, canSeeWorkload, canApprove}){
  const today = todayStr();
  // Hitung flag sekali per task, bukan berulang di tiap filter.
  const flagged = useMemo(() => tasks.map(t => ({ t, flag: getFlag(t, today).label })), [tasks, today]);

  const stats = useMemo(() => {
    const activeList = flagged.filter(x => x.t.status !== "Done");
    const thisMonth = today.slice(0,7);
    return {
      active: activeList.length,
      mine: activeList.filter(x => x.t.pics.includes(myName)).length,
      overdue: activeList.filter(x => x.flag==="OVERDUE").length,
      dueSoon: activeList.filter(x => x.flag==="DUE SOON").length,
      inProgress: activeList.filter(x => x.t.status==="In Progress").length,
      // Pakai completedAt, bukan lastUpdate — supaya task lama yang diedit tidak ikut terhitung.
      doneThisMonth: flagged.filter(x => x.t.status==="Done" && (x.t.completedAt||"").slice(0,7)===thisMonth).length,
    };
  }, [flagged, myName, today]);

  const myTasks = useMemo(() => flagged
    .filter(x => x.t.status!=="Done" && x.t.pics.includes(myName))
    .sort((a,b)=>(a.t.dueDate||"9999").localeCompare(b.t.dueDate||"9999"))
    .slice(0,6), [flagged, myName]);

  const waitingReview = useMemo(() => tasks.filter(t => t.status==="Waiting Review"), [tasks]);
  const waitingClient = useMemo(() => tasks.filter(t => t.status==="Menunggu Approval Klien"), [tasks]);
  // Approved + postable tapi preview kosong = belum di-compile, atau dikembalikan Operations.
  const needCompile = useMemo(() => tasks.filter(t =>
    t.status==="Approved" && isPostableTask(t) && !t.previewLink), [tasks]);
  const revisionForMe = useMemo(() => tasks.filter(t => t.status==="Revision" && myName && t.pics.includes(myName)), [tasks, myName]);

  const quotaProgress = useMemo(() => clientsMeta.filter(c=>Number(c.contentQuota)>0).map(meta => {
    const { start, end } = currentCycleWindow(meta.billingDate);
    const posted = tasks.filter(t => t.client===meta.client && isPostableTask(t) && t.status==="Done"
      && t.postedAt && t.postedAt>=start && t.postedAt<end).length;
    return { client: meta.client, posted, quota: Number(meta.contentQuota), cycleStart: start, cycleEnd: end };
  }), [tasks, clientsMeta]);

  const workload = useMemo(() => {
    if(!canSeeWorkload) return {};
    const map = {};
    staffNames.forEach(p => map[p] = { active:0, overdue:0, dueSoon:0, highPriority:0 });
    flagged.forEach(({t, flag}) => {
      if(t.status==="Done" || !t.pics.length) return;
      t.pics.forEach(pic => {
        const w = map[pic];
        if(!w) return;
        w.active += 1;
        if(flag === "OVERDUE") w.overdue += 1;
        if(flag === "DUE SOON") w.dueSoon += 1;
        if(t.anyHighPriority) w.highPriority += 1;
      });
    });
    return map;
  }, [flagged, staffNames, canSeeWorkload]);

  function workloadLevel(w){
    if(w.overdue > 0 || w.highPriority >= 3) return {label:"OVERLOAD", bg:"var(--red-bg)", txt:"var(--red)"};
    if(w.active >= 5 || w.highPriority >= 2 || w.dueSoon >= 2) return {label:"MULAI PADAT", bg:"var(--yellow-bg)", txt:"var(--yellow-txt)"};
    return {label:"WAJAR", bg:"#DFF3E8", txt:"var(--green)"};
  }

  return (
    <div>
      <div style={{fontSize:12,color:"var(--grey)",marginBottom:10}}>
        <span className="conn-dot" style={{background: connected ? "#1E7B4D":"#B3261E"}}></span>
        {connected ? "Tersambung — data live untuk semua tim" : "Belum tersambung"}
      </div>

      {(waitingReview.length>0 || waitingClient.length>0 || needCompile.length>0 || revisionForMe.length>0) && (
        <div className="card" style={{background:"var(--brand-gradient)",color:"#fff"}}>
          {canApprove && waitingReview.length>0 && (
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8,gap:8}}>
              <div style={{fontSize:13,fontWeight:700}}>{waitingReview.length} task menunggu review</div>
              <button className="btn btn-sm" style={{background:"#fff",color:"var(--brand-deep)"}} onClick={()=>onNavigate("review")}>Lihat</button>
            </div>
          )}
          {canApprove && waitingClient.length>0 && (
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8,gap:8}}>
              <div style={{fontSize:13,fontWeight:700}}>{waitingClient.length} menunggu konfirmasi client</div>
              <button className="btn btn-sm" style={{background:"#fff",color:"var(--brand-deep)"}} onClick={()=>waitingClient[0] && onOpenTask(waitingClient[0])}>Buka</button>
            </div>
          )}
          {canApprove && needCompile.length>0 && (
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8,gap:8}}>
              <div style={{fontSize:13,fontWeight:700}}>{needCompile.length} perlu di-compile jadi preview</div>
              <button className="btn btn-sm" style={{background:"#fff",color:"var(--brand-deep)"}} onClick={()=>needCompile[0] && onOpenTask(needCompile[0])}>Buka</button>
            </div>
          )}
          {revisionForMe.length>0 && (
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:8}}>
              <div style={{fontSize:13,fontWeight:700}}>{revisionForMe.length} revisi untuk kamu</div>
              <button className="btn btn-sm" style={{background:"#fff",color:"var(--brand-deep)"}} onClick={()=>revisionForMe[0] && onOpenTask(revisionForMe[0])}>Buka</button>
            </div>
          )}
        </div>
      )}

      <div className="card">
        <div className="section-title">Task Saya ({stats.mine})</div>
        {myTasks.length===0 && <div style={{color:"var(--grey)",fontSize:13}}>Tidak ada task aktif untuk kamu.</div>}
        {myTasks.map(({t, flag}) => (
          <button key={t.id} className="manage-row card-btn" style={{background:"none",padding:"8px 0"}} onClick={()=>onOpenTask(t)}>
            <div style={{minWidth:0}}>
              <div style={{fontSize:13,fontWeight:700}}>{t.subtasks[0] ? t.subtasks[0].description : "-"}</div>
              <div style={{fontSize:11,color:"var(--grey)"}}>{t.client} · Due {fmtDate(t.dueDate)}</div>
            </div>
            <span className={"badge " + getFlag(t, today).cls} style={{flexShrink:0}}>{flag}</span>
          </button>
        ))}
        {stats.mine > myTasks.length && (
          <button className="btn btn-outline btn-sm" style={{marginTop:8}} onClick={()=>onNavigate("mine")}>
            Lihat semua {stats.mine} task saya
          </button>
        )}
      </div>

      <div className="kpi-grid">
        <button className="kpi" style={{background:"var(--navy)"}} onClick={()=>onNavigate("all")}>
          <div className="num">{stats.active}</div><div className="lbl">TASK AKTIF</div></button>
        <button className="kpi" style={{background:"#9C0006"}} onClick={()=>onNavigate("overdue")}>
          <div className="num">{stats.overdue}</div><div className="lbl">OVERDUE</div></button>
        <button className="kpi" style={{background:"#B7791F"}} onClick={()=>onNavigate("duesoon")}>
          <div className="num">{stats.dueSoon}</div><div className="lbl">DUE SOON</div></button>
        <button className="kpi" style={{background:"#1F4E79"}} onClick={()=>onNavigate("inprogress")}>
          <div className="num">{stats.inProgress}</div><div className="lbl">SEDANG DIKERJAKAN</div></button>
        {canSeeWorkload && (
          <div className="kpi" style={{background:"#2E7D32",cursor:"default"}}>
            <div className="num">{stats.doneThisMonth}</div><div className="lbl">SELESAI BULAN INI</div></div>
        )}
      </div>

      {quotaProgress.length>0 && (
        <div className="card">
          <div className="section-title">Kuota Konten — Siklus Berjalan</div>
          {quotaProgress.map(q => {
            const pct = q.quota>0 ? Math.min(100, Math.round(q.posted/q.quota*100)) : 0;
            const endDisplay = new Date(new Date(q.cycleEnd+"T00:00:00").getTime()-86400000);
            return (
              <div key={q.client} style={{marginBottom:10}}>
                <div style={{display:"flex",justifyContent:"space-between",fontSize:12,marginBottom:3}}>
                  <span style={{fontWeight:700}}>{q.client}</span><span>{q.posted} dari {q.quota}</span>
                </div>
                <div style={{background:"var(--offwhite)",borderRadius:6,height:6,overflow:"hidden"}}>
                  <div style={{width:pct+"%",height:"100%",background:"var(--brand-deep)"}}></div>
                </div>
                <div style={{fontSize:10,color:"var(--grey)",marginTop:2}}>Siklus {fmtDate(q.cycleStart)} – {fmtDate(toLocalISO(endDisplay))}</div>
              </div>
            );
          })}
        </div>
      )}

      {canSeeWorkload && (
        <div className="card">
          <div className="section-title">Workload per Orang (task aktif)</div>
          {staffNames.filter(p=>workload[p] && workload[p].active>0)
            .sort((a,b)=>workload[b].active-workload[a].active)
            .map(p => {
              const w = workload[p];
              const lv = workloadLevel(w);
              const reasons = [];
              if(w.overdue>0) reasons.push(`${w.overdue} overdue`);
              if(w.highPriority>0) reasons.push(`${w.highPriority} high priority`);
              if(w.dueSoon>0) reasons.push(`${w.dueSoon} due soon`);
              return (
                <div key={p} className="manage-row">
                  <div>
                    <div style={{fontSize:13,fontWeight:700}}>{p} <span style={{fontWeight:400,color:"var(--grey)"}}>· {w.active} task</span></div>
                    {reasons.length>0 && <div style={{fontSize:10.5,color:"var(--grey)"}}>{reasons.join(" · ")}</div>}
                  </div>
                  <span className="badge" style={{background:lv.bg,color:lv.txt,flexShrink:0}}>{lv.label}</span>
                </div>
              );
            })}
          {staffNames.every(p=>!workload[p] || workload[p].active===0) && <div style={{color:"var(--grey)",fontSize:13}}>Belum ada task aktif.</div>}
          <div style={{fontSize:10,color:"var(--grey)",marginTop:10,fontStyle:"italic"}}>
            OVERLOAD = ada task overdue, atau ≥3 task High priority bersamaan. MULAI PADAT = ≥5 task aktif, atau ≥2 High priority / due soon.
          </div>
        </div>
      )}
    </div>
  );
}

/* ===================== TASK LIST ===================== */
function TaskList({tasks, onEdit, onDelete, isAdmin, staffNames, projectNames,
  filterPic, setFilterPic, filterStatus, setFilterStatus, filterFlag, setFilterFlag, filterClient, setFilterClient}){
  const [q, setQ] = useState("");
  const [sortBy, setSortBy] = useState("terbaru");   // terbaru | deadline
  const [dateMode, setDateMode] = useState("all");   // all | today | yesterday | pick
  const [pickDate, setPickDate] = useState(todayStr());
  const [showDone, setShowDone] = useState(false);

  const today = todayStr();
  const yesterday = useMemo(() => {
    const d = new Date(today+"T00:00:00"); d.setDate(d.getDate()-1); return toLocalISO(d);
  }, [today]);
  const targetDate = dateMode==="today" ? today : dateMode==="yesterday" ? yesterday : dateMode==="pick" ? pickDate : null;

  const filtered = useMemo(() => {
    const key = q.trim().toLowerCase();
    const list = tasks.filter(t => {
      if(!showDone && t.status==="Done") return false;
      if(filterPic && !t.pics.includes(filterPic)) return false;
      if(filterClient && t.client!==filterClient) return false;
      if(filterStatus && t.status!==filterStatus) return false;
      if(filterFlag && getFlag(t, today).label!==filterFlag) return false;
      if(targetDate && (t.createdAt||"") !== targetDate) return false;
      if(key){
        const hay = [t.client, t.category, t.status, t.pics.join(" "), t.notes,
          ...t.subtasks.map(s=>s.description)].join(" ").toLowerCase();
        if(!hay.includes(key)) return false;
      }
      return true;
    });
    if(sortBy === "deadline"){
      list.sort((a,b)=>(a.dueDate||"9999").localeCompare(b.dueDate||"9999"));
    } else {
      // Task lama belum punya createdAt — dikelompokkan di bawah, tidak hilang.
      list.sort((a,b)=>(b.createdAt||"0000").localeCompare(a.createdAt||"0000"));
    }
    return list;
  }, [tasks, q, filterPic, filterClient, filterStatus, filterFlag, targetDate, sortBy, showDone, today]);

  const noCreatedAt = useMemo(() => targetDate ? tasks.filter(t=>!t.createdAt && t.status!=="Done").length : 0, [tasks, targetDate]);

  return (
    <div>
      {filterFlag && (
        <div style={{background:"var(--brand-deep)",color:"#fff",borderRadius:8,padding:"7px 12px",marginBottom:10,
          fontSize:12,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <span>Filter aktif: <b>{filterFlag}</b></span>
          <button className="logout-btn" onClick={()=>setFilterFlag("")}>Hapus</button>
        </div>
      )}

      <div className="filter-row">
        <input placeholder="Cari task, client, PIC..." value={q} onChange={e=>setQ(e.target.value)} style={{flex:1,minWidth:150}} />
      </div>

      <div className="chips">
        <button className={"chip"+(sortBy==="terbaru"?" on":"")} onClick={()=>setSortBy("terbaru")}>Terbaru</button>
        <button className={"chip"+(sortBy==="deadline"?" on":"")} onClick={()=>setSortBy("deadline")}>Deadline</button>
        <span style={{width:8}}></span>
        <button className={"chip"+(dateMode==="all"?" on":"")} onClick={()=>setDateMode("all")}>Semua</button>
        <button className={"chip"+(dateMode==="today"?" on":"")} onClick={()=>setDateMode("today")}>Hari Ini</button>
        <button className={"chip"+(dateMode==="yesterday"?" on":"")} onClick={()=>setDateMode("yesterday")}>Kemarin</button>
        <button className={"chip"+(dateMode==="pick"?" on":"")} onClick={()=>setDateMode("pick")}>Pilih Tanggal</button>
      </div>

      {dateMode==="pick" && (
        <div className="field">
          <label htmlFor="pick-d">Task yang dibuat tanggal</label>
          <input id="pick-d" type="date" value={pickDate} onChange={e=>setPickDate(e.target.value)} />
        </div>
      )}
      {targetDate && noCreatedAt>0 && (
        <div className="locked-note">{noCreatedAt} task lama belum punya catatan tanggal dibuat, jadi tidak muncul di filter tanggal. Pilih "Semua" untuk melihatnya.</div>
      )}

      <div className="filter-row">
        <select value={filterPic} onChange={e=>setFilterPic(e.target.value)}>
          <option value="">Semua PIC</option>
          {staffNames.map(p=><option key={p} value={p}>{p}</option>)}
        </select>
        <select value={filterClient} onChange={e=>setFilterClient(e.target.value)}>
          <option value="">Semua Client</option>
          {projectNames.map(c=><option key={c} value={c}>{c}</option>)}
        </select>
        <select value={filterStatus} onChange={e=>setFilterStatus(e.target.value)}>
          <option value="">Semua Status</option>
          {STATUSES.map(s=><option key={s} value={s}>{s}</option>)}
        </select>
      </div>

      <label style={{display:"flex",alignItems:"center",gap:8,fontSize:12,color:"var(--grey)",marginBottom:12}}>
        <input type="checkbox" style={{width:"auto"}} checked={showDone} onChange={e=>setShowDone(e.target.checked)} />
        Tampilkan juga yang sudah selesai
      </label>

      {filtered.length===0 && <div className="empty">Tidak ada task yang cocok dengan filter ini.</div>}
      {filtered.map(t => {
        const flag = getFlag(t, today);
        return (
          <div key={t.id} className="card">
            <div onClick={()=>onEdit(t)} style={{cursor:"pointer",display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:10}}>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontSize:11,color:"var(--gold)",fontWeight:800}}>{t.client} · {t.category}</div>
                <div style={{fontSize:14,fontWeight:700,margin:"3px 0"}}>
                  {t.subtasks[0] ? t.subtasks[0].description : "-"}
                  {t.subtasks.length>1 && <span style={{color:"var(--grey)",fontWeight:400}}> +{t.subtasks.length-1} sub-task lainnya</span>}
                </div>
                <div style={{fontSize:12,color:"var(--grey)"}}>
                  {t.pics.length ? t.pics.join(", ") : "Belum ada PIC"} · Due {fmtDate(t.dueDate)} · {t.avgProgress}%
                </div>
              </div>
              <div style={{display:"flex",flexDirection:"column",gap:5,alignItems:"flex-end",flexShrink:0}}>
                <span className={"badge " + flag.cls}>{flag.label}</span>
                <span className={"badge " + priorityCls(t.overallPriority)}>{t.overallPriority}</span>
                <span className={"badge " + statusCls(t.status)}>{t.status}</span>
              </div>
            </div>
            {isAdmin && (
              <div style={{marginTop:8,display:"flex",justifyContent:"flex-end"}}>
                <button className="btn btn-outline btn-sm" onClick={()=>onDelete(t.id)}>Hapus</button>
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

/* ===================== TASK MODAL ===================== */
function activityLabel(type){
  return { link:"Link", revision:"Revisi", approval:"Approve Internal", client_approval:"Client Approve",
    client_revision:"Revisi Client", caption:"Caption", preview:"Preview", returned:"Dikembalikan", posted:"Posting", comment:"Komentar", status:"Status" }[type] || type;
}
const BASIC_STATUSES = ["Not Started","In Progress","On Hold","Done"];

function TaskModal({task, onClose, onSave, busy, isAdmin, myRole, myEmail, myName,
  canApprove, canMarkPosted, allowedCategories, staffNames, projectNames, reviewerNames,
  onSubmitForReview, onUpdateLinkAndResend, onRequestRevision, onApproveTask,
  onClientApprove, onClientRevision, onSendToOperations, onMarkDoneManual, onMarkPosted, onReturnToPM, onAddComment}){

  const isExisting = !!task.id;
  const [form, setForm] = useState(() => {
    if(isExisting) return task;
    // Role dengan satu kategori langsung dikunci ke kategori itu.
    const cat = allowedCategories.includes(task.category) ? task.category : allowedCategories[0];
    return { ...task, category: cat };
  });

  // Ikut perubahan dari orang lain tanpa menimpa yang sedang diketik.
  useEffect(() => {
    if(!isExisting) return;
    setForm(f => ({ ...f, status: task.status, activity: task.activity, version: task.version,
      link: task.link, caption: task.caption, previewLink: task.previewLink,
      postingDate: task.postingDate, livePostLink: task.livePostLink,
      postedAt: task.postedAt, internalApprovedBy: task.internalApprovedBy }));
  }, [task.id, task.version, isExisting]);

  const set = (k,v) => setForm(f => ({...f, [k]:v}));
  const structLocked = isExisting && !isAdmin;
  const isPaidAds = form.category === "Paid Ads";
  const isProduction = form.category === "Production";
  const isReview = isReviewCategory(form.category);
  const isContent = isPostableTask(form);

  const singleCategory = !isExisting && allowedCategories.length === 1;

  // Aturan dua kepala: yang approve internal tidak boleh menutup gerbang client.
  const iApprovedInternally = (form.internalApprovedBy||"").toLowerCase() === myEmail;
  const canClientGate = isAdmin || (canApprove && !iApprovedInternally);

  const [linkDraft, setLinkDraft] = useState(task.link || "");
  const [reviewer, setReviewer] = useState(task.reviewerTarget || "");
  const [reviewNote, setReviewNote] = useState("");
  const [captionDraft, setCaptionDraft] = useState(task.caption || "");
  const [previewDraft, setPreviewDraft] = useState(task.previewLink || "");
  const [postDateDraft, setPostDateDraft] = useState(task.postingDate || "");
  const [liveLinkDraft, setLiveLinkDraft] = useState("");
  const [commentDraft, setCommentDraft] = useState("");
  const [returnNote, setReturnNote] = useState("");
  const [showReturn, setShowReturn] = useState(false);
  const [localErr, setLocalErr] = useState("");

  function guardLink(v){
    if(!safeUrl(v)){ setLocalErr("Link tidak valid. Pakai alamat lengkap, contoh: https://drive.google.com/..."); return false; }
    setLocalErr(""); return true;
  }
  function togglePic(name){
    setForm(f => ({ ...f, pics: f.pics.includes(name) ? f.pics.filter(p=>p!==name) : [...f.pics, name] }));
  }
  const setSub = (i,k,v) => setForm(f => ({...f, subtasks: f.subtasks.map((s,idx)=> idx===i ? {...s,[k]:v} : s)}));
  const addSub = () => setForm(f => ({...f, subtasks: [...f.subtasks, emptySubtask()]}));
  const removeSub = (i) => setForm(f => f.subtasks.length>1 ? {...f, subtasks: f.subtasks.filter((_,idx)=>idx!==i)} : f);
  const setAdItem = (i,k,v) => setForm(f => ({...f, adItems: f.adItems.map((a,idx)=> idx===i ? {...a,[k]:v} : a)}));
  const addAdItem = () => setForm(f => ({...f, adItems: [...f.adItems, emptyAdItem()]}));
  const removeAdItem = (i) => setForm(f => f.adItems.length>1 ? {...f, adItems: f.adItems.filter((_,idx)=>idx!==i)} : f);

  return (
    <div className="modal-bg" onMouseDown={e=>{ if(e.target===e.currentTarget) onClose(); }}>
      <div className="modal" role="dialog" aria-modal="true">
        <div className="section-title">{isExisting ? "Edit Pengerjaan" : "Pengerjaan Baru"}</div>
        {localErr && <div className="login-error">{localErr}</div>}
        {structLocked && <div className="locked-note">Client, Kategori, & PIC dikunci — cuma Admin yang bisa ubah. Kamu tetap bisa tambah/edit sub-task, progress, dan Notes.</div>}

        <div className="field">
          <label htmlFor="tm-client">Client / Project</label>
          <select id="tm-client" value={form.client} onChange={e=>set("client",e.target.value)} disabled={structLocked}>
            <option value="">Pilih client</option>
            {projectNames.map(c=><option key={c} value={c}>{c}</option>)}

          </select>
        </div>

        <div className="field">
          <label htmlFor="tm-cat">Kategori</label>

            <>
              <div><span className="badge badge-purple">{form.category}</span></div>

            </>
          ) : (
            <select id="tm-cat" value={form.category} onChange={e=>set("category",e.target.value)} disabled={structLocked}>
              {categoryOptions.map(c=><option key={c} value={c}>{c}</option>)}

            </select>
          )}
        </div>

        <div className="field">
          <label>PIC (bisa pilih lebih dari 1)</label>
          <div style={{border:"1px solid var(--line)",borderRadius:8,padding:8,maxHeight:130,overflowY:"auto"}}>

        <div className="field">

            placeholder={isProduction ? "Link moodboard/storyboard" : "Link brief dari Drive"} />
        </div>

        {isGraphicDesign && (
          <div className="field" style={{display:"flex",alignItems:"center",gap:8}}>
            <input type="checkbox" id="forposting" style={{width:"auto"}} checked={form.forPosting===true}
              onChange={e=>set("forPosting",e.target.checked)} />

        )}

        {isPaidAds && (
          <>
            <div className="row2">
              <div className="field">
                <label htmlFor="tm-plat">Platform</label>
                <select id="tm-plat" value={form.platform} onChange={e=>set("platform",e.target.value)}>
                  <option value="">Pilih platform</option>
                  {AD_PLATFORMS.map(p=><option key={p} value={p}>{p}</option>)}
                </select>
              </div>
              <div className="field">
                <label htmlFor="tm-obj">Objektif</label>
                <select id="tm-obj" value={form.objective} onChange={e=>set("objective",e.target.value)} disabled={!form.platform}>

            </div>
            <div className="field">
              <label htmlFor="tm-budget">Budget</label>

                  {form.adItems.length>1 && <button className="btn btn-outline btn-sm" onClick={()=>removeAdItem(i)}>Hapus</button>}
                </div>
                <input value={a.link} onChange={e=>setAdItem(i,"link",e.target.value)} placeholder="Link Drive konten"

                <textarea rows="2" value={a.caption} onChange={e=>setAdItem(i,"caption",e.target.value)} placeholder="Caption / copy ads untuk konten ini"
                  style={{width:"100%",padding:8,border:"1px solid var(--line)",borderRadius:6,fontFamily:"inherit",fontSize:13,marginBottom:8}} />
                <div style={{borderTop:"1px dashed var(--line)",paddingTop:8}}>

            <label htmlFor="tm-status">Status</label>

            <div className="section-title" style={{fontSize:13}}>Daftar Sub-Task</div>
            <div className="locked-note">Tiap sub-task punya priority & progress sendiri.</div>
            {form.subtasks.map((s,i) => (
              <div key={s._id} style={{background:"var(--offwhite)",borderRadius:8,padding:10,marginBottom:8}}>
                <div style={{display:"flex",gap:8,alignItems:"flex-start",marginBottom:6}}>

                  {form.subtasks.length>1 && <button onClick={()=>removeSub(i)} className="btn btn-outline btn-sm">Hapus</button>}

            <button className="btn btn-outline btn-sm" onClick={addSub}>+ Tambah Sub-Task</button>

        {isReview && !isExisting && (
          <>
            <div style={{height:1,background:"var(--line)",margin:"14px 0"}}></div>
            <div className="locked-note">Simpan task ini dulu — setelah itu bagian Link, Approval & Revisi otomatis muncul.</div>
          </>
        )}

        {isReview && isExisting && (
          <>
            <div style={{height:1,background:"var(--line)",margin:"14px 0"}}></div>
            <div className="section-title" style={{fontSize:13}}>Link, Approval & Revisi</div>

              </div>

            {form.link && (
              <div style={{fontSize:12,marginBottom:8}}>

            {form.reviewerTarget && (form.status==="Waiting Review") && (
              <div className="locked-note">Dikirim ke: <b>{form.reviewerTarget}</b>. PM/CS lain tetap boleh approve kalau yang dituju berhalangan.</div>

            {form.activity.length>0 && (
              <div style={{background:"var(--offwhite)",borderRadius:8,padding:10,marginBottom:10,maxHeight:180,overflowY:"auto"}}>
                {[...form.activity].sort((a,b)=>(a.at||"").localeCompare(b.at||"")).map((a,i) => (
                  <div key={i} style={{fontSize:11.5,marginBottom:6}}>
                    <b>{a.author||"?"}</b> <span style={{color:"var(--grey)"}}>· {activityLabel(a.type)} · {fmtDate((a.at||"").slice(0,10))}</span>
                    <div style={{wordBreak:"break-word"}}>{a.text}</div>

            {(form.status==="Not Started" || form.status==="In Progress") && (

                <input id="tm-link" value={linkDraft} onChange={e=>setLinkDraft(e.target.value)} placeholder="https://drive.google.com/..." />
                <label htmlFor="tm-rev" style={{marginTop:8}}>Kirim ke</label>
                <select id="tm-rev" value={reviewer} onChange={e=>setReviewer(e.target.value)}>
                  <option value="">Pilih PM / Content Strategist</option>
                  {reviewerNames.map(r=><option key={r} value={r}>{r}</option>)}
                </select>
                {reviewerNames.length===0 && <div className="locked-note" style={{marginTop:6}}>Belum ada PM/Content Strategist aktif. Minta Admin mengaktifkan dulu.</div>}
                <button className="btn btn-gold btn-sm" style={{marginTop:8}} disabled={!linkDraft.trim() || !reviewer || busy}
                  onClick={()=>{ if(guardLink(linkDraft)) onSubmitForReview(task.id, linkDraft.trim(), reviewer); }}>
                  Kirim untuk Review
                </button>
              </div>
            )}

            {form.status==="Waiting Review" && (
              canApprove ? (
                <div className="field">
                  <label htmlFor="tm-note">Catatan Review (wajib kalau minta revisi)</label>
                  <textarea id="tm-note" rows="2" value={reviewNote} onChange={e=>setReviewNote(e.target.value)} />
                  {needsClientGate(form.category) && (
                    <div className="locked-note" style={{marginTop:6}}>
                      Approve di sini = disetujui internal. Setelah itu masih perlu konfirmasi client,
                      dan yang mengkonfirmasi harus PM/CS lain — bukan kamu.
                    </div>
                  )}
                  <div style={{display:"flex",gap:8,marginTop:6}}>
                    <button className="btn btn-outline btn-sm" disabled={!reviewNote.trim() || busy}
                      onClick={()=>onRequestRevision(task.id, reviewNote)}>Minta Revisi</button>
                    <button className="btn btn-gold btn-sm" disabled={busy}
                      onClick={()=>onApproveTask(task.id, reviewNote, form.category)}>Approve</button>
                  </div>
                </div>
              ) : (
                <div className="locked-note">Menunggu review dari PM / Content Strategist.</div>
              )
            )}

            {form.status==="Menunggu Approval Klien" && (
              canClientGate ? (
                <div className="field">
                  <label htmlFor="tm-cnote">Konfirmasi dari Client</label>
                  <textarea id="tm-cnote" rows="2" value={reviewNote} onChange={e=>setReviewNote(e.target.value)}
                    placeholder="Catatan (wajib kalau client minta revisi)" />
                  <div style={{display:"flex",gap:8,marginTop:6}}>
                    <button className="btn btn-outline btn-sm" disabled={!reviewNote.trim() || busy}
                      onClick={()=>onClientRevision(task.id, reviewNote)}>Client Minta Revisi</button>
                    <button className="btn btn-gold btn-sm" disabled={busy}
                      onClick={()=>onClientApprove(task.id)}>Client Approve</button>
                  </div>
                </div>
              ) : (
                <div className="locked-note">
                  {iApprovedInternally
                    ? "Kamu yang approve internal — konfirmasi client harus dari PM/CS lain."
                    : "Menunggu konfirmasi client dari PM / Content Strategist."}
                </div>
              )
            )}

            {form.status==="Revision" && (
              <div className="field">
                <label htmlFor="tm-link2">Link Versi Baru</label>
                <input id="tm-link2" value={linkDraft} onChange={e=>setLinkDraft(e.target.value)} placeholder="https://drive.google.com/..." />
                <label htmlFor="tm-rev2" style={{marginTop:8}}>Kirim ke</label>
                <select id="tm-rev2" value={reviewer} onChange={e=>setReviewer(e.target.value)}>
                  <option value="">Pilih PM / Content Strategist</option>
                  {reviewerNames.map(r=><option key={r} value={r}>{r}</option>)}
                </select>
                <button className="btn btn-gold btn-sm" style={{marginTop:8}} disabled={!linkDraft.trim() || !reviewer || busy}
                  onClick={()=>{ if(guardLink(linkDraft)) onUpdateLinkAndResend(task.id, linkDraft.trim(), reviewer); }}>
                  Kirim Ulang untuk Review
                </button>
              </div>
            )}

            {form.status==="Approved" && isContent && (
              canApprove ? (
                <div className="field">
                  <div className="locked-note" style={{marginTop:0}}>
                    Compile dulu hasil kerjaannya, lalu tempel link preview di sini. Yang dilihat Operations
                    adalah link preview ini — bukan link kerjaan mentah dari editor.
                  </div>
                  <label htmlFor="tm-prev">Link Preview (hasil compile)</label>
                  <input id="tm-prev" value={previewDraft} onChange={e=>setPreviewDraft(e.target.value)}
                    placeholder="https://drive.google.com/..." />
                  <label htmlFor="tm-pdate" style={{marginTop:8}}>Tanggal Posting (target buat Operations)</label>
                  <input id="tm-pdate" type="date" value={postDateDraft} onChange={e=>setPostDateDraft(e.target.value)} />
                  <label htmlFor="tm-cap" style={{marginTop:8}}>Caption</label>
                  <textarea id="tm-cap" rows="3" value={captionDraft} onChange={e=>setCaptionDraft(e.target.value)} placeholder="Tulis caption..." />
                  <button className="btn btn-gold btn-sm" style={{marginTop:8}}
                    disabled={!captionDraft.trim() || !previewDraft.trim() || busy}
                    onClick={()=>{ if(guardLink(previewDraft)) onSendToOperations(task.id, captionDraft, previewDraft.trim(), postDateDraft); }}>
                    Kirim ke Operations
                  </button>
                  {!previewDraft.trim() && <div className="locked-note" style={{marginTop:6}}>Link preview wajib diisi sebelum bisa dikirim.</div>}
                </div>
              ) : (
                <div className="locked-note">Menunggu di-compile oleh PM / Content Strategist.</div>
              )
            )}
            {form.status==="Approved" && !isContent && (
              <button className="btn btn-gold btn-sm" disabled={busy} onClick={()=>onMarkDoneManual(task.id)}>Tandai Selesai (Done)</button>
            )}

            {form.status==="Ready to Post" && (
              <div>
                {form.previewLink && (
                  <div style={{fontSize:12,marginBottom:6}}>
                    <b>Preview:</b> <ExternalLink href={form.previewLink} style={{color:"var(--brand-deep)",wordBreak:"break-all"}}>{form.previewLink}</ExternalLink>
                  </div>
                )}
                {form.postingDate && (
                  <div style={{fontSize:12,marginBottom:6}}><b>Target tayang:</b> {fmtDate(form.postingDate)}</div>
                )}
                <div style={{fontSize:12,marginBottom:8,background:"var(--offwhite)",borderRadius:6,padding:8,whiteSpace:"pre-wrap"}}>
                  <b>Caption:</b> {form.caption}
                </div>
                {canMarkPosted ? (
                  <>
                    <div className="field">
                      <label htmlFor="tm-live">Link Postingan Live</label>
                      <input id="tm-live" value={liveLinkDraft} onChange={e=>setLiveLinkDraft(e.target.value)} placeholder="https://instagram.com/p/..." />
                    </div>
                    <button className="btn btn-gold btn-sm" disabled={!liveLinkDraft.trim() || busy}
                      onClick={()=>{ if(guardLink(liveLinkDraft)) onMarkPosted(task.id, liveLinkDraft.trim()); }}>
                      Tandai Sudah Posting
                    </button>
                    {!showReturn ? (
                      <button className="btn btn-outline btn-sm" style={{marginLeft:8}} onClick={()=>setShowReturn(true)}>
                        Ada yang salah — Kembalikan ke PM
                      </button>
                    ) : (
                      <div className="field" style={{marginTop:10}}>
                        <label htmlFor="tm-ret">Apa yang salah? (wajib diisi)</label>
                        <textarea id="tm-ret" rows="2" value={returnNote} onChange={e=>setReturnNote(e.target.value)}
                          placeholder="mis. file preview corrupt / caption salah client / versi lama" />
                        <div className="locked-note" style={{marginTop:6}}>
                          Task balik ke PM/CS untuk di-compile ulang. Link preview lama dihapus, caption tetap tersimpan.
                        </div>
                        <div style={{display:"flex",gap:8,marginTop:6}}>
                          <button className="btn btn-outline btn-sm" onClick={()=>{setShowReturn(false); setReturnNote("");}}>Batal</button>
                          <button className="btn btn-gold btn-sm" disabled={!returnNote.trim() || busy}
                            onClick={()=>onReturnToPM(task.id, returnNote)}>Kembalikan ke PM</button>
                        </div>
                      </div>
                    )}
                  </>
                ) : (
                  <div className="locked-note">Menunggu ditandai tayang oleh PM / Content Strategist / Operations.</div>
                )}
              </div>
            )}

            {form.status==="Done" && form.livePostLink && (
              <div style={{fontSize:12,marginBottom:8}}>
                Live: <ExternalLink href={form.livePostLink} style={{wordBreak:"break-all",color:"var(--brand-deep)"}}>{form.livePostLink}</ExternalLink>
              </div>
            )}

            <div className="field" style={{marginTop:10}}>
              <label htmlFor="tm-cm">Tambah Komentar</label>
              <textarea id="tm-cm" rows="2" value={commentDraft} onChange={e=>setCommentDraft(e.target.value)} />
              <button className="btn btn-outline btn-sm" style={{marginTop:6}} disabled={!commentDraft.trim() || busy}
                onClick={()=>onAddComment(task.id, commentDraft)}>Kirim Komentar</button>
            </div>
          </>
        )}

        <div className="field" style={{marginTop:12}}>
          <label htmlFor="tm-notes">Notes / Blocker</label>
          <textarea id="tm-notes" rows="2" value={form.notes} onChange={e=>set("notes",e.target.value)} />
        </div>
        <div className="field" style={{display:"flex",alignItems:"center",gap:8}}>
          <input type="checkbox" id="showcal" style={{width:"auto"}}
            checked={(isPaidAds||isProduction) ? true : form.showOnCalendar}
            disabled={isPaidAds||isProduction} onChange={e=>set("showOnCalendar",e.target.checked)} />
          <label htmlFor="showcal" style={{margin:0}}>Tampilkan di Calendar{(isPaidAds||isProduction) ? " (wajib)" : ""}</label>
        </div>

        <div className="modal-actions">
          <button className="btn btn-outline" onClick={onClose}>Batal</button>
          <button className="btn btn-gold" onClick={()=>onSave(form)} disabled={busy}>{busy ? "Menyimpan..." : "Simpan"}</button>
        </div>
      </div>
    </div>
  );
}

/* ===================== CALENDAR ===================== */
function CalendarView({tasks, calMonth, setCalMonth, holidayMap}){
  const year = calMonth.getFullYear(), month = calMonth.getMonth();
  const monthLabel = calMonth.toLocaleDateString("id-ID",{month:"long",year:"numeric"});
  const [quickView, setQuickView] = useState(null);
  const [dayView, setDayView] = useState(null);
  const [clientFilter, setClientFilter] = useState("");
  // Di layar HP, grid 7 kolom membuat tulisan terlalu kecil — agenda jadi bawaan.
  const [view, setView] = useState(() => (window.innerWidth < 640 ? "agenda" : "grid"));
  const today = todayStr();

  const monthTasks = useMemo(() => tasks
    .filter(t => t.showOnCalendar)
    .filter(t => !clientFilter || t.client===clientFilter), [tasks, clientFilter]);

  const clientOptions = useMemo(() => [...new Set(tasks.filter(t=>t.showOnCalendar).map(t=>t.client))].sort(), [tasks]);

  const eventsByDate = useMemo(() => {
    const map = {};
    monthTasks.forEach(t => {
      const ed = eventDate(t);
      if(!ed) return;
      if(!map[ed]) map[ed] = [];
      map[ed].push(t);
    });
    return map;
  }, [monthTasks]);

  const gridStart = new Date(year, month, 1);
  gridStart.setDate(gridStart.getDate() - gridStart.getDay());
  const lastDay = new Date(year, month+1, 0).getDate();
  const rowsNeeded = Math.ceil((new Date(year, month, 1).getDay() + lastDay) / 7);
  const cells = [];
  for(let i=0;i<rowsNeeded*7;i++){
    const d = new Date(gridStart);
    d.setDate(gridStart.getDate()+i);
    cells.push(d);
  }

  // Agenda: hanya tanggal yang benar-benar ada isinya, plus hari libur.
  const agendaDays = useMemo(() => {
    const out = [];
    for(let day=1; day<=lastDay; day++){
      const iso = toLocalISO(new Date(year, month, day));
      const evs = eventsByDate[iso] || [];
      if(evs.length || holidayMap[iso]) out.push({ iso, evs, hol: holidayMap[iso] });
    }
    return out;
  }, [year, month, lastDay, eventsByDate, holidayMap]);

  const shiftMonth = (delta) => setCalMonth(new Date(year, month+delta, 1));
  const dayHeads = ["Min","Sen","Sel","Rab","Kam","Jum","Sab"];

  return (
    <div className="card">
      <div className="month-nav">
        <button onClick={()=>shiftMonth(-1)} aria-label="Bulan sebelumnya">‹</button>
        <div className="label">{monthLabel}</div>
        <button onClick={()=>shiftMonth(1)} aria-label="Bulan berikutnya">›</button>
      </div>

      <div className="chips">
        <button className={"chip"+(view==="agenda"?" on":"")} onClick={()=>setView("agenda")}>Agenda</button>
        <button className={"chip"+(view==="grid"?" on":"")} onClick={()=>setView("grid")}>Kalender</button>
      </div>

      <div className="filter-row">
        <select value={clientFilter} onChange={e=>setClientFilter(e.target.value)}>
          <option value="">Semua Client</option>
          {clientOptions.map(c=><option key={c} value={c}>{c}</option>)}
        </select>
      </div>

      {view === "agenda" ? (
        <div>
          {agendaDays.length===0 && <div className="empty">Tidak ada agenda di bulan ini.</div>}
          {agendaDays.map(({iso, evs, hol}) => {
            const d = new Date(iso+"T00:00:00");
            const label = d.toLocaleDateString("id-ID",{weekday:"long",day:"numeric",month:"long"});
            return (
              <div key={iso} className="agenda-day">
                <div className={"agenda-date" + (hol ? " hol":"")}>
                  {label}{iso===today ? " · HARI INI" : ""}{hol ? ` · ${hol}` : ""}
                </div>
                {evs.map(ev => {
                  const flag = getFlag(ev, today);
                  return (
                    <button key={ev.id} className="card card-btn" style={{padding:10,marginBottom:6,boxShadow:"none",border:"1px solid var(--line)"}}
                      onClick={()=>setQuickView(ev)}>
                      <div style={{fontSize:10.5,color:"var(--gold)",fontWeight:800}}>{ev.client} · {ev.category}</div>
                      <div style={{fontSize:13,fontWeight:700,margin:"2px 0"}}>{calLabel(ev)}</div>
                      <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>
                        <span className={"badge " + flag.cls}>{flag.label}</span>
                        <span className={"badge " + statusCls(ev.status)}>{ev.status}</span>
                      </div>
                    </button>
                  );
                })}
                {evs.length===0 && <div style={{fontSize:12,color:"var(--grey)",paddingBottom:6}}>Libur — tidak ada agenda.</div>}
              </div>
            );
          })}
        </div>
      ) : (
        <div className="cal-grid">
          {dayHeads.map(d=><div key={d} className="cal-head">{d}</div>)}
          {cells.map((d,i) => {
            const iso = toLocalISO(d);
            const inMonth = d.getMonth()===month;
            const holName = holidayMap[iso];
            const allEvs = eventsByDate[iso] || [];
            const showAsCount = allEvs.length > 2;
            return (
              <div key={i} className={"cal-cell" + (!inMonth?" dim":"") + (holName?" holiday":"") + (iso===today?" today":"")}>
                <div className="cal-date">{d.getDate()}</div>
                {holName && <div className="cal-holname">{holName}</div>}
                {showAsCount ? (
                  <button className="cal-count" onClick={()=>setDayView({iso, tasks:allEvs})}>{allEvs.length} task</button>
                ) : (
                  allEvs.map(ev => (
                    <button key={ev.id} className={"cal-event" + (ev.category==="Billing" ? " billing":"")}
                      onClick={()=>setQuickView(ev)}>{calLabel(ev)}</button>
                  ))
                )}
              </div>
            );
          })}
        </div>
      )}

      <div className="legend">
        <span><span className="dot" style={{background:"var(--blue-bg)"}}></span>Event/Meeting</span>
        <span><span className="dot" style={{background:"var(--green-bg)"}}></span>Penagihan client</span>
        <span><span className="dot" style={{background:"var(--red-bg)"}}></span>Tanggal merah</span>
      </div>

      {dayView && (
        <DayTasksModal iso={dayView.iso} tasks={dayView.tasks} onClose={()=>setDayView(null)}
          onPickTask={(t)=>{ setDayView(null); setQuickView(t); }} />
      )}
      {quickView && <TaskQuickView task={quickView} onClose={()=>setQuickView(null)} />}
    </div>
  );
}

function DayTasksModal({iso, tasks, onClose, onPickTask}){
  const dateLabel = new Date(iso+"T00:00:00").toLocaleDateString("id-ID",{weekday:"long",day:"numeric",month:"long"});
  const today = todayStr();
  return (
    <div className="modal-bg" onMouseDown={e=>{ if(e.target===e.currentTarget) onClose(); }}>
      <div className="modal" style={{maxWidth:420}}>
        <div className="section-title">{dateLabel}</div>
        <div style={{color:"var(--grey)",fontSize:12,marginBottom:12}}>{tasks.length} task di tanggal ini — pilih salah satu untuk lihat detail.</div>
        {tasks.map(t => {
          const flag = getFlag(t, today);
          return (
            <button key={t.id} className="card card-btn" style={{boxShadow:"none",border:"1px solid var(--line)"}}
              onClick={()=>onPickTask(t)}>
              <div style={{fontSize:10.5,color:"var(--gold)",fontWeight:800}}>{t.client} · {t.category}</div>
              <div style={{fontSize:13,fontWeight:700,margin:"2px 0"}}>{calLabel(t)}</div>
              <div style={{display:"flex",gap:5}}>
                <span className={"badge " + flag.cls}>{flag.label}</span>
                <span className={"badge " + priorityCls(t.overallPriority)}>{t.overallPriority}</span>
              </div>
            </button>
          );
        })}
        <div className="modal-actions">
          <button className="btn btn-outline" style={{width:"100%"}} onClick={onClose}>Tutup</button>
        </div>
      </div>
    </div>
  );
}

function TaskQuickView({task, onClose}){
  const flag = getFlag(task, todayStr());
  return (
    <div className="modal-bg" onMouseDown={e=>{ if(e.target===e.currentTarget) onClose(); }}>
      <div className="modal" style={{maxWidth:420}}>
        <div style={{fontSize:11,color:"var(--gold)",fontWeight:800}}>{task.client} · {task.category}</div>
        <div style={{display:"flex",gap:6,margin:"6px 0 12px",flexWrap:"wrap"}}>
          <span className={"badge " + flag.cls}>{flag.label}</span>
          <span className={"badge " + statusCls(task.status)}>{task.status}</span>
        </div>
        <div style={{fontSize:13,color:"var(--navy)",lineHeight:1.8,marginBottom:10}}>
          <div><b>PIC:</b> {task.pics.length ? task.pics.join(", ") : "Belum ada PIC"}</div>
          <div><b>Start:</b> {fmtDate(task.startDate)} &nbsp; <b>Due:</b> {fmtDate(task.dueDate)}</div>
          <div><b>Progress rata-rata:</b> {task.avgProgress}%</div>
        </div>
        <div style={{fontWeight:700,fontSize:13,marginBottom:6}}>Sub-Task ({task.subtasks.length})</div>
        {task.subtasks.map(s => (
          <div key={s._id} style={{background:"var(--offwhite)",borderRadius:8,padding:8,marginBottom:6}}>
            <div style={{fontSize:13,fontWeight:600}}>{s.description || "-"}</div>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:4}}>
              <span className={"badge " + priorityCls(s.priority)}>{s.priority}</span>
              <span style={{fontSize:11,color:"var(--grey)"}}>{s.progress}%</span>
            </div>
          </div>
        ))}
        {task.notes && <div style={{fontSize:12,marginTop:8}}><b>Notes:</b> {task.notes}</div>}
        <div className="modal-actions">
          <button className="btn btn-gold" style={{width:"100%"}} onClick={onClose}>Tutup</button>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
