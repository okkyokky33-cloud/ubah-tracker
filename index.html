function PostingHistoryView({tasks, projectNames, dailyLog, month, setMonth,
  onSaveDailyLog, isAdmin, onDeleteDailyLog, busy}){
  const [client, setClient] = useState("");
  const [showLogModal, setShowLogModal] = useState(false);
  const [waOpen, setWaOpen] = useState(false);
  const [copyMsg, setCopyMsg] = useState("");

  const content = useMemo(() => tasks.filter(t => isPostableTask(t) && t.status==="Done" && t.postedAt
    && (t.postedAt||"").slice(0,7)===month && (!client || t.client===client)), [tasks, month, client]);
  const logEntries = useMemo(() => dailyLog
    .filter(d => (!client || d.client===client))
    .sort((a,b)=>(b.date||"").localeCompare(a.date||"")), [dailyLog, client]);

  // Ringkasan bulanan — angka inilah yang biasanya ditanya client.
  const summary = useMemo(() => {
    const byType = {};
    let spend = 0, campaigns = 0;
    logEntries.forEach(e => (e.campaigns||[]).forEach(c => {
      const rt = resultOf(c);
      if(!byType[rt]) byType[rt] = { total:0, costSum:0, costCount:0 };
      byType[rt].total += Number(c.totalLeads)||0;
      if(Number(c.costPerLead) > 0){ byType[rt].costSum += Number(c.costPerLead); byType[rt].costCount += 1; }
      spend += Number(c.budgetUsed)||0;
      campaigns += 1;
    }));
    const types = Object.keys(byType).map(rt => ({
      type: rt, total: byType[rt].total,
      avgCost: byType[rt].costCount ? Math.round(byType[rt].costSum / byType[rt].costCount) : 0,
    })).sort((a,b) => b.total - a.total);
    return { types, spend, campaigns };
  }, [logEntries]);

  // Teks WA mengikuti tanggal terbaru yang ada di filter aktif, bukan selalu hari ini.
  const waDate = logEntries.length ? logEntries[0].date : todayStr();
  const waEntries = useMemo(() => logEntries.filter(e => e.date === waDate), [logEntries, waDate]);
  const waText = useMemo(() => buildDailyWAText(waDate, waEntries), [waDate, waEntries]);

  function copyWA(){
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(waText)
        .then(()=>setCopyMsg("Tersalin. Tinggal tempel di WhatsApp."))
        .catch(()=>setCopyMsg("Salin otomatis gagal — pilih teksnya manual di bawah."));
    } else {
      setCopyMsg("Salin otomatis tidak tersedia — pilih teksnya manual di bawah.");
    }
    setWaOpen(true);
  }

  return (
    <div>
      <div className="card" style={{background:"var(--brand-gradient)",color:"#fff"}}>
        <div style={{fontWeight:800,fontSize:14,marginBottom:4}}>Log Harian Ads</div>
        <div style={{fontSize:12,opacity:.92}}>Ganti kebiasaan ketik manual di WA — isi angka ads di sini, kapan saja, untuk client mana saja.</div>
        <div style={{display:"flex",gap:8,marginTop:10,flexWrap:"wrap"}}>
          <button className="btn btn-onbrand" onClick={()=>setShowLogModal(true)}>+ Update Ads</button>
          <button className="btn" style={{background:"transparent",color:"#fff",border:"1px solid #fff"}} onClick={copyWA}>Salin ke WA</button>
        </div>
      </div>

      <div className="card">
        <div className="row2">
          <div className="field" style={{marginBottom:0}}>
            <label htmlFor="h-client">Client</label>
            <select id="h-client" value={client} onChange={e=>setClient(e.target.value)}>
              <option value="">Semua Client</option>
              {projectNames.map(c=><option key={c} value={c}>{c}</option>)}
            </select>
          </div>
          <div className="field" style={{marginBottom:0}}>
            <label htmlFor="h-month">Bulan</label>
            <input id="h-month" type="month" value={month} onChange={e=>setMonth(e.target.value)} />
          </div>
        </div>
      </div>

      {summary.campaigns > 0 && (
        <div className="card">
          <div className="section-title">Ringkasan Bulan Ini</div>
          {summary.types.map(x => (
            <div key={x.type} style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",
              gap:10,padding:"9px 0",borderBottom:"1px solid var(--line-soft)"}}>
              <span style={{fontSize:13.5,fontWeight:600}}>{x.type}</span>
              <span style={{display:"flex",alignItems:"baseline",gap:12,flexShrink:0}}>
                <span className="meta-line">{fmtIDR(x.avgCost)} / {x.type}</span>
                <span style={{fontSize:17,fontWeight:660,fontVariantNumeric:"tabular-nums"}}>
                  {x.total.toLocaleString("id-ID")}
                </span>
              </span>
            </div>
          ))}
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",gap:10,paddingTop:11}}>
            <span style={{fontSize:13.5,fontWeight:600}}>Budget terpakai</span>
            <span style={{fontSize:17,fontWeight:660}}>{fmtIDR(summary.spend)}</span>
          </div>
          <div className="locked-note" style={{marginTop:10,marginBottom:0}}>
            Dipisah per jenis result — leads dan engagement tidak bisa dijumlahkan jadi satu angka.
          </div>
        </div>
      )}

      <div className="section-title">Log Harian Ads ({logEntries.length})</div>
      {logEntries.length===0 && <div className="empty">Belum ada update harian di periode ini.</div>}
      {logEntries.map(entry => {
        const camps = entry.campaigns || [];
        return (
          <div key={entry.id} className="card">
            <div style={{display:"flex",justifyContent:"space-between",marginBottom:4,alignItems:"center"}}>
              <span className="client-line">{entry.client}</span>
              <div style={{display:"flex",gap:8,alignItems:"center"}}>
                <span style={{fontSize:11,color:"var(--ink-3)"}}>{fmtDate(entry.date)}</span>
                {isAdmin && <button className="btn btn-outline btn-sm" disabled={busy} onClick={()=>onDeleteDailyLog(entry.id)}>Hapus</button>}
              </div>
            </div>
            {camps.map((c,i) => (
              <div key={i} style={{fontSize:12,marginBottom:5,paddingBottom:5,borderBottom: i<camps.length-1 ? "1px dashed var(--line)" : "none"}}>
                <div style={{display:"flex",justifyContent:"space-between",fontWeight:700,gap:8}}>
                  <span>{c.name || "(tanpa nama)"}{c.active===false ? " — OFF" : ""}</span>
                  <span style={{color:"var(--ink-3)",fontWeight:400,whiteSpace:"nowrap"}}>{c.endDate ? daysLeftLabel(c.endDate) : ""}</span>
                </div>
                <div style={{color:"var(--ink-3)"}}>
                  {fmtIDR(c.costPerLead)} / {resultOf(c)} · {c.totalLeads||0} {resultOf(c)}
                  {(c.budgetUsed||c.totalBudget) ? ` · Budget ${fmtIDR(c.budgetUsed)} / ${fmtIDR(c.totalBudget)}` : ""}
                </div>
              </div>
            ))}
          </div>
        );
      })}

      <div className="section-title">Konten Tayang ({content.length})</div>
      {content.length===0 && <div className="empty">Belum ada konten yang tayang di periode ini.</div>}
      {content.map(t => (
        <div key={t.id} className="card">
          <div className="client-line">{t.client}</div>
          <div style={{fontSize:13,fontWeight:700,margin:"3px 0"}}>{taskTitle(t)}</div>
          <div style={{fontSize:11,color:"var(--ink-3)",marginBottom:4}}>
            Tayang {fmtDate(t.postedAt)}
            {t.postingDate && (() => {
              const late = daysBetween(t.postingDate, t.postedAt);
              return late > 0
                ? <span className="badge badge-red" style={{marginLeft:6}}>TELAT {late} HARI</span>
                : <span className="badge badge-green" style={{marginLeft:6}}>TEPAT WAKTU</span>;
            })()}
          </div>
          {t.livePostLink && <ExternalLink href={t.livePostLink} style={{fontSize:12,color:"var(--brand)",wordBreak:"break-all"}}>{t.livePostLink}</ExternalLink>}
          {t.previewLink && (
            <div style={{fontSize:11,marginTop:4}}>
              Preview: <ExternalLink href={t.previewLink} style={{color:"var(--ink-3)",wordBreak:"break-all"}}>{t.previewLink}</ExternalLink>
            </div>
          )}
        </div>
      ))}

      {showLogModal && (
        <DailyLogModal projectNames={projectNames} dailyLog={dailyLog}
          onSave={onSaveDailyLog} onClose={()=>setShowLogModal(false)} defaultClient={client} busy={busy} />
      )}

      {waOpen && (
        <div className="modal-bg" onMouseDown={e=>{ if(e.target===e.currentTarget) setWaOpen(false); }}>
          <div className="modal">
            <div className="section-title">Format WA — {fmtDate(waDate)}</div>
            {copyMsg && <div style={{fontSize:12,color:"var(--green)",marginBottom:8,fontWeight:700}}>{copyMsg}</div>}
            {waEntries.length===0 && <div className="locked-note">Belum ada log di periode yang dipilih.</div>}
            <textarea readOnly rows="16" value={waText}
              style={{width:"100%",padding:10,border:"1px solid var(--line)",borderRadius:8,fontSize:12,fontFamily:"monospace"}}
              onFocus={e=>e.target.select()} />
            <div className="modal-actions">
              <button className="btn btn-gold" style={{width:"100%"}} onClick={()=>setWaOpen(false)}>Tutup</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function DailyLogModal({projectNames, dailyLog, onSave, onClose, defaultClient, busy}){
  const [client, setClient] = useState(defaultClient || "");
  const [date, setDate] = useState(todayStr());
  const [err, setErr] = useState("");
  const existing = dailyLog.find(d => d.date===date && d.client===client);

  const [rows, setRows] = useState([emptyAdLogRow()]);
  useEffect(() => {
    const found = dailyLog.find(d => d.date===date && d.client===client);
    setRows((found && Array.isArray(found.campaigns) && found.campaigns.length)
      ? found.campaigns.map(c=>({...emptyAdLogRow(), ...c, _id: uid()}))
      : [emptyAdLogRow()]);
  }, [client, date, dailyLog]);

  function setRow(i,k,v){ setRows(r => r.map((row,idx)=> idx===i ? {...row,[k]:v} : row)); }
  function addRow(){ setRows(r => [...r, emptyAdLogRow()]); }
  function removeRow(i){ setRows(r => r.length>1 ? r.filter((_,idx)=>idx!==i) : r); }

  async function submit(){
    setErr("");
    if(!client){ setErr("Pilih client dulu."); return; }
    if(!date){ setErr("Pilih tanggal dulu."); return; }
    const campaigns = rows.filter(r=>(r.name||"").trim() || r.costPerLead || r.totalLeads)
      .map(r=>({ name:(r.name||"").trim(), resultType: r.resultType || "Leads",
        costPerLead:Math.max(0,Number(r.costPerLead)||0),
        totalLeads:Math.max(0,Number(r.totalLeads)||0), budgetUsed:Math.max(0,Number(r.budgetUsed)||0),
        totalBudget:Math.max(0,Number(r.totalBudget)||0), endDate:r.endDate||"", active:r.active!==false }));
    if(campaigns.length===0){ setErr("Isi minimal 1 campaign."); return; }
    const ok = await onSave(client, date, campaigns);
    if(ok) onClose();
  }

  return (
    <div className="modal-bg" onMouseDown={e=>{ if(e.target===e.currentTarget) onClose(); }}>
      <div className="modal">
        <div className="section-title">Update Ads</div>
        {err && <div className="login-error">{err}</div>}
        <div className="row2">
          <div className="field">
            <label htmlFor="dl-client">Client</label>
            <select id="dl-client" value={client} onChange={e=>setClient(e.target.value)}>
              <option value="">Pilih client</option>
              {projectNames.map(c=><option key={c} value={c}>{c}</option>)}
            </select>
          </div>
          <div className="field">
            <label htmlFor="dl-date">Tanggal</label>
            <input id="dl-date" type="date" value={date} max={todayStr()} onChange={e=>setDate(e.target.value)} />
          </div>
        </div>
        {existing && <div className="locked-note">Sudah ada update untuk {client} di tanggal ini — isian di bawah otomatis terisi datanya. Simpan lagi untuk memperbarui.</div>}

        {rows.map((r,i) => (
          <div key={r._id} style={{background:"var(--offwhite)",borderRadius:8,padding:10,marginBottom:8}}>
            <div style={{display:"flex",gap:8,alignItems:"flex-start",marginBottom:6}}>
              <input value={r.name} onChange={e=>setRow(i,"name",e.target.value)} placeholder={`Nama campaign #${i+1}`}
                style={{flex:1,padding:8,border:"1px solid var(--line)",borderRadius:6,fontSize:13,fontFamily:"inherit"}} />
              {rows.length>1 && <button className="btn btn-outline btn-sm" onClick={()=>removeRow(i)}>Hapus</button>}
            </div>
            <div style={{marginBottom:6}}>
              <label className="mini-label">
                Jenis Result — sesuai objektif di platform
              </label>
              <select value={r.resultType || "Leads"} onChange={e=>setRow(i,"resultType",e.target.value)}
                className="inp-sm">
                {RESULT_TYPES.map(rt=><option key={rt} value={rt}>{rt}</option>)}
              </select>
            </div>
            <div className="row2" style={{marginBottom:6}}>
              <input type="number" min="0" placeholder={`Cost per ${r.resultType || "Leads"} (IDR)`}
                value={r.costPerLead} onChange={e=>setRow(i,"costPerLead",e.target.value)}
                className="inp-sm" />
              <input type="number" min="0" placeholder={`Total ${r.resultType || "Leads"}`}
                value={r.totalLeads} onChange={e=>setRow(i,"totalLeads",e.target.value)}
                className="inp-sm" />
            </div>
            <div className="row2" style={{marginBottom:6}}>
              <input type="number" min="0" placeholder="Budget Terpakai" value={r.budgetUsed} onChange={e=>setRow(i,"budgetUsed",e.target.value)}
                className="inp-sm" />
              <input type="number" min="0" placeholder="Total Budget" value={r.totalBudget} onChange={e=>setRow(i,"totalBudget",e.target.value)}
                className="inp-sm" />
            </div>
            <div className="row2" style={{alignItems:"center"}}>
              <div>
                <label style={{fontSize:11,color:"var(--ink-3)"}} htmlFor={"ed-"+r._id}>Tanggal Berakhir</label>
                <input id={"ed-"+r._id} type="date" value={r.endDate} onChange={e=>setRow(i,"endDate",e.target.value)}
                  className="inp-sm" />
              </div>
              <label style={{display:"flex",alignItems:"center",gap:6,fontSize:12,fontWeight:400,marginTop:16}}>
                <input type="checkbox" style={{width:"auto"}} checked={r.active!==false} onChange={e=>setRow(i,"active",e.target.checked)} />
                Aktif (hilangkan centang kalau OFF)
              </label>
            </div>
          </div>
        ))}
        <button className="btn btn-outline btn-sm" onClick={addRow}>+ Tambah Campaign</button>

        <ModalActions onCancel={onClose} onSubmit={submit} busy={busy} />
      </div>
    </div>
  );
}

/* ===================== DASHBOARD ===================== */
function Dashboard({tasks, connected, staffNames, onNavigate, myName, onOpenTask,
  standupNotes, onGoStandup, canSeeWorkload, canApprove}){
  const today = todayStr();
  // Hitung mundur ikut berjalan tanpa perlu refresh.
  const [now, setNow] = useState(() => new Date());
  const [showAllToday, setShowAllToday] = useState(false);
  useEffect(() => {
    const id = setInterval(() => setNow(new Date()), 60000);
    return () => clearInterval(id);
  }, []);

  // PM/CS lihat semua yang jatuh tempo hari ini; sisanya cuma bagiannya sendiri.
  // Yang berjam tampil dengan hitung mundur; yang tanpa jam cukup didaftar —
  // kalau semua diberi hitung mundur, lima baris "11 jam lagi" yang sama jadi bising.
  const todayItems = useMemo(() => {
    const list = tasks
      .filter(t => t.status !== "Done" && t.dueDate === today)
      .filter(t => canSeeWorkload ? true : waitingOn(t, myName))
      .map(t => ({ t, timed: /^\d{2}:\d{2}$/.test(t.dueTime||""), due: dueMoment(t) }));
    return list.sort((a,b) => (a.timed === b.timed) ? (a.due - b.due) : (a.timed ? -1 : 1));
  }, [tasks, today, canSeeWorkload, myName]);
  // Hitung flag sekali per task, bukan berulang di tiap filter.
  const flagged = useMemo(() => tasks.map(t => ({ t, flag: getFlag(t, today).label })), [tasks, today]);

  const stats = useMemo(() => {
    const activeList = flagged.filter(x => x.t.status !== "Done");
    const thisMonth = today.slice(0,7);
    return {
      active: activeList.length,
      mine: activeList.filter(x => taskPeople(x.t).includes(myName)).length,
      overdue: activeList.filter(x => x.flag==="OVERDUE").length,
      dueSoon: activeList.filter(x => x.flag==="DUE SOON").length,
      inProgress: activeList.filter(x => x.t.status==="In Progress").length,
      // Pakai completedAt, bukan lastUpdate — supaya task lama yang diedit tidak ikut terhitung.
      doneThisMonth: flagged.filter(x => x.t.status==="Done" && (x.t.completedAt||"").slice(0,7)===thisMonth).length,
    };
  }, [flagged, myName, today]);

  const myTasks = useMemo(() => flagged
    .filter(x => x.t.status!=="Done" && taskPeople(x.t).includes(myName))
    .sort((a,b)=>(a.t.dueDate||"9999").localeCompare(b.t.dueDate||"9999"))
    .slice(0,6), [flagged, myName]);

  const waitingReview = useMemo(() => tasks.filter(t => t.status==="Waiting Review"), [tasks]);
  const waitingClient = useMemo(() => tasks.filter(t => t.status==="Menunggu Approval Klien"), [tasks]);
  // Approved + postable tapi preview kosong = belum di-compile, atau dikembalikan Operations.
  const needCompile = useMemo(() => tasks.filter(t =>
    t.status==="Approved" && isPostableTask(t) && !t.previewLink), [tasks]);
  // Catatan standup yang menyebut nama orang ini — biar tahu tanpa harus buka tab Standup.
  const notesForMe = useMemo(() => (standupNotes||[]).filter(n => myName && noteMentions(n).includes(myName)),
    [standupNotes, myName]);

  const revisionForMe = useMemo(() => tasks.filter(t => t.status==="Revision" && myName
    && (taskPeople(t).includes(myName)
        || (t.deliverables||[]).some(d => d.state==="revision" && d.pic===myName))), [tasks, myName]);

  const workload = useMemo(() => {
    if(!canSeeWorkload) return {};
    const map = {};
    staffNames.forEach(p => map[p] = { active:0, overdue:0, dueSoon:0, highPriority:0 });
    flagged.forEach(({t, flag}) => {
      const people = taskPeople(t);
      if(t.status==="Done" || !people.length) return;
      people.forEach(pic => {
        const w = map[pic];
        if(!w) return;
        w.active += 1;
        if(flag === "OVERDUE") w.overdue += 1;
        if(flag === "DUE SOON") w.dueSoon += 1;
        if(t.anyHighPriority) w.highPriority += 1;
      });
    });
    return map;
  }, [flagged, staffNames, canSeeWorkload]);



  return (
    <div>
      <div className="hint-block">
        <span className="conn-dot" style={{background: connected ? "#1E7B4D":"#B3261E"}}></span>
        {connected ? "Tersambung — data live untuk semua tim" : "Belum tersambung"}
      </div>

      {todayItems.length > 0 && (
        <div className="card">
          <div className="section-title">
            Hari ini · {new Date(today+"T00:00:00").toLocaleDateString("id-ID",{weekday:"long",day:"numeric",month:"long"})}
          </div>
          {todayItems.slice(0, showAllToday ? 99 : 6).map(({t, due, timed}) => {
            const u = timed ? urgencyOfMoment(due, now) : "";
            const hh = timed ? (String(due.getHours()).padStart(2,"0") + ":" + String(due.getMinutes()).padStart(2,"0")) : "";
            return (
              <button key={t.id} className={"today-row" + (u==="late" ? " today-late" : u==="soon" ? " today-soon" : "")}
                onClick={()=>onOpenTask(t)}>
                <span className="today-time">{timed ? hh : "·"}</span>
                <span style={{flex:1,minWidth:0}}>
                  <span style={{display:"block",fontSize:13.5,fontWeight:600}}>{taskTitle(t)}</span>
                  <span className="meta-line">
                    {t.client}
                    {(() => {
                      const mine = (t.deliverables||[]).filter(d => canSeeWorkload
                        ? (d.state==="pending" || d.state==="revision")
                        : (d.pic===myName && (d.state==="pending" || d.state==="revision")));
                      if(!mine.length) return "";
                      return " · " + mine.map(d => canSeeWorkload ? `${d.label} (${d.pic||"?"})` : d.label).join(", ");
                    })()}
                  </span>
                </span>
                {timed && (
                  <span className={"badge " + (u==="late" ? "badge-red" : u==="soon" ? "badge-yellow" : "badge-grey")}
                    style={{flexShrink:0}}>{countdownLabel(due, now)}</span>
                )}
              </button>
            );
          })}
          {todayItems.length > 6 && !showAllToday && (
            <button className="btn btn-outline btn-sm" style={{marginTop:10}} onClick={()=>setShowAllToday(true)}>
              Lihat {todayItems.length - 6} lainnya
            </button>
          )}
        </div>
      )}

      {(waitingReview.length>0 || waitingClient.length>0 || needCompile.length>0 || revisionForMe.length>0 || notesForMe.length>0) && (
        <div className="card" style={{background:"var(--brand-gradient)",color:"#fff"}}>
          {canApprove && waitingReview.length>0 && (
            <div className="row-mid">
              <div style={{fontSize:13,fontWeight:700}}>{waitingReview.length} task menunggu review</div>
              <button className="btn btn-sm btn-onbrand" onClick={()=>onNavigate("review")}>Lihat</button>
            </div>
          )}
          {canApprove && waitingClient.length>0 && (
            <div className="row-mid">
              <div style={{fontSize:13,fontWeight:700}}>{waitingClient.length} menunggu konfirmasi client</div>
              <button className="btn btn-sm btn-onbrand" onClick={()=>onNavigate("client")}>Lihat</button>
            </div>
          )}
          {canApprove && needCompile.length>0 && (
            <div className="row-mid">
              <div style={{fontSize:13,fontWeight:700}}>{needCompile.length} perlu di-compile jadi preview</div>
              <button className="btn btn-sm btn-onbrand" onClick={()=>onNavigate("compile")}>Lihat</button>
            </div>
          )}
          {revisionForMe.length>0 && (
            <div className="row-mid" style={{marginBottom: notesForMe.length>0 ? 8 : 0}}>
              <div style={{fontSize:13,fontWeight:700}}>{revisionForMe.length} revisi untuk kamu</div>
              <button className="btn btn-sm btn-onbrand" onClick={()=>onNavigate("myrevision")}>Lihat</button>
            </div>
          )}
          {notesForMe.length>0 && (
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:8}}>
              <div style={{fontSize:13,fontWeight:700}}>{notesForMe.length} catatan standup menyebut kamu</div>
              <button className="btn btn-sm btn-onbrand" onClick={onGoStandup}>Lihat</button>
            </div>
          )}
        </div>
      )}

      <div className="card">
        <div className="section-title">Task saya ({stats.mine})</div>
        {myTasks.length===0 && <div style={{color:"var(--ink-3)",fontSize:13}}>Tidak ada task aktif untuk kamu.</div>}
        {myTasks.map(({t}) => {
          const urg = urgencyBadge(t, today);
          return (
            <button key={t.id} className="manage-row card-btn" style={{background:"none",padding:"10px 0"}} onClick={()=>onOpenTask(t)}>
              <div style={{minWidth:0}}>
                <div style={{fontSize:13.5,fontWeight:600}}>{taskTitle(t)}</div>
                <div className="meta-line">{t.client} · Due {fmtDate(t.dueDate)}</div>
              </div>
              <span className={"badge " + (urg ? urg.cls : statusCls(t.status))} style={{flexShrink:0}}>
                {urg ? urg.label : t.status}
              </span>
            </button>
          );
        })}
        {stats.mine > myTasks.length && (
          <button className="btn btn-outline btn-sm" style={{marginTop:8}} onClick={()=>onNavigate("mine")}>
            Lihat semua {stats.mine} task saya
          </button>
        )}
      </div>

      <div className="kpi-grid">
        <button className="kpi" onClick={()=>onNavigate("all")}>
          <div className="num">{stats.active}</div><div className="lbl">Task aktif</div></button>
        <button className="kpi k-late" onClick={()=>onNavigate("overdue")}>
          <div className="num">{stats.overdue}</div><div className="lbl">Overdue</div></button>
        <button className="kpi k-soon" onClick={()=>onNavigate("duesoon")}>
          <div className="num">{stats.dueSoon}</div><div className="lbl">Due soon</div></button>
        <button className="kpi k-brand" onClick={()=>onNavigate("inprogress")}>
          <div className="num">{stats.inProgress}</div><div className="lbl">Dikerjakan</div></button>
        {canSeeWorkload && (
          <div className="kpi k-ok" style={{cursor:"default"}}>
            <div className="num">{stats.doneThisMonth}</div><div className="lbl">Selesai bulan ini</div></div>
        )}

      {canSeeWorkload && (() => {
        const rows = staffNames
          .filter(p => workload[p] && workload[p].active > 0)
          .map(p => ({ name:p, ...workload[p] }))
          .sort((a,b) => b.active - a.active);

        return (
          <div className="card">
            <div className="section-title">Beban kerja · task aktif</div>
            {rows.length === 0 && <div className="meta-line">Belum ada task aktif.</div>}

              <div key={w.name} style={{padding:"9px 0",borderBottom:"1px solid var(--line-soft)"}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",gap:8,marginBottom:5}}>
                  <span style={{fontSize:13.5,fontWeight:600}}>{w.name}</span>
                  <span style={{display:"flex",alignItems:"baseline",gap:8,flexShrink:0}}>
                    {w.overdue > 0 && <span className="badge badge-red">{w.overdue} overdue</span>}
                    <span style={{fontSize:15,fontWeight:660,fontVariantNumeric:"tabular-nums"}}>{w.active}</span>
                  </span>
                </div>
                <div style={{background:"var(--line-soft)",borderRadius:99,height:5,overflow:"hidden"}}>
                  <div style={{width:Math.round(w.active/max*100)+"%",height:"100%",borderRadius:99,
                    background: w.overdue > 0 ? "var(--late)" : "var(--brand)"}}></div>
                </div>
              </div>
            ))}
            <div className="locked-note" style={{marginTop:10,marginBottom:0}}>
              Batang dibandingkan terhadap yang paling banyak, bukan terhadap batas tertentu —
              yang berguna di sini selisihnya, bukan angka mutlaknya.
            </div>
          </div>
        );
      })()}
    </div>
  );
}

/* ===================== TASK LIST ===================== */
function TaskList({tasks, archivedTasks, onEdit, onDelete, onCancel, onRestore, canCancel, isAdmin, staffNames, projectNames,
  filterPic, setFilterPic, filterStatus, setFilterStatus, filterFlag, setFilterFlag, filterClient, setFilterClient,
  filterSpecial, setFilterSpecial}){
  const [q, setQ] = useState("");
  const [sortBy, setSortBy] = useState("terbaru");   // terbaru | deadline
  const [dateMode, setDateMode] = useState("all");   // all | today | yesterday | pick
  const [pickDate, setPickDate] = useState(todayStr());
  const [showDone, setShowDone] = useState(false);
  // Termasuk calon klien yang belum terdaftar, supaya tetap bisa disaring.
  const clientOptions = useMemo(
    () => [...new Set([...projectNames, ...tasks.map(t=>t.client).filter(Boolean)])].sort(),
    [projectNames, tasks]);

  const today = todayStr();
  const yesterday = useMemo(() => {
    const d = new Date(today+"T00:00:00"); d.setDate(d.getDate()-1); return toLocalISO(d);
  }, [today]);
  const targetDate = dateMode==="today" ? today : dateMode==="yesterday" ? yesterday : dateMode==="pick" ? pickDate : null;

  const filtered = useMemo(() => {
    const key = q.trim().toLowerCase();
    const list = tasks.filter(t => {
      if(!showDone && t.status==="Done") return false;
      if(filterPic && !taskPeople(t).includes(filterPic)) return false;
      if(filterClient && t.client!==filterClient) return false;
      if(filterStatus && t.status!==filterStatus) return false;
      if(filterFlag && getFlag(t, today).label!==filterFlag) return false;
      if(filterSpecial === "compile" &&
         !(t.status === "Approved" && isPostableTask(t) && !t.previewLink)) return false;
      if(targetDate && (t.createdAt||"") !== targetDate) return false;
      if(key){
        const hay = [t.client, t.category, t.status, taskPeople(t).join(" "), t.notes,
          ...t.subtasks.map(s=>s.description)].join(" ").toLowerCase();
        if(!hay.includes(key)) return false;
      }
      return true;
    });
    if(sortBy === "deadline"){
      list.sort((a,b)=>(a.dueDate||"9999").localeCompare(b.dueDate||"9999"));
    } else {
      // Task lama belum punya createdAt — dikelompokkan di bawah, tidak hilang.
      list.sort((a,b)=>(b.createdAt||"0000").localeCompare(a.createdAt||"0000"));
    }
    return list;
  }, [tasks, q, filterPic, filterClient, filterStatus, filterFlag, filterSpecial, targetDate, sortBy, showDone, today]);

  const noCreatedAt = useMemo(() => targetDate ? tasks.filter(t=>!t.createdAt && t.status!=="Done").length : 0, [tasks, targetDate]);

  return (
    <div>
      {(() => {
        const label = filterSpecial === "compile" ? "Perlu di-compile jadi preview"
          : filterFlag ? filterFlag
          : (filterStatus && filterPic) ? `${filterStatus} · ${filterPic}`
          : "";
        if(!label) return null;
        return (
          <div style={{background:"var(--brand)",color:"#fff",borderRadius:10,padding:"8px 12px",marginBottom:10,
            fontSize:12.5,display:"flex",justifyContent:"space-between",alignItems:"center",gap:8}}>
            <span>Filter aktif: <b>{label}</b></span>
            <button className="logout-btn" style={{flexShrink:0}}
              onClick={()=>{ setFilterFlag(""); setFilterSpecial(""); setFilterStatus(""); setFilterPic(""); }}>
              Hapus filter
            </button>
          </div>
        );
      })()}

      <div className="filter-row">
        <input placeholder="Cari task, client, PIC..." value={q} onChange={e=>setQ(e.target.value)} style={{flex:1,minWidth:150}} />
      </div>

      <div className="chips">
        <button className={"chip"+(sortBy==="terbaru"?" on":"")} onClick={()=>setSortBy("terbaru")}>Terbaru</button>
        <button className={"chip"+(sortBy==="deadline"?" on":"")} onClick={()=>setSortBy("deadline")}>Deadline</button>
        <span style={{width:8}}></span>
        <button className={"chip"+(dateMode==="all"?" on":"")} onClick={()=>setDateMode("all")}>Semua</button>
        <button className={"chip"+(dateMode==="today"?" on":"")} onClick={()=>setDateMode("today")}>Hari Ini</button>
        <button className={"chip"+(dateMode==="yesterday"?" on":"")} onClick={()=>setDateMode("yesterday")}>Kemarin</button>
        <button className={"chip"+(dateMode==="pick"?" on":"")} onClick={()=>setDateMode("pick")}>Pilih Tanggal</button>
      </div>

      {dateMode==="pick" && (
        <div className="field">
          <label htmlFor="pick-d">Task yang dibuat tanggal</label>
          <input id="pick-d" type="date" value={pickDate} onChange={e=>setPickDate(e.target.value)} />
        </div>
      )}
      {targetDate && noCreatedAt>0 && (
        <div className="locked-note">{noCreatedAt} task lama belum punya catatan tanggal dibuat, jadi tidak muncul di filter tanggal. Pilih "Semua" untuk melihatnya.</div>
      )}

      <div className="filter-row">
        <select value={filterPic} onChange={e=>setFilterPic(e.target.value)}>
          <option value="">Semua PIC</option>
          {staffNames.map(p=><option key={p} value={p}>{p}</option>)}
        </select>
        <select value={filterClient} onChange={e=>setFilterClient(e.target.value)}>
          <option value="">Semua Client</option>
          {clientOptions.map(c=><option key={c} value={c}>{c}</option>)}
        </select>
        <select value={filterStatus} onChange={e=>setFilterStatus(e.target.value)}>
          <option value="">Semua Status</option>
          {STATUSES.map(s=><option key={s} value={s}>{s}</option>)}
        </select>
      </div>

      <label style={{display:"flex",alignItems:"center",gap:8,fontSize:12,color:"var(--ink-3)",marginBottom:12}}>
        <input type="checkbox" style={{width:"auto"}} checked={showDone} onChange={e=>setShowDone(e.target.checked)} />
        Tampilkan juga yang sudah selesai
      </label>

      {filtered.length===0 && <div className="empty">Tidak ada task yang cocok dengan filter ini.</div>}
      {canCancel && archivedTasks.length>0 && (
        <details style={{marginTop:16}}>
          <summary style={{fontSize:12,color:"var(--ink-3)",cursor:"pointer",padding:"6px 0"}}>
            Task dibatalkan ({archivedTasks.length})
          </summary>
          <div style={{paddingTop:8}}>
            <div className="locked-note">Hapus permanen cuma ada di sini — supaya task aktif tidak bisa terhapus karena salah pencet.</div>
            {archivedTasks.map(t => (
              <div key={t.id} className="card" style={{opacity:.72}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:10}}>
                  <div style={{minWidth:0}}>
                    <div className="client-line">{t.client} · {t.category}</div>
                    <div className="task-title">{taskTitle(t)}</div>
                  </div>
                  <div style={{display:"flex",gap:6,flexShrink:0}}>
                    <button className="btn btn-outline btn-sm" onClick={()=>onRestore(t.id)}>Aktifkan lagi</button>
                    <button className="btn btn-outline btn-sm" style={{color:"var(--late)"}}
                      onClick={()=>onDelete(t.id, taskTitle(t))}>Hapus permanen</button>
                  </div>
                </div>
              </div>
            ))}
          </div>
        </details>
      )}
      {filtered.map(t => {
        const urg = urgencyBadge(t, today);
        return (
          <div key={t.id} className={"card" + spineCls(t, today)}>
            <div onClick={()=>onEdit(t)} style={{cursor:"pointer",display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:10}}>
              <div style={{flex:1,minWidth:0}}>
                <div className="client-line">{t.client} · {t.category}</div>
                <div className="task-title">
                  {taskTitle(t)}
                  {t.subtasks.length>1 && <span style={{color:"var(--ink-3)",fontWeight:400}}> +{t.subtasks.length-1} lagi</span>}
                </div>
                <div className="meta-line">
                  {(() => { const ppl = taskPeople(t); return ppl.length ? ppl.join(", ") : "Belum ada PIC"; })()}
                  {" · "}{dueLabel(t)}
                  {!isEventCategory(t.category) && (" · " + t.progress + "%")}
                </div>
              </div>
              <div style={{display:"flex",flexDirection:"column",gap:5,alignItems:"flex-end",flexShrink:0}}>
                {urg && <span className={"badge " + urg.cls}>{urg.label}</span>}
                <span className={"badge " + statusCls(t.status)}>{t.status}</span>
                {t.overallPriority==="High" && <span className="badge badge-grey">High</span>}
              </div>
            </div>
            {(isAdmin || canCancel) && (
              <div style={{marginTop:10,display:"flex",justifyContent:"flex-end",gap:8}}>
                {canCancel && <button className="btn btn-outline btn-sm" onClick={()=>onCancel(t)}>Batalkan</button>}
                {isAdmin && <button className="btn btn-outline btn-sm"
                  onClick={()=>onDelete(t.id, taskTitle(t))}>Hapus</button>}
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

/* ===================== GAMBAR ===================== */
function ImageBoard({taskId, kind, canEdit, onAdd, onRemove, busy, title, hint}){
  const [images, setImages] = useState([]);
  const [loading, setLoading] = useState(true);
  const [err, setErr] = useState("");
  const [working, setWorking] = useState(false);

  // Diambil hanya saat modal dibuka, bukan ikut listener utama.
  useEffect(() => {
    if(!taskId) { setLoading(false); return; }
    const unsub = db.collection(IMAGES_COLLECTION).doc(`${taskId}_${kind}`)
      .onSnapshot(snap => {
        setImages(snap.exists && Array.isArray(snap.data().images) ? snap.data().images : []);
        setLoading(false);
      }, e => { console.error(e); setLoading(false); });
    return () => unsub();
  }, [taskId, kind]);

  async function pick(e){
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if(!file) return;
    setErr(""); setWorking(true);
    try{
      if(!/^image\//.test(file.type)) throw new Error("File harus berupa gambar.");
      const data = await compressImage(file);
      await onAdd(taskId, kind, data, file.name.slice(0,40));
    }catch(ex){ setErr(ex.message || "Gagal memproses gambar."); }
    setWorking(false);
  }

  const totalBytes = images.reduce((n,i)=>n+(i.data||"").length, 0);

  return (
    <div className="stack">
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:8,marginBottom:6}}>
        <div style={{fontSize:12.5,fontWeight:620}}>{title}</div>
        {images.length>0 && <span className="meta-line">{images.length}/{MAX_IMG_COUNT} · {fmtKB(totalBytes)}</span>}
      </div>
      {hint && <div className="locked-note" style={{margin:"0 0 8px"}}>{hint}</div>}
      {err && <div className="login-error">{err}</div>}
      {loading ? <div className="meta-line">Memuat gambar...</div> : (
        <>
          {images.map(img => (
            <div key={img._id} style={{marginBottom:8}}>
              <img src={img.data} alt={img.label||"Gambar"} style={{width:"100%",borderRadius:10,display:"block"}} />
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:8,marginTop:4}}>
                <span className="meta-line">{img.by} · {fmtDate((img.at||"").slice(0,10))}</span>
                {canEdit && <button className="btn btn-outline btn-sm" disabled={busy}
                  onClick={()=>onRemove(taskId, kind, img._id)}>Hapus</button>}
              </div>
            </div>
          ))}
          {images.length===0 && <div className="meta-line">Belum ada gambar.</div>}
          {canEdit && images.length < MAX_IMG_COUNT && (
            <label className="btn btn-outline btn-sm" style={{display:"inline-block",marginTop:6,cursor:"pointer"}}>
              {working ? "Memproses..." : "+ Tambah Gambar"}
              <input type="file" accept="image/*" style={{display:"none"}} onChange={pick} disabled={working||busy} />
            </label>
          )}
        </>
      )}
    </div>
  );
}

/* ===================== TASK MODAL ===================== */
function activityLabel(type){
  return { link:"Link", revision:"Revisi", approval:"Approve Internal", client_approval:"Client Approve",
    client_revision:"Revisi Client", caption:"Caption", preview:"Preview", returned:"Dikembalikan",
    cancelled:"Dibatalkan", restored:"Diaktifkan", posted:"Posting", comment:"Komentar", status:"Status" }[type] || type;
}
const BASIC_STATUSES = ["Not Started","In Progress","On Hold","Done"];

function TaskModal({task, onClose, onSave, busy, isAdmin, myRole, myEmail, myName,
  canApprove, canMarkPosted, allowedCategories, staffList, projectNames, reviewerNames,
  onSubmitDeliverable, onRequestRevisionOn, onApproveDeliverable,
  onClientApprove, onClientRevision, onSendToOperations, onMarkPosted,
  onMarkDoneManual, onReturnToPM, onAddComment, onAddImage, onRemoveImage}){

  const isExisting = !!task.id;
  const [form, setForm] = useState(() => {
    if(isExisting) return task;
    // Role dengan satu kategori langsung dikunci ke kategori itu.
    const cats = (allowedCategories && allowedCategories.length) ? allowedCategories : CATEGORIES;
    const cat = cats.includes(task.category) ? task.category : cats[0];
    return { ...task, category: cat };
  });

  // Ikut perubahan dari orang lain tanpa menimpa yang sedang diketik.
  useEffect(() => {
    if(!isExisting) return;
    setForm(f => ({ ...f, status: task.status, activity: task.activity, version: task.version,
      link: task.link, caption: task.caption, previewLink: task.previewLink,
      deliverables: task.deliverables,
      postingDate: task.postingDate, livePostLink: task.livePostLink,
      postedAt: task.postedAt, internalApprovedBy: task.internalApprovedBy }));
  }, [task.id, task.version, isExisting]);

  const set = (k,v) => setForm(f => ({...f, [k]:v}));
  function setCategory(v){
    setForm(f => ({ ...f, category:v,
      deliverables: isExisting ? f.deliverables : presetDeliverables(v) }));
  }
  // Pilihan PIC disaring sesuai job desk. Yang di luar job desk tetap bisa dipilih
  // tapi dipisah ke grup "Lainnya", supaya tidak asal kepilih.
  const roster = staffList || [];
  function splitByRole(roles){
    const want = roles && roles.length ? roles : null;
    return {
      fit:  want ? roster.filter(x => want.includes(x.role)) : roster,
      rest: want ? roster.filter(x => !want.includes(x.role)) : [],
    };
  }
  function PicSelect({value, roles, disabled, onChange, id}){
    const { fit, rest } = splitByRole(roles);
    return (
      <>
        <select id={id} value={value} onChange={onChange} disabled={disabled} className="inp">
          <option value="">Belum ditentukan</option>
          {fit.length>0 && (
            <optgroup label="Sesuai job desk">
              {fit.map(x=><option key={x.id} value={x.name}>{x.name} — {ROLES[x.role]||"-"}</option>)}
            </optgroup>
          )}
          {rest.length>0 && (
            <optgroup label="Lainnya (di luar job desk)">
              {rest.map(x=><option key={x.id} value={x.name}>{x.name} — {ROLES[x.role]||"-"}</option>)}
            </optgroup>
          )}
        </select>
        {fit.length===0 && roles && roles.length>0 && (
          <div className="locked-note" style={{margin:"5px 0 0"}}>
            Belum ada staff aktif ber-job desk {roles.map(r=>ROLES[r]).join(" / ")}. Minta Admin mengaktifkan dulu.
          </div>
        )}
      </>
    );
  }

  const setDeliv = (i,k,v) => setForm(f => ({...f,
    deliverables: f.deliverables.map((d,idx)=> idx===i ? {...d,[k]:v} : d)}));
  const addDeliv = () => setForm(f => ({...f, deliverables:[...f.deliverables, emptyDeliverable("","")]}));
  const removeDeliv = (i) => setForm(f => ({...f, deliverables: f.deliverables.filter((_,idx)=>idx!==i)}));
  const structLocked = isExisting && !isAdmin;
  const isPaidAds = form.category === "Paid Ads";
  const isProduction = form.category === "Production";
  const isMeeting = form.category === "Meeting";
  const isCatatan = form.category === "Catatan Client";
  const isEvent = isEventCategory(form.category);
  const isReview = isReviewCategory(form.category);
  const isContent = isPostableTask(form);
  const isGraphicDesign = form.category === "Graphic Design";
  const allowedCats = (allowedCategories && allowedCategories.length) ? allowedCategories : CATEGORIES;
  const categoryOptions = isExisting ? CATEGORIES : allowedCats;
  const singleCategory = !isExisting && allowedCats.length === 1;

  // Konfirmasi client: PM + Admin saja. Content Strategist tidak, karena yang
  // berkomunikasi ke client adalah PM — dialah yang tahu client bilang apa.
  const canClientGate = isAdmin || myRole === "pm";

  // Client di luar daftar resmi = calon klien. Task lama yang clientnya sudah diarsipkan
  // juga masuk mode ini supaya namanya tidak hilang saat disimpan ulang.
  const [prospectMode, setProspectMode] = useState(
    () => !!(task.client && !projectNames.includes(task.client)));
  const [delivDraft, setDelivDraft] = useState({});
  const [revNotes, setRevNotes] = useState({});
  const [reviewer, setReviewer] = useState(task.reviewerTarget || "");
  const [reviewNote, setReviewNote] = useState("");
  const [previewDraft, setPreviewDraft] = useState(task.previewLink || "");
  const [postDateDraft, setPostDateDraft] = useState(task.postingDate || "");
  const [liveLinkDraft, setLiveLinkDraft] = useState("");
  const [commentDraft, setCommentDraft] = useState("");
  const [returnNote, setReturnNote] = useState("");
  const [showReturn, setShowReturn] = useState(false);
  const [localErr, setLocalErr] = useState("");

  function guardLink(v){
    if(!safeUrl(v)){ setLocalErr("Link tidak valid. Pakai alamat lengkap, contoh: https://drive.google.com/..."); return false; }
    setLocalErr(""); return true;
  }
  function togglePic(name){
    setForm(f => ({ ...f, pics: f.pics.includes(name) ? f.pics.filter(p=>p!==name) : [...f.pics, name] }));
  }
  const setAdItem = (i,k,v) => setForm(f => ({...f, adItems: f.adItems.map((a,idx)=> idx===i ? {...a,[k]:v} : a)}));
  const addAdItem = () => setForm(f => ({...f, adItems: [...f.adItems, emptyAdItem()]}));
  const removeAdItem = (i) => setForm(f => f.adItems.length>1 ? {...f, adItems: f.adItems.filter((_,idx)=>idx!==i)} : f);

  return (
    <div className="modal-bg" onMouseDown={e=>{ if(e.target===e.currentTarget) onClose(); }}>
      <div className="modal" role="dialog" aria-modal="true">
        <div className="section-title">{isExisting ? "Edit Pengerjaan" : "Pengerjaan Baru"}</div>
        {localErr && <div className="login-error">{localErr}</div>}
        {structLocked && <div className="locked-note">Client, Kategori, & PIC dikunci — cuma Admin yang bisa ubah. Kamu tetap bisa tambah/edit sub-task, progress, dan Notes.</div>}

        <div className="field">
          <label htmlFor="tm-title">Judul Assignment</label>
          <input id="tm-title" value={form.title} onChange={e=>set("title",e.target.value)}
            placeholder="mis. Reels Promo Serum Vitamin C" />
        </div>

        <div className="field">
          <label htmlFor="tm-client">Client / Project</label>
          {prospectMode ? (
            <>
              <input id="tm-client" value={form.client} onChange={e=>set("client",e.target.value)}
                disabled={structLocked} placeholder="Nama calon klien" autoFocus />
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:8,marginTop:6}}>
                <span className="locked-note" style={{margin:0}}>
                  Belum masuk daftar client. Kalau nanti jadi, Admin tinggal menambahkannya di Kelola.
                </span>
                {!structLocked && (
                  <button className="btn btn-outline btn-sm" style={{flexShrink:0}}
                    onClick={()=>{ setProspectMode(false); set("client",""); }}>Batal</button>
                )}
              </div>
            </>
          ) : (
            <select id="tm-client" value={form.client}
              onChange={e=>{
                if(e.target.value === "__prospect__"){ setProspectMode(true); set("client",""); }
                else set("client", e.target.value);
              }} disabled={structLocked}>
              <option value="">Pilih client</option>
              {projectNames.map(c=><option key={c} value={c}>{c}</option>)}
              {form.client && !projectNames.includes(form.client) && <option value={form.client}>{form.client}</option>}
              <option value="__prospect__">+ Calon klien (belum terdaftar)</option>
            </select>
          )}
        </div>

        <div className="field">
          <label htmlFor="tm-cat">Kategori</label>
          {singleCategory ? (
            <>
              <div><span className="badge badge-purple">{form.category}</span></div>
              <div className="locked-note" style={{marginTop:6}}>Sesuai job desk kamu, task yang bisa dibuat cuma kategori ini.</div>
            </>
          ) : (
            <select id="tm-cat" value={form.category} onChange={e=>setCategory(e.target.value)} disabled={structLocked}>
              {categoryOptions.map(c=><option key={c} value={c}>{c}</option>)}
              {isExisting && !categoryOptions.includes(form.category) && <option value={form.category}>{form.category}</option>}

        {isReview ? (
          <div className="locked-note" style={{marginTop:-4}}>

                    Itu satu-satunya yang dilihat Operations.
                  </div>
                  <label htmlFor="tm-prev">Link Preview (hasil compile)</label>
                  <input id="tm-prev" value={previewDraft} onChange={e=>setPreviewDraft(e.target.value)}
                    placeholder="https://drive.google.com/..." />
                  <label htmlFor="tm-pdate" style={{marginTop:8}}>Tanggal Posting (target buat Operations)</label>
                  <input id="tm-pdate" type="date" value={postDateDraft} onChange={e=>setPostDateDraft(e.target.value)} />
                  <button className="btn btn-gold btn-sm" style={{marginTop:8,width:"100%"}}
                    disabled={!previewDraft.trim() || busy}
                    onClick={()=>{ if(guardLink(previewDraft)) onSendToOperations(task.id, previewDraft.trim(), postDateDraft); }}>
                    Kirim ke Operations
                  </button>
                  {!previewDraft.trim() && <div className="locked-note" style={{marginTop:6}}>Link preview wajib diisi sebelum bisa dikirim.</div>}
                </div>
              ) : (
                <div className="locked-note">Menunggu di-compile oleh PM / Content Strategist.</div>
              )
            )}
            {form.status==="Approved" && !isContent && (
              <div>
                <button className="btn btn-gold btn-sm" disabled={busy} onClick={()=>onMarkDoneManual(task.id)}>Tandai Selesai (Done)</button>
                {isGraphicDesign && canApprove && (
                  <>
                    <button className="btn btn-outline btn-sm" style={{marginLeft:8}} disabled={busy}
                      onClick={()=>onSave({ ...form, forPosting:true })}>Ternyata perlu diposting</button>
                    <div className="locked-note" style={{marginTop:6}}>
                      Tekan itu kalau desain ini harus tayang di sosmed — nanti muncul kolom link preview.
                    </div>
                  </>
                )}
              </div>
            )}

            {form.status==="Ready to Post" && (
              <div>
                {form.previewLink && (
                  <div style={{fontSize:12,marginBottom:6}}>
                    <b>Preview:</b> <ExternalLink href={form.previewLink} className="link-brand">{form.previewLink}</ExternalLink>
                  </div>
                )}
                {form.postingDate && (
                  <div style={{fontSize:12,marginBottom:6}}><b>Target tayang:</b> {fmtDate(form.postingDate)}</div>
                )}
                {form.caption && (
                  <details style={{marginBottom:8}}>
                    <summary className="disc">Caption lama (dari versi sebelumnya)</summary>
                    <div style={{fontSize:12,background:"var(--offwhite)",borderRadius:8,padding:9,whiteSpace:"pre-wrap",marginTop:6}}>{form.caption}</div>
                  </details>
                )}
                {canMarkPosted ? (
                  <>
                    <div className="field">
                      <label htmlFor="tm-live">Link Postingan Live</label>
                      <input id="tm-live" value={liveLinkDraft} onChange={e=>setLiveLinkDraft(e.target.value)}
                        placeholder="https://instagram.com/p/..." />
                    </div>
                    <button className="btn btn-gold btn-sm" disabled={!liveLinkDraft.trim() || busy}
                      onClick={()=>{ if(guardLink(liveLinkDraft)) onMarkPosted(task.id, liveLinkDraft.trim()); }}>
                      Tandai Sudah Posting
                    </button>
                    {!showReturn ? (
                      <button className="btn btn-outline btn-sm" style={{marginLeft:8}} onClick={()=>setShowReturn(true)}>
                        Ada yang salah — Kembalikan ke PM
                      </button>
                    ) : (
                      <div className="field" style={{marginTop:10}}>
                        <label htmlFor="tm-ret">Apa yang salah? (wajib diisi)</label>
                        <textarea id="tm-ret" rows="2" value={returnNote} onChange={e=>setReturnNote(e.target.value)}
                          placeholder="mis. file preview corrupt / caption salah client / versi lama" />
                        <div className="locked-note" style={{marginTop:6}}>
                          Task balik ke PM/CS untuk di-compile ulang. Link preview lama dihapus, caption tetap tersimpan.
                        </div>
                        <div style={{display:"flex",gap:8,marginTop:6}}>
                          <button className="btn btn-outline btn-sm" onClick={()=>{setShowReturn(false); setReturnNote("");}}>Batal</button>
                          <button className="btn btn-gold btn-sm" disabled={!returnNote.trim() || busy}
                            onClick={()=>onReturnToPM(task.id, returnNote)}>Kembalikan ke PM</button>
                        </div>
                      </div>
                    )}
                  </>
                ) : (
                  <div className="locked-note">Menunggu ditandai tayang oleh PM / Content Strategist / Operations.</div>
                )}
              </div>
            )}

            {form.status==="Done" && form.livePostLink && (
              <div style={{fontSize:12,marginBottom:8}}>
                Live: <ExternalLink href={form.livePostLink} style={{wordBreak:"break-all",color:"var(--brand)"}}>{form.livePostLink}</ExternalLink>
              </div>
            )}

            <div className="field" style={{marginTop:10}}>
              <label htmlFor="tm-cm">Tambah Komentar</label>
              <textarea id="tm-cm" rows="2" value={commentDraft} onChange={e=>setCommentDraft(e.target.value)} />
              <button className="btn btn-outline btn-sm" style={{marginTop:6}} disabled={!commentDraft.trim() || busy}
                onClick={()=>onAddComment(task.id, commentDraft)}>Kirim Komentar</button>
            </div>
          </>
        )}

        {(!isEvent || isCatatan) && (
          <div className="field" style={{marginTop:12}}>
            <label htmlFor="tm-notes">{isCatatan ? "Isi Catatan" : "Notes / Blocker"}</label>
            <textarea id="tm-notes" rows={isCatatan?3:2} value={form.notes} onChange={e=>set("notes",e.target.value)}
              placeholder={isCatatan ? "mis. Confirm dulu jadi/tidak pakai jasa kita untuk shooting" : ""} />
          </div>
        )}
        {(!isEvent || isCatatan) && (
        <div className="field row-inline">
          <input type="checkbox" id="showcal" style={{width:"auto"}}
            checked={(isPaidAds||isProduction||isMeeting) ? true : form.showOnCalendar}
            disabled={isPaidAds||isProduction||isMeeting} onChange={e=>set("showOnCalendar",e.target.checked)} />
          <label htmlFor="showcal" style={{margin:0}}>Tampilkan di Calendar{isPaidAds ? " (wajib)" : ""}</label>
        </div>
        )}

        <div className="modal-actions">
          <button className="btn btn-outline" onClick={onClose}>Batal</button>
          <button className="btn btn-gold" onClick={()=>onSave(form)} disabled={busy}>{busy ? "Menyimpan..." : "Simpan"}</button>
        </div>
      </div>
    </div>
  );
}

/* ===================== CALENDAR ===================== */
function CalendarView({tasks, calMonth, setCalMonth, holidayMap, onOpenTask}){
  const year = calMonth.getFullYear(), month = calMonth.getMonth();
  const monthLabel = calMonth.toLocaleDateString("id-ID",{month:"long",year:"numeric"});
  const [quickView, setQuickView] = useState(null);
  const [dayView, setDayView] = useState(null);
  const [clientFilter, setClientFilter] = useState("");
  // Di layar HP, grid 7 kolom membuat tulisan terlalu kecil — agenda jadi bawaan.
  const [view, setView] = useState(() => (window.innerWidth < 640 ? "agenda" : "grid"));
  const today = todayStr();

  const monthTasks = useMemo(() => tasks
    .filter(t => t.showOnCalendar)
    .filter(t => !clientFilter || t.client===clientFilter), [tasks, clientFilter]);

  // Jadwal tayang muncul otomatis tanpa perlu centang "Tampilkan di Calendar".
  const postTasks = useMemo(() => tasks
    .filter(t => t.postingDate && t.status !== "Done")
    .filter(t => !clientFilter || t.client===clientFilter), [tasks, clientFilter]);

  const clientOptions = useMemo(() =>
    [...new Set(tasks.filter(t=>t.showOnCalendar || t.postingDate).map(t=>t.client))].sort(), [tasks]);

  // Dua sumber tanggal: deadline kerjaan (perlu centang) dan jadwal tayang (otomatis).
  const eventsByDate = useMemo(() => {
    const map = {};
    const push = (d, t, kind) => { if(!d) return; if(!map[d]) map[d] = []; map[d].push({t, kind, key: t.id+"_"+kind}); };
    monthTasks.forEach(t => push(eventDate(t), t, t.category==="Billing" ? "billing" : "work"));
    postTasks.forEach(t => push(t.postingDate, t, "post"));
    return map;
  }, [monthTasks, postTasks]);

  const gridStart = new Date(year, month, 1);
  gridStart.setDate(gridStart.getDate() - gridStart.getDay());
  const lastDay = new Date(year, month+1, 0).getDate();
  const rowsNeeded = Math.ceil((new Date(year, month, 1).getDay() + lastDay) / 7);
  const cells = [];
  for(let i=0;i<rowsNeeded*7;i++){
    const d = new Date(gridStart);
    d.setDate(gridStart.getDate()+i);
    cells.push(d);
  }

  // Agenda: hanya tanggal yang benar-benar ada isinya, plus hari libur.
  const agendaDays = useMemo(() => {
    const out = [];
    for(let day=1; day<=lastDay; day++){
      const iso = toLocalISO(new Date(year, month, day));
      const evs = eventsByDate[iso] || [];
      if(evs.length || holidayMap[iso]) out.push({ iso, evs, hol: holidayMap[iso] });
    }
    return out;
  }, [year, month, lastDay, eventsByDate, holidayMap]);

  const shiftMonth = (delta) => setCalMonth(new Date(year, month+delta, 1));
  const dayHeads = ["Min","Sen","Sel","Rab","Kam","Jum","Sab"];

  return (
    <div className="card">
      <div className="month-nav">
        <button onClick={()=>shiftMonth(-1)} aria-label="Bulan sebelumnya">‹</button>
        <div className="label">{monthLabel}</div>
        <button onClick={()=>shiftMonth(1)} aria-label="Bulan berikutnya">›</button>
      </div>

      <div className="chips">
        <button className={"chip"+(view==="agenda"?" on":"")} onClick={()=>setView("agenda")}>Agenda</button>
        <button className={"chip"+(view==="grid"?" on":"")} onClick={()=>setView("grid")}>Kalender</button>
      </div>

      <div className="filter-row">
        <select value={clientFilter} onChange={e=>setClientFilter(e.target.value)}>
          <option value="">Semua Client</option>
          {clientOptions.map(c=><option key={c} value={c}>{c}</option>)}
        </select>
      </div>

      {view === "agenda" ? (
        <div>
          {agendaDays.length===0 && <div className="empty">Tidak ada agenda di bulan ini.</div>}
          {agendaDays.map(({iso, evs, hol}) => {
            const d = new Date(iso+"T00:00:00");
            const label = d.toLocaleDateString("id-ID",{weekday:"long",day:"numeric",month:"long"});
            return (
              <div key={iso} className="agenda-day">
                <div className={"agenda-date" + (hol ? " hol":"")}>
                  {label}{iso===today ? " · HARI INI" : ""}{hol ? ` · ${hol}` : ""}
                </div>
                {evs.map(({t:ev, kind, key}) => {
                  const urg = kind==="post" ? null : urgencyBadge(ev, today);
                  const spine = kind==="post" ? " sp-post" : spineCls(ev, today);
                  return (
                    <button key={key} className={"card card-btn" + spine} style={{padding:11,marginBottom:6,boxShadow:"none",border:"1px solid var(--line-soft)"}}
                      onClick={()=>setQuickView(ev)}>
                      <div className="row-top">
                        <div className="client-line">{ev.client} · {ev.category}</div>
                        {kind==="post"
                          ? <span className="badge badge-purple" style={{flexShrink:0}}>Jadwal tayang</span>
                          : kind==="billing"
                            ? <span className="badge badge-green" style={{flexShrink:0}}>Billing</span>
                            : urg && <span className={"badge " + urg.cls} style={{flexShrink:0}}>{urg.label}</span>}
                      </div>
                      <div className="task-title" style={{marginBottom:0}}>{calLabel(ev)}</div>
                    </button>
                  );
                })}
                {evs.length===0 && <div style={{fontSize:12,color:"var(--ink-3)",paddingBottom:6}}>Libur — tidak ada agenda.</div>}
              </div>
            );
          })}
        </div>
      ) : (
        <div className="cal-grid">
          {dayHeads.map(d=><div key={d} className="cal-head">{d}</div>)}
          {cells.map((d,i) => {
            const iso = toLocalISO(d);
            const inMonth = d.getMonth()===month;
            const holName = holidayMap[iso];
            const allEvs = eventsByDate[iso] || [];
            const showAsCount = allEvs.length > 2;
            return (
              <div key={i} className={"cal-cell" + (!inMonth?" dim":"") + (holName?" holiday":"") + (iso===today?" today":"")}>
                <div className="cal-date">{d.getDate()}</div>
                {holName && <div className="cal-holname">{holName}</div>}
                {showAsCount ? (
                  <button className="cal-count" onClick={()=>setDayView({iso, tasks:allEvs})}>{allEvs.length} task</button>
                ) : (
                  allEvs.map(({t:ev, kind, key}) => (
                    <button key={key} className={"cal-event" + (kind==="post" ? " post" : kind==="billing" ? " billing":"")}
                      onClick={()=>setQuickView(ev)}>{kind==="post" ? "Tayang: " + ev.client : calLabel(ev)}</button>
                  ))
                )}
              </div>
            );
          })}
        </div>
      )}

      <div className="legend">
        <span><span className="dot" style={{background:"var(--post)"}}></span>Jadwal tayang</span>
        <span><span className="dot" style={{background:"var(--ok)"}}></span>Penagihan client</span>
        <span><span className="dot" style={{background:"var(--calm)"}}></span>Kerjaan</span>
        <span><span className="dot" style={{background:"var(--late)"}}></span>Tanggal merah</span>
      </div>

      {dayView && (
        <DayTasksModal iso={dayView.iso} entries={dayView.tasks} onClose={()=>setDayView(null)}
          onPickTask={(t)=>{ setDayView(null); setQuickView(t); }} />
      )}
      {quickView && (
        <TaskQuickView task={quickView} onClose={()=>setQuickView(null)}
          onOpenFull={(t)=>{ setQuickView(null); onOpenTask(t); }} />
      )}
    </div>
  );
}

function DayTasksModal({iso, entries, onClose, onPickTask}){
  const dateLabel = new Date(iso+"T00:00:00").toLocaleDateString("id-ID",{weekday:"long",day:"numeric",month:"long"});
  const today = todayStr();
  return (
    <div className="modal-bg" onMouseDown={e=>{ if(e.target===e.currentTarget) onClose(); }}>
      <div className="modal" style={{maxWidth:420}}>
        <div className="section-title">{dateLabel}</div>
        <div className="meta-line" style={{marginBottom:12}}>{entries.length} agenda di tanggal ini.</div>
        {entries.map(({t, kind, key}) => {
          const urg = kind==="post" ? null : urgencyBadge(t, today);
          return (
            <button key={key} className={"card card-btn" + (kind==="post" ? " sp-post" : spineCls(t, today))}
              style={{boxShadow:"none",border:"1px solid var(--line-soft)"}} onClick={()=>onPickTask(t)}>
              <div className="row-top">
                <div className="client-line">{t.client} · {t.category}</div>
                {kind==="post"
                  ? <span className="badge badge-purple" style={{flexShrink:0}}>Jadwal tayang</span>
                  : urg && <span className={"badge " + urg.cls} style={{flexShrink:0}}>{urg.label}</span>}
              </div>
              <div className="task-title" style={{marginBottom:0}}>{calLabel(t)}</div>
            </button>
          );
        })}
        <div className="modal-actions">
          <button className="btn btn-outline" style={{width:"100%"}} onClick={onClose}>Tutup</button>
        </div>
      </div>
    </div>
  );
}

function TaskQuickView({task, onClose, onOpenFull}){
  const flag = getFlag(task, todayStr());
  return (
    <div className="modal-bg" onMouseDown={e=>{ if(e.target===e.currentTarget) onClose(); }}>
      <div className="modal" style={{maxWidth:420}}>
        <div className="client-line">{task.client} · {task.category}</div>
        <div style={{display:"flex",gap:6,margin:"6px 0 12px",flexWrap:"wrap"}}>
          <span className={"badge " + flag.cls}>{flag.label}</span>
          <span className={"badge " + statusCls(task.status)}>{task.status}</span>
        </div>
        <div style={{fontSize:13,color:"var(--ink)",lineHeight:1.8,marginBottom:10}}>
          <div><b>PIC:</b> {(() => { const ppl = taskPeople(task); return ppl.length ? ppl.join(", ") : "Belum ada PIC"; })()}</div>
          {isEventCategory(task.category) ? (
            <div><b>Jadwal:</b> {fmtDate(task.dueDate)}{task.dueTime ? " · " + task.dueTime : ""}</div>
          ) : (
            <>
              <div><b>Start:</b> {fmtDate(task.startDate)} &nbsp; <b>Due:</b> {fmtDate(task.dueDate)}</div>
              <div><b>Progress:</b> {task.progress}%</div>
            </>
          )}
        </div>
        {(task.deliverables||[]).length>0 && (
          <>
            <div style={{fontWeight:700,fontSize:13,marginBottom:6}}>Kiriman ({task.deliverables.length})</div>
            {task.deliverables.map(d => {
              const st = DELIV_STATE[d.state] || DELIV_STATE.pending;
              return (
                <div key={d._id} style={{background:"var(--offwhite)",borderRadius:10,padding:9,marginBottom:6}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:8}}>
                    <div style={{fontSize:13,fontWeight:600,minWidth:0}}>
                      {d.label} <span className="meta-line">· {d.pic || "belum ada PIC"}</span>
                    </div>
                    <span className={"badge " + st.cls} style={{flexShrink:0}}>{st.label}</span>
                  </div>
                </div>
              );
            })}
          </>
        )}
        {task.category === "Meeting" && (task.meetingPlace || task.clientAttendees || task.agenda || task.outcome) && (
          <div style={{fontSize:13,lineHeight:1.8,marginTop:8}}>
            {task.meetingPlace && <div><b>Tempat:</b> {task.meetingPlace}</div>}
            {task.clientAttendees && <div><b>Peserta client:</b> {task.clientAttendees}</div>}
            {task.agenda && <div style={{whiteSpace:"pre-wrap"}}><b>Agenda:</b> {task.agenda}</div>}
            {task.outcome && <div style={{whiteSpace:"pre-wrap"}}><b>Hasil:</b> {task.outcome}</div>}
          </div>
        )}
        {task.notes && <div style={{fontSize:12,marginTop:8}}><b>Notes:</b> {task.notes}</div>}
        <div className="modal-actions">
          <button className="btn btn-outline" onClick={onClose}>Tutup</button>
          {onOpenFull && <button className="btn btn-gold" onClick={()=>onOpenFull(task)}>Buka Task Lengkap</button>}
        </div>
      </div>
    </div>
  );
}

class ErrorCatcher extends React.Component {
  constructor(p){ super(p); this.state = { err:null, info:"" }; }
  static getDerivedStateFromError(err){ return { err }; }
  componentDidCatch(err, info){
    console.error(err, info);
    this.setState({ info: (info && info.componentStack ? info.componentStack : "").split("\n").slice(0,6).join("\n") });
  }
  render(){
    if(!this.state.err) return this.props.children;
    return (
      <div style={{padding:20,fontFamily:"-apple-system,sans-serif"}}>
        <div style={{background:"#FCEFF3",border:"1px solid #E8B9C8",borderRadius:14,padding:16}}>
          <div style={{fontWeight:700,fontSize:15,marginBottom:6,color:"#A82C56"}}>Aplikasi berhenti — ada error</div>
          <div style={{fontSize:13,marginBottom:10,color:"#5A5670"}}>
            Screenshot layar ini lalu kirim ke Okky. Datamu aman, tidak ada yang hilang.
          </div>
          <div style={{fontSize:12,fontFamily:"monospace",background:"#fff",borderRadius:8,padding:10,
            whiteSpace:"pre-wrap",wordBreak:"break-word",marginBottom:10}}>
            {"PESAN: " + String((this.state.err && (this.state.err.message || this.state.err)) || "?") + "\n\n"}
            {String((this.state.err && this.state.err.stack) || "").slice(0,700)}
            {this.state.info ? "\n--- lokasi ---" + this.state.info : ""}
          </div>
          <button onClick={()=>window.location.reload()}
            style={{background:"#1E1B2E",color:"#fff",border:"none",borderRadius:10,padding:"9px 15px",
              fontSize:13,fontWeight:600,cursor:"pointer"}}>Muat Ulang</button>
        </div>
      </div>
    );
  }
}

// Jaring pengaman terakhir: error di luar React tetap tampil, bukan layar kosong.
window.addEventListener("error", function(e){
  const root = document.getElementById("root");
  if(root && root.childElementCount === 0){
    root.innerHTML = '<div style="padding:20px;font-family:-apple-system,sans-serif">' +
      '<div style="background:#FCEFF3;border:1px solid #E8B9C8;border-radius:14px;padding:16px">' +
      '<div style="font-weight:700;color:#A82C56;margin-bottom:6px">Gagal memuat aplikasi</div>' +
      '<div style="font-size:12px;font-family:monospace;background:#fff;border-radius:8px;padding:10px;white-space:pre-wrap;word-break:break-word">' +
      String((e && (e.message || e.error)) || "Error tidak diketahui").slice(0,600) +
      (e && e.filename ? "\n" + e.filename + ":" + e.lineno : "") +
      '</div></div></div>';
  }
});

ReactDOM.createRoot(document.getElementById("root")).render(
  <ErrorCatcher><App /></ErrorCatcher>
);
</script>
