<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>UBAHdigital Tracker</title>
<link rel="icon" href="data:,">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<style>
  :root{
    /* Netral sejuk — bukan krem, supaya tidak bentrok dengan ungu brand */
    --bg:#F6F6F9; --surface:#FFFFFF; --line:#E8E8EE; --line-soft:#F0F0F4;
    --ink:#1E1B2E; --ink-2:#5A5670; --ink-3:#8B8798;
    --offwhite:#FAFAFC;
    /* Brand tetap, tapi turun pangkat jadi aksen */
    --brand:#6B2FB5; --brand-2:#9A2D71;
    --brand-gradient:linear-gradient(120deg,#8B2A85 0%,#6B2FB5 100%);
    /* Semantik diredam: masih terbaca, tidak menyilaukan */
    --late:#A82C56; --late-bg:#FCEFF3;
    --soon:#8A6410; --soon-bg:#FBF3E2;
    --ok:#1D6B4C;   --ok-bg:#E9F3ED;
    --calm:#5A5670; --calm-bg:#F1F1F5;
    --post:#5B3FA8; --post-bg:#EFEBFA;
  }
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{margin:0;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;}
  .app{max-width:1000px;margin:0 auto;padding-bottom:70px;}

  .topbar{background:var(--brand-gradient);color:#fff;padding:14px 18px 16px;position:sticky;top:0;z-index:20;}
  .topbar h1{margin:1px 0 0;font-size:19px;font-weight:680;letter-spacing:-.3px;}
  .topbar .tag{font-size:9.5px;letter-spacing:1.4px;font-weight:700;opacity:.72;}
  .logout-btn{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);color:#fff;
    border-radius:8px;padding:5px 10px;font:inherit;font-size:11px;font-weight:600;cursor:pointer;}
  .role-pill{display:inline-block;background:rgba(255,255,255,.95);color:var(--brand);font-size:9px;
    font-weight:800;padding:2px 8px;border-radius:999px;margin-left:7px;letter-spacing:.7px;vertical-align:middle;}

  .tabs{display:flex;gap:6px;padding:12px 14px 2px;overflow-x:auto;background:var(--bg);}
  .tabs::-webkit-scrollbar{display:none;}
  .tab{flex:0 0 auto;padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);
    color:var(--ink-2);font:inherit;font-size:12.5px;font-weight:560;cursor:pointer;white-space:nowrap;
    display:inline-flex;align-items:center;gap:6px;}
  .tab-ico{font-size:13px;line-height:1;}
  .tab.active{background:var(--ink);border-color:var(--ink);color:#fff;}
  .tab:focus-visible{outline:2px solid var(--brand);outline-offset:2px;}

  .content{padding:12px 14px 0;}

  /* ---------- Kerangka: menu di kiri (layar lebar) / bilah bawah (HP) ---------- */
  .shell{display:flex;min-height:100vh;align-items:flex-start;}
  .side{position:sticky;top:0;height:100vh;flex:0 0 228px;width:228px;background:var(--surface);
    border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:20;overflow-y:auto;}
  .shell.mini .side{flex-basis:66px;width:66px;}
  .side-head{background:var(--brand-gradient);color:#fff;padding:14px 14px 13px;}
  .side-head img{height:30px;display:block;margin-bottom:8px;}
  .side-head .t{font-size:15px;font-weight:680;letter-spacing:-.2px;display:flex;align-items:center;flex-wrap:wrap;gap:6px;}
  .side-head .role-pill{margin-left:0;}
  .side-nav{flex:1;padding:6px 8px 10px;}
  .side-group{font-size:10px;letter-spacing:1.1px;font-weight:700;color:var(--ink-3);padding:13px 10px 5px;text-transform:uppercase;}
  .side-item{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:9px;border:none;
    background:none;font:inherit;font-size:13px;font-weight:560;color:var(--ink-2);cursor:pointer;text-align:left;}
  .side-item:hover{background:var(--bg);}
  .side-item.active{background:var(--ink);color:#fff;}
  .side-item:focus-visible{outline:2px solid var(--brand);outline-offset:1px;}
  .side-ico{font-size:15px;line-height:1;width:20px;text-align:center;flex:none;}
  .side-lbl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .side-badge{background:var(--brand);color:#fff;font-size:10px;font-weight:700;border-radius:999px;padding:1px 7px;flex:none;}
  .side-item.active .side-badge{background:#fff;color:var(--ink);}
  .side-foot{border-top:1px solid var(--line);padding:10px 10px 14px;font-size:11px;color:var(--ink-3);}
  .side-foot .who{font-size:12.5px;color:var(--ink);font-weight:620;padding:0 4px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .side-foot .ver{padding:0 4px 8px;font-size:10px;}
  .side-foot .row{display:flex;gap:6px;flex-wrap:wrap;}
  .side-foot button{background:var(--surface);border:1px solid var(--line);color:var(--ink-2);border-radius:8px;
    padding:5px 9px;font:inherit;font-size:11px;font-weight:600;cursor:pointer;}
  .shell.mini .side-lbl,.shell.mini .side-group,.shell.mini .side-head .t,.shell.mini .side-foot .who,
  .shell.mini .side-foot .ver,.shell.mini .side-foot .hide-mini{display:none;}
  .shell.mini .side-head{padding:12px 8px;}
  .shell.mini .side-head img{height:20px;margin:0 auto;}
  .shell.mini .side-item{justify-content:center;padding:9px 0;position:relative;}
  .shell.mini .side-badge{position:absolute;top:2px;right:6px;padding:0 5px;}
  .shell.mini .side-nav hr{display:block;}
  .side-nav hr{display:none;border:none;border-top:1px solid var(--line);margin:8px 10px;}
  .main{flex:1;min-width:0;}
  .topbar.mobtop{display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .mobbar{display:none;}
  .more-list{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
  .more-list .side-item{border:1px solid var(--line);}
  @media(min-width:900px){
    .topbar.mobtop{display:none;}
    .main .content{padding-top:18px;}
  }
  @media(max-width:899px){
    .side{display:none;}
    .app{padding-bottom:140px;}
    .mobbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);
      border-top:1px solid var(--line);padding:5px 4px calc(5px + env(safe-area-inset-bottom));}
    .mobbar button{flex:1;min-width:0;background:none;border:none;font:inherit;font-size:10px;font-weight:600;
      color:var(--ink-3);padding:5px 2px 3px;display:flex;flex-direction:column;align-items:center;gap:2px;
      cursor:pointer;position:relative;border-radius:8px;}
    .mobbar button .side-ico{font-size:18px;width:auto;}
    .mobbar button span.l{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
    .mobbar button.active{color:var(--brand);}
    .mobbar .side-badge{position:absolute;top:0;right:calc(50% - 22px);padding:0 5px;}
    .fab{bottom:calc(78px + env(safe-area-inset-bottom));}
    .toast{bottom:140px;}
  }

  /* ---------- Preview & laporan klien ---------- */
  .pv-head{display:flex;gap:10px;align-items:flex-end;margin-bottom:14px;flex-wrap:wrap;}
  .pv-row{padding:0;}
  .pv-row.pv-hot{box-shadow:inset 3px 0 0 var(--brand),0 1px 3px rgba(16,24,40,.06);}
  .pv-row > .row-top{padding:14px 14px 0;}
  .pv-row > .pv-actions{padding:0 14px 14px;}
  .pv-rowbtn{display:flex;gap:10px;align-items:center;width:100%;background:none;border:none;font:inherit;
    color:inherit;text-align:left;padding:14px;cursor:pointer;}
  .pv-title{font-size:14px;font-weight:680;}
  .pv-title span{font-weight:500;color:var(--ink-2);}
  .pv-status{font-size:12.5px;color:var(--ink-2);margin-top:2px;}
  .pv-meta{font-size:11px;color:var(--ink-3);margin-top:2px;line-height:1.5;}
  .pv-chev{color:var(--ink-3);font-size:13px;flex:none;}
  .pv-detail{border-top:1px solid var(--line);padding:12px 14px 14px;}
  .pv-actions{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-top:9px;}
  .pv-todo{background:#FFF9E8;border:1px solid #EBD9A0;border-radius:11px;padding:11px 12px;font-size:12.5px;
    line-height:1.6;margin-top:11px;}
  .pv-item{border:1px solid var(--line);border-radius:11px;padding:11px 12px;margin-top:9px;}
  .pv-line{font-size:12px;color:var(--ink-2);margin-top:6px;line-height:1.5;}
  .pv-cmt{background:var(--offwhite);border-left:3px solid var(--late);border-radius:0 8px 8px 0;padding:8px 10px;
    margin-top:7px;font-size:12.5px;line-height:1.5;white-space:pre-line;word-break:break-word;}
  .pv-cmt.old{border-left-color:var(--line);color:var(--ink-3);}
  .te-row{align-items:flex-start}.te-row textarea{flex:1;min-height:44px;font-size:13px}
  .te-n{font-size:11px;color:var(--ink-3);width:16px;padding-top:9px;flex:none}
  .te-a{display:flex;gap:2px;flex:none}.te-a button{padding:6px 7px;font-size:12px;color:var(--ink-3);background:none;border:0}
  .te-a button:disabled{opacity:.3}
  .te-list{display:flex;flex-direction:column;gap:4px;max-height:320px;overflow:auto}
  .te-tpl{text-align:left;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff;display:flex;flex-direction:column;gap:2px}
  .te-tpl b{font-size:12.5px}.te-tpl span{font-size:11px;color:var(--ink-3)}
  .cmt-x{margin:5px 0 2px}.cmt-pics{display:flex;gap:6px;flex-wrap:wrap}
  .cmt-pics button{padding:0;border:0;background:none;cursor:zoom-in}
  .cmt-pics img{width:48px;height:86px;object-fit:cover;border-radius:7px;border:1px solid var(--line);display:block}
  .cmt-link{display:block;font-size:12px;margin-top:4px;word-break:break-all}
  .pv-slide{display:inline-block;font-size:10.5px;font-weight:700;color:var(--brand);margin-bottom:2px;}
  .pv-rev{border-top:1px solid var(--line);padding:10px 0;}
  .pv-rev:first-of-type{border-top:none;}
  .pv-tick{display:flex;gap:7px;align-items:flex-start;margin:0 0 5px;font-size:12px;font-weight:400;line-height:1.45;}
  .pv-tick i{color:var(--ink-3);}
  .pv-note{font-size:10.5px;color:var(--ink-3);margin-top:6px;line-height:1.5;}
  .bt-pick{display:flex;gap:9px;align-items:flex-start;border:1px solid var(--line);border-radius:9px;padding:9px 10px;margin-bottom:7px;cursor:pointer;background:#fff}
.bt-pick.on{border-color:var(--brand);background:#faf6ff}.bt-pick input{width:auto;margin-top:2px}
.bt-pick span{flex:1;font-size:13px}.bt-pick em{display:block;font-style:normal;font-size:11.5px;margin-top:2px}
.bt-pick em.ok{color:#2f6b4f}.bt-pick em.warn{color:#9a6a1c}
.hub-seg.big button{font-size:14px;padding:9px 6px}
.bt-proof{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:12px;background:#fbfdfb}
.bt-ad{border-top:1px dashed var(--line);padding-top:8px;margin-top:8px}
.bt-ad .bt-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px}
.bt-ad .bt-row input[type=date]{width:auto;padding:5px 8px;font-size:12.5px}
.bt-chg{background:#fff7ea;border:1px solid #f0d3a6;border-radius:8px;padding:8px 10px;font-size:12px;color:#7a5414;margin:8px 0}
.bt-proof-h b{display:block;font-size:13.5px;color:#1f6b3a}.bt-proof-h span{font-size:11.5px;color:var(--ink-3)}
.bt-ad-h{display:flex;gap:8px;align-items:center;font-size:12.5px;margin-bottom:4px}.bt-ad-h em{font-style:normal;font-size:10.5px;padding:1px 7px;border-radius:9px;background:#eef3ee;color:#1f6b3a}
.bt-date{display:flex;gap:8px;align-items:center;font-size:12px;margin-top:6px}.bt-date input{width:auto;padding:5px 8px;font-size:12.5px}
.bt-chg ul{margin:4px 0 4px 16px;padding:0}.bt-chg textarea{width:100%;margin-top:6px;padding:7px;border:1px solid #f0d3a6;border-radius:6px;font-family:inherit;font-size:12.5px}
.bt-ok{display:flex;gap:7px;align-items:flex-start;font-size:12.5px;margin:8px 0}.bt-ok input{width:auto;margin-top:2px}
.bt-empty{font-size:12px;color:var(--ink-3);padding:6px 0}
.bt-sets{background:var(--offwhite);border:1px solid var(--line);border-radius:10px;padding:9px 10px;margin:8px 0 10px}
.bt-sets-h b{display:block;font-size:13px}.bt-sets-h span{font-size:11.5px;color:var(--ink-3)}
.bt-set{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px;margin:8px 0;display:flex;flex-direction:column;gap:6px}
.bt-pl{display:flex;flex-wrap:wrap;gap:5px}.bt-pl label{display:flex;gap:4px;align-items:center;font-size:11.5px;border:1px solid var(--line);border-radius:99px;padding:3px 9px;cursor:pointer}
.bt-pl label.on{border-color:var(--brand);color:var(--brand);font-weight:600}.bt-pl input{width:auto;margin:0}
.bt-gaps{background:#fff7ea;border:1px solid #f0d3a6;border-radius:8px;padding:8px 10px;font-size:12px;color:#7a5414;margin:4px 0 8px}
.bt-gaps ul{margin:4px 0 0 16px;padding:0;line-height:1.5}
.ar-err{background:var(--late-bg);color:var(--late);border-radius:8px;padding:7px 10px;font-size:12px;margin:4px 0}
.ar-chk{display:flex;gap:7px;align-items:flex-start;font-size:12.5px;margin:4px 0 8px}.ar-chk input{width:auto;margin-top:2px}
.ar-prev{border-top:1px solid var(--line);padding-top:10px;margin-top:6px}
.ar-ok{background:#e6f5ec;border-radius:8px;padding:7px 10px;font-size:12.5px;color:#215c3e;margin-bottom:8px}
.ar-tbl{width:100%;border-collapse:collapse;font-size:12px;margin:4px 0}.ar-tbl th,.ar-tbl td{padding:5px 6px;border-bottom:1px solid var(--line);text-align:right}
.ar-tbl th:first-child,.ar-tbl td:first-child{text-align:left}.ar-tbl th{color:var(--ink-3);font-weight:600}.ar-tbl em{font-style:normal;color:var(--ink-3)}
.ar-match{background:#fff7ea;border:1px solid #f0d3a6;border-radius:8px;padding:8px 10px;font-size:12px;color:#7a5414;margin-top:8px}
.ar-mrow{display:flex;flex-direction:column;gap:3px;margin-top:7px}.ar-mrow span{color:var(--ink)}.ar-mrow em{font-style:normal;color:var(--ink-3)}
.ar-chips{display:flex;gap:5px;flex-wrap:wrap;margin:5px 0}.ar-chips span{font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px}
.ar-chips .ok{background:#e6f5ec;color:#215c3e}.ar-chips .wait{background:#fff3df;color:#8a5a12}
.ar-tab{flex:1;border:none;background:none;padding:8px 6px;font:inherit;font-size:12.5px;font-weight:600;color:var(--ink-2);border-radius:8px;cursor:pointer}
.ar-tab.on{background:var(--ink);color:#fff}
.ar-kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}.ar-kpi div{background:var(--offwhite);border-radius:8px;padding:8px;text-align:center}
.ar-kpi b{display:block;font-size:15px}.ar-kpi span{font-size:11px;color:var(--ink-3)}
.ar-ins.mine{border:2px solid var(--brand)}
.ar-role{font-size:11.5px;padding:2px 9px;border-radius:6px}.r-ops{background:#fdf0e3;color:#a0611c}.r-cs{background:#f1ebfa;color:#58279D}.r-ad{background:#e3f6f8;color:#1e7f8a}
.ar-act{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
@media (max-width:640px){ .ar-act{grid-template-columns:1fr} }
.ar-ck{font-size:12.5px;padding:2px 0}.ar-ck.ok{color:#215c3e}.ar-ck.warn{color:#8a5a12}
.ok-out{border:1px solid var(--line);border-radius:8px;padding:9px 11px;margin:10px 0;font-size:12.5px;background:var(--surface)}
.ok-out-n{color:var(--ink-2);margin-bottom:6px}
.ok-out label{display:flex;gap:7px;align-items:flex-start}.ok-out input{width:auto;margin-top:2px}
.ok-out-by{font-size:11px;color:var(--ink-3);margin-top:4px}
.swp-c{border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin-bottom:8px;background:var(--surface,#fff)}
.swp-c.on{border-color:var(--brand)}
.swp-h b{display:block;font-size:13px}.swp-h span{font-size:11px;color:var(--ink-3)}
.swp-pend{font-size:11.5px;background:#fff7ea;border-radius:6px;padding:5px 8px;margin-top:6px;color:#7a5414}
.swp-pend .lnk-btn{margin-left:6px;font-size:11.5px}
.swp-ad{display:flex;gap:8px;align-items:flex-start;padding:7px 0 0;margin-top:6px;border-top:1px dashed var(--line);cursor:pointer}
.swp-ad input{width:auto;margin-top:3px}
.swp-ad b{display:block;font-size:12.5px;font-weight:600}.swp-ad em{font-style:normal;font-size:11px;color:var(--ink-3)}
.swp-ad.on b{color:var(--brand)}
.sw-plan{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin:2px 0 6px}
.sw-plan span{font-size:11px;color:var(--ink-3);margin-right:2px}
.sw-plan-l{font-size:11px;color:var(--ink-3);margin:6px 0 4px;padding-top:6px;border-top:1px dashed var(--line)}
.sw-plan button{border:1px solid var(--line);background:var(--surface,#fff);border-radius:99px;padding:4px 10px;font:inherit;font-size:11.5px;cursor:pointer;color:var(--ink-2)}
.sw-plan button.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.cc-chk{display:flex;gap:7px;align-items:flex-start;font-size:12px;margin:2px 0 8px}.cc-chk input{width:auto;margin-top:2px}.cc-chk em{font-style:normal;color:var(--ink-3)}
.stg{margin-top:10px}.stg-n{font-size:13px}.stg-n b{font-size:17px}.stg-n span{color:var(--ink-3)}
.stg-bar{height:8px;border-radius:5px;background:var(--line);overflow:hidden;margin:6px 0 10px}.stg-bar i{display:block;height:100%}
.stg-cols{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:6px}
.stg-cols em{display:block;font-style:normal;font-size:10.5px;letter-spacing:.5px;text-transform:uppercase;color:var(--ink-3);margin-bottom:3px}
.stg-cols div div{display:flex;justify-content:space-between;gap:6px;font-size:12px;padding:2px 0}.stg-cols span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pv-parts{border:1px solid var(--line);border-radius:7px;padding:7px 9px;margin-top:6px;font-size:12px;line-height:1.6}
.pv-parts .ok{color:#2f6b4f}.pv-parts .no{color:#9d4a40}.pv-parts b{color:var(--ink);margin-right:2px}
.pv-parts .hint{color:var(--ink-3);font-size:11.5px;margin-top:3px}
.pv-note.late{color:var(--late);}
  .badge.pv-ok{background:#E8F4EC;color:#2F6B4F;}
  .badge.pv-warn{background:var(--late-bg);color:var(--late);}
  .badge.pv-info{background:#E8F1F8;color:#1F5F8B;}
  .badge.pv-off{background:var(--bg);color:var(--ink-3);}
  .pv-danger{color:var(--late) !important;}
  .lnk-btn{background:none;border:none;padding:0;font:inherit;font-weight:650;color:var(--brand);
    text-decoration:underline;cursor:pointer;}
  /* ---------- Penawaran & tagihan ---------- */
  .q-calc{background:#F4EEFB;border-radius:10px;padding:9px 11px;font-size:12.5px;margin-bottom:7px;}
  .q-calc > div{display:flex;justify-content:space-between;gap:10px;padding:2px 0;color:var(--ink-2);}
  .q-calc b{color:var(--ink);}
  .q-calc .tot{border-top:1px solid #DCCDF0;margin-top:5px;padding-top:6px;}
  .q-calc .tot b{color:var(--brand);font-size:14px;}
  .q-group{border:1px solid var(--line);border-radius:10px;padding:9px 10px;margin-top:8px;background:#fff;}
  .q-bul{display:flex;gap:6px;align-items:center;margin-top:6px;}
  .q-bul input{flex:1;min-width:0;padding:7px 9px;font-size:12.5px;}
  .q-bul input.rm{flex:0 0 34%;background:var(--offwhite);}
  .q-bul button{flex:none;width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:#fff;
    color:var(--ink-3);font-size:11px;cursor:pointer;padding:0;}
