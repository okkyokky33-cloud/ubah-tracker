/* ===================== HELPERS ===================== */
function toLocalISO(d){
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,"0");
  const dd = String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${dd}`;
}
function todayStr(){ return toLocalISO(new Date()); }
function fmtDate(s){ if(!s) return "-"; const d=new Date(s+"T00:00:00"); return d.toLocaleDateString("id-ID",{day:"2-digit",month:"short",year:"2-digit"}); }
// Pakai UTC supaya selisih hari tidak bergeser kalau zona waktu perangkat berubah.
function daysBetween(a,b){
  const pa = a.split("-").map(Number), pb = b.split("-").map(Number);
  return Math.round((Date.UTC(pb[0],pb[1]-1,pb[2]) - Date.UTC(pa[0],pa[1]-1,pa[2]))/86400000);
}

// Tolak skema berbahaya (javascript:, data:) sebelum link dipasang ke href.
const SAFE_PROTOCOLS = ["http:","https:"];
function safeUrl(raw){
  if(!raw) return null;
  const s = String(raw).trim();
  if(!s) return null;
  try{
    const u = new URL(s);
    return SAFE_PROTOCOLS.includes(u.protocol) ? u.href : null;
  }catch(e){
    try{
      const u2 = new URL("https://" + s);
      return u2.hostname.includes(".") ? u2.href : null;
    }catch(e2){ return null; }
  }
}
function ExternalLink({href, children, style, onClick}){
  const safe = safeUrl(href);
  if(!safe) return <span style={{color:"var(--grey)",fontSize:12}}>{children} <i>(link tidak valid)</i></span>;
  return <a href={safe} target="_blank" rel="noopener noreferrer" style={style} onClick={onClick}>{children}</a>;
}

function getFlag(task, today){
  const ref = today || todayStr();
  if(task.status === "Done") return {label:"Selesai", cls:"badge-green"};
  if(!task.dueDate) return {label:"No Due Date", cls:"badge-grey"};
  const diff = daysBetween(ref, task.dueDate);
  if(diff < 0) return {label:"OVERDUE", cls:"badge-red"};
  if(diff <= 2) return {label:"DUE SOON", cls:"badge-yellow"};
  return {label:"On Track", cls:"badge-green"};
}
function eventDate(task){ return task.dueDate || task.startDate || null; }
function priorityCls(p){ return p==="High" ? "badge-red" : p==="Medium" ? "badge-yellow" : "badge-grey"; }
function statusCls(s){
  if(s==="Revision") return "badge-red";
  if(s==="Waiting Review") return "badge-yellow";
  if(s==="Menunggu Approval Klien") return "badge-purple";
  if(s==="Done"||s==="Approved") return "badge-green";
  return "badge-grey";
}

const uid = () => (window.crypto && window.crypto.randomUUID)
  ? window.crypto.randomUUID()
  : "id" + Math.random().toString(36).slice(2) + Date.now();

const emptySubtask = () => ({ _id: uid(), description:"", priority:"Medium", progress:0 });
const emptyAdItem  = () => ({ _id: uid(), label:"", link:"", caption:"", proofLink:"", proofUploadedAt:"", proofUploadedBy:"" });
const emptyTask = () => ({
  client:"", category:"Video Editing", pics:[], status:"Not Started",
  startDate:"", dueDate:"", notes:"", showOnCalendar:false,
  subtasks:[emptySubtask()],
  link:"", caption:"", previewLink:"", postingDate:"", livePostLink:"", postedAt:"", activity:[],
  briefLink:"", forPosting:false, reviewerTarget:"",
  platform:"", objective:"", budget:"", adItems:[emptyAdItem()],
  shootLocation:"", shootTime:"", equipment:"", crew:"",
  version:0, internalApprovedBy:"", completedAt:"", createdAt:"",
});

// Backward-compat: dokumen lama pakai {pic, description} datar; yang baru {pics, subtasks}.
function normalizeTask(t){
  const pics = Array.isArray(t.pics) ? t.pics : (t.pic ? [t.pic] : []);
  const rawSubs = Array.isArray(t.subtasks) && t.subtasks.length > 0
    ? t.subtasks
    : [{ description: t.description || "", priority: t.priority || "Medium", progress: t.progress || 0 }];
  const subtasks = rawSubs.map(s => ({ _id: s._id || uid(), description:s.description||"",
    priority:s.priority||"Medium", progress:Number(s.progress)||0 }));
  const avgProgress = subtasks.length
    ? Math.round(subtasks.reduce((s,x)=>s+x.progress,0) / subtasks.length)
    : 0;
  const anyHighPriority = subtasks.some(s=>s.priority==="High");
  const overallPriority = anyHighPriority ? "High"
    : subtasks.some(s=>s.priority==="Medium") ? "Medium" : "Low";
  const rawAds = (Array.isArray(t.adItems) && t.adItems.length>0) ? t.adItems
    : (t.link || t.caption || t.contentPromoted)
      ? [{ label: t.contentPromoted||"", link: t.link||"", caption: t.caption||"" }]
      : [emptyAdItem()];
  const adItems = rawAds.map(a => ({ _id:a._id||uid(), label:a.label||"", link:a.link||"", caption:a.caption||"",
    proofLink:a.proofLink||"", proofUploadedAt:a.proofUploadedAt||"", proofUploadedBy:a.proofUploadedBy||"" }));
  return { ...t, pics, subtasks, avgProgress, anyHighPriority, overallPriority,
    link: t.link || "", caption: t.caption || "",
    previewLink: t.previewLink || "", postingDate: t.postingDate || "",
    livePostLink: t.livePostLink || "",
    briefLink: t.briefLink || "", forPosting: t.forPosting === true,
    reviewerTarget: t.reviewerTarget || "",
    postedAt: t.postedAt || "", activity: Array.isArray(t.activity) ? t.activity : [],
    platform: t.platform || "", objective: t.objective || "", budget: t.budget || "",
    adItems,
    shootLocation: t.shootLocation || "", shootTime: t.shootTime || "",
    equipment: t.equipment || "", crew: t.crew || "",
    version: Number(t.version)||0, internalApprovedBy: t.internalApprovedBy || "",
    completedAt: t.completedAt || "", createdAt: t.createdAt || "" };
}

function calLabel(task){
  if(task.category === "Billing") return task.client;
  const picLabel = task.pics.length > 1 ? `${task.pics[0]} +${task.pics.length-1}` : (task.pics[0] || "?");
  const firstDesc = task.subtasks[0] ? task.subtasks[0].description : "";
  const extra = task.subtasks.length > 1 ? ` +${task.subtasks.length-1}` : "";
  return `${picLabel}: ${firstDesc.slice(0,14)}${extra}`;
}

function newActivity(type, text, author){
  return { type, text, author: author||"", at: new Date().toISOString() };
}
function isReviewCategory(cat){ return REVIEW_CATEGORIES.includes(cat); }
function needsClientGate(cat){ return CLIENT_GATE_CATEGORIES.includes(cat); }
function isPostableTask(task){
  if(!task) return false;
  if(ALWAYS_POSTABLE.includes(task.category)) return true;
  if(task.category === "Graphic Design") return task.forPosting === true;
  return false;
}

// Tanggal 31 di bulan Februari harus dijepit ke hari terakhir bulan itu —
// kalau tidak, Date meluber ke bulan berikutnya dan siklus billing jadi salah.
function clampDay(year, monthIdx, day){
  const last = new Date(year, monthIdx + 1, 0).getDate();
  return new Date(year, monthIdx, Math.min(day, last));
}
// Kuota konten tidak selalu reset tanggal 1 — banyak client billing-nya di tengah bulan.
function currentCycleWindow(billingDate){
  const today = new Date(todayStr()+"T00:00:00");
  const y = today.getFullYear(), m = today.getMonth();
  if(!billingDate){
    return { start: toLocalISO(new Date(y,m,1)), end: toLocalISO(new Date(y,m+1,1)) };
  }
  const day = Math.min(31, Math.max(1, Number(billingDate) || 1));
  let start = clampDay(y, m, day);
  if(start > today) start = clampDay(y, m-1, day);
  const end = clampDay(start.getFullYear(), start.getMonth()+1, day);
  return { start: toLocalISO(start), end: toLocalISO(end) };
}

function fmtIDR(n){ const num = Number(n)||0; return "IDR " + num.toLocaleString("id-ID"); }
function daysLeftLabel(dueDate){
  if(!dueDate) return "";
  const diff = daysBetween(todayStr(), dueDate);
  if(diff < 0) return `Berakhir ${Math.abs(diff)} hari lalu`;
  if(diff === 0) return "Berakhir hari ini";
  return `${diff} Hari Lagi`;
}
function fmtDateShort(iso){
  if(!iso) return "";
  return new Date(iso+"T00:00:00").toLocaleDateString("id-ID",{day:"2-digit",month:"short"});
}
function emptyAdLogRow(){ return { _id:uid(), name:"", costPerLead:"", totalLeads:"", budgetUsed:"", totalBudget:"", endDate:"", active:true }; }

function buildDailyWAText(dateStr, logEntries){
  const dateLabel = new Date(dateStr+"T00:00:00").toLocaleDateString("id-ID",{day:"2-digit",month:"short",year:"numeric"});
  let out = `Daily Report Ads\n${dateLabel}\n\n`;
  logEntries.forEach(entry => {
    if(!entry.client || !entry.campaigns || entry.campaigns.length===0) return;
    out += `*${entry.client}*\n`;
    entry.campaigns.forEach(c => {
      const offTag = c.active===false ? " *OFF*" : "";
      if(c.name) out += `${c.name}\n`;
      out += `${fmtIDR(c.costPerLead)} (${c.totalLeads||0})${offTag}\n`;
      if(c.budgetUsed || c.totalBudget) out += `Budget: ${fmtIDR(c.budgetUsed)} dari ${fmtIDR(c.totalBudget)}\n`;
      if(c.endDate) out += `*End ${fmtDateShort(c.endDate)} (${daysLeftLabel(c.endDate)})*\n`;
    });
    out += `\n`;
  });
  return out.trim();
}

/* ===================== FIREBASE INIT ===================== */
let db = null;
let auth = null;
let firebaseReady = false;
let firebaseError = null;
try{
  firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();
  auth = firebase.auth();
  db.enablePersistence({synchronizeTabs:true}).catch(()=>{});
  firebaseReady = true;
}catch(e){ firebaseError = e.message; }

const SERVER_TS = () => firebase.firestore.FieldValue.serverTimestamp();

/* ===================== TOAST ===================== */
function useToast(){
  const [toast, setToast] = useState(null);
  const timer = useRef(null);
  const show = useCallback((msg, kind) => {
    setToast({ msg, kind: kind || "ok" });
    if(timer.current) clearTimeout(timer.current);
    timer.current = setTimeout(()=>setToast(null), 4200);
  }, []);
  useEffect(() => () => { if(timer.current) clearTimeout(timer.current); }, []);
  return { toast, show };
}
function friendlyError(e){
  const code = (e && e.code) || "";
  if(code.includes("permission-denied")) return "Kamu tidak punya izin untuk aksi ini.";
  if(code.includes("unavailable")) return "Koneksi terputus. Perubahan akan dikirim ulang saat online.";
  if(code.includes("not-found")) return "Data sudah tidak ada — mungkin dihapus orang lain.";
  return (e && e.message) ? e.message : "Terjadi kesalahan. Coba lagi.";
}

/* ===================== APP ===================== */
function App(){
  const [tab, setTab] = useState("dashboard");
  const [tasks, setTasks] = useState([]);
  const [staff, setStaff] = useState([]);
  const [projects, setProjects] = useState([]);
  const [holidays, setHolidays] = useState([]);
  const [loading, setLoading] = useState(true);
  const [connected, setConnected] = useState(false);
  const [modalTask, setModalTask] = useState(null);
  const [filterPic, setFilterPic] = useState("");
  const [filterStatus, setFilterStatus] = useState("");
  const [filterFlag, setFilterFlag] = useState("");
  const [filterClient, setFilterClient] = useState("");
  const [calMonth, setCalMonth] = useState(() => { const d=new Date(); d.setDate(1); return d; });
  const [user, setUser] = useState(undefined); // undefined = memeriksa, null = keluar
  const [clientsMeta, setClientsMeta] = useState([]);
  const [documents, setDocuments] = useState([]);
  const [dailyLog, setDailyLog] = useState([]);
  const [busy, setBusy] = useState(false);
  const [showPwd, setShowPwd] = useState(false);
  const { toast, show } = useToast();

  const isAdmin = !!(user && ADMIN_EMAILS.includes((user.email||"").toLowerCase()));
  const myEmail = user ? (user.email||"").toLowerCase() : "";
  const me = useMemo(() => staff.find(s => s.id === myEmail) || null, [staff, myEmail]);
  const myRole = isAdmin ? "admin" : (me ? me.role : "");
  const myName = isAdmin ? (me && me.name ? me.name : (user ? user.email.split("@")[0] : "Admin")) : (me ? me.name : "");
  const activated = isAdmin || !!(me && me.role && me.active !== false);

  const canApprove      = isAdmin || APPROVER_ROLES.includes(myRole);
  const canDocsHistory  = isAdmin || DOCS_ROLES.includes(myRole);
  const canMarkPosted   = isAdmin || POSTING_ROLES.includes(myRole);
  const canSeeWorkload  = isAdmin || WORKLOAD_ROLES.includes(myRole);
  const allowedCategories = (isAdmin || !ROLE_CATEGORIES[myRole]) ? CATEGORIES : ROLE_CATEGORIES[myRole];

  // Semua tulisan lewat sini supaya kegagalan selalu kelihatan, tidak diam-diam.
  const run = useCallback(async (fn, okMsg) => {
    setBusy(true);
    try{
      await fn();
      if(okMsg) show(okMsg, "ok");
      return true;
    }catch(e){
      console.error(e);
      show(friendlyError(e), "err");
      return false;
    }finally{
      setBusy(false);
    }
  }, [show]);

  useEffect(() => {
    if(!firebaseReady) return;
    const unsub = auth.onAuthStateChanged(u => setUser(u));
    return () => unsub();
  }, []);

  // Daftarkan diri sendiri sekali saat login pertama (tanpa role — admin yang mengaktifkan).
  useEffect(() => {
    if(!firebaseReady || !user || isAdmin) return;
    const email = (user.email||"").toLowerCase();
    if(!email) return;
    const ref = db.collection(STAFF_COLLECTION).doc(email);
    ref.get().then(snap => {
      if(!snap.exists){
        return ref.set({ email, name:"", role:"", active:false, registeredAt: SERVER_TS() });
      }
    }).catch(e => console.error(e));
  }, [user, isAdmin]);

  // Ambil hanya task yang masih berjalan. Task Done dipanggil terpisah lewat menu Riwayat,
  // supaya kuota baca harian tidak habis begitu data menumpuk.
  useEffect(() => {
    if(!firebaseReady || !user) return;
    const unsub = db.collection(COLLECTION).limit(400).onSnapshot(snap => {
      setTasks(prev => {
        const map = new Map(prev.map(t => [t.id, t]));
        snap.docChanges().forEach(ch => {
          if(ch.type === "removed") map.delete(ch.doc.id);
          else map.set(ch.doc.id, normalizeTask({ id: ch.doc.id, ...ch.doc.data() }));
        });
        return [...map.values()];
      });
      setLoading(false);
      setConnected(true);
    }, err => { setLoading(false); setConnected(false); console.error(err); show(friendlyError(err),"err"); });
    return () => unsub();
  }, [user, show]);

  useEffect(() => {
    if(!firebaseReady || !user) return;
    const unsub = db.collection(STAFF_COLLECTION).onSnapshot(snap => {
      const list = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      list.sort((a,b)=>(a.name||a.id).localeCompare(b.name||b.id));
      setStaff(list);
    }, e => console.error(e));
    return () => unsub();
  }, [user]);

  useEffect(() => {
    if(!firebaseReady || !user) return;
    const unsub = db.collection(PROJECTS_COLLECTION).onSnapshot(snap => {
      const list = snap.docs.map(d => ({ id: d.id, name: d.data().name, active: d.data().active !== false }))
        .sort((a,b)=>a.name.localeCompare(b.name));
      setProjects(list);
    }, e => console.error(e));
    return () => unsub();
  }, [user]);

  useEffect(() => {
    if(!firebaseReady || !user) return;
    const unsub = db.collection(CLIENTS_META_COLLECTION).onSnapshot(snap => {
      setClientsMeta(snap.docs.map(d => ({ id: d.id, ...d.data() })));
    }, e => console.error(e));
    return () => unsub();
  }, [user]);

  useEffect(() => {
    if(!firebaseReady || !user || !canDocsHistory) return;
    const unsub = db.collection(DOCUMENTS_COLLECTION).onSnapshot(snap => {
      setDocuments(snap.docs.map(d => ({ id: d.id, ...d.data() })));
    }, e => console.error(e));
    return () => unsub();
  }, [user, canDocsHistory]);

  useEffect(() => {
    if(!firebaseReady || !user || !canDocsHistory) return;
    const unsub = db.collection(DAILY_LOG_COLLECTION).onSnapshot(snap => {
      setDailyLog(snap.docs.map(d => ({ id: d.id, ...d.data() })));
    }, e => console.error(e));
    return () => unsub();
  }, [user, canDocsHistory]);

  useEffect(() => {
    if(!firebaseReady || !user) return;
    const unsub = db.collection(HOLIDAYS_COLLECTION).onSnapshot(snap => {
      setHolidays(snap.docs.map(d => ({ id: d.id, date: d.data().date, name: d.data().name })));
    }, e => console.error(e));
    return () => unsub();
  }, [user]);

  const holidayMap = useMemo(() => {
    const m = {};
    holidays.forEach(h => { if(h.date) m[h.date] = h.name; });
    return m;
  }, [holidays]);

  // Dokumen staff lama (dari sistem sebelumnya) ber-ID acak, bukan email.
  // Dipisah supaya tidak tercampur dengan orang yang benar-benar baru login.
  const isEmailId = (id) => typeof id === "string" && id.includes("@");
  const staffLegacy  = useMemo(() => staff.filter(s => !isEmailId(s.id)), [staff]);
  const staffActive  = useMemo(() => staff.filter(s => isEmailId(s.id) && s.role && s.active !== false), [staff]);
  const staffPending = useMemo(() => staff.filter(s => isEmailId(s.id) && (!s.role || s.active === false)), [staff]);
  const staffNames   = useMemo(() => staffActive.map(s => s.name).filter(Boolean), [staffActive]);
  const reviewerNames= useMemo(() => staffActive.filter(s => APPROVER_ROLES.includes(s.role)).map(s=>s.name).filter(Boolean), [staffActive]);
  const projectNames = useMemo(() => projects.filter(p=>p.active).map(p => p.name), [projects]);

  function goToTasks(kind){
    setFilterPic(""); setFilterClient("");
    if(kind==="all"){ setFilterStatus(""); setFilterFlag(""); }
    if(kind==="mine"){ setFilterStatus(""); setFilterFlag(""); setFilterPic(myName); }
    if(kind==="overdue"){ setFilterStatus(""); setFilterFlag("OVERDUE"); }
    if(kind==="duesoon"){ setFilterStatus(""); setFilterFlag("DUE SOON"); }
    if(kind==="inprogress"){ setFilterStatus("In Progress"); setFilterFlag(""); }
    if(kind==="review"){ setFilterStatus("Waiting Review"); setFilterFlag(""); }
    setTab("tasks");
  }

  async function saveTask(task){
    const isAds = task.category === "Paid Ads";
    const isProd = task.category === "Production";
    let cleanSubtasks = task.subtasks
      .filter(s => (s.description||"").trim())
      .map(s => ({ description: s.description.trim(), priority: s.priority, progress: Number(s.progress)||0 }));
    if(isAds){
      const labels = (task.adItems||[]).map(a=>(a.label||"").trim()).filter(Boolean);
      const autoTitle = labels.length ? labels.join(", ")
        : [task.platform, task.objective].filter(Boolean).join(" — ") || "Paid Ads";
      cleanSubtasks = [{ description: autoTitle, priority:"Medium", progress: task.status==="Done" ? 100 : 0 }];
    }
    if(cleanSubtasks.length === 0){ show("Isi minimal 1 deskripsi task.","err"); return false; }
    if(!task.client){ show("Pilih client dulu.","err"); return false; }

    const payload = {
      client: task.client, category: task.category, pics: task.pics,
      status: task.status, startDate: task.startDate, dueDate: task.dueDate,
      notes: task.notes, showOnCalendar: (isAds || isProd) ? true : task.showOnCalendar,
      subtasks: cleanSubtasks,
      briefLink: task.briefLink || "",
      forPosting: task.category === "Graphic Design" ? (task.forPosting === true) : false,
      platform: isAds ? task.platform : "", objective: isAds ? task.objective : "",
      budget: isAds ? task.budget : "",
      shootLocation: isProd ? task.shootLocation : "", shootTime: isProd ? task.shootTime : "",
      equipment: isProd ? task.equipment : "", crew: isProd ? task.crew : "",
      lastUpdate: todayStr(), updatedBy: myEmail, updatedAt: SERVER_TS(),
    };
    if(isAds){
      payload.adItems = (task.adItems||[])
        .filter(a => (a.label||"").trim() || (a.link||"").trim() || (a.caption||"").trim() || (a.proofLink||"").trim())
        .map(a => ({ label:a.label||"", link:a.link||"", caption:a.caption||"",
          proofLink:a.proofLink||"", proofUploadedAt:a.proofUploadedAt||"", proofUploadedBy:a.proofUploadedBy||"" }));
      if(payload.adItems.length === 0) payload.adItems = [{ label:"",link:"",caption:"",proofLink:"",proofUploadedAt:"",proofUploadedBy:"" }];
    }

    const ok = await run(async () => {
      if(task.id){
        // Cek versi supaya perubahan orang lain tidak tertimpa diam-diam.
        await db.runTransaction(async tx => {
          const ref = db.collection(COLLECTION).doc(task.id);
          const snap = await tx.get(ref);
          if(!snap.exists) throw { code:"not-found" };
          const current = Number(snap.data().version) || 0;
          if(current !== (Number(task.version)||0)){
            throw new Error("Task ini baru diubah orang lain. Tutup dulu, buka lagi, baru simpan.");
          }
          tx.set(ref, { ...payload, version: current + 1 }, { merge:true });
        });
      } else {
        await db.collection(COLLECTION).add({
          link:"", caption:"", previewLink:"", postingDate:"", livePostLink:"", postedAt:"", activity:[], adItems:[],
          reviewerTarget:"", internalApprovedBy:"", completedAt:"", version:1,
          createdAt: todayStr(), createdBy: myEmail, createdTs: SERVER_TS(),
          ...payload,
        });
      }
    }, "Tersimpan.");
    if(ok) setModalTask(null);
    return ok;
  }

  async function deleteTask(id){
    if(!isAdmin) return;
    if(!window.confirm("Hapus task ini? Tidak bisa dibatalkan.")) return;
    await run(() => db.collection(COLLECTION).doc(id).delete(), "Task dihapus.");
  }

  async function taskAction(taskId, statusUpdate, activityEntry, extraFields, okMsg){
    const payload = { ...(extraFields||{}), lastUpdate: todayStr(), updatedBy: myEmail, updatedAt: SERVER_TS() };
    if(statusUpdate) payload.status = statusUpdate;
    if(activityEntry) payload.activity = firebase.firestore.FieldValue.arrayUnion(activityEntry);
    payload.version = firebase.firestore.FieldValue.increment(1);
    const ok = await run(() => db.collection(COLLECTION).doc(taskId).set(payload, {merge:true}), okMsg);
    if(ok) setModalTask(null);
    return ok;
  }
  const submitForReview = (id, link, reviewer) =>
    taskAction(id, "Waiting Review", newActivity("link", `Dikirim ke ${reviewer} — ${link}`, myName), { link, reviewerTarget: reviewer }, "Dikirim untuk review.");
  const updateLinkAndResend = (id, link, reviewer) =>
    taskAction(id, "Waiting Review", newActivity("link", `Revisi dikirim ke ${reviewer} — ${link}`, myName), { link, reviewerTarget: reviewer }, "Dikirim ulang.");
  const requestRevision = (id, note) =>
    note.trim() ? taskAction(id, "Revision", newActivity("revision", note, myName), {}, "Revisi diminta.") : null;
  const approveTask = (id, note, category) => {
    const gate = needsClientGate(category);
    return taskAction(id, gate ? "Menunggu Approval Klien" : "Approved",
      newActivity("approval", note || (gate ? "Disetujui internal — menunggu konfirmasi client." : "Disetujui."), myName),
      gate ? { internalApprovedBy: myEmail } : {},
      gate ? "Disetujui internal. Menunggu konfirmasi client." : "Disetujui.");
  };
  const clientApprove = (id) =>
    taskAction(id, "Approved", newActivity("client_approval", "Client sudah approve.", myName), {}, "Client approve dicatat.");
  const clientRevision = (id, note) =>
    note.trim() ? taskAction(id, "Revision", newActivity("client_revision", `Dari client: ${note}`, myName), {}, "Revisi client dicatat.") : null;
  // Setelah approve, PM/CS compile dulu jadi preview — itu yang jadi acuan Operations,
  // bukan link kerjaan mentah dari editor.
  const sendToOperations = (id, captionText, previewLink, postingDate) =>
    taskAction(id, "Ready to Post",
      newActivity("preview", `Preview siap${postingDate ? ` — target tayang ${fmtDate(postingDate)}` : ""}: ${previewLink}`, myName),
      { caption: captionText, previewLink, postingDate }, "Dikirim ke Operations.");
  const markDoneManual = (id) =>
    taskAction(id, "Done", newActivity("status", "Ditandai selesai.", myName), { completedAt: todayStr() }, "Ditandai selesai.");
  const returnToPM = (id, note) =>
    note.trim() ? taskAction(id, "Approved",
      newActivity("returned", `Dikembalikan ke PM: ${note}`, myName),
      { previewLink: "" }, "Dikembalikan ke PM.") : null;
  const markPosted = (id, liveLink) =>
    taskAction(id, "Done", newActivity("posted", liveLink, myName),
      { livePostLink: liveLink, postedAt: todayStr(), completedAt: todayStr() }, "Ditandai sudah tayang.");
  const addComment = (id, text) =>
    text.trim() ? taskAction(id, null, newActivity("comment", text, myName), {}, "Komentar terkirim.") : null;

  const addDocument = (doc) => run(
    () => db.collection(DOCUMENTS_COLLECTION).add({ ...doc, addedAt: new Date().toISOString(), addedByEmail: myEmail }),
    "Dokumen ditambahkan.");
  async function deleteDocument(id){
    if(!isAdmin) return;
    if(!window.confirm("Hapus dokumen ini dari daftar?")) return;
    await run(() => db.collection(DOCUMENTS_COLLECTION).doc(id).delete(), "Dokumen dihapus.");
  }

  // ID dokumen dibuat dari projectId, bukan nama client — nama client bisa berubah.
  function saveDailyLog(client, date, campaigns){
    const proj = projects.find(p => p.name === client);
    const key = proj ? proj.id : client.replace(/[^A-Za-z0-9]/g,"_");
    return run(() => db.collection(DAILY_LOG_COLLECTION).doc(`${date}_${key}`).set({
      date, client, projectId: proj ? proj.id : "", campaigns,
      updatedAt: new Date().toISOString(), updatedBy: myEmail,
    }, {merge:true}), "Log tersimpan.");
  }
  async function deleteDailyLog(id){
    if(!isAdmin) return;
    if(!window.confirm("Hapus log ini? Tidak bisa dibatalkan.")) return;
    await run(() => db.collection(DAILY_LOG_COLLECTION).doc(id).delete(), "Log dihapus.");
  }

  function saveClientQuota(client, patch){
    const existing = clientsMeta.find(c=>c.client===client);
    return run(() => existing
      ? db.collection(CLIENTS_META_COLLECTION).doc(existing.id).set(patch, {merge:true})
      : db.collection(CLIENTS_META_COLLECTION).add({ client, contentQuota:"", billingDate:"", ...patch }),
      "Kuota tersimpan.");
  }

  const upsertStaff = (email, data) => run(
    () => db.collection(STAFF_COLLECTION).doc(email.trim().toLowerCase())
      .set({ email: email.trim().toLowerCase(), ...data }, {merge:true}), "Staff tersimpan.");
  const archiveStaff = (email, active) => run(
    () => db.collection(STAFF_COLLECTION).doc(email).set({ active }, {merge:true}),
    active ? "Staff diaktifkan." : "Staff diarsipkan.");
  const deleteStaffDoc = (id) => run(
    () => db.collection(STAFF_COLLECTION).doc(id).delete(), "Data lama dihapus.");
  const addProject = (name) => run(
    () => db.collection(PROJECTS_COLLECTION).add({ name, active:true }), "Project ditambahkan.");
  const archiveProject = (id, active) => run(
    () => db.collection(PROJECTS_COLLECTION).doc(id).set({ active }, {merge:true}),
    active ? "Project diaktifkan." : "Project diarsipkan.");
  const addHoliday = (date, name) => run(
    () => db.collection(HOLIDAYS_COLLECTION).doc(date).set({ date, name }), "Hari libur ditambahkan.");
  const removeHoliday = (id) => run(
    () => db.collection(HOLIDAYS_COLLECTION).doc(id).delete(), "Hari libur dihapus.");
  const seedHolidays = () => run(async () => {
    const batch = db.batch();
    HOLIDAY_SEED_2026.forEach(([date,name]) => {
      batch.set(db.collection(HOLIDAYS_COLLECTION).doc(date), { date, name });
    });
    await batch.commit();
  }, "Hari libur 2026 diisi.");
  const seedProjects = () => run(async () => {
    const batch = db.batch();
    DEFAULT_PROJECTS.forEach(name => {
      batch.set(db.collection(PROJECTS_COLLECTION).doc(name.replace(/[^A-Za-z0-9]/g,"_")), { name, active:true });
    });
    await batch.commit();
  }, "Daftar client diisi.");

  if(!firebaseReady) return <SetupNotice error={firebaseError} />;
  if(user === undefined) return <div className="login-wrap"><div style={{color:"#fff"}}>Memuat...</div></div>;
  if(user === null) return <LoginScreen />;

  if(!activated){
    return (
      <div className="login-wrap">
        <img src={LOGO_WHITE} alt="UBAHdigital" className="login-logo" />
        <div className="login-card">
          <h2>Akun belum aktif</h2>
          <div className="sub" style={{marginBottom:16}}>
            Email kamu ({user.email}) sudah terdaftar. Admin akan mengisi nama dan job desk kamu —
            setelah itu tinggal muat ulang halaman ini.
          </div>
          <button className="btn btn-gold" style={{width:"100%",marginBottom:8}} onClick={()=>window.location.reload()}>Muat Ulang</button>
          <button className="btn btn-outline" style={{width:"100%"}} onClick={()=>auth.signOut()}>Keluar</button>
        </div>
      </div>
    );
  }

  const tabList = [
    "dashboard","tasks","posting",
    ...(canDocsHistory ? ["dokumen","history"] : []),
    "calendar",
    ...(isAdmin ? ["manage"] : []),
  ];
  const tabLabel = { dashboard:"Dashboard", tasks:"Task Tracker", posting:"Siap Posting",
    dokumen:"Dokumen", history:"Riwayat", calendar:"Calendar", manage:"Kelola" };
  const activeTab = tabList.includes(tab) ? tab : "dashboard";

  return (
    <div className="app">
      <div className="topbar" style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:10}}>
        <div style={{display:"flex",alignItems:"center",gap:12,minWidth:0}}>
          <img src={LOGO_WHITE} alt="UBAHdigital" style={{height:34}} />
          <div style={{minWidth:0}}>
            <div className="tag">#SAATNYABERUBAH</div>
            <h1>Tracker<span className="role-pill">{isAdmin ? "ADMIN" : (ROLES[myRole]||"TIM").toUpperCase()}</span></h1>
          </div>
        </div>
        <div style={{display:"flex",flexDirection:"column",gap:5,alignItems:"flex-end"}}>
          <div style={{fontSize:11,opacity:.9}}>{myName}</div>
          <div style={{display:"flex",gap:6}}>
            <button className="logout-btn" onClick={()=>setShowPwd(true)}>Password</button>
            <button className="logout-btn" onClick={()=>auth.signOut()}>Keluar</button>
          </div>
        </div>
      </div>

      <div className="tabs">
        {tabList.map(t => (
          <button key={t} className={"tab" + (activeTab===t ? " active":"")} onClick={()=>setTab(t)}>{tabLabel[t]}</button>
        ))}
      </div>

      <div className="content">
        {loading ? <div className="empty">Memuat data...</div> : (
          <>
            {activeTab==="dashboard" && (
              <Dashboard tasks={tasks} connected={connected} staffNames={staffNames} onNavigate={goToTasks}
                clientsMeta={clientsMeta} myName={myName} onOpenTask={setModalTask}
                canSeeWorkload={canSeeWorkload} canApprove={canApprove} />
            )}
            {activeTab==="tasks" && (
              <TaskList tasks={tasks} onEdit={setModalTask} onDelete={deleteTask} isAdmin={isAdmin}
                staffNames={staffNames} projectNames={projectNames}
                filterPic={filterPic} setFilterPic={setFilterPic}
                filterStatus={filterStatus} setFilterStatus={setFilterStatus}
                filterFlag={filterFlag} setFilterFlag={setFilterFlag}
                filterClient={filterClient} setFilterClient={setFilterClient} />
            )}
            {activeTab==="posting" && <ReadyToPostView tasks={tasks} onOpenTask={setModalTask} />}
            {activeTab==="dokumen" && canDocsHistory && (
              <DocumentsView tasks={tasks} projectNames={projectNames} documents={documents} myName={myName}
                isAdmin={isAdmin} onAddDocument={addDocument} onDeleteDocument={deleteDocument} busy={busy} />
            )}
            {activeTab==="history" && canDocsHistory && (
              <PostingHistoryView tasks={tasks} projectNames={projectNames} dailyLog={dailyLog}
                onSaveDailyLog={saveDailyLog} isAdmin={isAdmin} onDeleteDailyLog={deleteDailyLog} busy={busy} />
            )}
            {activeTab==="calendar" && (
              <CalendarView tasks={tasks} calMonth={calMonth} setCalMonth={setCalMonth} holidayMap={holidayMap} />
            )}
            {activeTab==="manage" && isAdmin && (
              <ManageView staffActive={staffActive} staffPending={staffPending} staffLegacy={staffLegacy}
                projects={projects} clientsMeta={clientsMeta}
                holidays={holidays} busy={busy}
                onUpsertStaff={upsertStaff} onArchiveStaff={archiveStaff} onDeleteStaffDoc={deleteStaffDoc}
                onAddProject={addProject} onArchiveProject={archiveProject}
                onSaveClientQuota={saveClientQuota}
                onAddHoliday={addHoliday} onRemoveHoliday={removeHoliday} onSeedHolidays={seedHolidays}
                onSeedProjects={seedProjects} />
            )}
          </>
        )}
      </div>

      {activeTab==="tasks" && <button className="fab" title="Task baru" onClick={()=>setModalTask(emptyTask())}>+</button>}

      {modalTask && (
        <TaskModal task={modalTask.id ? (tasks.find(t=>t.id===modalTask.id) || modalTask) : modalTask}
          onClose={()=>setModalTask(null)} onSave={saveTask} busy={busy}
          isAdmin={isAdmin} myRole={myRole} myEmail={myEmail} myName={myName}
          canApprove={canApprove} canMarkPosted={canMarkPosted}
          allowedCategories={allowedCategories}
          staffNames={staffNames} projectNames={projectNames} reviewerNames={reviewerNames}
          onSubmitForReview={submitForReview} onUpdateLinkAndResend={updateLinkAndResend}
          onRequestRevision={requestRevision} onApproveTask={approveTask}
          onClientApprove={clientApprove} onClientRevision={clientRevision}
          onSendToOperations={sendToOperations} onMarkDoneManual={markDoneManual} onReturnToPM={returnToPM}
          onMarkPosted={markPosted} onAddComment={addComment} />
      )}
      {showPwd && <PasswordModal onClose={()=>setShowPwd(false)} show={show} />}
      {toast && <div className={"toast " + toast.kind}>{toast.msg}</div>}
    </div>
  );
}

/* ===================== LOGIN & AKUN ===================== */
function LoginScreen(){
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [error, setError] = useState("");
  const [info, setInfo] = useState("");
  const [busy, setBusy] = useState(false);

  async function handleLogin(e){
    e.preventDefault();
    setError(""); setInfo(""); setBusy(true);
    try{
      await auth.signInWithEmailAndPassword(email.trim().toLowerCase(), password);
    }catch(err){
      setError("Login gagal — cek lagi email & password.");
    }
    setBusy(false);
  }
  async function handleReset(){
    setError(""); setInfo("");
    if(!email.trim()){ setError("Isi dulu email kamu di atas, baru tekan Lupa Password."); return; }
    try{
      await auth.sendPasswordResetEmail(email.trim().toLowerCase());
      setInfo("Email reset sudah dikirim. Cek inbox — kalau tidak ada, cek folder Spam.");
    }catch(err){
      setInfo("Kalau email itu terdaftar, link reset sudah dikirim. Cek inbox dan folder Spam.");
    }
  }

  return (
    <div className="login-wrap">
      <img src={LOGO_WHITE} alt="UBAHdigital" className="login-logo" />
      <div className="login-card">
        <h2>Tracker</h2>
        <div className="sub">Masuk pakai email kamu sendiri.</div>
        {error && <div className="login-error">{error}</div>}
        {info && <div style={{background:"#DFF3E8",color:"var(--green)",padding:"8px 10px",borderRadius:8,fontSize:12,marginBottom:12}}>{info}</div>}
        <form onSubmit={handleLogin}>
          <div className="field">
            <label htmlFor="lg-email">Email</label>
            <input id="lg-email" type="email" value={email} onChange={e=>setEmail(e.target.value)} required autoCapitalize="none" autoComplete="username" />
          </div>
          <div className="field">
            <label htmlFor="lg-pass">Password</label>
            <input id="lg-pass" type="password" value={password} onChange={e=>setPassword(e.target.value)} required autoComplete="current-password" />
          </div>
          <button className="btn btn-gold" type="submit" style={{width:"100%"}} disabled={busy}>
            {busy ? "Memproses..." : "Masuk"}
          </button>
        </form>
        <button className="btn btn-outline btn-sm" style={{width:"100%",marginTop:10}} onClick={handleReset}>Lupa Password</button>
      </div>
    </div>
  );
}

function PasswordModal({onClose, show}){
  const [p1, setP1] = useState("");
  const [p2, setP2] = useState("");
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");

  async function submit(){
    setErr("");
    if(p1.length < 6){ setErr("Password minimal 6 karakter."); return; }
    if(p1 !== p2){ setErr("Dua isian password belum sama."); return; }
    setBusy(true);
    try{
      await auth.currentUser.updatePassword(p1);
      show("Password berhasil diganti.","ok");
      onClose();
    }catch(e){
      setErr(e.code === "auth/requires-recent-login"
        ? "Demi keamanan, keluar dulu lalu masuk lagi, baru ganti password."
        : friendlyError(e));
    }
    setBusy(false);
  }

  return (
    <div className="modal-bg" onMouseDown={e=>{ if(e.target===e.currentTarget) onClose(); }}>
      <div className="modal" style={{maxWidth:400}}>
        <div className="section-title">Ganti Password</div>
        {err && <div className="login-error">{err}</div>}
        <div className="field">
          <label htmlFor="np1">Password Baru</label>
          <input id="np1" type="password" value={p1} onChange={e=>setP1(e.target.value)} autoComplete="new-password" />
        </div>
        <div className="field">
          <label htmlFor="np2">Ulangi Password Baru</label>
          <input id="np2" type="password" value={p2} onChange={e=>setP2(e.target.value)} autoComplete="new-password" />
        </div>
        <div className="modal-actions">
          <button className="btn btn-outline" onClick={onClose}>Batal</button>
          <button className="btn btn-gold" onClick={submit} disabled={busy}>{busy ? "Menyimpan..." : "Simpan"}</button>
        </div>
      </div>
    </div>
  );
}

function SetupNotice({error}){
  return (
    <div className="setup-box">
      <b>Firebase belum tersambung.</b><br/><br/>
      Buka <code>index.html</code>, cari blok <code>firebaseConfig</code>, lalu pastikan isinya sama dengan
      config di Firebase Console (Project Settings → General → Your apps).<br/><br/>
      {error && <>Pesan teknis: <code>{error}</code><br/><br/></>}
      Setelah diperbaiki, simpan file lalu muat ulang halaman ini.
    </div>
  );
}

/* ===================== KELOLA ===================== */
function ManageView({staffActive, staffPending, staffLegacy, projects, clientsMeta, holidays, busy,
  onUpsertStaff, onArchiveStaff, onDeleteStaffDoc, onAddProject, onArchiveProject, onSaveClientQuota,
  onAddHoliday, onRemoveHoliday, onSeedHolidays, onSeedProjects}){
  const [newProject, setNewProject] = useState("");
  const [mEmail, setMEmail] = useState("");
  const [mName, setMName] = useState("");
  const [mRole, setMRole] = useState("pm");
  const [holDate, setHolDate] = useState("");
  const [holName, setHolName] = useState("");

  const active = staffActive;
  const archived = staffPending.filter(s => s.role && s.active === false);
  const approverCount = active.filter(s => APPROVER_ROLES.includes(s.role)).length;

  return (
    <div>
      {approverCount < 2 && (
        <div className="warn-box">
          <b>Perhatian:</b> baru ada {approverCount} orang ber-job desk PM / Content Strategist.
          Gerbang approval butuh minimal 2 orang — kalau cuma 1, konfirmasi client akan sering mentok
          dan harus ditembus Admin.
        </div>
      )}

      {staffPending.filter(s => !s.role).length > 0 && (
        <div className="card pending-box">
          <div className="section-title">Menunggu Aktivasi ({staffPending.filter(s => !s.role).length})</div>
          <div className="locked-note">Orang-orang ini sudah login sekali. Isi nama dan job desk-nya supaya bisa mulai kerja.</div>
          {staffPending.filter(s => !s.role).map(s => <PendingRow key={s.id} row={s} onSave={onUpsertStaff} busy={busy} />)}
        </div>
      )}

      <div className="card">
        <div className="section-title">Staff Aktif ({active.length})</div>
        {active.map(s => <StaffRow key={s.id} row={s} onSave={onUpsertStaff} onArchive={onArchiveStaff} busy={busy} />)}
        {active.length===0 && <div style={{color:"var(--grey)",fontSize:13}}>Belum ada staff aktif.</div>}

        <div style={{marginTop:16,paddingTop:12,borderTop:"1px solid var(--line)"}}>
          <div style={{fontWeight:700,fontSize:13,marginBottom:8}}>Tambah Manual</div>
          <div className="locked-note">Biasanya tidak perlu — nama muncul sendiri di "Menunggu Aktivasi" setelah orangnya login sekali.</div>
          <div className="field"><label htmlFor="ms-email">Email login</label>
            <input id="ms-email" value={mEmail} onChange={e=>setMEmail(e.target.value)} placeholder="nama@gmail.com" autoCapitalize="none" /></div>
          <div className="row2">
            <div className="field"><label htmlFor="ms-name">Nama</label>
              <input id="ms-name" value={mName} onChange={e=>setMName(e.target.value)} placeholder="mis. Dhanty" /></div>
            <div className="field"><label htmlFor="ms-role">Job Desk</label>
              <select id="ms-role" value={mRole} onChange={e=>setMRole(e.target.value)}>
                {Object.entries(ROLES).map(([k,v])=><option key={k} value={k}>{v}</option>)}
              </select></div>
          </div>
          <button className="btn btn-gold btn-sm" disabled={busy} onClick={async ()=>{
            if(!mEmail.trim() || !mName.trim()) return;
            const ok = await onUpsertStaff(mEmail, { name:mName.trim(), role:mRole, active:true });
            if(ok){ setMEmail(""); setMName(""); }
          }}>Tambah Staff</button>
        </div>

        {archived.length>0 && (
          <div style={{marginTop:16,paddingTop:12,borderTop:"1px solid var(--line)"}}>
            <div style={{fontWeight:700,fontSize:13,marginBottom:6}}>Diarsipkan ({archived.length})</div>
            <div className="locked-note">Riwayat task mereka tetap utuh. Bisa diaktifkan lagi kapan saja.</div>
            {archived.map(s => (
              <div key={s.id} className="manage-row">
                <span style={{color:"var(--grey)"}}>{s.name || s.id} · {ROLES[s.role]||"-"}</span>
                <button className="btn btn-outline btn-sm" disabled={busy} onClick={()=>onArchiveStaff(s.id, true)}>Aktifkan</button>
              </div>
            ))}
          </div>
        )}
      </div>

      {staffLegacy.length > 0 && (
        <div className="card" style={{borderLeft:"4px solid var(--red)"}}>
          <div className="section-title">Data Staff Lama ({staffLegacy.length})</div>

function DocumentsView({tasks, projectNames, documents, myName, isAdmin, onAddDocument, onDeleteDocument, busy}){
  const [openClient, setOpenClient] = useState(null);
  const [q, setQ] = useState("");

  // Satu kali hitung untuk semua client — bukan sekali per client di dalam map.
  const counts = useMemo(() => {
    const m = new Map();
    const bump = c => m.set(c, (m.get(c)||0) + 1);
    tasks.forEach(t => { if(DOC_TASK_CATEGORIES.includes(t.category) && t.link) bump(t.client); });
    documents.forEach(d => bump(d.client));
    return m;
  }, [tasks, documents]);

  const globalHits = useMemo(() => {
    if(!q.trim()) return null;
    const k = q.toLowerCase();
    return documents.filter(d => (d.title||"").toLowerCase().includes(k) || (d.client||"").toLowerCase().includes(k));
  }, [q, documents]);

  if(openClient){
    return <ClientDocuments client={openClient} tasks={tasks} documents={documents} myName={myName}
      isAdmin={isAdmin} onAddDocument={onAddDocument} onDeleteDocument={onDeleteDocument}
      onBack={()=>setOpenClient(null)} busy={busy} />;
  }

  return (
    <div>
      <div style={{fontSize:12,color:"var(--grey)",marginBottom:10}}>
        Pilih brand untuk melihat semua dokumen — report, company profile, kontrak, ideation,
        dan file kerjaan yang sudah di-approve.
      </div>
      <div className="filter-row">
        <input placeholder="Cari dokumen di semua client..." value={q} onChange={e=>setQ(e.target.value)} style={{flex:1}} />
      </div>

      {globalHits ? (
        <>
          <div className="section-title" style={{fontSize:13}}>Hasil pencarian ({globalHits.length})</div>
          {globalHits.length===0 && <div className="empty">Tidak ada dokumen yang cocok.</div>}
          {globalHits.map(d => (
            <div key={d.id} className="card">
              <span className="badge badge-grey">{d.docType}</span>
              <div style={{fontSize:13,fontWeight:700,margin:"5px 0 2px"}}>{d.title}</div>
              <div style={{fontSize:11,color:"var(--gold)",fontWeight:700,marginBottom:3}}>{d.client}{d.period ? " · " + d.period : ""}</div>
              <ExternalLink href={d.link} style={{fontSize:12,color:"var(--brand-deep)",wordBreak:"break-all"}}>{d.link}</ExternalLink>
            </div>
          ))}
        </>
      ) : (
        projectNames.map(p => (
          <button key={p} className="card card-btn"
            style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}
            onClick={()=>setOpenClient(p)}>
            <span style={{fontWeight:700,fontSize:13}}>{p}</span>
            <span className="badge badge-grey">{counts.get(p)||0} dokumen</span>
          </button>
        ))
      )}
    </div>
  );
}

function ReadyToPostView({tasks, onOpenTask}){
  const today = todayStr();
  const ready = useMemo(() => tasks.filter(t => t.status==="Ready to Post")
    .sort((a,b)=> (a.postingDate||"9999").localeCompare(b.postingDate||"9999")), [tasks]);
  const [copied, setCopied] = useState("");

  function copyCaption(text, id){
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(()=>{
        setCopied(id);
        setTimeout(()=>setCopied(""), 2000);
      }).catch(()=>{});
    }
  }
  function postingFlag(t){
    if(!t.postingDate) return null;
    const diff = daysBetween(today, t.postingDate);
    if(diff < 0) return {label:`TELAT ${Math.abs(diff)} HARI`, cls:"badge-red"};
    if(diff === 0) return {label:"POSTING HARI INI", cls:"badge-yellow"};
    if(diff <= 2) return {label:`${diff} HARI LAGI`, cls:"badge-yellow"};
    return {label:fmtDate(t.postingDate), cls:"badge-grey"};
  }

  return (
    <div>
      {ready.length===0 && <div className="empty">Belum ada konten yang siap posting.</div>}
      {ready.map(t => {
        const pf = postingFlag(t);
        return (
          <div key={t.id} className="card">
            <div onClick={()=>onOpenTask(t)} style={{cursor:"pointer"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:8}}>
                <div style={{fontSize:11,color:"var(--gold)",fontWeight:800}}>{t.client}</div>
                {pf && <span className={"badge " + pf.cls} style={{flexShrink:0}}>{pf.label}</span>}
              </div>
              <div style={{fontSize:13,fontWeight:700,margin:"3px 0"}}>{t.subtasks[0] ? t.subtasks[0].description : "-"}</div>
              <div style={{fontSize:11,color:"var(--grey)",marginBottom:6}}>
                {t.postingDate ? `Target tayang ${fmtDate(t.postingDate)}` : "Belum ada target tayang"}
              </div>
            </div>

            {t.previewLink ? (
              <div style={{background:"var(--offwhite)",borderRadius:8,padding:10,marginBottom:8}}>
                <div style={{fontSize:11,fontWeight:800,color:"var(--brand-deep)",marginBottom:3}}>PREVIEW — INI YANG DIPOSTING</div>
                <ExternalLink href={t.previewLink} style={{fontSize:12,color:"var(--brand-deep)",wordBreak:"break-all",fontWeight:700}}>{t.previewLink}</ExternalLink>
              </div>
            ) : (
              <div className="locked-note">Belum ada link preview — minta PM/CS meng-compile dulu.</div>
            )}

            {t.caption && (
              <>
                <div style={{fontSize:12,background:"var(--offwhite)",borderRadius:6,padding:8,whiteSpace:"pre-wrap",marginBottom:6}}>{t.caption}</div>
                <button className="btn btn-outline btn-sm" onClick={()=>copyCaption(t.caption, t.id)}>
                  {copied===t.id ? "Tersalin" : "Salin Caption"}
                </button>
              </>
            )}

            <details style={{marginTop:8}}>
              <summary style={{fontSize:11,color:"var(--grey)",cursor:"pointer"}}>Lihat file asli & brief</summary>
              <div style={{paddingTop:6}}>
                {t.link && <div style={{fontSize:11,marginBottom:3}}>File kerjaan: <ExternalLink href={t.link} style={{color:"var(--grey)"}}>{t.link}</ExternalLink></div>}
                {t.briefLink && <div style={{fontSize:11}}>Brief: <ExternalLink href={t.briefLink} style={{color:"var(--grey)"}}>{t.briefLink}</ExternalLink></div>}
              </div>
            </details>
          </div>
        );
      })}
    </div>
  );
}
