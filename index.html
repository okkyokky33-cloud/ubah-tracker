<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>UBAHdigital Tracker</title>
<link rel="icon" href="data:,">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<style>
  :root{
    /* Netral sejuk — bukan krem, supaya tidak bentrok dengan ungu brand */
    --bg:#F6F6F9; --surface:#FFFFFF; --line:#E8E8EE; --line-soft:#F0F0F4;
    --ink:#1E1B2E; --ink-2:#5A5670; --ink-3:#8B8798;
    --offwhite:#FAFAFC;
    /* Brand tetap, tapi turun pangkat jadi aksen */
    --brand:#6B2FB5; --brand-2:#9A2D71;
    --brand-gradient:linear-gradient(120deg,#8B2A85 0%,#6B2FB5 100%);
    /* Semantik diredam: masih terbaca, tidak menyilaukan */
    --late:#A82C56; --late-bg:#FCEFF3;
    --soon:#8A6410; --soon-bg:#FBF3E2;
    --ok:#1D6B4C;   --ok-bg:#E9F3ED;
    --calm:#5A5670; --calm-bg:#F1F1F5;
    --post:#5B3FA8; --post-bg:#EFEBFA;
  }
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{margin:0;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;}
  .app{max-width:1000px;margin:0 auto;padding-bottom:70px;}

  .topbar{background:var(--brand-gradient);color:#fff;padding:14px 18px 16px;position:sticky;top:0;z-index:20;}
  .topbar h1{margin:1px 0 0;font-size:19px;font-weight:680;letter-spacing:-.3px;}
  .topbar .tag{font-size:9.5px;letter-spacing:1.4px;font-weight:700;opacity:.72;}
  .logout-btn{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);color:#fff;
    border-radius:8px;padding:5px 10px;font:inherit;font-size:11px;font-weight:600;cursor:pointer;}
  .role-pill{display:inline-block;background:rgba(255,255,255,.95);color:var(--brand);font-size:9px;
    font-weight:800;padding:2px 8px;border-radius:999px;margin-left:7px;letter-spacing:.7px;vertical-align:middle;}

  .tabs{display:flex;gap:6px;padding:12px 14px 2px;overflow-x:auto;background:var(--bg);}
  .tabs::-webkit-scrollbar{display:none;}
  .tab{flex:0 0 auto;padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);
    color:var(--ink-2);font:inherit;font-size:12.5px;font-weight:560;cursor:pointer;white-space:nowrap;}
  .tab.active{background:var(--ink);border-color:var(--ink);color:#fff;}
  .tab:focus-visible{outline:2px solid var(--brand);outline-offset:2px;}

  .content{padding:12px 14px 0;}

  .card{background:var(--surface);border-radius:14px;padding:14px;margin-bottom:10px;position:relative;overflow:hidden;
    box-shadow:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.05);}
  /* Tulang punggung kiri = urgensi. Kartu tenang tidak berwarna sama sekali. */
  .card.sp-late::before,.card.sp-soon::before,.card.sp-post::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;}
  .card.sp-late::before{background:var(--late);}
  .card.sp-soon::before{background:var(--soon);}
  .card.sp-post::before{background:var(--post);}
  .card-btn{display:block;width:100%;text-align:left;border:none;font-family:inherit;color:inherit;cursor:pointer;}
  .card-btn:focus-visible{outline:2px solid var(--brand);outline-offset:2px;}

  .kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px;margin-bottom:14px;}
  .kpi{background:var(--surface);border-radius:13px;padding:12px 13px 11px;position:relative;overflow:hidden;
    box-shadow:0 1px 2px rgba(16,24,40,.04);border:none;font:inherit;color:inherit;text-align:left;width:100%;cursor:pointer;display:block;}
  .kpi::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:0 3px 3px 0;background:var(--ink);}
  .kpi.k-late::before{background:var(--late);}
  .kpi.k-soon::before{background:var(--soon);}
  .kpi.k-brand::before{background:var(--brand);}
  .kpi.k-ok::before{background:var(--ok);}
  .kpi .num{font-size:29px;font-weight:660;letter-spacing:-1.2px;font-variant-numeric:tabular-nums;line-height:1.05;}
  .kpi .lbl{font-size:10px;font-weight:640;letter-spacing:.7px;color:var(--ink-3);text-transform:uppercase;margin-top:2px;}

  .section-title{font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--ink-3);margin:0 0 8px;}

  .badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:999px;font-size:10.5px;
    font-weight:640;letter-spacing:.2px;white-space:nowrap;}
  .badge-red{background:var(--late-bg);color:var(--late);}
  .badge-yellow{background:var(--soon-bg);color:var(--soon);}
  .badge-green{background:var(--ok-bg);color:var(--ok);}
  .badge-grey{background:var(--calm-bg);color:var(--calm);}
  .badge-purple{background:var(--post-bg);color:var(--post);}

  .btn{background:var(--ink);color:#fff;border:none;border-radius:10px;padding:9px 15px;font:inherit;
    font-size:12.5px;font-weight:620;cursor:pointer;}
  .btn:disabled{opacity:.4;cursor:not-allowed;}
  .btn-gold{background:var(--brand);color:#fff;}
  .btn-outline{background:var(--surface);color:var(--ink-2);border:1px solid var(--line);}
  .btn-sm{padding:6px 12px;font-size:11.5px;border-radius:8px;}
  .fab{position:fixed;bottom:22px;right:22px;background:var(--brand);color:#fff;border:none;width:54px;height:54px;
    border-radius:27px;font-size:26px;box-shadow:0 6px 18px rgba(107,47,181,.35);cursor:pointer;z-index:15;}

  .modal-bg{position:fixed;inset:0;background:rgba(30,27,46,.42);display:flex;align-items:flex-end;justify-content:center;z-index:30;}
  .modal{background:var(--surface);width:100%;max-width:520px;max-height:92vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:20px;}
  @media(min-width:640px){.modal-bg{align-items:center;}.modal{border-radius:18px;}}

  .field{margin-bottom:12px;}
  .field label{display:block;font-size:11.5px;font-weight:620;color:var(--ink-2);margin-bottom:5px;}
  .field input,.field select,.field textarea{width:100%;padding:10px 11px;border:1px solid var(--line);
    border-radius:10px;font:inherit;font-size:14px;background:var(--surface);color:var(--ink);}
  .field input:focus,.field textarea:focus,.field select:focus{outline:2px solid var(--brand);outline-offset:-1px;border-color:transparent;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .modal-actions{display:flex;gap:10px;margin-top:16px;}
  .modal-actions .btn{flex:1;}
  .empty{text-align:center;padding:38px 20px;color:var(--ink-3);font-size:13.5px;}
  .locked-note{font-size:11.5px;color:var(--ink-3);line-height:1.55;margin:5px 0 10px;}
  .add-row{display:flex;gap:8px;margin-top:12px;}
  .add-row input{flex:1;padding:10px 11px;border:1px solid var(--line);border-radius:10px;font:inherit;font-size:14px;}
  .manage-row{display:flex;justify-content:space-between;align-items:center;padding:11px 0;
    border-bottom:1px solid var(--line-soft);font-size:13.5px;gap:8px;}
  .manage-row:last-child{border-bottom:none;}

  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
  .cal-head{font-size:9.5px;font-weight:700;letter-spacing:.5px;color:var(--ink-3);text-align:center;padding:4px 0;text-transform:uppercase;}
  .cal-cell{background:var(--surface);border-radius:9px;min-height:76px;padding:5px;font-size:10px;border:1px solid var(--line-soft);}
  .cal-cell.dim{opacity:.35;}
  .cal-cell.holiday{background:var(--late-bg);border-color:transparent;}
  .cal-cell.today{border:1.5px solid var(--brand);}
  .cal-date{font-weight:700;font-size:11.5px;margin-bottom:3px;font-variant-numeric:tabular-nums;}
  .cal-count{background:var(--ink);color:#fff;border-radius:6px;padding:3px 5px;font-size:9.5px;font-weight:700;
    text-align:center;cursor:pointer;margin-top:2px;border:none;width:100%;font-family:inherit;}
  .cal-event{background:var(--calm-bg);color:var(--calm);border-radius:5px;padding:2px 4px;margin-bottom:2px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;border:none;width:100%;
    text-align:left;font-family:inherit;font-size:9.5px;font-weight:560;}
  .cal-event.billing{background:var(--ok-bg);color:var(--ok);}
  .cal-event.post{background:var(--post-bg);color:var(--post);font-weight:640;}
  .cal-holname{color:var(--late);font-weight:700;font-size:8.5px;margin-bottom:2px;}
  .month-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .month-nav button{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:9px;
    width:34px;height:34px;font-size:16px;cursor:pointer;}
  .month-nav .label{font-size:16px;font-weight:640;letter-spacing:-.2px;}

  .filter-row{display:flex;gap:8px;margin-bottom:10px;overflow-x:auto;padding-bottom:2px;}
  .filter-row select,.filter-row input{padding:8px 10px;border-radius:10px;border:1px solid var(--line);
    font:inherit;font-size:12.5px;background:var(--surface);color:var(--ink);}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;}
  .chip{padding:6px 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);
    font:inherit;font-size:12px;font-weight:600;color:var(--ink-2);cursor:pointer;white-space:nowrap;}
  .chip.on{background:var(--ink);color:#fff;border-color:var(--ink);}

  .legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--ink-3);margin-top:12px;}
  .legend span{display:inline-flex;align-items:center;gap:5px;}
  .dot{width:9px;height:9px;border-radius:3px;display:inline-block;}
  .conn-dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:6px;}

  .setup-box{background:#FFF9E8;border:1px solid #EBD9A0;border-radius:14px;padding:16px;margin:16px;
    font-size:13px;line-height:1.6;color:#6B5410;}
  .setup-box code{background:rgba(0,0,0,.06);padding:2px 6px;border-radius:5px;font-size:12px;}
  .warn-box{background:#FFF9E8;border:1px solid #EBD9A0;border-radius:12px;padding:12px;font-size:12.5px;
    margin-bottom:12px;line-height:1.6;color:#6B5410;}
  .pending-box{background:#FFF9E8;border:1px solid #EBD9A0;}

  .login-wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:var(--brand-gradient);padding:20px;}
  .login-logo{width:132px;margin-bottom:26px;}
  .login-card{background:var(--surface);border-radius:18px;padding:26px 22px;width:100%;max-width:360px;
    box-shadow:0 10px 40px rgba(30,27,46,.18);}
  .login-card h2{margin:0 0 3px;font-size:20px;font-weight:660;letter-spacing:-.3px;}
  .login-card .sub{color:var(--ink-3);font-size:12.5px;margin-bottom:18px;}
  .login-error{background:var(--late-bg);color:var(--late);padding:9px 11px;border-radius:10px;font-size:12.5px;margin-bottom:12px;}

  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;z-index:60;padding:11px 16px;
    border-radius:12px;font-size:13px;font-weight:600;color:#fff;max-width:92vw;box-shadow:0 8px 24px rgba(30,27,46,.28);}
  .toast.ok{background:var(--ok);} .toast.err{background:var(--late);}

  .agenda-day{margin-bottom:6px;}
  .agenda-date{font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--brand);
    padding:6px 0 7px;border-bottom:1px solid var(--line);margin:14px 0 9px;}
  .agenda-date.hol{color:var(--late);}
  .stack{background:var(--offwhite);border:1px solid var(--line-soft);border-radius:12px;padding:12px;margin-bottom:10px;}
  .eyebrow{font-size:9.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--post);margin-bottom:4px;}
  .client-line{font-size:10.5px;font-weight:700;letter-spacing:.5px;color:var(--brand-2);text-transform:uppercase;}
  .task-title{font-size:14.5px;font-weight:600;letter-spacing:-.15px;margin:4px 0 3px;}
  .meta-line{font-size:12px;color:var(--ink-3);}
  .btn-onbrand{background:#fff;color:var(--brand);}
  .row-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .row-mid{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;}
  .row-inline{display:flex;align-items:center;gap:8px;}
  .divider{height:1px;background:var(--line);margin:14px 0;}
  .hint-block{font-size:12px;color:var(--ink-3);margin-bottom:10px;}
  .link-brand{color:var(--brand);word-break:break-all;}
  .mini-label{font-size:11px;color:var(--ink-3);font-weight:600;display:block;margin-bottom:4px;}
  .inp-sm{width:100%;padding:8px;border:1px solid var(--line);border-radius:6px;font-size:13px;font-family:inherit;
    background:var(--surface);color:var(--ink);}
  .link-sm{font-size:12px;color:var(--brand);word-break:break-all;}
  .disc{font-size:11.5px;color:var(--ink-3);cursor:pointer;}
  .inp{width:100%;padding:9px;border:1px solid var(--line);border-radius:9px;font-family:inherit;
    font-size:13.5px;background:var(--surface);color:var(--ink);}
  .inp:focus{outline:2px solid var(--brand);outline-offset:-1px;border-color:transparent;}
  .today-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line-soft);
    width:100%;background:none;border-left:none;border-right:none;border-top:none;font:inherit;color:inherit;
    text-align:left;cursor:pointer;}
  .today-row:last-child{border-bottom:none;}
  .today-time{font-size:14px;font-weight:680;letter-spacing:-.3px;font-variant-numeric:tabular-nums;
    min-width:52px;flex-shrink:0;}
  .today-late .today-time{color:var(--late);}
  .today-soon .today-time{color:var(--soon);}
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useMemo, useCallback, useRef } = React;

/* ===================== CONFIG ===================== */
const firebaseConfig = {
  apiKey: "AIzaSyAp3pc0-U1bSbB1pWtDTNIBjGI8Emq9Uys",
  authDomain: "ubah-project-tracker.firebaseapp.com",
  projectId: "ubah-project-tracker",
  storageBucket: "ubah-project-tracker.firebasestorage.app",
  messagingSenderId: "255038719115",
  appId: "1:255038719115:web:31d4d2ed0192d96bd8808e",
};
const COLLECTION = "ubah_tracker_tasks";
const STAFF_COLLECTION = "ubah_tracker_staff";
const PROJECTS_COLLECTION = "ubah_tracker_projects";
const DOCUMENTS_COLLECTION = "ubah_tracker_documents";
const DAILY_LOG_COLLECTION = "ubah_tracker_daily_log";
const HOLIDAYS_COLLECTION = "ubah_tracker_holidays";
// Gambar disimpan di dokumen terpisah, bukan di dalam task — supaya tidak ikut terunduh
// setiap kali aplikasi dibuka. Hanya diambil saat modal task benar-benar dibuka.
const IMAGES_COLLECTION = "ubah_tracker_images";
// Papan catatan tempel khusus Standup — sengaja TERPISAH dari ubah_tracker_tasks.
// Sifatnya sekali pakai: bebas ditulis siapa saja, dihapus begitu selesai dibahas,
// tidak pernah menyentuh sistem client/kategori/status/Rules milik task sungguhan.
const STANDUP_NOTES_COLLECTION = "ubah_tracker_standup_notes";
// Sales tracking — dipisah dari task & standup karena datanya beda sifat:
// ini progres closing, bukan pekerjaan produksi. Cuma Admin + PM yang bisa lihat.
const SALES_COLLECTION = "ubah_tracker_sales";
const SALES_STAGES = [
  { key:"lead",      label:"Lead Baru" },
  { key:"prospek",   label:"Prospek" },
  { key:"penawaran", label:"Penawaran" },
  { key:"nego",      label:"Negosiasi" },
  { key:"closing",   label:"Closing" },
];
// Klien lama yang ditawari layanan tambahan — tahapannya lebih pendek
// karena hubungannya sudah ada, tinggal soal ditawarkan atau belum.
const UPSELL_STAGES = [
  { key:"peluang",     label:"Ada Peluang" },
  { key:"ditawarkan",  label:"Sudah Ditawarkan" },
  { key:"selesai",     label:"Deal / Tidak" },
];
const SALES_RESULTS = [
  { key:"",      label:"Belum ditentukan", cls:"badge-grey" },
  { key:"deal",  label:"Deal",             cls:"badge-green" },
  { key:"batal", label:"Tidak Jadi",       cls:"badge-red" },
];
function salesResult(key){
  return SALES_RESULTS.find(r => r.key === (key||"")) || SALES_RESULTS[0];
}
function stagesFor(board){ return board === "upsell" ? UPSELL_STAGES : SALES_STAGES; }
const STANDUP_NOTE_COLUMNS = [
  { key:"todo",     label:"To Do List" },
  { key:"progress", label:"On Progress" },
  { key:"hold",     label:"On Hold" },
];
// Prioritas catatan standup — ditandai titik warna, bukan badge besar,
// supaya kartu tetap ringkas dan enak dibaca pas screen-share.
const NOTE_PRIORITIES = [
  { key:"high",   label:"Tinggi", color:"var(--late)" },
  { key:"normal", label:"Sedang", color:"var(--ink-3)" },
  { key:"low",    label:"Rendah", color:"var(--line)" },
];
function notePriority(key){
  return NOTE_PRIORITIES.find(p => p.key === key) || NOTE_PRIORITIES[1];
}
// Catatan lama menyimpan 'mention' sebagai satu nama (string); yang baru pakai
// 'mentions' berupa array. Dibaca lewat satu pintu supaya keduanya tetap jalan.
function noteMentions(note){
  if(!note) return [];
  if(Array.isArray(note.mentions)) return note.mentions.filter(Boolean);
  return note.mention ? [note.mention] : [];
}
// Batas aman jumlah task yang ditarik sekali jalan. Kalau tercapai, aplikasi
// memberi peringatan — bukan diam-diam menyembunyikan task seperti sebelumnya.
const TASK_LIMIT = 800;
const MAX_IMG_WIDTH = 900;
const IMG_QUALITY = 0.55;
const MAX_IMG_BYTES = 140 * 1024;   // batas per gambar setelah dikompres
const MAX_IMG_COUNT = 4;

const DOCUMENT_TYPES = ["Report","Proposal","Company Profile","Kontrak","Ideation","Lainnya"];
const DOC_TASK_CATEGORIES = ["Strategy","Proposal","Website","Content Brief","Report"];

// Admin dikenali dari email. admin@ubahdigital.app tetap disimpan sebagai
// jalan cadangan sampai akun Gmail terbukti bisa masuk.
const ADMIN_EMAILS = [
  "admin@ubahdigital.app",
  "okkyokky33@gmail.com",
  "assanuraga@gmail.com",
];

/* ===================== ROLE ===================== */
const ROLES = {
  pm:               "Project Manager",
  strategist:       "Content Strategist",
  planner:          "Content Planner",
  video_editor:     "Video Editor",
  graphic_designer: "Graphic Designer",
  operations:       "Operations",
};
// Kategori yang boleh dibuat tiap role. Role yang tidak terdaftar = bebas semua.
const ROLE_CATEGORIES = {
  planner:          ["Content Brief"],
  video_editor:     ["Video Editing"],
  graphic_designer: ["Graphic Design"],
  operations:       ["Paid Ads","Report"],
};
// Role yang wajar mengerjakan tiap kategori. Dipakai menyaring pilihan PIC
// supaya Operations tidak bisa kepilih jadi PIC file video.
const CATEGORY_ROLES = {
  "Video Editing":          ["video_editor"],
  "Graphic Design":         ["graphic_designer"],
  "Moodboard & Storyboard": ["graphic_designer"],
  "Content Brief":          ["planner","strategist"],
  "Paid Ads":               ["operations"],
  "Report":                 ["operations"],
  "Strategy":               ["pm","strategist"],
  "Proposal":               ["pm","strategist"],
  "Production":             ["video_editor","graphic_designer","pm"],
};
const APPROVER_ROLES   = ["pm","strategist"];
const DOCS_ROLES       = ["pm","strategist","operations"];
const POSTING_ROLES    = ["pm","strategist","operations"];
const SALES_ROLES      = ["pm"];   // + admin, dicek terpisah
const WORKLOAD_ROLES   = ["pm","strategist"];

const DEFAULT_PROJECTS = ["N Beauty","Nuris","Nirwana Hill","PNR","Solid Gradino","UBAHdigital","UBAHproperty","Xvantages","Other"];

const CATEGORIES = ["Strategy","Proposal","Video Editing","Graphic Design","Moodboard & Storyboard","Paid Ads","Production","Website","Content Brief","Billing","Report","Meeting","Catatan Client"];
const PRIORITIES = ["High","Medium","Low"];
const STATUSES = ["Not Started","In Progress","Waiting Review","Revision","Approved","Menunggu Approval Klien","Ready to Post","On Hold","Done"];

// Kategori yang lewat alur review (Waiting Review -> Approved/Revision) sebelum Done.
// Production sengaja TIDAK masuk sini — itu jadwal shooting, bukan file yang direview.
const REVIEW_CATEGORIES = ["Video Editing","Graphic Design","Moodboard & Storyboard","Website","Content Brief","Strategy","Report","Proposal"];

/* ===================== HELPERS ===================== */
function isReviewCategory(cat){ return REVIEW_CATEGORIES.includes(cat); }

function toLocalISO(d){
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,"0");
  const dd = String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${dd}`;
}
function todayStr(){ return toLocalISO(new Date()); }
function fmtDate(s){ if(!s) return "-"; const d=new Date(s+"T00:00:00"); return d.toLocaleDateString("id-ID",{day:"2-digit",month:"short",year:"2-digit"}); }
// Pakai UTC supaya selisih hari tidak bergeser kalau zona waktu perangkat berubah.
function daysBetween(a,b){
  const pa = a.split("-").map(Number), pb = b.split("-").map(Number);
  return Math.round((Date.UTC(pb[0],pb[1]-1,pb[2]) - Date.UTC(pa[0],pa[1]-1,pa[2]))/86400000);
}

// Tolak skema berbahaya (javascript:, data:) sebelum link dipasang ke href.
const SAFE_PROTOCOLS = ["http:","https:"];
function safeUrl(raw){
  if(!raw) return null;
  const s = String(raw).trim();
  if(!s) return null;
  try{
    const u = new URL(s);
    return SAFE_PROTOCOLS.includes(u.protocol) ? u.href : null;
  }catch(e){
    try{
      const u2 = new URL("https://" + s);
      return u2.hostname.includes(".") ? u2.href : null;
    }catch(e2){ return null; }
  }
}
function ExternalLink({href, children, style, onClick}){
  const safe = safeUrl(href);
  if(!safe) return <span style={{color:"var(--ink-3)",fontSize:12}}>{children} <i>(link tidak valid)</i></span>;
  return <a href={safe} target="_blank" rel="noopener noreferrer" style={style} onClick={onClick}>{children}</a>;
}

function getFlag(task, today){
  const ref = today || todayStr();
  if(task.status === "Done") return {label:"Selesai", cls:"badge-green"};
  if(isEventCategory(task.category)){
    if(!task.dueDate) return {label:"Terjadwal", cls:"badge-grey"};
    const d = daysBetween(ref, task.dueDate);
    if(d < 0)  return {label:"Belum ditandai selesai", cls:"badge-yellow"};
    if(d === 0) return {label:"Hari ini", cls:"badge-purple"};
    return {label:"Terjadwal", cls:"badge-grey"};
  }
  if(!task.dueDate) return {label:"No Due Date", cls:"badge-grey"};
  const diff = daysBetween(ref, task.dueDate);
  if(diff < 0) return {label:"OVERDUE", cls:"badge-red"};
  if(diff <= 2) return {label:"DUE SOON", cls:"badge-yellow"};
  return {label:"On Track", cls:"badge-green"};
}
function eventDate(task){ return task.dueDate || task.startDate || null; }

// Jam kosong dianggap akhir hari — kalau dianggap 00:00, semua assignment lama
// langsung terlihat "lewat" padahal belum.
function dueMoment(t){
  if(!t || !t.dueDate) return null;
  const time = /^\d{2}:\d{2}$/.test(t.dueTime || "") ? t.dueTime : "23:59";
  const d = new Date(t.dueDate + "T" + time + ":00");
  return isNaN(d.getTime()) ? null : d;
}
function countdownLabel(due, now){
  if(!due) return "";
  const diff = due.getTime() - now.getTime();
  const mins = Math.round(Math.abs(diff) / 60000);
  const h = Math.floor(mins / 60), m = mins % 60;
  const span = h > 0 ? (m > 0 ? `${h} jam ${m} mnt` : `${h} jam`) : `${m} mnt`;
  return diff < 0 ? `Lewat ${span}` : `${span} lagi`;
}
function urgencyOfMoment(due, now){
  if(!due) return "";
  const diff = due.getTime() - now.getTime();
  if(diff < 0) return "late";
  if(diff <= 2 * 3600 * 1000) return "soon";
  return "";
}
// Siapa yang masih ditunggu untuk assignment ini.
function waitingOn(t, name){
  if(!name || t.status === "Done") return false;
  const dels = t.deliverables || [];
  if(dels.length) return dels.some(d => d.pic === name && (d.state === "pending" || d.state === "revision"));
  return (t.pics || []).includes(name);
}
// Garis tepi kartu: hanya muncul kalau butuh perhatian.
function spineCls(task, today){
  if(task.status === "Done") return "";
  const f = getFlag(task, today).label;
  if(f === "OVERDUE") return " sp-late";
  if(f === "DUE SOON") return " sp-soon";
  return "";
}
// Badge urgensi disembunyikan kalau semuanya aman — supaya yang merah benar-benar menonjol.
function urgencyBadge(task, today){
  if(task.status === "Done") return null;
  const f = getFlag(task, today);
  if(f.label === "OVERDUE"){
    const late = task.dueDate ? Math.abs(daysBetween(today, task.dueDate)) : 0;
    return { label: late ? `Telat ${late} hari` : "Telat", cls: f.cls };
  }
  if(f.label === "DUE SOON"){
    const d = daysBetween(today, task.dueDate);
    return { label: d === 0 ? "Hari ini" : `${d} hari lagi`, cls: f.cls };
  }
  return null;
}
// "Hari ini 14:00" jauh lebih berguna daripada "06 Agu 26" untuk yang jatuh tempo hari ini.
function dueLabel(t){
  if(!t.dueDate) return "Due -";
  const today = todayStr();
  const diff = daysBetween(today, t.dueDate);
  const hh = /^\d{2}:\d{2}$/.test(t.dueTime||"") ? " " + t.dueTime : "";
  if(diff === 0) return "Hari ini" + hh;
  if(diff === 1) return "Besok" + hh;
  return "Due " + fmtDate(t.dueDate) + hh;
}
function statusCls(s){
  if(s==="Revision") return "badge-red";
  if(s==="Waiting Review") return "badge-yellow";
  if(s==="Menunggu Approval Klien") return "badge-purple";
  if(s==="Done"||s==="Approved") return "badge-green";
  return "badge-grey";
}

// Status assignment diturunkan dari kondisi tiap kiriman — bukan sebaliknya.
// Ini yang membuat review bisa jalan per bagian tanpa menunggu yang lain selesai.
// Penanda jumlah bagian yang disetujui. Rules tidak bisa membandingkan isi array
// satu per satu, jadi angka ini yang dipakai untuk mendeteksi ada approval baru.
function countApproved(list){ return (list||[]).filter(d => d.state === "approved").length; }
function deriveStatus(list, category, current){
  if(!list || list.length === 0) return current;
  if(list.every(d => d.state === "approved")){
    return CLIENT_GATE_CATEGORIES.includes(category) ? "Menunggu Approval Klien" : "Approved";
  }
  if(list.some(d => d.state === "revision"))  return "Revision";
  if(list.some(d => d.state === "submitted")) return "Waiting Review";
  return (current === "Not Started" || current === "On Hold") ? current : "In Progress";
}

  const set = new Set(t.pics || []);
  (t.deliverables || []).forEach(d => { if(d.pic) set.add(d.pic); });
  return [...set];
}

// Backward-compat: dokumen lama pakai {pic, description} datar; yang baru {pics, subtasks}.
function normalizeTask(t){
  const pics = (Array.isArray(t.pics) ? t.pics : (t.pic ? [t.pic] : [])).filter(x => typeof x === "string" && x);
  const rawSubs = Array.isArray(t.subtasks) && t.subtasks.length > 0
    ? t.subtasks
    : [{ description: t.description || "", priority: t.priority || "Medium", progress: t.progress || 0 }];
  const subtasks = rawSubs.filter(Boolean).map(s => ({ _id: s._id || uid(), description:s.description||"",
    priority:s.priority||"Medium", progress:Number(s.progress)||0 }));
  const avgProgress = subtasks.length
    ? Math.round(subtasks.reduce((s,x)=>s+x.progress,0) / subtasks.length)
    : 0;
  const anyHighPriority = subtasks.some(s=>s.priority==="High");
  const overallPriority = anyHighPriority ? "High"
    : subtasks.some(s=>s.priority==="Medium") ? "Medium" : "Low";
  const rawAds = (Array.isArray(t.adItems) && t.adItems.length>0) ? t.adItems
    : (t.link || t.caption || t.contentPromoted)
      ? [{ label: t.contentPromoted||"", link: t.link||"", caption: t.caption||"" }]
      : [emptyAdItem()];
  const adItems = rawAds.filter(Boolean).map(a => ({ _id:a._id||uid(), label:a.label||"", link:a.link||"", caption:a.caption||"",
    proofLink:a.proofLink||"", proofUploadedAt:a.proofUploadedAt||"", proofUploadedBy:a.proofUploadedBy||"" }));
  let deliverables;
  if(Array.isArray(t.deliverables) && t.deliverables.length){
    deliverables = t.deliverables.filter(Boolean).map(d => ({ _id:d._id||uid(), label:d.label||"", role:d.role||"",
      pic:d.pic||"", briefLink:d.briefLink||"", driveFolder:d.driveFolder||"",
      link:d.link||"", state:d.state||(d.link?"submitted":"pending"),
      note:d.note||"", at:d.at||"", by:d.by||"",
      approvedBy:d.approvedBy||"", approvedAt:d.approvedAt||"" }));
  } else if(isReviewCategory(t.category)){
    const preset = DELIVERABLE_PRESETS[t.category];
    const label = preset ? preset[0][0] : "Hasil kerjaan";
    const role  = preset ? preset[0][1] : "";
    deliverables = [{ _id:uid(), label, role, pic:(pics[0]||""),
      briefLink:t.briefLink||"", driveFolder:t.driveFolder||"", link:t.link||"",
      state: t.link ? "submitted" : "pending", note:"", at:"", by:"", approvedBy:"", approvedAt:"" }];
  } else {
    deliverables = [];
  }
  // Judul pindah ke level assignment. Task lama mengambilnya dari sub-task pertama.
  const title = (t.title || (subtasks[0] ? subtasks[0].description : "") || "").trim();
  const priority = t.priority || overallPriority;
  const progress = t.progress != null ? Number(t.progress)||0 : avgProgress;
  return { ...t, pics, subtasks, avgProgress, anyHighPriority, overallPriority,
    title, priority, progress, deliverables, dueTime: t.dueTime || "",
    link: t.link || "", caption: t.caption || "",
    previewLink: t.previewLink || "", postingDate: t.postingDate || "",
    livePostLink: t.livePostLink || "",
    briefLink: t.briefLink || "", driveFolder: t.driveFolder || "",
    forPosting: t.forPosting === undefined ? (t.category === "Graphic Design") : (t.forPosting === true),
    reviewerTarget: t.reviewerTarget || "",
    postedAt: t.postedAt || "", activity: (Array.isArray(t.activity) ? t.activity : []).filter(Boolean),
    platform: t.platform || "", objective: t.objective || "", budget: t.budget || "",
    adItems,
    shootLocation: t.shootLocation || "", equipment: t.equipment || "", crew: t.crew || "",
    meetingPlace: t.meetingPlace || "", clientAttendees: t.clientAttendees || "",
    agenda: t.agenda || "", outcome: t.outcome || "",
    version: Number(t.version)||0, internalApprovedBy: t.internalApprovedBy || "",
    internalApprovers: Array.isArray(t.internalApprovers) ? t.internalApprovers.filter(Boolean) : [],
    completedAt: t.completedAt || "", createdAt: t.createdAt || "" };
}

function taskTitle(t){
  const fromSub = (t.subtasks && t.subtasks[0]) ? t.subtasks[0].description : "";

// Tanggal 31 di bulan Februari harus dijepit ke hari terakhir bulan itu —
// kalau tidak, Date meluber ke bulan berikutnya dan siklus billing jadi salah.
function fmtIDR(n){ const num = Number(n)||0; return "IDR " + num.toLocaleString("id-ID"); }
function daysLeftLabel(dueDate){
  if(!dueDate) return "";
  const diff = daysBetween(todayStr(), dueDate);
  if(diff < 0) return `Berakhir ${Math.abs(diff)} hari lalu`;
  if(diff === 0) return "Berakhir hari ini";
  return `${diff} Hari Lagi`;
}
// Rentang Senin–Minggu dari tanggal mana pun. Dipakai tab "Minggu Ini"
// yang jadi acuan rapat WFO tiap Senin.
function weekRange(ref){
  const d = new Date((ref || todayStr()) + "T00:00:00");
  const dow = d.getDay();                 // 0 = Minggu
  const back = dow === 0 ? 6 : dow - 1;   // mundur ke Senin
  const start = new Date(d); start.setDate(d.getDate() - back);
  const end = new Date(start); end.setDate(start.getDate() + 6);
  return { start: toLocalISO(start), end: toLocalISO(end) };
}
function shiftWeek(ref, delta){
  const d = new Date(ref + "T00:00:00");
  d.setDate(d.getDate() + delta*7);
  return toLocalISO(d);
}
function dayName(iso){
  return new Date(iso + "T00:00:00").toLocaleDateString("id-ID", { weekday:"short", day:"numeric" });
}

function fmtDateShort(iso){
  if(!iso) return "";
  return new Date(iso+"T00:00:00").toLocaleDateString("id-ID",{day:"2-digit",month:"short"});
}
function emptyAdLogRow(){ return { _id:uid(), name:"", resultType:"Leads", costPerLead:"", totalLeads:"",
  budgetUsed:"", totalBudget:"", endDate:"", active:true }; }
// Dokumen lama belum punya resultType — dianggap Leads supaya angkanya tidak berpindah arti.
function resultOf(c){ return (c && c.resultType) ? c.resultType : "Leads"; }

function buildDailyWAText(dateStr, logEntries){
  const dateLabel = new Date(dateStr+"T00:00:00").toLocaleDateString("id-ID",{day:"2-digit",month:"short",year:"numeric"});
  let out = `Daily Report Ads\n${dateLabel}\n\n`;
  logEntries.forEach(entry => {
    if(!entry.client || !entry.campaigns || entry.campaigns.length===0) return;
    out += `*${entry.client}*\n`;
    entry.campaigns.forEach(c => {
      const offTag = c.active===false ? " *OFF*" : "";
      const rt = resultOf(c);
      if(c.name) out += `${c.name}\n`;
      out += `${fmtIDR(c.costPerLead)} / ${rt} — ${c.totalLeads||0} ${rt}${offTag}\n`;
      if(c.budgetUsed || c.totalBudget) out += `Budget: ${fmtIDR(c.budgetUsed)} dari ${fmtIDR(c.totalBudget)}\n`;
      if(c.endDate) out += `*End ${fmtDateShort(c.endDate)} (${daysLeftLabel(c.endDate)})*\n`;
    });
    out += `\n`;
  });
  return out.trim();
}

// Kompres di HP: foto 4 MB jadi sekitar 80 KB. Tanpa ini, satu gambar saja
// bisa menembus batas 1 MB per dokumen Firestore.
async function compressImage(file){
  const bitmap = await createImageBitmap(file);
  const scale = Math.min(1, MAX_IMG_WIDTH / bitmap.width);
  const c = document.createElement("canvas");
  c.width  = Math.round(bitmap.width  * scale);
  c.height = Math.round(bitmap.height * scale);
  c.getContext("2d").drawImage(bitmap, 0, 0, c.width, c.height);
  bitmap.close && bitmap.close();
  let q = IMG_QUALITY, data = c.toDataURL("image/jpeg", q);
  while(data.length > MAX_IMG_BYTES && q > 0.25){
    q -= 0.1;
    data = c.toDataURL("image/jpeg", q);
  }
  if(data.length > MAX_IMG_BYTES) throw new Error("Gambar terlalu besar walau sudah dikompres. Coba potong dulu.");
  return data;
}
function fmtKB(n){ return Math.round((n||0)/1024) + " KB"; }

let db = null;
let auth = null;
let firebaseReady = false;
let firebaseError = null;
try{
  firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();
  auth = firebase.auth();
  db.enablePersistence({synchronizeTabs:true}).catch(()=>{});
  firebaseReady = true;
}catch(e){ firebaseError = e.message; }

const SERVER_TS = () => firebase.firestore.FieldValue.serverTimestamp();

/* ===================== TOAST ===================== */
function useToast(){
  const [toast, setToast] = useState(null);
  const timer = useRef(null);
  const show = useCallback((msg, kind) => {
    setToast({ msg, kind: kind || "ok" });
    if(timer.current) clearTimeout(timer.current);
    timer.current = setTimeout(()=>setToast(null), 4200);
  }, []);
  useEffect(() => () => { if(timer.current) clearTimeout(timer.current); }, []);
  return { toast, show };
}
function friendlyError(e){
  const code = (e && e.code) || "";
  if(code.includes("permission-denied")) return "Kamu tidak punya izin untuk aksi ini.";
  if(code.includes("unavailable")) return "Koneksi terputus. Perubahan akan dikirim ulang saat online.";
  if(code.includes("not-found")) return "Data sudah tidak ada — mungkin dihapus orang lain.";
  return (e && e.message) ? e.message : "Terjadi kesalahan. Coba lagi.";
}

  async function saveTask(task){
    const isAds = task.category === "Paid Ads";
    const isProd = task.category === "Production";
    const isMeet = task.category === "Meeting";
    const isCat = task.category === "Catatan Client";
    const isEvent = isEventCategory(task.category);
    let title = (task.title||"").trim();
    if(isAds){
      const labels = (task.adItems||[]).map(a=>(a.label||"").trim()).filter(Boolean);
      title = labels.length ? labels.join(", ")
        : [task.platform, task.objective].filter(Boolean).join(" — ") || "Paid Ads";
    }
    if(!title){ show("Judul assignment belum diisi.","err"); return false; }
    if(!task.client){ show("Pilih client dulu.","err"); return false; }
    const cleanSubtasks = [{ description: title, priority: task.priority || "Medium",
      progress: isAds ? (task.status==="Done" ? 100 : 0) : (Number(task.progress)||0) }];

    const payload = {
      client: task.client, category: task.category, pics: task.pics,
      status: task.status, startDate: isEvent ? "" : task.startDate,
      dueDate: task.dueDate, dueTime: task.dueTime || "",
      notes: (isEvent && !isCat) ? "" : task.notes,
      showOnCalendar: (isAds || isProd || isMeet) ? true : task.showOnCalendar,
      title,
      priority: isEvent ? "Medium" : (task.priority || "Medium"),
      progress: isEvent ? (task.status === "Done" ? 100 : 0) : (Number(task.progress)||0),
      subtasks: cleanSubtasks,
      briefLink: isEvent ? "" : (task.briefLink || ""), driveFolder: isEvent ? "" : (task.driveFolder || ""),
      reviewerTarget: task.reviewerTarget || "",
      deliverables: isReviewCategory(task.category)
        ? (task.deliverables||[]).filter(d => (d.label||"").trim()).map(d => ({
            _id:d._id, label:d.label.trim(), role:d.role||"", pic:d.pic||"",
            briefLink:d.briefLink||"", driveFolder:d.driveFolder||"", link:d.link||"",
            state:d.state||"pending", note:d.note||"", at:d.at||"", by:d.by||"",
            approvedBy:d.approvedBy||"", approvedAt:d.approvedAt||"" }))
        : [],
      approvedCount: countApproved(isReviewCategory(task.category) ? (task.deliverables||[]) : []),
      forPosting: task.category === "Graphic Design" ? (task.forPosting === true) : false,
      platform: isAds ? task.platform : "", objective: isAds ? task.objective : "",
      budget: isAds ? task.budget : "",
      shootLocation: isProd ? task.shootLocation : "",
      equipment: isProd ? task.equipment : "", crew: isProd ? task.crew : "",
      meetingPlace: isMeet ? task.meetingPlace : "", clientAttendees: isMeet ? task.clientAttendees : "",
      agenda: isMeet ? task.agenda : "", outcome: isMeet ? task.outcome : "",
      lastUpdate: todayStr(), updatedBy: myEmail, updatedAt: SERVER_TS(),
    };
    if(isAds){
      payload.adItems = (task.adItems||[])
        .filter(a => (a.label||"").trim() || (a.link||"").trim() || (a.caption||"").trim() || (a.proofLink||"").trim())
        .map(a => ({ label:a.label||"", link:a.link||"", caption:a.caption||"",
          proofLink:a.proofLink||"", proofUploadedAt:a.proofUploadedAt||"", proofUploadedBy:a.proofUploadedBy||"" }));
      if(payload.adItems.length === 0) payload.adItems = [{ label:"",link:"",caption:"",proofLink:"",proofUploadedAt:"",proofUploadedBy:"" }];
    }

    const ok = await run(async () => {
      if(task.id){
        // Cek versi supaya perubahan orang lain tidak tertimpa diam-diam.
        await db.runTransaction(async tx => {
          const ref = db.collection(COLLECTION).doc(task.id);
          const snap = await tx.get(ref);
          if(!snap.exists) throw { code:"not-found" };
          const current = Number(snap.data().version) || 0;
          if(current !== (Number(task.version)||0))
            throw new Error("Task ini baru diubah orang lain. Tutup dulu, buka lagi, baru simpan.");
          tx.set(ref, { ...payload, version: current + 1 }, { merge:true });
        });
      } else {
        await db.collection(COLLECTION).add({
          link:"", caption:"", previewLink:"", postingDate:"", livePostLink:"", postedAt:"", activity:[], adItems:[],
          reviewerTarget:"", internalApprovedBy:"", completedAt:"", version:1, approvedCount:0,
          createdAt: todayStr(), createdBy: myEmail, createdTs: SERVER_TS(),
          ...payload,
        });
      }
    }, "Tersimpan.");
    if(ok) setModalTask(null);
    return ok;
  }

  async function cancelTask(task){
    const note = window.prompt("Alasan membatalkan task ini? (tercatat di riwayat)");
    if(note === null) return;
    if(!note.trim()){ show("Alasan wajib diisi.","err"); return; }
    await taskAction(task.id, null,
      newActivity("cancelled", `Task dibatalkan: ${note.trim()}`, myName),
      { archived:true, archivedBy: myEmail, archivedAt: todayStr() }, "Task dibatalkan.");
  }
  async function restoreTask(id){
    await taskAction(id, null, newActivity("restored", "Task diaktifkan kembali.", myName),
      { archived:false }, "Task diaktifkan kembali.");
  }
  async function deleteTask(id, label){
    if(!isAdmin && !canCancel) return;
    const nama = label ? `"${label}"` : "task ini";
    if(!window.confirm(`Hapus permanen ${nama}?\n\nSeluruh riwayat approval, komentar, dan link ikut hilang. Tidak bisa dikembalikan.`)) return;
    await run(() => db.collection(COLLECTION).doc(id).delete(), "Task dihapus permanen.");
  }

  async function taskAction(taskId, statusUpdate, activityEntry, extraFields, okMsg){
    const payload = { ...(extraFields||{}), lastUpdate: todayStr(), updatedBy: myEmail, updatedAt: SERVER_TS() };
    if(statusUpdate) payload.status = statusUpdate;
    if(activityEntry) payload.activity = firebase.firestore.FieldValue.arrayUnion(activityEntry);
    payload.version = firebase.firestore.FieldValue.increment(1);
    const ok = await run(() => db.collection(COLLECTION).doc(taskId).set(payload, {merge:true}), okMsg);
    if(ok) setModalTask(null);
    return ok;
  }
  // Semua perubahan task lewat satu pintu: ambil dokumen, ubah, tulis balik dalam transaksi.
  // Tanpa ini, Yadi dan Robby yang mengirim bersamaan bisa saling menimpa.
  // Dipakai submit & approve: ambil salinan daftar kiriman + posisinya.
  function pickDeliverable(data, delivId){
    const list = (Array.isArray(data.deliverables) ? data.deliverables : []).map(d => ({...d}));
    const i = list.findIndex(d => d._id === delivId);
    if(i < 0) throw new Error("Daftar kiriman sudah berubah. Tutup lalu buka lagi.");
    return { list, i };
  }

  function editTask(taskId, mutate, okMsg){
    return run(async () => {
      await db.runTransaction(async tx => {
        const ref = db.collection(COLLECTION).doc(taskId);
        const snap = await tx.get(ref);
        if(!snap.exists) throw { code:"not-found" };
        const data = snap.data();
        const patch = mutate(data);
        if(!patch) return;
        tx.set(ref, {
          ...patch,
          lastUpdate: todayStr(), updatedBy: myEmail, updatedAt: SERVER_TS(),
          version: (Number(data.version)||0) + 1,
        }, { merge:true });
      });
    }, okMsg);
  }

  // Yadi dan Robby bisa mengirim bersamaan — tanpa transaksi, salah satu akan tertimpa.
  async function submitDeliverable(taskId, delivId, link, reviewerFallback){
    return editTask(taskId, (data) => {
      const { list, i } = pickDeliverable(data, delivId);
      list[i] = { ...list[i], link, state:"submitted", note:"", at:new Date().toISOString(), by:myName };
      const target = data.reviewerTarget || reviewerFallback || "";
      return {
        deliverables: list,
        link: list[0] ? (list[0].link || link) : link,
        status: deriveStatus(list, data.category, data.status),
        approvedCount: countApproved(list),
        reviewerTarget: target,
        activity: [...(data.activity||[]),
          newActivity("link", `${list[i].label} dikirim — ${link}`, myName),
          newActivity("status", `${list[i].label} menunggu review${target ? ` (${target})` : ""}.`, myName)],
      };
    }, "Kiriman terkirim — menunggu review.");
  }

  // Approve satu bagian saja — bagian lain tidak perlu menunggu.
  async function approveDeliverable(taskId, delivId, note){
    return editTask(taskId, (data) => {
      const { list, i } = pickDeliverable(data, delivId);
      if(list[i].state !== "submitted") throw new Error("Bagian ini belum dikirim atau sudah disetujui.");
      list[i] = { ...list[i], state:"approved", note:"", approvedBy:myName, approvedAt:todayStr() };
      const next = deriveStatus(list, data.category, data.status);
      const activity = [...(data.activity||[]),
        newActivity("approval", `${list[i].label} disetujui${note ? " — " + note : ""}.`, myName)];
      if(next === "Menunggu Approval Klien")
        activity.push(newActivity("status", "Semua bagian disetujui — menunggu konfirmasi client.", myName));
      else if(next === "Approved")
        activity.push(newActivity("status", "Semua bagian disetujui.", myName));
      return { deliverables:list, status:next, activity, internalApprovedBy: myEmail,
        approvedCount: countApproved(list) };
    }, "Bagian disetujui.");
  }

  // Revisi ditujukan ke bagian tertentu — yang sudah benar tidak ikut diulang.
  async function requestRevisionOn(taskId, delivIds, note){
    if(!note.trim()) return false;
    const ok = await editTask(taskId, (data) => {
      const list = (Array.isArray(data.deliverables) ? data.deliverables : []).map(d =>
        delivIds.includes(d._id) ? { ...d, state:"revision", note:note.trim() } : d);
      const names = list.filter(d => delivIds.includes(d._id)).map(d => d.label).join(", ");
      return {
        deliverables: list,
        status: deriveStatus(list, data.category, data.status),
        approvedCount: countApproved(list),
        activity: [...(data.activity||[]), newActivity("revision", `${names || "Task"}: ${note.trim()}`, myName)],
      };
    }, "Revisi diminta.");
    if(ok) setModalTask(null);
    return ok;
  }

  const clientApprove = async (id) => {
    await purgeRevisionImages(id);
    return taskAction(id, "Approved", newActivity("client_approval", "Client sudah approve.", myName), {}, "Client approve dicatat.");
  };
  const clientRevision = (id, note) =>
    note.trim() ? taskAction(id, "Revision", newActivity("client_revision", `Dari client: ${note}`, myName), {}, "Revisi client dicatat.") : null;
  // Setelah approve, PM/CS compile dulu jadi preview — itu yang jadi acuan Operations,
  // bukan link kerjaan mentah dari editor.
  const sendToOperations = (id, previewLink, postingDate) =>

      newActivity("preview", `Preview siap${postingDate ? ` — target tayang ${fmtDate(postingDate)}` : ""}: ${previewLink}`, myName),
      { previewLink, postingDate }, "Dikirim ke Operations.");

  const markDoneManual = (id) =>
    taskAction(id, "Done", newActivity("status", "Ditandai selesai.", myName), { completedAt: todayStr() }, "Ditandai selesai.");

  const returnToPM = (id, note) =>
    note.trim() ? taskAction(id, "Approved",
      newActivity("returned", `Dikembalikan ke PM: ${note}`, myName),
      { previewLink: "" }, "Dikembalikan ke PM.") : null;

  const markPosted = (id, liveLink) =>
    taskAction(id, "Done", newActivity("posted", liveLink, myName),
      { livePostLink: liveLink, postedAt: todayStr(), completedAt: todayStr() }, "Ditandai sudah tayang.");

  // Kunci dokumen: <taskId>_rev untuk acuan revisi, <taskId>_ads untuk bukti tayang.
  const imagesRef = (taskId, kind) => db.collection(IMAGES_COLLECTION).doc(`${taskId}_${kind}`);

  // Dua orang bisa mengunggah bersamaan — transaksi mencegah salah satu tertimpa.
  function editImages(taskId, kind, mutate, okMsg){
    return run(async () => {
      const ref = imagesRef(taskId, kind);
      await db.runTransaction(async tx => {
        const snap = await tx.get(ref);
        const current = (snap.exists && Array.isArray(snap.data().images)) ? snap.data().images.slice() : [];
        const list = mutate(current, snap.exists);
        if(!list) return;
        tx.set(ref, { taskId, kind, images: list, updatedAt: SERVER_TS() }, { merge:true });
      });
    }, okMsg);
  }
  const addImage = (taskId, kind, dataUrl, label) =>
    editImages(taskId, kind, (list) => {
      if(list.length >= MAX_IMG_COUNT) throw new Error(`Maksimal ${MAX_IMG_COUNT} gambar. Hapus salah satu dulu.`);
      return [...list, { _id: uid(), data: dataUrl, label: label||"", by: myName, at: new Date().toISOString() }];
    }, "Gambar tersimpan.");

  const removeImage = (taskId, kind, imgId) =>
    editImages(taskId, kind, (list, exists) => exists ? list.filter(x => x._id !== imgId) : null,
      "Gambar dihapus.");
  // Acuan revisi dibuang begitu client approve — inilah yang menjaga kuota tetap kecil.
  function purgeRevisionImages(taskId){
    return imagesRef(taskId, "rev").delete().catch(()=>{});
  }

  const addComment = (id, text) =>
    text.trim() ? taskAction(id, null, newActivity("comment", text, myName), {}, "Komentar terkirim.") : null;

  const addDocument = (doc) => run(
    () => db.collection(DOCUMENTS_COLLECTION).add({ ...doc, addedAt: new Date().toISOString(), addedByEmail: myEmail }),
    "Dokumen ditambahkan.");
  async function deleteDocument(id){
    if(!isAdmin) return;
    if(!window.confirm("Hapus dokumen ini dari daftar?")) return;
    await run(() => db.collection(DOCUMENTS_COLLECTION).doc(id).delete(), "Dokumen dihapus.");

  // ID dokumen dibuat dari projectId, bukan nama client — nama client bisa berubah.

      updatedAt: new Date().toISOString(), updatedBy: myEmail,

      services: (data.services||"").trim().slice(0,200),
      contact:  (data.contact||"").trim().slice(0,120),
      value:    Math.max(0, Number(data.value)||0),
      followUp: data.followUp || "",
      note:     (data.note||"").trim().slice(0,500),
      result:   "",
      createdBy: myName, createdAt: new Date().toISOString(),

  const moveSalesItem = (id, stage) => run(
    () => db.collection(SALES_COLLECTION).doc(id).set({ stage }, {merge:true}));
  const setSalesResult = (id, result) => run(
    () => db.collection(SALES_COLLECTION).doc(id).set({ result }, {merge:true}));

    () => db.collection(SALES_COLLECTION).doc(id).set(patch, {merge:true}), "Tersimpan.");

    () => db.collection(SALES_COLLECTION).doc(id).delete(), "Dihapus.");

  const addStandupNote = (text, opts) => text.trim() ? run(

      dueDate: (opts && opts.dueDate) || "",

  const updateStandupNote = (id, patch) => run(
    () => db.collection(STANDUP_NOTES_COLLECTION).doc(id).set(patch, {merge:true}), "Tersimpan.");
  const moveStandupNote = (id, column) => run(
    () => db.collection(STANDUP_NOTES_COLLECTION).doc(id).set({ column }, {merge:true}));

    () => db.collection(STANDUP_NOTES_COLLECTION).doc(id).delete());
  const seedHolidays = () => run(async () => {
    const batch = db.batch();
    HOLIDAY_SEED_2026.forEach(([date,name]) => {
      batch.set(db.collection(HOLIDAYS_COLLECTION).doc(date), { date, name });

    await batch.commit();
  }, "Hari libur 2026 diisi.");
  const seedProjects = () => run(async () => {
    const batch = db.batch();
    DEFAULT_PROJECTS.forEach(name => {
      batch.set(db.collection(PROJECTS_COLLECTION).doc(name.replace(/[^A-Za-z0-9]/g,"_")), { name, active:true });

    await batch.commit();

          <>

              <Dashboard tasks={liveTasks} connected={connected} staffNames={staffNames} onNavigate={goToTasks}

            {activeTab==="dokumen" && canDocsHistory && (

function AuthShell({title, sub, children}){

      <img src={LOGO_WHITE} alt="UBAHdigital" className="login-logo" />

// Pesan seragam menyembunyikan penyebabnya — "kadang bisa kadang tidak"
// biasanya pembatasan sementara Firebase, bukan password yang salah.
function loginError(err){
  const code = (err && err.code) || "";
  if(code.includes("too-many-requests"))
    return "Terlalu banyak percobaan gagal. Akun dikunci sementara oleh Firebase — tunggu 5–15 menit, lalu coba lagi. Password kamu tidak berubah.";
  if(code.includes("network-request-failed"))
    return "Koneksi bermasalah. Cek internet lalu coba lagi.";
  if(code.includes("user-disabled"))
    return "Akun ini dinonaktifkan. Hubungi Admin.";
  if(code.includes("invalid-email"))
    return "Format email tidak valid.";
  if(code.includes("user-not-found") || code.includes("wrong-password") || code.includes("invalid-credential"))
    return "Email atau password salah. Kalau merasa benar, pakai Lupa Password.";
  return "Login gagal — " + (code || (err && err.message) || "penyebab tidak diketahui");
}

function LoginScreen(){
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [error, setError] = useState("");
  const [info, setInfo] = useState("");
  const [busy, setBusy] = useState(false);

  async function handleLogin(e){
    e.preventDefault();
    setError(""); setInfo(""); setBusy(true);
    try{
      await auth.signInWithEmailAndPassword(email.trim().toLowerCase(), password);
    }catch(err){
      setError(loginError(err));
    }
    setBusy(false);
  }
  async function handleReset(){
    setError(""); setInfo("");
    if(!email.trim()){ setError("Isi dulu email kamu di atas, baru tekan Lupa Password."); return; }
    try{
      await auth.sendPasswordResetEmail(email.trim().toLowerCase());
      setInfo("Email reset sudah dikirim. Cek inbox — kalau tidak ada, cek folder Spam.");
    }catch(err){
      setInfo("Kalau email itu terdaftar, link reset sudah dikirim. Cek inbox dan folder Spam.");
    }
  }

  return (
    <AuthShell title="Tracker" sub="Masuk pakai email kamu sendiri.">
      {error && <div className="login-error">{error}</div>}
        {info && <div style={{background:"#DFF3E8",color:"var(--green)",padding:"8px 10px",borderRadius:8,fontSize:12,marginBottom:12}}>{info}</div>}
        <form onSubmit={handleLogin}>
          <div className="field">
            <label htmlFor="lg-email">Email</label>
            <input id="lg-email" type="email" value={email} onChange={e=>setEmail(e.target.value)} required autoCapitalize="none" autoComplete="username" />
          </div>
          <div className="field">
            <label htmlFor="lg-pass">Password</label>
            <input id="lg-pass" type="password" value={password} onChange={e=>setPassword(e.target.value)} required autoComplete="current-password" />
          </div>
          <button className="btn btn-gold" type="submit" style={{width:"100%"}} disabled={busy}>
            {busy ? "Memproses..." : "Masuk"}
          </button>
        </form>
      <button className="btn btn-outline btn-sm" style={{width:"100%",marginTop:10}} onClick={handleReset}>Lupa Password</button>
    </AuthShell>
  );
}

function PasswordModal({onClose, show}){
  const [p1, setP1] = useState("");
  const [p2, setP2] = useState("");
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");

  async function submit(){
    setErr("");
    if(p1.length < 6){ setErr("Password minimal 6 karakter."); return; }
    if(p1 !== p2){ setErr("Dua isian password belum sama."); return; }
    setBusy(true);
    try{
      await auth.currentUser.updatePassword(p1);
      show("Password berhasil diganti.","ok");
      onClose();
    }catch(e){
      setErr(e.code === "auth/requires-recent-login"
        ? "Demi keamanan, keluar dulu lalu masuk lagi, baru ganti password."
        : friendlyError(e));
    }
    setBusy(false);
  }

  return (
    <div className="modal-bg" onMouseDown={e=>{ if(e.target===e.currentTarget) onClose(); }}>
      <div className="modal" style={{maxWidth:400}}>
        <div className="section-title">Ganti Password</div>
        {err && <div className="login-error">{err}</div>}
        <div className="field">
          <label htmlFor="np1">Password Baru</label>
          <input id="np1" type="password" value={p1} onChange={e=>setP1(e.target.value)} autoComplete="new-password" />
        </div>
        <div className="field">
          <label htmlFor="np2">Ulangi Password Baru</label>
          <input id="np2" type="password" value={p2} onChange={e=>setP2(e.target.value)} autoComplete="new-password" />
        </div>
        <ModalActions onCancel={onClose} onSubmit={submit} busy={busy} />
      </div>
    </div>
  );
}

function SetupNotice({error}){
  return (
    <div className="setup-box">

      {error && <>Pesan teknis: <code>{error}</code><br/><br/></>}

}

function DocumentsView({tasks, projectNames, documents, myName, isAdmin, onAddDocument, onDeleteDocument, busy}){
  const [openClient, setOpenClient] = useState(null);
  const [q, setQ] = useState("");

  // Satu kali hitung untuk semua client — bukan sekali per client di dalam map.
  const counts = useMemo(() => {
    const m = new Map();
    const bump = c => m.set(c, (m.get(c)||0) + 1);
    tasks.forEach(t => { if(DOC_TASK_CATEGORIES.includes(t.category) && t.link) bump(t.client); });
    documents.forEach(d => bump(d.client));
    return m;
  }, [tasks, documents]);

  const globalHits = useMemo(() => {
    if(!q.trim()) return null;
    const k = q.toLowerCase();
    return documents.filter(d => (d.title||"").toLowerCase().includes(k) || (d.client||"").toLowerCase().includes(k));
  }, [q, documents]);

  if(openClient){
    return <ClientDocuments client={openClient} tasks={tasks} documents={documents} myName={myName}
      isAdmin={isAdmin} onAddDocument={onAddDocument} onDeleteDocument={onDeleteDocument}
      onBack={()=>setOpenClient(null)} busy={busy} />;
  }

  return (
    <div>
      <div className="hint-block">
        Pilih brand untuk melihat semua dokumen — report, company profile, kontrak, ideation,
        dan file kerjaan yang sudah di-approve.
      </div>
      <div className="filter-row">
        <input placeholder="Cari dokumen di semua client..." value={q} onChange={e=>setQ(e.target.value)} style={{flex:1}} />
      </div>

      {globalHits ? (
        <>
          <div className="section-title" style={{fontSize:13}}>Hasil pencarian ({globalHits.length})</div>
          {globalHits.length===0 && <div className="empty">Tidak ada dokumen yang cocok.</div>}
          {globalHits.map(d => (
            <div key={d.id} className="card">
              <span className="badge badge-grey">{d.docType}</span>
              <div style={{fontSize:13,fontWeight:700,margin:"5px 0 2px"}}>{d.title}</div>
              <div style={{fontSize:11,color:"var(--brand-2)",fontWeight:700,marginBottom:3}}>{d.client}{d.period ? " · " + d.period : ""}</div>
              <ExternalLink href={d.link} className="link-sm">{d.link}</ExternalLink>
            </div>
          ))}
        </>
      ) : (
        projectNames.map(p => (
          <button key={p} className="card card-btn"
            style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}
            onClick={()=>setOpenClient(p)}>
            <span style={{fontWeight:700,fontSize:13}}>{p}</span>
            <span className="badge badge-grey">{counts.get(p)||0} dokumen</span>
          </button>
        ))

  );

function ReadyToPostView({tasks, onOpenTask}){
  const today = todayStr();
  const ready = useMemo(() => tasks.filter(t => t.status==="Ready to Post")
    .sort((a,b)=> (a.postingDate||"9999").localeCompare(b.postingDate||"9999")), [tasks]);

  function postingState(t){
    if(!t.postingDate) return { badge:{label:"Tanpa target", cls:"badge-grey"}, spine:"" };
    const diff = daysBetween(today, t.postingDate);
    if(diff < 0)  return { badge:{label:`Telat ${Math.abs(diff)} hari`, cls:"badge-red"},  spine:" sp-late" };
    if(diff === 0)return { badge:{label:"Posting hari ini", cls:"badge-purple"},           spine:" sp-post" };
    if(diff <= 2) return { badge:{label:`${diff} hari lagi`, cls:"badge-yellow"},          spine:" sp-soon" };
    return { badge:{label:fmtDate(t.postingDate), cls:"badge-grey"}, spine:"" };
  }

  return (
    <div>
      {ready.length===0 && <div className="empty">Belum ada konten yang siap posting.</div>}
      {ready.map(t => {
        const st = postingState(t);
        return (
          <div key={t.id} className={"card" + st.spine}>
            <div onClick={()=>onOpenTask(t)} style={{cursor:"pointer"}}>
              <div className="row-top">
                <div className="client-line">{t.client}</div>
                <span className={"badge " + st.badge.cls} style={{flexShrink:0}}>{st.badge.label}</span>
              </div>
              <div className="task-title">{taskTitle(t)}</div>
              <div className="meta-line" style={{marginBottom:11}}>
                {t.postingDate ? `Target tayang ${fmtDate(t.postingDate)}` : "Belum ada target tayang"}
              </div>
            </div>

            {t.previewLink ? (
              <div className="stack">
                <div className="eyebrow">Preview — ini yang diposting</div>
                <ExternalLink href={t.previewLink}
                  style={{fontSize:12.5,color:"var(--brand)",wordBreak:"break-all",fontWeight:560,textDecoration:"none"}}>
                  {t.previewLink}
                </ExternalLink>
              </div>
            ) : (
              <div className="locked-note">Belum ada link preview — minta PM/CS meng-compile dulu.</div>
            )}

            <details style={{marginTop:2}}>
              <summary className="disc">Lihat file asli &amp; brief</summary>
              <div style={{paddingTop:7}}>
                {t.link && <div style={{fontSize:11.5,marginBottom:4}}>File kerjaan: <ExternalLink href={t.link} style={{color:"var(--ink-3)"}}>{t.link}</ExternalLink></div>}

              </div>
            </details>
          </div>
        );
      })}
    </div>
  );
}

// Siapa yang perlu melihat status apa. Kuncinya: yang bisa BERTINDAK, bukan yang terlibat.
const WEEK_STATUS_BY_ROLE = {
  pm:               ["Not Started","In Progress","Revision","Waiting Review","Menunggu Approval Klien","Approved","On Hold"],
  strategist:       ["Not Started","In Progress","Revision","Waiting Review","Approved"],
  operations:       ["Not Started","In Progress","Revision","Ready to Post"],
  video_editor:     ["Not Started","In Progress","Revision"],
  graphic_designer: ["Not Started","In Progress","Revision"],
  planner:          ["Not Started","In Progress","Revision"],
};
// Admin sengaja tanpa batasan supaya bisa memantau semuanya.
// Nama yang TIDAK cocok dengan daftar staff diperlakukan seperti pelaksana biasa —
// kalau dibiarkan "tampilkan semua", salah ketik satu huruf saja bikin penyaring bocor.
const WEEK_STATUS_FALLBACK = ["Not Started","In Progress","Revision"];
function weekStatusesFor(role){
  if(role === "admin") return null;           // null = tampilkan semua
  return WEEK_STATUS_BY_ROLE[role] || WEEK_STATUS_FALLBACK;

function WeekView({tasks, standupNotes, staffNames, staffList, onOpenTask}){
  const [anchor, setAnchor] = useState(() => todayStr());
  const { start, end } = useMemo(() => weekRange(anchor), [anchor]);
  const today = todayStr();
  const isThisWeek = useMemo(() => {
    const now = weekRange(today);
    return now.start === start;
  }, [start, today]);

  const perPerson = useMemo(() => {
    const map = {};
    const ensure = (nm) => { if(!map[nm]) map[nm] = { thisWeek:[], overdue:[] }; return map[nm]; };
    const roleOf = {};
    (staffList||[]).forEach(x => { if(x.name) roleOf[x.name] = x.role; });

    tasks.forEach(t => {
      if(t.status === "Done" || !t.dueDate) return;
      const people = taskPeople(t);
      if(!people.length) return;
      const inWeek = t.dueDate >= start && t.dueDate <= end;
      const late   = t.dueDate < today;
      if(!inWeek && !late) return;
      people.forEach(nm => {
        const allowed = weekStatusesFor(roleOf[nm]);
        if(allowed && !allowed.includes(t.status)) return;
        const box = ensure(nm);
        // Yang lewat deadline dihitung sekali saja, tidak dobel di dua daftar.
        if(late) box.overdue.push(t);
        else if(inWeek) box.thisWeek.push({ kind:"task", task:t, dueDate:t.dueDate });
      });
    });

    // Catatan standup yang punya deadline DAN mention — ikut masuk ke orangnya,
    // ditandai supaya jelas ini bukan assignment produksi.
    (standupNotes||[]).forEach(n => {
      if(!n.dueDate) return;
      const inWeek = n.dueDate >= start && n.dueDate <= end;
      if(!inWeek) return;
      noteMentions(n).forEach(nm => {
        ensure(nm).thisWeek.push({ kind:"note", note:n, dueDate:n.dueDate });
      });
    });

    Object.values(map).forEach(box => {
      box.thisWeek.sort((a,b) => (a.dueDate||"").localeCompare(b.dueDate||""));
      box.overdue.sort((a,b) => (a.dueDate||"").localeCompare(b.dueDate||""));
    });
    return map;
  }, [tasks, standupNotes, staffList, start, end, today]);

  const knownSet = useMemo(() => new Set(staffNames||[]), [staffNames]);
  const withWork = useMemo(() =>
    Object.keys(perPerson)
      .filter(nm => perPerson[nm].thisWeek.length > 0 || perPerson[nm].overdue.length > 0)
      .sort((a,b) => perPerson[b].thisWeek.length - perPerson[a].thisWeek.length),
    [perPerson]);

  const idle = useMemo(() =>
    (staffNames||[]).filter(nm => !perPerson[nm] || perPerson[nm].thisWeek.length === 0),
    [staffNames, perPerson]);

  const totalWeek = withWork.reduce((n,nm) => n + perPerson[nm].thisWeek.length, 0);
  const totalLate = withWork.reduce((n,nm) => n + perPerson[nm].overdue.length, 0);

  return (
    <div>
      <div className="month-nav">
        <button onClick={()=>setAnchor(a=>shiftWeek(a,-1))} aria-label="Minggu sebelumnya">‹</button>
        <div style={{textAlign:"center"}}>
          <div className="label" style={{fontSize:14}}>{fmtDate(start)} – {fmtDate(end)}</div>
          {isThisWeek && <div className="meta-line">Minggu berjalan</div>}
        </div>
        <button onClick={()=>setAnchor(a=>shiftWeek(a,1))} aria-label="Minggu berikutnya">›</button>
      </div>

      <div className="hint-block">
        {totalWeek} deadline minggu ini
        {totalLate > 0 && ` · ${totalLate} sudah lewat dan belum ditutup`}
      </div>

      {withWork.length === 0 && (
        <div className="empty">Tidak ada deadline di rentang minggu ini.</div>
      )}

      {withWork.map(nm => (
        <WeekPersonBlock key={nm} name={nm} unknown={!knownSet.has(nm)}
          thisWeek={perPerson[nm].thisWeek} overdue={perPerson[nm].overdue}
          onOpenTask={onOpenTask} />
      ))}

      {idle.length > 0 && withWork.length > 0 && (
        <div className="hint-block" style={{marginTop:12}}>
          Tidak ada deadline minggu ini: {idle.join(", ")}
        </div>
      )}
    </div>
  );
}

// Dua papan dalam satu tab: calon klien (belum jadi klien) dan upsell (sudah jadi klien).
// Sengaja dipisah karena tahapannya beda artinya — "Penawaran" ke calon klien
// bukan hal yang sama dengan menawarkan layanan tambahan ke klien lama.
function fmtRupiahShort(n){
  const v = Number(n)||0;
  if(v <= 0) return "";
  if(v >= 1000000000) return "Rp " + (v/1000000000).toFixed(v % 1000000000 ? 1 : 0) + " M";
  if(v >= 1000000)    return "Rp " + (v/1000000).toFixed(v % 1000000 ? 1 : 0) + " jt";
  if(v >= 1000)       return "Rp " + Math.round(v/1000) + " rb";
  return "Rp " + v;
}

function SalesBoard({title, hint, board, items, onAddClick, onMove, onSetResult, onDelete, onEdit, busy}){
  const stages = stagesFor(board);
  const grouped = useMemo(() => {
    const map = {};
    stages.forEach(st => map[st.key] = []);
    items.forEach(it => { if(map[it.stage]) map[it.stage].push(it); });
    // Follow-up terdekat naik ke atas — yang tanpa tanggal turun ke bawah.
    Object.keys(map).forEach(k => map[k].sort((a,b) =>
      (a.followUp || "9999").localeCompare(b.followUp || "9999")));
    return map;
  }, [items, stages]);

  const total = items.reduce((sum,it) => sum + (Number(it.value)||0), 0);

  return (
    <div style={{marginBottom:26}}>
      <div className="row-mid" style={{marginBottom:4}}>

        {stages.map(st => (

    if(editItem){
      const { board, ...patch } = data;
      onUpdate(editItem.id, {

        value: Math.max(0, Number(patch.value)||0), followUp: patch.followUp, note: patch.note.trim(),
